name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Portão (o autoteste prova que ele acusa)
        run: python docs/verificar_antes_de_subir.py --autoteste
      - name: Portão sobre o app
        run: python docs/verificar_antes_de_subir.py
