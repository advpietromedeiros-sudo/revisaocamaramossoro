corporando-se, obrigatoriamente, na receita, todos os tributos, rendas e suprimentos de fundos, e incluindo-se, discriminadamente, na despesa, as dotações necessárias ao custo de todos os serviços municipais."],"nt":[]},{"id":"lom:156","n":"156","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["O orçamento não conterá dispositivo estranho à previsão da receita, nem a fixação da despesa anteriormente autorizada. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Não se incluem nesta proibição: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – Autorização para abertura de créditos suplementares; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Contratação de Operações de créditos, ainda que por antecipação de receita nos termos da lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:157","n":"157","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["São vedados:","I – Início de programas ou projetos não incluídos na lei orçamentária anual;","II – A realização de despesas ou a assunção de obrigações diretas que excedam os créditos orçamentários ou adicionais;","III – A realização de operações de créditos que excedam o montante das despesas de capital, ressalvadas as autorizadas mediante créditos suplementares ou especiais com finalidade precisa, aprovadas pela Câmara por maioria absoluta; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – A vinculação de receita de impostos a órgão, fundo ou despesa, ressalvadas a repartição do produto da arrecadação dos impostos a que se referem os arts. 158 e 159, a destinação de recursos para as ações e serviços públicos de saúde, para manutenção e desenvolvimento do ensino e para realização de atividades da administração tributária, como determinado, respectivamente, pelos arts. 198, § 2º, 212 e 37, XXII da Constituição Federal, a prestação de garantias às operações de crédito por antecipação de receita, previstas no art. 165, § 8º, bem como o disposto no § 4º do art. 167 da Constituição Federal vigente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – A abertura de crédito suplementar ou especial sem prévia autorização legislativa e sem indicação dos recursos correspondentes;","VI – A transposição, o remanejamento ou a transferência de recursos de uma categoria de programação para outra ou de um órgão para outro, sem prévia autorização legislativa;","VII – A concessão ou utilização de créditos ilimitados;","VIII – A utilização sem autorização legislativa especifica, de recursos do orçamento fiscal para suprir necessidade ou cobrir déficit de empresas, fundações e fundos;","IX – A instituição de fundos de qualquer natureza, sem prévia autorização legislativa;","X – Transferência voluntária de recursos e a concessão de empréstimos, inclusive por antecipação de receita, pelo Governo Federal e Estaduais e suas instituições financeiras, para pagamento de despesas com pessoal ativo, inativo e pensionista do Município; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XI – A utilização dos recursos provenientes das contribuições previdenciárias, para a realização de despesas distintas do pagamento de benefícios do regime próprio de previdência social. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º Nenhum investimento cuja execução ultrapasse um exercício financeiro poderá ser iniciado sem prévia inclusão no plano plurianual ou sem lei que autorize a inclusão, sob pena de crime de responsabilidade.","§ 2º Os créditos especiais e extraordinários terão vigência no exercício financeiro em que forem autorizados, salvo se o ato de autorização for promulgado nos últimos quatro meses daquele exercício, caso em que reabertos nos limites de seus saldos, serão incorporados ao orçamento do exercício financeiro subsequente."],"nt":[]},{"id":"lom:158","n":"158","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["Os recursos correspondentes a dotações orçamentárias, compreendidos os créditos suplementares e especiais, destinados à Câmara Municipal, ser-lhes-ão entregues até o dia vinte de cada mês."],"nt":[]},{"id":"lom:159","n":"159","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["A despesa com pessoal ativo e inativo do Município não poderá exceder os limites estabelecidos em Lei Complementar Federal. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A concessão de qualquer vantagem ou aumento de remuneração, a criação de cargos ou alteração de estrutura de carteiras, bem como a admissão de pessoal, a qualquer título, pelos Órgãos e entidades da Administração direta ou indireta, só poderão ser feitas se houver prévia dotação orçamentária suficiente para atender às projeções de despesa de pessoal e aos acréscimos dela decorrentes e previsão na Lei de Diretrizes Orçamentárias."],"nt":[]},{"id":"lom:160","n":"160","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["A saúde é direito de todos os Munícipes e dever do Poder Público, assegurada mediante políticas sociais e econômicas que visem à redução do risco de doenças e outros agravos e ao acesso universal e igualitário às ações e serviços para sua promoção, proteção e recuperação. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:161","n":"161","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["Para atingir os objetivos estabelecidos no artigo anterior, o Município promoverá por todos os meios ao seu alcance:","I – condições dignas de trabalho, saneamento, moradia, alimentação, educação, transporte e lazer;","II – Solução para as causas de insalubridade, independentemente, do pagamento aos seus servidores do adicional previsto em lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – colocar suas funcionárias servidoras, quando notificadas de gravidez, em local não insalubre garantindo-lhes exames médicos periódicos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – respeito ao meio ambiente e controle da poluição ambiental; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – acesso universal e igualitário de todos os habitantes do Município às ações e serviços de promoção, proteção e recuperação de saúde, sem qualquer discriminação. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:162","n":"162","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["As ações de saúde são de relevância pública devendo sua execução ser feita preferencialmente através de serviços públicos e, de modo complementar, através de serviços de terceiros. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único É vedado ao Município cobrar do usuário pela prestação de serviços de assistência de saúde mantidos pelo Poder Público ou contratados com terceiro."],"nt":[]},{"id":"lom:163","n":"163","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["São atribuições do Município, no âmbito do sistema único de saúde:","I – planejar, programar e organizar a rede regionalizada e hierarquizada do SUS, em articulação com a sua direção estadual e federal; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – gerir, executar, controlar e avaliar as ações referentes às condições e aos ambientes de trabalho; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – planejar, gerir, executar e monitorar as ações de serviços de saúde do Município, especialmente referentes à: (Redação dada pela Emenda à Lei Orgânica 04/2016) a) vigilância epidemiológica; (Redação dada pela Emenda à Lei Orgânica 04/2016) b) vigilância sanitária; (Redação dada pela Emenda à Lei Orgânica 04/2016) c) vigilância nutricional. (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – planejar e executar a política do saneamento básico em articulação com o Estado e a União;","V – fiscalizar agressões ao meio ambiente que tenham repercussão sobre a saúde humana e atuar, junto aos órgãos estaduais e federais competentes, para controla-las;","VI – executar a política de insumos e equipamentos para saúde;","VII – formar consórcios intermunicipais de saúde;","VIII – gerir laboratórios públicos de saúde;","IX – avaliar e controlar a execução de convênios e contratos, celebrados pelo Município, com entidades privadas prestadoras de serviços de saúde e com Instituições de Ensino Públicas e Privadas com cursos na área de Ciências da Saúde; (Redação dada pela Emenda à Lei Orgânica 04/2016)","X – construir postos de combate às moléstias específicas, contagiosas e infectocontagiosas;","XI – formação de consciência sanitária individual nas primeiras idades, através da Educação Infantil e Ensino Fundamental; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XII – combate, prevenção do uso de tóxicos e entorpecentes, bem como o tratamento de dependentes. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:164","n":"164","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["As ações e os serviços de saúde realizados no Município devem observar os princípios e diretrizes estabelecidos para o Sistema Único de Saúde, organizado de acordo com os princípios e diretrizes estabelecidos em Lei Federal: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – comando único exercido pela Secretaria Municipal de Saúde ou equivalente, assegurada a participação popular; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – integridade na prestação das ações de saúde;","III – organização de distritos sanitários com alocação de infraestrutura, equipamentos e pessoal, recursos técnicos e práticos de saúde adequados à realidade epidemiológica local; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – participação em nível de decisão de entidades representativas dos usuários, dos trabalhadores de saúde e dos representantes governamentais, na formulação, gestão e controle da política municipal e das ações de saúde através do Conselho Municipal de caráter deliberativo e paritário. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Os limites dos distritos sanitários referidos no inciso III constarão do Plano Diretor de Saúde e serão fiados segundo os seguintes critérios:","I – área geográfica de abrangência;","II – descrição da clientela;","III – resolutividade de serviços à disposição da população."],"nt":[]},{"id":"lom:165","n":"165","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["Lei Municipal disporá sobre o Conselho Municipal de Saúde, para exercer o controle social das ações da política e dos serviços de saúde. (Redação dada pela Emenda à Lei Orgânica 04/2016) I. (Revogado pela Emenda à Lei Orgânica 04/2016) II. (Revogado pela Emenda à Lei Orgânica 04/2016) III. (Revogado pela Emenda à Lei Orgânica 04/2016)","Parágrafo único (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:166","n":"166","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["As instituições privadas poderão participar de forma complementar do Sistema Único de Saúde mediante contrato de direito público ou convênio, tendo preferência as entidades filantrópicas e as sem fins lucrativos."],"nt":[]},{"id":"lom:167","n":"167","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO I — Da Política de Saúde"],"t":["O Sistema Único de Saúde no âmbito do Município será financiado com recursos do Orçamento do Município, do Estado, da União e da Seguridade Social, além de outras fontes.","§ 1º Os recursos destinados às ações e aos serviços de saúde no Município constituirão o Fundo Municipal de Saúde, conforme dispuser a lei.","§ 2º (Revogado pela Emenda à Lei Orgânica 01/2012)","§ 3º É vedada a destinação de recursos públicos para auxílios e subvenções às instituições privadas com fins lucrativos."],"nt":[]},{"id":"lom:168","n":"168","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["A educação, direito de todos e dever do Estado e da Família, é promovida e incentivada com a colaboração da sociedade, visando o pleno desenvolvimento da pessoa, seu preparo para o exercício da cidadania e sua qualificação para o trabalho.","Parágrafo único Lei Municipal disporá sobre o Conselho Municipal de Educação, para exercer o controle social das ações da Política Municipal de Educação. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:169","n":"169","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["O ensino será ministrado com base nos seguintes princípios: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – igualdade de condições para o acesso e permanência na escola; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – liberdade de aprender, ensinar, pesquisar e divulgar o pensamento, a arte e o saber; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – pluralismo de ideias e de concepções pedagógicas, e coexistência de instituições públicas e privadas de ensino; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – gratuidade do ensino público em estabelecimentos oficiais; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – valorização dos profissionais da educação, garantidos, na forma da lei, planos de carreira, com ingresso exclusivamente por concurso público de provas e títulos, aos das redes públicas; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – gestão democrática do ensino público, na forma da lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VII – garantia de padrão de qualidade de acordo com as diretrizes estabelecidas nos termos da Legislação vigente; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VIII – piso salarial profissional nacional para os profissionais da educação escolar pública, nos termos de lei federal; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IX – Garantia de oferta de Educação em tempo integral. (Redação dada pela Emenda à Lei Orgânica 04/2016) X (Revogado Pela Emenda à Lei Orgânica à Lei Orgânica 04/2016)","XI – (Revogado Pela Emenda à Lei Orgânica à Lei Orgânica 04/2016)","XII – (Revogado Pela Emenda à Lei Orgânica à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:170","n":"170","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["O ensino é livre à iniciativa privada, atendidas as seguintes condições:","I – cumprimento das normas gerais da educação nacional;","II – autorização e avaliação de qualidade pelo Poder Público."],"nt":[]},{"id":"lom:171","n":"171","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["São fixados conteúdos mínimos para a Educação Infantil e Ensino Fundamental, de modo a assegurar formação básica comum e respeito aos valores culturais, cívicos e artísticos, nacionais e regionais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O ensino religioso, de matrícula facultativa, constitui disciplina dos horários normais das escolas públicas de Ensino Fundamental. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º As escolas públicas de Educação Infantil e Ensino Fundamental, incluem entre as disciplinas oferecidas, o estudo da cultura Norte Riograndense, envolvendo as noções básicas da literatura, das artes plásticas e do folclore do Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:172","n":"172","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["O Município organizará em regime de colaboração com o Estado e a União, seu sistema de ensino visando à garantia de:","I – educação básica obrigatória e gratuita dos 4 (quatro) aos 17 (dezessete) anos de idade, assegurada inclusive sua oferta gratuita para todos os que a ela não tiveram acesso na idade própria; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – (Revogado pela Emenda à Lei Orgânica à Lei Orgânica 04/2016)","III – atendimento educacional especializado aos portadores de deficiência, na rede regular de ensino; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – atendimento em creche e pré-escolar às crianças de zero a cinco anos de idade; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – acesso aos níveis mais elevados do ensino, da pesquisa e da criação artística, considerando-se o ritmo de aprendizagem e as potencialidades individuais;","VI – oferta e ensino noturno regular, adequado às condições do educando;","VII – atendimento ao educando, no ensino fundamental, através de programas suplementares de material didático escolar, transporte, alimentação e assistência à saúde.","§ 1º O Município atuará prioritariamente na educação infantil e ensino fundamental, adequando o calendário escolar às peculiaridades climáticas e às condições sociais e econômicas de forma flexível; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Compete ao Poder Público Municipal recensear os educandos do ensino fundamental, fazer-lhes a chamada e zelar, junto aos pais ou responsáveis, pela frequência à escola. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O não oferecimento do ensino obrigatório pelo Poder Público Municipal, ou sua oferta irregular, importam responsabilidade da autoridade competente, nos termos da lei específica. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º O Município assegurará à criança de zero a cinco anos a educação pré-escolar obrigatória, pública e gratuita, com o objetivo de promover o seu desenvolvimento biossocial, psico-afetivo e intelectual. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:173","n":"173","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["O Município aplicará, anualmente, no mínimo, vinte e cinco por cento da receita resultante de impostos e das transferências recebidas do Estado e da União na manutenção e no desenvolvimento do ensino. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Compete ao município na oferta da educação infantil e ensino fundamental, o mínimo de 30%. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:174","n":"174","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["A lei estabelecerá o plano municipal de educação, de duração decenal, visando a articulação e ao desenvolvimento do ensino aos seus diversos níveis, etapas e modalidades à integração das ações do Poder Público que conduzam a:","I – erradicação do analfabetismo,","II – universalização do atendimento escolar;","III – melhoria da qualidade do ensino;","IV – formação para o trabalho;","V – promoção humanística, científica e tecnológica do Município."],"nt":[]},{"id":"lom:175","n":"175","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["O Município promoverá e incentivará o desenvolvimento científico cultural a pesquisa e a formação continuada aos profissionais da educação. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A pesquisa sobre temas regionais receberá tratamento prioritário da administração municipal, tendo como vista os bens públicos e o progresso da ciência e da técnica.","§ 2º O Município estimulará as empresas que investirem em pesquisa, formação e aperfeiçoamento de professores e técnicos, bem como as que investirem no desenvolvimento artístico e cultural da Região. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:176","n":"176","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["(Revogado pela Emenda à Lei Orgânica 04/2016)","§ 1º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:177","n":"177","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO I — Da Política Educacional"],"t":["A expansão da rede municipal de educação, para o ensino médio e superior, está condicionada a comprovação do pleno atendimento das necessidades do ensino pré-escolar e fundamental. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único O Município deverá incluir ao currículo escolar temas transversais, nos termos de lei específica. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:178","n":"178","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO II — Da Política Cultural"],"t":["O Município garantirá a todos pleno exercício dos direitos culturais e o acesso às fontes de cultura, apoiará e incentivará a valorização e a difusão das manifestações culturais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A lei disporá sobre a fixação de datas comemorativas de alta significação para os diferentes segmentos étnicos Municipal, Estadual e Nacional."],"nt":[]},{"id":"lom:179","n":"179","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO II — Da Política Cultural"],"t":["Constituem patrimônio cultural do Município os bens de natureza material e imaterial tomados, individualmente ou em conjunto, portadores de referência à identidade, à ação, à memória dos diferentes grupos formadores da sociedade mossoroense, nos quais se incluem: (Redação dada pela à Lei Orgânica Emenda 04/2016)","I – as formas de expressão;","II – os modos de criar, fazer e viver;","III – as criações científicas, artísticas e tecnológicas;","IV – os conjuntos urbanos e sítios de valor histórico, paisagístico, artístico, arqueológico, paleontológico, ecológico e científico.","V – as obras, objetos, documentos, edificações e demais espaços destinados às manifestações artístico- culturais; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O Poder Público, com a colaboração da comunidade, promoverá e protegerá o patrimônio cultural do Município, por meio de inventário, registro, vigilância, tombamento, desapropriação e de outras formas de cautelamento e preservação. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Cabem à administração pública, na forma da lei, a gestão da documentação governamental e as providências para franquear sua consulta a quanto delas necessitem.","§ 3º A lei estabelecerá incentivos para a produção e o conhecimento de bens e valores culturais.","§ 4º Os danos e ameaças ao patrimônio são punidos, na forma da lei.","§ 5º O poder Público assegurará os meios e as condições para o funcionamento eficiente da Biblioteca Pública Municipal, documentação e arquivos, como órgãos executores da política de incentivo à leitura, à preservação do patrimônio bibliográfico, documental e o intercâmbio com as instituições congêneres.","§ 6º Ficam isentos do pagamento do imposto predial e territorial urbano os imóveis tombados pelo Município com razão de suas características históricas, artísticas, culturais e paisagísticas."],"nt":[]},{"id":"lom:180","n":"180","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO III — Da Política Esportiva"],"t":["É dever do Município fomentar práticas desportivas formais e não formais, como direito de cada um, observados: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – a autonomia das entidades desportivas dirigentes e associações, quanto a sua organização e funcionamento.","II – a destinação de recursos públicos para a promoção prioritária do desporto educacional e, casos específicos, para o desporto de alto rendimento;","III – O tratamento diferenciado para o desporto profissional e o não profissional;","IV – a proteção e o incentivo às manifestações desportivas de criação nacional.","§ 1º O Poder Público incentivará o lazer como forma de promoção social.","§ 2º O Município estimulará, por todos os meios, a prática esportiva. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O Município instituirá plano municipal de esporte e lazer, e o executará conforme lei específica. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:181","n":"181","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO III — Da Política Esportiva"],"t":["O Município não custeará entidades desportivas profissionais."],"nt":[]},{"id":"lom:182","n":"182","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO II — Da Política Educacional, Cultural e Esportiva","SEÇÃO III — Da Política Esportiva"],"t":["(Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183","n":"183","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["A política da assistência social do Município de Mossoró será prestada a quem dela necessitar, independentemente de contribuição à seguridade social, e tem por objetivos: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – a proteção integral à família, à maternidade, à criança, ao adolescente, ao idoso e à pessoa com deficiência; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – a proteção crianças e adolescentes em situação de risco e vulnerabilidade social; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – a promoção da integração do mercado de trabalho; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – a reabilitação e habilitação da pessoa com deficiência, promovendo-lhe a melhoria da qualidade de vida e a integração na vida comunitária; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – a oferta do Serviço de Proteção; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – (Revogado pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Caberá ao Município de Mossoró, apresentar para revalidar ou não o plano municipal de assistência social por ocasião da conferência municipal, contendo banco de dados consistentes, acessíveis e públicos, com referência ao usuário da zona urbana e rural, bem como os avanços obtidos com a política de assistência. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-A","n":"183-A","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município estabelecerá plano de ações na área da assistência social observada as seguintes diretrizes: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – As ações governamentais na área da assistência social serão realizadas com recursos do orçamento da seguridade social, previstos no art. 195 da CF, além de outras fontes;","II – tomar conhecimento de todos os programas, projetos e serviços na área de assistência social, desenvolvidos no âmbito do Município independente de ser ente público ou não. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-B","n":"183-B","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município poderá firmar convênios com entidades do 3º setor, devidamente cadastradas no Conselho Municipal de Assistência Social para a execução do SUAS, sob pena de nulidade. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-C","n":"183-C","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município, na formulação e na aplicação de suas políticas sociais, visará oportunizar a família condições para a realização de suas relevantes funções sociais. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-D","n":"183-D","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["É dever da família, da sociedade e do Poder Público assegurar à criança e ao adolescente, com absoluta prioridade, o direito à vida, à saúde, à alimentação, à educação, ao lazer, à profissionalização, à cultura, à dignidade, ao respeito, à liberdade e à convivência familiar e comunitária, além de colocá-los a salvo de toda forma de negligência, discriminação, exploração, violência, crueldade e opressão. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-E","n":"183-E","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município, em conjunto com a sociedade, criará e manterá Programas socioeducativos e de assistência jurídica destinados ao atendimento de criança e adolescente privados das condições necessárias ao seu pleno desenvolvimento e incentivará os programas de iniciativa das comunidades, mediante apoio técnico e financeiro, vinculado ao orçamento, de forma a garantir-se o completo atendimento dos direitos constantes desta Lei Orgânica. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-F","n":"183-F","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município promoverá condições que assegurem amparo à pessoa idosa, no que respeite à sua dignidade e ao seu bem-estar. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O amparo ao idoso será, quando possível, exercido no próprio lar. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Para assegurar a integração do idoso na comunidade e na família, serão criados centros diurnos de lazer e de amparo à velhice. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-G","n":"183-G","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O Município, isoladamente ou em cooperação, criará e manterá: (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Unidades de escuta e ou de serviços especializados a mulher, a criança e o idoso vítimas de violência no âmbito da família ou fora dele; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – Centros de orientação jurídica à mulher, formados por equipes multidisciplinares; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Centros de apoio e acolhimento à menina de rua que a considerem em suas especificidades. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:183-H","n":"183-H","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO III — Da Política de Assistência Social"],"t":["O município poderá firmar convênios/ parcerias com organizações não governamentais devidamente cadastradas no conselho municipal de assistência social para execução do sistema único da assistência social, sob pena de nulidade. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:184","n":"184","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["O Município promoverá o seu desenvolvimento econômico, agindo de modo que as atividades econômicas realizadas em seu território contribuam para elevar o nível de vida e o bem - estar da população local, bem como para valorizar o trabalho humano e o desenvolvimento de novas tecnologias de produção. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Para consecução do objetivo mencionado neste artigo, o Município atuará de forma exclusiva ou em parceria com a União, com o Estado, outros Municípios ou Parcerias Público-Privadas. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:185","n":"185","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["Na promoção do desenvolvimento econômico o Município agirá, sem prejuízo de outras iniciativas, observados os seguintes objetivos: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – Fomentar a livre iniciativa;","II – Privilegiar a geração de emprego;","III – Utilizar tecnologia de uso intensivo de mão-de-obra;","IV – Fomentar a livre concorrência; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Promover o desenvolvimento sustentável; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – Proteger os direitos dos usuários dos serviços públicos e dos consumidores;","VII – Dar tratamento favorecido às micro e pequenas empresas e microempreendedores individuais; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VIII – Estimular o associativismo, o cooperativismo, as demais instituições de economia solidária, bem como as Parcerias Público-Privadas; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IX – Flexibilizar entraves burocráticos que possam limitar o exercício da atividade econômica; (Redação dada pela Emenda à Lei Orgânica 04/2016)","X – Desenvolver ações junto a outras esferas de Governo, de modo a que sejam, entre outros, efetivados: (Redação dada pela Emenda à Lei Orgânica 04/2016) a) Assistência técnica;","b) Crédito especializado ou subsidiado;","c) Estímulos fiscais e financeiros;","d) Serviços de suporte informativo ou de mercado.","XI – Distribuir os benefícios e encargos do processo de desenvolvimento do Município, inibindo a especulação imobiliária, os vazios urbanos e a excessiva concentração urbana. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:186","n":"186","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["É de responsabilidade do Município, no campo de sua competência, a realização de investimentos para formar e manter a infraestrutura básica capaz de atrair, apoiar ou incentivar o desenvolvimento de atividades produtivas, seja diretamente ou mediante delegação ao setor privado para esse fim.","Parágrafo único A atuação do Município dar-se-á, inclusive, no meio rural, para a fixação de contingentes populacionais possibilitando-lhes acesso aos meios de produção e geração de renda e estabelecendo a necessária infraestrutura destinada a viabilizar esse propósito."],"nt":[]},{"id":"lom:187","n":"187","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["A atuação do Município, na zona rural, terá como principais objetivos:","I – Oferecer meios para assegurar ao pequeno produtor e trabalhador rural condição de trabalho e de mercado para os produtos, a rentabilidade dos empreendimentos e a melhoria do padrão de vida da família rural;","II – Promover o escoamento e a comercialização da produção, sobretudo nas centrais de abastecimento alimentar; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Garantir a utilização sustentável dos recursos naturais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – Incentivar a ampliação e conservação de rede de estradas, eletrificação e rede de água potável. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:188","n":"188","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["Como principais instrumentos para o fomento da produção na zona rural, o Município poderá utilizar a assistência técnica, a extensão rural, o armazenamento, o transporte, o associativismo e a divulgação das oportunidades de crédito e de incentivos fiscais. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:189","n":"189","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["O Município poderá promover parcerias com outros Municípios com vistas ao desenvolvimento de atividades econômicas de interesse comum, bem como integrar-se em pesquisas de desenvolvimento regional a cargo de outras esferas de governo. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:190","n":"190","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["O Município desenvolverá esforços para proteger o consumidor através de:","I – Orientação e gratuidade de assistência jurídica independente da situação social e econômica do reclamante;","II – Criação de órgãos para defesa do consumidor;","III – Atuação coordenada com a União e o Estado."],"nt":[]},{"id":"lom:191","n":"191","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["Poder Executivo criará e disponibilizará no prazo de 1 (um) ano, sistema de informações sócio econômicas. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:192","n":"192","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["O Município poderá estabelecer legislação tributária, visando ao tratamento favorecido para pequena e média empresa, os microempreendedores individuais, associações e cooperativas e demais instituições da economia solidária, conforme a lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:193","n":"193","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["O Município, em caráter precário e por prazo limitado definido em ato do Prefeito, permitirá às microempresas se estabelecerem na residência de seus titulares, desde que não prejudiquem as normas ambientais, da segurança, do silêncio, do trânsito e da saúde pública."],"nt":[]},{"id":"lom:194","n":"194","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["Fica assegurada às micro e pequenas empresas e os microempreendedores individuais ou entidades de economia solidária a simplificação ou a eliminação, através de ato do Prefeito, de procedimentos administrativos em seu relacionamento com a Administração Municipal, direta ou indireta. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:195","n":"195","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IV — Da Política Econômica"],"t":["As pessoas com deficiência, assim como as pessoas idosas, terão prioridade para exercer o comércio eventual ou ambulante no Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:196","n":"196","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["A política urbana, a ser formulada no âmbito do processo de planejamento municipal, terá por objetivo o pleno desenvolvimento das funções sociais da cidade e o bem-estar dos seus habitantes, em consonância com as políticas sociais e econômicas do Município.","§ 1º As funções sociais da cidade dependem do acesso de todos os cidadãos aos bens e aos serviços urbanos, assegurando- lhes condições de vida e moradia compatíveis com o estágio de desenvolvimento do Município.","§ 2º A propriedade urbana cumpre sua função social quando atende às exigências fundamentais de ordenação da cidade expressas no plano diretor. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º As desapropriações de imóveis urbanos serão feitas com prévia e justa indenização em dinheiro. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º É facultado ao Poder Público municipal, mediante lei especifica para área incluída no plano diretor, exigir, nos termos da lei federal, do proprietário do solo urbano não edificado, subutilizado ou não utilizado, que promova seu adequado aproveitamento, sob pena, sucessivamente, de:","I – Parcelamento ou edificação compulsória;","II – Imposto sobre a propriedade predial e territorial urbana progressivo no tempo;","III – Desapropriação com pagamento mediante título da dívida pública de emissão previamente aprovado pelo Senado Federal, com prazo de resgate de até dez anos, em parcelas anuais, iguais e sucessivas, assegurados o valor real da indenização e os juros legais.","§ 5º A partir da promulgação desta lei, os proprietários dos espaços vazios, não utilizados ou subutilizados, localizados dentro do perímetro urbano, poderão ser notificados pela prefeitura, conforme conveniência e necessidade, a apresentarem o projeto de utilização no prazo de um ano. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:197","n":"197","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["O plano diretor, aprovado pela Câmara Municipal, é o instrumento básico da política urbana a ser executada pelo Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O plano diretor fixará os critérios que assegurem a função social da propriedade; cujo uso e ocupação devem respeitar a legislação urbanística, a proteção do patrimônio ambiental, natural, construído e o interesse da coletividade.","§ 2º O plano diretor deverá ser revisado com a participação das entidades representativas da comunidade diretamente interessada, mediante realização de audiência pública. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O plano diretor definirá as áreas especiais de interesse social, urbanístico ou ambiental, para as quais será exigido aproveitamento adequado nos termos previstos na Constituição Federal.","§ 4º No Plano Diretor deverão ser reservados locais para o funcionamento de feiras livres de pequenos produtores e artesãos, que gozem de isenções de impostos municipais na comercialização de seus produtos.","§ 5º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 6º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 7º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 8º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 9º As obras públicas serão adaptadas conforme normas de acessibilidade vigente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 10º O plano diretor do município deverá conter:","I – A delimitação de áreas destinadas à implantação de atividades com potencial poluidor hídrico e atmosférico, que atendam aos padrões de controle de qualidade sanitária;","II – A delimitação de áreas destinadas à habitação popular, que atenderão aos seguintes critérios:","a) contiguidade às áreas de rede de abastecimento de água e energia elétrica, no caso de conjuntos habitacionais;","b) localização acima da cota máxima de cheias;","c) declividade inferior a trinta por cento, salvo se existirem no perímetro urbano áreas que atendam a esse requisito, quando será admitida uma declividade de até cinquenta por cento, desde que se obedeçam aos padrões de projetos, a serem definidos em lei municipal.","III – A identificação das áreas urbanas para o atendimento ao disposto no art. 182 §4ºda Constituição Federal;","IV – O estabelecimento de parâmetros máximos para parcelamento do solo e para edificação, que assegurem o adequado aproveitamento do solo;","V – As diretrizes orçamentárias e os orçamentos anuais consignando prioridades da administração pública, metas e indicação de recursos necessários para os programas de duração continuada, em benefício de pessoas com deficiência, menores carentes e idosos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – A eliminação das barreiras arquitetônicas em logradouros públicos, bem como aos veículos de transporte coletivo.","§ 11 A prefeitura poderá permitir a concessão de outorga onerosa do direito de construir, bem como a exploração do potencial construtivo. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:198","n":"198","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["Para assegurar as funções sociais da cidade, o Poder Executivo deverá utilizar os instrumentos jurídicos tributários, financeiros e de controle urbanístico e ambiental existentes e à disposição do Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:199","n":"199","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["O Município promoverá, em consonância com sua política urbana e respeitadas as disposições do plano diretor, programas de habitação popular destinados a melhorar as condições de moradia da população carente do Município.","§ 1º A ação do Município deverá orientar-se para:","I – Ampliar o acesso a lotes mínimos dotados de infraestrutura básica e servidos por transporte coletivo;","II – Estimular e assistir tecnicamente projetos comunitários e associativos de construção de habitação e serviços;","III – Urbanizar, regularizar e titular as áreas ocupadas por população de baixa renda, passíveis de urbanização;","IV – Priorizar serviços e obras na periferia da cidade onde residem as populações mais carentes;","V – Investir, prioritariamente, nos pontos turísticos, parques, praças e áreas de lazer da cidade.","§ 2º Na promoção de seus programas de habitação popular, o Município deverá articular-se com os órgãos estaduais, regionais e federais competentes e entidades representativas, quando couber, estimular a iniciativa privada e contribuir para aumentar a oferta de moradias adequadas e compatíveis com a capacidade econômica da população. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O Poder Público Municipal liberará o habite-se para construções, quando estas possuírem toda sua infraestrutura concluída. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º No caso dos empreendimentos multifamiliares, o Poder Público Municipal está autorizado a liberar habite-se parcial quando as áreas de utilização comuns estiverem concluídas. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:200","n":"200","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["O Município, em consonância com a sua política urbana e ambiental segundo o disposto em seu plano diretor, deverá promover programas de saneamento ambiental destinados melhorar as condições sanitárias e ambientais das áreas urbanas e os níveis de saúde da população. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A ação do Município deverá orientar-se para:","I – Ampliar progressivamente a responsabilidade local pela prestação de serviços de saneamento básico;","II – Executar programas de saneamento em áreas pobres atendendo à população de baixa renda, com soluções adequadas e de baixo custo para o abastecimento de água e esgoto sanitário;","III – Executar programas de educação sanitária e melhorar o nível da participação das comunidades na solução de seus problemas de saneamento;","IV – Levar à prática, pelas autoridades competentes, tarifas sociais para os serviços de água.","IV – Implementar tarifas sociais para os serviços de água. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:201","n":"201","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO I — Da Política Urbana"],"t":["O Município deverá manter articulação permanente com os demais Municípios da região e com o Estado visando à racionalização da utilização dos recursos hídricos e das bacias hidrográficas, respeitadas as diretrizes estabelecidas pela União."],"nt":[]},{"id":"lom:202","n":"202","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO II — Da Política Municipal de Transporte"],"t":["O Município na prestação de serviços de transporte público fará obedecer aos seguintes princípios básicos:","I – Segurança e conforto dos passageiros, garantindo, em especial, acesso às pessoas de deficiências físicas e senhoras gestantes, somente permitindo a circulação de novos ônibus que se encontrem adaptados para esta finalidade; (Redação dada pela Emenda à Lei Orgânica 04/2016) II – Tarifa Social, assegurada a gratuidade aos maiores de sessenta anos, desde que reconhecidamente pobres, na forma da lei, e assegurado o desconto de cinquenta por cento aos estudantes em geral, com gratuidade total aos estudantes da rede pública de ensino ou bolsistas da rede privada, desde que reconhecidamente pobres, na forma da lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Proteção ambiental contra poluição atmosférica e sonora, inclusive tornando obrigatório o uso do sistema aéreo do escapamento dos coletivos;","IV – Integração entre sistemas e meios de transporte e racionalização das vias públicas por onde trafegam os transportes coletivos;","V – Prioridade a pedestres e usuários dos serviços;","VI – Participação das entidades representativas da comunidade e dos usuários no planejamento e na fiscalização dos serviços.","Parágrafo único Lei específica disporá acerca da isenção de que trata o Inciso II deste artigo. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:203","n":"203","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO II — Da Política Municipal de Transporte"],"t":["O Município, em consonância com sua política urbana e ambiental seguindo o disposto ao seu plano diretor, deverá promover planos e programas setoriais destinados a melhorar as condições do transporte público, da circulação de veículos e da segurança do trânsito.","§ 1º Lei Municipal disporá sobre o Conselho Municipal de Trânsito e Transporte. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º O Plano Municipal de Mobilidade Urbana considerará todos os locais possíveis de atendimento ao usuário. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O serviço de táxi e mototaxi terá seu reajuste tarifário por ocasião do reajuste dos transportes, urbanos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:203-A","n":"203-A","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO V — Da Política Urbana e de Transporte","SEÇÃO II — Da Política Municipal de Transporte"],"t":["O Município deverá estabelecer e implantar políticas de educação para a segurança do trânsito, em articulação com o Estado. (Redação dada pela à Lei Orgânica Emenda 04/2016)."],"nt":[]},{"id":"lom:204","n":"204","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["O Município deverá atuar no sentido de assegurar o direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo e essencial à sadia qualidade de vida, impondo a todos o dever de defendê-lo e preserva-lo para as presentes e futuras gerações. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Para assegurar efetividade a esse direito, o Município deverá articular-se com órgãos estaduais, regionais e federais competentes e ainda, quando for o caso, com outros Municípios, objetivando a solução de problemas comuns relativos à proteção ambiental."],"nt":[]},{"id":"lom:205","n":"205","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["O Município deverá atuar mediante planejamento, controle e fiscalização das atividades, públicas ou privadas, causadoras efetivas ou potenciais de alterações significativas no meio ambiente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O Município estabelecerá plano plurianual de saneamento com a aprovação da Câmara Municipal determinando as diretrizes e os programas, atendidas as particularidades da bacia hidrográfica da cidade e os respectivos recursos hídricos.","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 3º O município fiscalizará a emissão de sons e ruídos, produzidos por qualquer meios e espécies, considerando sempre, os locais e horários, e a natureza das atividades emissoras, aplicando a legislação pertinente. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:206","n":"206","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["O Município ao promover a ordenação de seu território, definirá zoneamento e diretrizes gerais de ocupação que assegurem a proteção dos recintos naturais, em consonância com o disposto na legislação estadual pertinente."],"nt":[]},{"id":"lom:207","n":"207","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["A política urbana do Município e o seu plano diretor deve contribuir para a proteção do meio ambiente, através da adoção de diretrizes adequadas de uso e ocupação do solo urbano. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Na construção de escolas e creches serão destinados trinta por cento da área total do terreno para formação e preservação de área verde, inclusive, garantindo locais adequados para a construção de áreas de lazer e esporte."],"nt":[]},{"id":"lom:208","n":"208","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["Nas licenças de parcelamento, loteamento e localização o Município exigirá o cumprimento da legislação de proteção ambiental emanada da União, do Estado e do Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:209","n":"209","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["As empresas concessionárias ou permissionárias de serviços públicos deverão atender rigorosamente aos dispositivos de proteção ambiental em vigor, sob pena de não ser renovada a concessão ou permissão pelo Município."],"nt":[]},{"id":"lom:210","n":"210","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VI — Da Política do Meio Ambiente"],"t":["O Município assegurará a participação das entidades representativas da comunidade no planejamento e na fiscalização da proteção ambiental, garantindo o amplo acesso dos interessados as informações sobre as fontes de poluição e degradação ambiental ao seu dispor.","§ 1º A lei manterá o órgão municipal de controle da poluição e preservação do meio ambiente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Os detritos sólidos portadores de agentes patogênicos e os de estabelecimentos hospitalares e congêneres, animais mortos, assim como resíduos perigosos deverão ser adequadamente acondicionados e conduzidos em transportes especiais para a devida destinação adequada, sob a responsabilidade do seu gerador. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O município se responsabilizará pela coleta, transporte e destinação final dos resíduos domiciliares. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º O município implementará e manterá o plano municipal de resíduos sólidos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:211","n":"211","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VII — Da Política de Turismo"],"t":["A política de turismo do Município de Mossoró promoverá o conhecimento e fruição das riquezas culturais e naturais do local, sendo pautada pelo respeito e preservação da identidade cultural local, sua diversidade, bem como do equilíbrio ambiental, sendo prioritárias as ações que fomentem grupos tradicionais e companhias artísticas locais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A realização de grandes eventos festivos deverá obedecer aos princípios mencionados no caput. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:212","n":"212","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VII — Da Política de Turismo"],"t":["O Município criará o Conselho Municipal de Turismo a ser regulamentado em Lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º Da composição do Conselho a que se refere este artigo participarão, sempre, representantes dos Poderes Executivo e Legislativo e da sociedade civil; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º A Presidência do Conselho será de indicação exclusiva do Prefeito e terá mandato de dois anos, com direito à indicação por mais um período. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:213","n":"213","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VIII — Política de Segurança, de Defesa Civil e do Consumidor"],"t":["Caberá à Secretaria de Segurança Pública: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – Exercer, no âmbito do município de Mossoró, monitoramento preventivo e comunitário de atos que possam configurar desvio da ordem, do sossego e da paz pública, promovendo mediação de conflitos e o respeito aos direitos fundamentais dos cidadãos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Atuar, de forma articulada com os órgãos municipais de políticas sociais, visando a ações interdisciplinares de segurança e defesa civil do Município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:213-A","n":"213-A","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VIII — Política de Segurança, de Defesa Civil e do Consumidor"],"t":["A lei conferirá a órgãos da sociedade civil atribuições consultivas na colaboração da política de segurança do Município, com especificações regionais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O município criará o Conselho Municipal de Segurança Pública, com participação da Sociedade Civil e da População, nos termos da lei complementar. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º O município elaborará como suporte ao Conselho Municipal de Segurança Pública, um Plano Municipal de Segurança Pública. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O Plano Municipal de Segurança Pública possui caráter diagnóstico e participativo, com prazo de cinco anos renovados a cada quinquênio. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:214","n":"214","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VIII — Política de Segurança, de Defesa Civil e do Consumidor"],"t":["O Município dará apoio permanente a todas as iniciativas da Comissão de Defesa Civil."],"nt":[]},{"id":"lom:215","n":"215","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO VIII — Política de Segurança, de Defesa Civil e do Consumidor"],"t":["O Município poderá constituir guarda municipal, força auxiliar destinada à proteção de seus bens, serviços e instalações, nos termos de lei complementar.","§ 1º A Lei complementar de criação da guarda municipal disporá sobre acesso, direitos, deveres, vantagens e regime de trabalho, com base na hierarquia e disciplina.","§ 2º A investidura nos cargos de guarda municipal far-se-á mediante concurso público de provas ou de provas e títulos."],"nt":[]},{"id":"lom:216","n":"216","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O Município poderá criar na forma da lei a Secretaria Municipal de Agricultura, cujas competências e atribuições serão especificadas na forma da lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:217","n":"217","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A política agrícola e de abastecimento do município será orientada pelo incentivo à agricultura familiar, à produção agroecológica e eficiente, ao cooperativismo, à pesquisa científica, à promoção da extensão rural e do equilíbrio socioambiental no campo, bem como pelo combate à pobreza rural e às práticas produtivas predatórias da terra, do meio ambiente e do trabalho. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O Município poderá desenvolver ações específicas de apoio ao pequeno produtor agrícola, com vistas a promover seu avanço socioeconômicos e estimular uma produção racional, eficiente e ecologicamente sustentável. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º A.O Município deverá elaborar, anualmente, com ampla participação popular, o Plano Municipal de Agricultura, em que constem planejamentos e ações prioritárias que devam ser promovidas no setor agrícola e os resultados que, a partir delas, deverão ser obtidos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:218","n":"218","tag":"","b":"H","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A lei disciplinará a utilização de agrotóxicos no território do Município, vedada a concessão de qualquer beneficio fiscal ou incentivo a produtos potencialmente causadores de poluição ou degradação de meio ambiente."],"nt":[]},{"id":"lom:ADCT-1º","n":"1º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["As normas constantes nesta lei terão o prazo de um ano para a sua regulamentação.","Parágrafo único Transcorrido o prazo previsto neste artigo sem que haja a devida regulamentação, qualquer cidadão poderá provocar o Poder Judiciário para o seu cumprimento."],"nt":[]},{"id":"lom:ADCT-2º","n":"2º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Lei Municipal disporá acerca da concessão dos Equipamentos de Proteção Individual para os servidores públicos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:ADCT-3º","n":"3º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["(Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:ADCT-4º","n":"4º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O Município deverá instalar geradores de energia nos seus serviços essenciais.","Parágrafo único Os serviços essenciais de que trata este artigo abrangem as áreas de saúde e sistemas de comunicação."],"nt":[]},{"id":"lom:ADCT-5º","n":"5º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Mediante autorização do Poder Legislativo, aprovado por dois terços (2/3) dos seus membros, o Poder Executivo poderá celebrar convênios com empresas privadas, para uso por prazo determinado, de terrenos, e outros próprios de patrimônio público, pagando com construção de obras de interesse social."],"nt":[]},{"id":"lom:ADCT-6º","n":"6º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A revisão da Lei Orgânica será realizada após 10 (dez) anos, contados a partir da data de sua promulgação."],"nt":[]},{"id":"lom:ADCT-7º","n":"7º","tag":"ADCT","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Esta Lei Orgânica, aprovada pela Câmara Municipal, será por ela promulgada e entrará em vigor na data de sua publicação. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:EC-1º","n":"1º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A Lei Orgânica do Município de Mossoró passa a vigorar com as seguintes alterações: “Art. 19. O Regime Próprio de Previdência Social - RPPS dos servidores titulares de cargos efetivos terá caráter contributivo e solidário, mediante contribuição dos órgãos integrantes dos poderes Legislativo e Executivo do Município e dos servidores ativos, de aposentados e de pensionistas, observados critérios que preservem o equilíbrio financeiro e atuarial.","§ 1º Os benefícios previdenciários a cargo do Regime Próprio de Previdência Social - RPPS municipal se restringem a aposentadorias e pensão por morte.","§ 2º O servidor público abrangido pelo Regime Próprio de Previdência Social - RPPS municipal será aposentado:","I – por incapacidade permanente para o trabalho, no cargo em que estiver investido, quando insuscetível de readaptação, hipótese em que será obrigatória a realização de avaliações periódicas para verificação da continuidade das condições que ensejaram a concessão da aposentadoria, na forma de Lei Complementar Municipal;","II – compulsoriamente, com proventos proporcionais ao tempo de contribuição, aos 75 (setenta e cinco) anos de idade, na forma da Lei Complementar Federal nº 152, de dezembro de 2015;","III – aos 60 (sessenta) anos de idade, se mulher, e aos 65 (sessenta e cinco) anos de idade, se homem, observados o tempo de contribuição e os demais requisitos estabelecidos em lei complementar municipal.","§ 3º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o § 2º do art. 201 ou superiores ao limite máximo estabelecido para o Regime Geral de Previdência Social, observado o disposto nos §§ 14 a 16, do artigo 40 da Constituição Federal.","§ 4º As modalidades de aposentadorias, os requisitos e critérios de concessão, as regras para cálculo de proventos de aposentadoria e pensão por morte e demais disciplinas que se fizerem necessárias serão carreadas em lei complementar municipal.","§ 5º As rubricas remuneratórias denominadas como salário-família, salário-maternidade, auxíliodoença, benefício por incapacidade temporária e auxílio-reclusão ficam excluídos do rol de benefícios previdenciários do RPPS de Mossoró e serão pagas, quando devidas, nos termos desta Lei Orgânica e dos demais dispositivos da legislação aplicável, diretamente pelo Ente Federativo e não correrão à conta do Regime Próprio de Previdência Social - RPPS, sendo de inteira e exclusiva responsabilidade, tanto financeira, quanto orçamentária, do Município de Mossoró.","§ 6º O servidor titular de cargo efetivo que tenha completado as exigências para a aposentadoria voluntária estabelecidas neste artigo e que opte, mediante efetiva verificação da implementação dos requisitos para aposentação espontânea, por permanecer em atividade fará jus a um abono de permanência equivalente ao valor da sua contribuição previdenciária, até completar a idade para aposentadoria compulsória.","§ 7º As idades mínimas do servidor exercente do cargo de magistério serão de 58 (cinquenta e oito) anos, se mulher, 63 (sessenta e três) anos de idade, se homem, devendo ser observada a aplicação do redutor constitucional de 5 (cinco) anos, para aqueles que comprovem 25 (vinte e cinco) anos de exclusivo e efetivo exercício das funções de magistério na educação infantil e no ensino fundamental e médio............................................................................................................” (NR) “Art. 19-A. O Regime Próprio de Previdência Social - RPPS do Município de Mossoró fica alterado, e nos termos do inciso II, do art. 36, da Emenda Constitucional nº 103, de 2019, ficando referendadas:","I – pelas alterações promovidas pelo art. 1º da Emenda Constitucional nº 103, de 2019, e art. 149 da Constituição Federal; e","II – pelas revogações previstas na alínea “a”, do inciso I, e nos incisos III e IV, do art. 35 da Emenda Constitucional nº 103, de 2019.”"],"nt":[]},{"id":"lom:EC-2º","n":"2º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A concessão de aposentadoria ao servidor municipal vinculado ao RPPS e de pensão por morte aos respectivos dependentes será assegurada, a qualquer tempo, desde que tenham sido cumpridos os requisitos para obtenção destes benefícios antes da data de vigência desta Emenda à Lei Orgânica, observados os critérios da legislação vigente na data em que foram atendidos os requisitos para a concessão da aposentadoria ou da pensão por morte.","§ 1º Os proventos de aposentadoria a serem concedidos ao servidor a que se refere o caput e as pensões por morte devidas aos seus dependentes serão calculados e reajustados de acordo com a legislação em vigor à época em que foram atendidos os requisitos nela estabelecidos para a concessão destes benefícios.","§ 2º É assegurado o direito ao recebimento do benefício de aposentadoria mais favorável ao servidor municipal, desde que tenham sido implementados todos os requisitos para sua concessão, ou de pensão aos seus dependentes, calculada com base na aposentadoria voluntária que seria devida se estivesse aposentado à data do óbito."],"nt":[]},{"id":"lom:EC-3º","n":"3º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Até que entre em vigor lei complementar alterando ou substituindo as Leis Complementares nº 60 e nº 61, de 9 de dezembro de 2011, aplica-se o disposto nos artigos que se seguem em conjunto com as disposições não revogadas das leis mencionadas neste artigo."],"nt":[]},{"id":"lom:EC-4º","n":"4º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Com fundamento nos incisos I e III do § 1º, §§4º-A, 4º-C e 5º do art. 40 da Constituição Federal, o servidor titular de cargo efetivo vinculado ao RPPS será aposentado nos termos dos incisos I, II e III do § 1º, incisos II e III do §2º e §3º do art. 10, da Emenda Constitucional nº 103, de 2019.","§ 1º As idades mínimas previstas na alínea “a”, inciso I, do §1º e inciso III, do §2º, do art. 10 da Emenda Constitucional nº 103, de 2019, serão alteradas para 60 (sessenta anos), se mulher, e 65 (sessenta e cinco) anos, se homem, para o servidor público em geral.","§ 2º As idades mínimas previstas no inciso III, do §2º, do art. 10 da Emenda Constitucional nº 103, de 2019, serão alteradas para a idade de 58 (cinquenta e oito) anos, se mulher, 63 (sessenta e três) anos de idade, se homem, para os ocupantes do cargo municipal de professor, devendo ser observada a aplicação do redutor de 5 (cinco) anos, de trata o §7º, do art. 19, da Lei Orgânica Municipal, para aqueles que comprovem 25 (vinte e cinco) anos de exclusivo e efetivo exercício das funções de magistério na educação infantil e no ensino fundamental e médio.","§ 3º As determinações previstas no inciso II, do §2º, do art. 10 da Emenda Constitucional nº 103, de 2019, serão alterados pelas disposições contidas no art. 10 desta Emenda à Lei Orgânica Municipal."],"nt":[]},{"id":"lom:EC-5º","n":"5º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Para o cálculo dos proventos de aposentadoria do Regime de Previdência de que trata o inciso I, do § 1º, do art. 10 da Emenda Constitucional nº 103, de 2019, será utilizada a média aritmética simples das remunerações adotadas como base para contribuições ao Regime Próprio de Previdência Social - RPPS, atualizados monetariamente, correspondentes a 85% (oitenta e cinco por cento) dos maiores salários de contribuição desde a competência julho de 1994 ou desde o início da contribuição, se posterior àquela competência, observado o quanto disposto nos §§1º e 6º do art. 26, da Emenda Constitucional nº 103, de 2019.","Parágrafo único Os valores previstos no caput serão reajustados, a partir da data de entrada em vigor desta Emenda, na mesma data e com o mesmo índice em que se der o reajuste dos benefícios do Regime Geral de Previdência Social - RGPS."],"nt":[]},{"id":"lom:EC-6º","n":"6º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Para o cálculo dos proventos de aposentadoria do Regime de Previdência de que trata o inciso II, do §1º, do art. 10 da Emenda Constitucional nº 103, de 2019, será utilizada a média aritmética simples das remunerações adotadas como base para contribuições ao Regime Próprio de Previdência Social - RPPS, atualizados monetariamente, correspondentes a 85% (oitenta e cinco por cento) dos maiores salários de contribuição desde a competência julho de 1994 ou desde o início da contribuição, se posterior àquela competência, quando a incapacidade permanente decorrer de acidente de trabalho, de doença profissional ou do trabalho ou doença grave, contagiosa ou incurável, especificada em lei, observado o quanto disposto nos §§ 1º e 6º, do art. 26, da Emenda Constitucional nº 103, de 2019.","§ 1º Para os casos de incapacidade permanente não abrangidos no caput, o valor da aposentadoria será de 60% (sessenta por cento) do equivalente ao resultado da elaboração da média, conforme caput, acrescido de dois pontos percentuais para cada ano que exceder os vinte anos de contribuição, se homem, e dois pontos percentuais para cada ano que exceder os quinze anos, se mulher.","§ 2º A concessão de aposentadoria por incapacidade permanente dependerá da verificação da condição de incapacidade permanente e insuscetível de reabilitação ou readaptação, mediante inspeção da Junta Biopsicossocial do Município.","§ 3º Constatada a incapacidade permanente pela Junta Biopsicossocial do Município, o segurado passa, imediatamente, a perceber benefício por incapacidade temporária que só será cessado com a publicação do ato aposentador.","§ 4º Até o advento de lei complementar conforme disposto no art. 3º, observar-se-á o rol das doenças graves, contagiosas ou incuráveis do art. 13, da Lei Complementar Municipal nº 060, de 2011.","§ 5º O requerimento do benefício de aposentadoria por incapacidade permanente decorrente de doença mental independerá da apresentação do termo de curatela.","§ 6º O aposentado por incapacidade permanente que voltar a exercer atividade laboral terá a aposentadoria cessada, a partir da data do retorno.","§ 7º Os valores previstos no neste artigo serão reajustados, a partir da data de entrada em vigor desta Emenda, na mesma data e com o mesmo índice em que se der o reajuste dos benefícios do Regime Geral de Previdência Social - RGPS."],"nt":[]},{"id":"lom:EC-7º","n":"7º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Para o cálculo dos proventos de aposentadoria do Regime de Previdência de que trata o inciso III, do § 1º, do art. 10 da Emenda Constitucional nº 103, de 2019, será utilizada a média aritmética simples das remunerações adotadas como base para contribuições ao Regime Próprio de Previdência Social - RPPS, atualizados monetariamente, correspondentes a 85% (oitenta e cinco por cento) dos maiores salários de contribuição desde a competência julho de 1994 ou desde o início da contribuição, se posterior àquela competência, observado o quanto disposto nos §§ 1º e 6º do art. 26 da Emenda Constitucional nº 103, de 2019.","§ 1º O valor da aposentadoria prevista no presente dispositivo será de 60% (sessenta por cento) do equivalente ao resultado da elaboração da média, conforme caput, acrescido de dois pontos percentuais para cada ano que exceder os vinte anos de contribuição, se homem, e dois pontos percentuais para cada ano que exceder os quinze anos, se mulher.","§ 2º Os valores previstos no caput serão reajustados, a partir da data de entrada em vigor desta Emenda, na mesma data e com o mesmo índice em que se der o reajuste dos benefícios do Regime Geral de Previdência Social - RGPS."],"nt":[]},{"id":"lom:EC-8º","n":"8º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O servidor público municipal que tenha ingressado no serviço público em cargo efetivo até a data da entrada em vigor desta Emenda à Lei Orgânica Municipal de Mossoró, poderá aposentar-se voluntariamente conforme o disposto no art. 4º da Emenda Constitucional nº 103, de 2019, observadas as seguintes alterações:","I – as idades mínimas serão reduzidas em dois anos para os servidores públicos de ambos os sexos, para fins do disposto no inciso I, do caput do art. 4º da Emenda Constitucional nº 103, de 2019;","II – o tempo mínimo exigido de efetivo exercício no serviço público será reduzido em cinco anos, para fins do disposto no inciso III, do caput do art. 4º da Emenda Constitucional nº 103, de 2019.","§ 1º Serão reduzidos em cinco anos, para ambos os sexos, os requisitos de idade e tempo de contribuição e, em dez, a quantidade de pontos para o professor que comprovar exclusivamente tempo de efetivo exercício das funções de Magistério na educação infantil e no ensino fundamental e médio, para fins do disposto nos incisos I, II e V, do caput do art. 4º da Emenda Constitucional nº 103, de 2019.","§ 2º O somatório a que se refere o inciso V, do caput do art. 4º da Emenda Constitucional nº 103, de 2019, será acrescido, a cada um ano, a partir de 1º de janeiro de 2023, de um ponto, até atingir o limite de 96 (noventa e seis) pontos, se mulher, e de 104 (cento e quatro) pontos, se homem, com redutor de dez pontos, para ambos os sexos, em relação aos servidores a que se refere o § 1º deste artigo.","§ 3º Para os fins do disposto neste artigo, não se aplica o §1º e o inciso III, do §4º do art. 4º da Emenda Constitucional nº 103, de 2019.","§ 4º Os proventos das aposentadorias concedidas nos termos do disposto neste artigo corresponderão:","I – à totalidade da remuneração do servidor público no cargo efetivo em que se der a aposentadoria, observado o disposto no § 6º, para o servidor público que tenha ingressado no serviço público em cargo efetivo até 31 de dezembro de 2003 e que não tenha feito a opção de que trata o § 16, do art. 40 da Constituição Federal, desde que tenha, no mínimo, sessenta anos de idade, se mulher, e 65 (sessenta e cinco) anos de idade, se homem, ou, para os titulares do cargo de professor de que trata o § 4º desta Emenda à Lei Orgânica Municipal, 55 (cinquenta e cinco) anos de idade, se mulher, e sessenta anos de idade, se homem;","II – ao valor apurado na forma do art. 5º, para o servidor público não contemplado no inciso I desta Emenda à Lei Orgânica Municipal.","§ 5º Os proventos das aposentadorias concedidas nos termos do disposto neste artigo não serão inferiores ao valor a que se refere o § 2º, do art. 201 da Constituição Federal, e serão reajustados:","I – de acordo com o disposto no art. 7º da Emenda Constitucional nº 41, de 19 de dezembro de 2003, se cumpridos os requisitos previstos no inciso I do § 4º deste artigo; ou","II – nos termos estabelecidos para o Regime Geral de Previdência Social - RGPS, na hipótese prevista no inciso II do § 4º deste artigo.","§ 6º Considera-se remuneração do servidor público no cargo ef
