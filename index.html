etivo, para fins de cálculo dos proventos de aposentadoria com fundamento no disposto no inciso I, do § 4º deste artigo, o valor constituído pelo subsídio, pelo vencimento e pelas vantagens pecuniárias permanentes do cargo, estabelecidos em lei, acrescidos dos adicionais de caráter individual e das vantagens pessoais permanentes, observados os seguintes critérios:","I – se o cargo estiver sujeito a variações na carga horária, o valor das rubricas que refletem essa variação integrará o cálculo do valor da remuneração do servidor público no cargo efetivo em que se deu a aposentadoria, considerando-se a média aritmética simples dessa carga horária proporcional ao número de anos completos de recebimento e contribuição, contínuos ou intercalados, em relação ao tempo total exigido para a aposentadoria;","II – se as vantagens pecuniárias permanentes forem variáveis por estarem vinculadas a indicadores de desempenho, produtividade ou situação similar, o valor dessas vantagens integrará o cálculo da remuneração do servidor público no cargo efetivo mediante a aplicação, sobre o valor atual de referência das vantagens pecuniárias permanentes variáveis, da média aritmética simples do indicador, proporcional ao número de anos completos de recebimento e de respectiva contribuição, contínuos ou intercalados, em relação ao tempo total exigido para a aposentadoria ou, se inferior, ao tempo total de percepção da vantagem."],"nt":[]},{"id":"lom:EC-9º","n":"9º","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O servidor público municipal que tenha ingressado no serviço público em cargo efetivo até a data da entrada em vigor desta Emenda poderá aposentar-se voluntariamente conforme o disposto no art. 20 da Emenda Constitucional nº 103, de 2019, observadas as seguintes alterações:","I – 55 (cinquenta e cinco) anos de idade, se mulher, e 58 (cinquenta e oito) anos de idade, se homem, para fins do disposto no inciso I, do caput do art. 20, da Emenda Constitucional nº 103, de 2019;","II – o servidor deverá cumprir um período adicional de contribuição correspondente a 50% (cinquenta por cento) do tempo que, na data desta Lei, faltaria para atingir o mínimo exigido no inciso II, do caput do art. 20, da Emenda Constitucional nº 103, de 2019, para fins do disposto no inciso IV do mesmo artigo;","§ 1º O valor das aposentadorias concedidas nos termos do disposto neste artigo corresponderá:","I – em relação ao servidor público que tenha ingressado no serviço público em cargo efetivo até 31 de dezembro de 2003 e que não tenha feito a opção de que trata o § 16, do art. 40, da Constituição Federal, à totalidade da remuneração no cargo efetivo em que se der a aposentadoria, observado o disposto no § 6º, do art. 8º, desta Emenda;","II – em relação aos demais servidores públicos, ao valor apurado na forma do art. 5º desta Emenda.","§ 2º O valor das aposentadorias concedidas nos termos do disposto neste artigo não será inferior ao valor a que se refere o § 2º, do art. 201, da Constituição Federal, e será reajustado:","I – de acordo com o disposto no art. 7º da Emenda Constitucional nº 41, de 19 de dezembro de 2003, se cumpridos os requisitos previstos no inciso I, do § 1º, desta Emenda;","II – nos termos estabelecidos para o Regime Geral de Previdência Social - RGPS, na hipótese prevista no inciso II, do § 1º, desta Emenda."],"nt":[]},{"id":"lom:EC-10","n":"10","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O servidor público cujas atividades sejam exercidas com efetiva exposição a agentes químicos, físicos e biológicos prejudiciais à saúde ou à integridade física ou com risco de vida ou associação desses agentes, vedada a caracterização por categoria profissional ou ocupação, poderão aposentar-se aos 55 (cinquenta e cinco) anos de idade, se homem, e 52 (cinquenta e dois) anos de idade, se mulher, com 25 (vinte e cinco) anos de efetiva exposição e contribuição, 10 (dez) anos de efetivo exercício de serviço público e 5 (cinco) anos no cargo efetivo em que for concedida a aposentadoria.","§ 1º Para o cálculo dos proventos de aposentadoria especial do caput deste artigo será utilizada a média aritmética simples das remunerações adotadas como base para contribuições ao Regime Próprio de Previdência Social - RPPS, atualizados monetariamente, correspondentes a 85% (oitenta e cinco por cento) dos maiores salários de contribuição desde a competência julho de 1994 ou desde o início da contribuição, se posterior àquela competência, observado o quanto disposto nos §§1º e 6º do art. 26 da Emenda Constitucional nº 103, 12 de novembro de 2019.","§ 2º O valor da aposentadoria prevista no presente dispositivo será de 60% (sessenta por cento) do equivalente ao resultado da elaboração da média, conforme caput, acrescido de dois pontos percentuais para cada ano que exceder os vinte anos de contribuição, se homem e dois pontos percentuais para cada ano que exceder os quinze anos, se mulher.","§ 3º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o §2º, do art. 201, da Constituição Federal ou superiores ao limite máximo estabelecido para os benefícios do Regime Geral de Previdência Social - RGPS, salvo as parcelas pagas pelo regime de previdência complementar, nos casos que o servidor tenha aderido ao RPC – Regime de Previdência Complementar.","§ 4º Os valores previstos no caput serão reajustados, a partir da data de entrada em vigor desta Lei, na mesma data e com o mesmo índice em que se der o reajuste dos benefícios do Regime Geral de Previdência Social - RGPS.","§ 5º Para os fins da concessão da aposentadoria prevista no caput, será admitido como meio de prova para a comprovação de tempo de contribuição sob condições especiais, o recebimento de adicionais ou gratificações pela prestação de atividades insalubres, perigosas ou com risco de vida."],"nt":[]},{"id":"lom:EC-11","n":"11","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Fica assegurada aposentadoria na forma da Lei Complementar Federal nº 142, de 8 de maio de 2013, à pessoa com deficiência segurada do Regime Próprio de Previdência Social - RPPS municipal, desde que cumpridos o tempo mínimo de dez anos de efetivo exercício no serviço público e de cinco anos no cargo efetivo em que for concedida a aposentadoria.","Parágrafo único Os critérios de cálculo dos benefícios concedidos com base no caput serão àqueles da Lei Complementar Federal nº 142, de 2013."],"nt":[]},{"id":"lom:EC-11-A","n":"11-A","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O servidor público municipal que tenha ingressado no serviço público em cargo efetivo até a data da entrada em vigor desta Emenda cujas atividades tenham sido exercidas com efetiva exposição a agentes químicos, físicos e biológicos prejudiciais à saúde ou com risco de vida, ou associação desses agentes, vedada a caracterização por categoria profissional ou ocupação, desde que cumpridos o tempo mínimo de vinte anos de efetivo exercício no serviço público e de cinco anos no cargo efetivo em que for concedida a aposentadoria, na forma dos arts. 57 e 58 da Lei Federal nº 8.213, de 24 de julho de 1991, poderá aposentar-se voluntariamente conforme o disposto no art. 21 da Emenda Constitucional nº 103, de 2019, observadas as seguintes alterações:","I – 61 (sessenta e um) pontos, se mulher, 65 (sessenta e cinco) pontos, se homem, e 15 (quinze) anos de efetiva exposição;","II – 71 (setenta e um) pontos, se mulher, 75 (setenta e cinco) pontos, se homem, e 20 (vinte) anos de efetiva exposição;","III – 77 (setenta e sete) pontos, se mulher, 80 (oitenta) pontos, se homem, e 25 (vinte e cinco) anos de efetiva exposição.","§ 1º Para o cálculo dos proventos de aposentadoria especial do caput deste artigo será utilizada a média aritmética simples das remunerações adotadas como base para contribuições ao Regime Próprio de Previdência Social - RPPS, atualizados monetariamente, correspondentes a 85% (oitenta e cinco por cento) dos maiores salários de contribuição desde a competência julho de 1994 ou desde o início da contribuição, se posterior àquela competência, observado o quanto disposto nos §§ 1º e 6º do art. 26 da Emenda Constitucional nº 103, 12 de novembro de 2019.","§ 2º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o §2º, do art. 201, da Constituição Federal ou superiores ao limite máximo estabelecido para os benefícios do Regime Geral de Previdência Social - RGPS, salvo as parcelas pagas pelo regime de previdência complementar, nos casos que o servidor tenha aderido ao RPC.","§ 3º Os valores previstos no caput serão reajustados, a partir da data de entrada em vigor desta Lei, na mesma data e com o mesmo índice em que se der o reajuste dos benefícios do Regime Geral de Previdência Social - RGPS.","§ 4º Para os fins da concessão da aposentadoria prevista no caput, será admitido como meio de prova para a comprovação de tempo de contribuição sob condições especiais, o recebimento de adicionais ou gratificações pela prestação de atividades insalubres, perigosas ou com risco de vida."],"nt":[]},{"id":"lom:EC-12","n":"12","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Na concessão de pensão por morte o dependente de segurado do RPPS falecido a partir da data de vigência desta Emenda à Lei Orgânica Municipal será aplicado o disposto nos §§ 1º, 2º, 3º, 5º e 6º do art. 23 da Emenda Constitucional nº 103, de 2019, observadas as seguintes alterações:","I – a cota de que trata o caput do art. 23 da Emenda Constitucional nº 103, de 2019, corresponderá a 15% (quinze por cento) pontos percentuais por dependente, até o máximo de 100% (cem por cento);","II – o número de dependentes de que trata o §1º, do art. 23 da Emenda Constitucional nº 103, de 2019, será igual ou superior a quatro;","III – a condição de dependente do filho menor se encerra aos 21 (vinte e um) anos de idade.","Parágrafo único Outras determinações acerca do tempo de duração da pensão por morte e das cotas individuais por dependente até a perda dessa qualidade, rol de dependentes e sua qualificação e as condições necessárias para enquadramento serão aqueles estabelecidos em Lei Municipal."],"nt":[]},{"id":"lom:EC-13","n":"13","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O servidor municipal vinculado ao RPPS fará jus a um abono de permanência, pago pelo Ente Municipal, equivalente à sua contribuição previdenciária, até completar a idade para aposentadoria compulsória, desde que opte expressamente por permanecer em atividade e que tenha cumprido, ou venha a cumprir, os requisitos para aposentadoria voluntária.","Parágrafo único O abono de permanência a que se refere o caput só será devido após verificação da implementação dos requisitos legais constantes neste artigo e seus efeitos financeiros somente retroagirão até a data da formalização do seu requerimento."],"nt":[]},{"id":"lom:EC-14","n":"14","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Conforme determinação do § 4º, do art. 9º, da Emenda Constitucional nº 103, de 2019, a alíquota de contribuição dos segurados ativos vinculados ao Regime Próprio de Previdência Social - RPPS do Município será de 14% (quatorze por cento) incidentes sobre a totalidade da remuneração de contribuição."],"nt":[]},{"id":"lom:EC-15","n":"15","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Os aposentados e pensionistas, vinculados ao Regime Próprio de Previdência Social - RPPS de Mossoró, com benefícios concedidos a qualquer tempo, contribuirão para o regime previdenciário com mesma alíquota prevista para o servidor ativo, incidente sobre a parcela que supere o valor do limite máximo estabelecido para os benefícios do Regime Geral de Previdência Social - RGPS.","Parágrafo único As contribuições previdenciárias calculadas sobre o benefício de pensão por morte têm como base de cálculo o valor total deste benefício, antes de sua divisão em cotas, a fim de que seja observado corretamente o limite previsto neste artigo."],"nt":[]},{"id":"lom:EC-16","n":"16","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A contribuição previdenciária a cargo do Município, incluídos seus poderes, autarquias e fundações, será igual ao somatório da alíquota de custeio ordinário com alíquota de custeio especial, que incidirão sobre o total da remuneração tida como base de cálculo da contribuição previdenciária a cargo, exclusivamente, dos servidores ativos segurados do Regime Próprio de Previdência Social - RPPS de Mossoró.","§ 1º A alíquota de custeio ordinária será de 14% (quatorze por cento).","§ 2º A alíquota de custeio especial deverá ser apurada anualmente, podendo sofrer reduções ou majorações, desde que seja demonstrada a referida necessidade, mediante avaliação atuarial específica, em atenção às prescrições da Constituição Federal, observados, portanto, os critérios que preservem o equilíbrio financeiro e atuarial do Regime Próprio de Previdência Social - RPPS.","§ 3º Até que seja implementada nova avaliação atuarial, a alíquota de custeio especial fica mantida em 5,53% (cinco vírgula cinquenta e três por cento)."],"nt":[]},{"id":"lom:EC-17","n":"17","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["A Taxa de Administração para o custeio das despesas correntes e de capital necessárias à organização e ao funcionamento do Instituto Municipal de Previdência Social dos Servidores de Mossoró – Previ-Mossoró, inclusive para conservação de seu patrimônio, será de até 3% (três por cento) do valor total das remunerações de contribuição dos servidores ativos vinculados ao Plano de Benefício com base no exercício anterior e cujos recursos serão destinados exclusivamente ao custeio das despesas correntes e de capital necessárias à organização e ao funcionamento do órgão gestor do Regime Próprio de Previdência Social - RPPS, observadas as demais disposições deste artigo, podendo ser acrescido de 20% (vinte por cento) a mais para as despesas com a certificação institucional do RPPS no Pró-Gestão e para certificação profissional de seus dirigentes e conselheiros.","§ 1º Na verificação do limite percentual definido no caput, não serão computadas as despesas decorrentes das aplicações de recursos em ativos financeiros conforme estabelecido pelo Conselho Monetário Nacional.","§ 2º Fica o Instituto Municipal de Previdência Social dos Servidores de Mossoró – Previ-Mossoró autorizado a constituir reserva com as sobras do custeio das despesas do exercício, cujos valores serão utilizados para os fins a que se destina a Taxa de Administração.","§ 3º Fica autorizada a reversão dos saldos remanescentes dos recursos destinados à Reserva Administrativa, apurados ao final de cada exercício, para pagamento dos benefícios do Regime Próprio de Previdência Social - RPPS, mediante prévia aprovação do Conselho Previdenciário."],"nt":[]},{"id":"lom:EC-18","n":"18","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Até que entre em vigor lei complementar alterando ou substituindo as Leis Complementares nº 60 e nº 61, de 9 de dezembro de 2011, a responsabilidade pelo desconto, recolhimento ou repasse das contribuições será do dirigente máximo do órgão ou entidade que efetuar o pagamento da remuneração, subsídio ou benefício e ocorrerá em até dia dez do mês subsequente àquele em que ocorrer o crédito correspondente.","Parágrafo único O não repasse das contribuições destinadas ao RPPS no prazo legal implicará na atualização destas de acordo com o IPCA - Índice Nacional de Preços ao Consumidor Amplo - IBGE, além de juros de mora de 0,5 % (zero vírgula cinco por cento) ao mês."],"nt":[]},{"id":"lom:EC-19","n":"19","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Fica instituído o Regime de Previdência Complementar, previsto no § 14, do art. 40, da Constituição Federal, devendo ser regulamentado por lei própria."],"nt":[]},{"id":"lom:EC-20","n":"20","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["O valor das pensões e aposentadorias concedidas pelo Regime Próprio será limitado ao teto máximo de benefícios do Regime Geral de Previdência Social - RGPS, salvo os servidores que aderirem ao Regime de Previdência Complementar.","§ 1º A disposição do caput se aplicará aos servidores que ingressarem no serviço público local após a instituição do Regime de Previdência Complementar.","§ 2º Os servidores que ingressaram no serviço público antes da instituição do Regime de Previdência Complementar, mediante expressa adesão, poderão dele participar."],"nt":[]},{"id":"lom:EC-21","n":"21","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Fica fixado, desde logo, prazo de 03 (três) anos a contar da data da promulgação desta emenda, para revisar as disposições aqui consolidadas, conforme necessidade, condicionado à apresentação de:","I – Avaliação atuarial atualizada;","II – Estudo prospectivo sobre equilíbrio financeiro e atuarial do RPPS municipal.","Parágrafo único Até o advento do prazo fixado no caput, deverá ser observado o total do percentual em 5,53%, conforme disposto no §3º, do artigo 17 desta emenda, de modo que a diferença, em pontos percentuais, resultante de eventuais reduções na alíquota de custeio especial, serão vertidas na forma de aporte financeiro realizado para a cobertura de déficit atuarial, a fim de que a contribuição patronal global não seja inferior a 19,53%, até o lapso temporal aqui determinado."],"nt":[]},{"id":"lom:EC-22","n":"22","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["As despesas decorrentes da presente Emenda à Lei Orgânica Municipal correrão por conta das dotações consignadas na Lei Orçamentária Municipal de 2022, ficando eventuais modificações no Plano Plurianual e na Lei Orçamentária do exercício de 2022, incluindo a abertura de créditos adicionais, remanejamentos, transposições e transferências, condicionadas à observância da legislação vigente."],"nt":[]},{"id":"lom:EC-23","n":"23","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Fica autorizada a utilização das disposições sobre benefícios temporários contidas nos art. 15, 16, 17, 18, 19, 20, 21, 26, 27 e 34, da Lei Complementar nº 60, de 2011, com ônus exclusivo para o Executivo Municipal, até a efetiva transposição das normas tais objetos para o estatuto dos servidores municipais."],"nt":[]},{"id":"lom:EC-24","n":"24","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Revogam-se os seguintes dispositivos da Lei Complementar nº 60, de 2011:","§ 4º do art. 6º, art. 12, art. 19, art. 28, art. 33, art. 35, art. 48, art. 52, art. 54, art. 67, art. 84, art. 85, art. 86, art. 87, art. 88 e art. 89."],"nt":[]},{"id":"lom:EC-25","n":"25","tag":"EC 11/2022","b":"I","h":["TÍTULO V — Da Ordem Econômica e Social","CAPÍTULO IX — Da Política Agrária, Agrícola e de Abastecimento"],"t":["Esta Emenda à Lei Orgânica Municipal entrará em vigor observando o seguinte:","I – em relação aos artigos 14, 15, 16 e 17, a partir do primeiro dia do quarto mês subsequente ao de sua publicação;","II – para os demais dispositivos, na data de sua publicação."],"nt":[]}],"ri":[{"id":"ri:RES-1º","n":"1º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["O Regimento Interno da Câmara Municipal de Mossoró passa a vigorar na conformidade do texto anexo.","Parágrafo único. Ficam mantidas as normas administrativas em vigor, no que não contrariem o anexo Regimento, estando convalidados os atos praticados pela Mesa Diretora até o início da vigência desta resolução."],"nt":[]},{"id":"ri:RES-2º","n":"2º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["O Código de Ética e Decoro Parlamentar é estabelecido por resolução própria."],"nt":[]},{"id":"ri:RES-3º","n":"3º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Ficam mantidas, até o fim do biênio legislativo em curso, com seus atuais Presidentes, Vice- Presidentes, Secretários e Membros, as Comissões Permanentes criadas e organizadas na forma da Resolução nº. 1, de 1997, que terão competência em relação às matérias das Comissões que lhes sejam correspondentes ou com as quais tenham maior afinidade."],"nt":[]},{"id":"ri:RES-4º","n":"4º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Todas as proposições em curso que disponham sobre alterações regimentais deverão ser arquivadas."],"nt":[]},{"id":"ri:RES-5º","n":"5º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Ficam mantidas, até o fim da legislatura em curso, as lideranças constituídas, na forma das disposições regimentais anteriores, até a data da promulgação do Regimento Interno."],"nt":[]},{"id":"ri:RES-6º","n":"6º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Todas as proposições apresentadas em obediência às disposições regimentais anteriores seguirão tramitação normal."],"nt":[]},{"id":"ri:RES-7º","n":"7º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Revogam-se a Resolução Nº 01/1997, suas alterações e seus precedentes regimentais, bem como as Resoluções Nº 03/2011, Nº 02/2012 e Nº 05/2019."],"nt":[]},{"id":"ri:RES-8º","n":"8º","tag":"Resolução nº 25/2025","b":"A","h":[],"t":["Esta Resolução entra em vigor na data de sua publicação."],"nt":[]},{"id":"ri:1º","n":"1º","tag":"","b":"A","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO I — Das Funções da Câmara Municipal"],"t":["A Câmara Municipal é o órgão legislativo e fiscalizador do Município e tem sua sede nesta cidade de Mossoró, Rio Grande do Norte."],"nt":[]},{"id":"ri:2º","n":"2º","tag":"","b":"A","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO I — Das Funções da Câmara Municipal"],"t":["A Câmara Municipal compõe-se de Vereadores eleitos pelo sistema proporcional, como representantes do povo, tendo mandato de quatro anos.","§ 1º São condições de elegibilidade para o exercício do mandato de Vereador, na forma da lei federal:","I – a nacionalidade brasileira;","II – o pleno exercício dos direitos políticos;","III – o alistamento eleitoral;","IV – o domicílio eleitoral;","V – a filiação partidária;","VI – a idade mínima de dezoito anos;","VII – ser alfabetizado.","§ 2º O número de Vereadores será fixado pela Justiça Eleitoral, tendo em vista o disposto no artigo 29, inciso IV, da Constituição Federal."],"nt":["O número de vereadores é fixado pela Lei Orgânica, dentro dos limites máximos do art. 29, IV, da CF (EC 58/2009)."]},{"id":"ri:3º","n":"3º","tag":"","b":"A","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO I — Das Funções da Câmara Municipal"],"t":["A Câmara tem funções legislativas, exerce atribuições de fiscalização externa, financeira e orçamentária de controle e de assessoramento dos atos do Poder Executivo, bem como exerce atos de administração interna.","§ 1º A função legislativa consiste em deliberar por meio de emendas à Lei Orgânica, leis, medidas provisórias, decretos legislativos e resoluções sobre todas as matérias de competência do município.","§ 2º A função de fiscalização, compreendendo a contábil, financeira, orçamentária e patrimonial do Município e das entidades da Administração indireta é exercida com o auxílio do Tribunal de Contas do Estado, compreendendo:","a) apreciação das contas do exercício financeiro, apresentadas pelo Prefeito e pela Mesa da Câmara;","b) acompanhamento das atividades financeiras do Município;","c) julgamento da regularidade das contas dos administradores e demais responsáveis por bens e valores públicos da administração direta e indireta, incluídas as fundações e sociedades instituídas e mantidas pelo Poder Público e as contas daqueles que derem causa a perda, extravio ou outra irregularidade de que resulte prejuízo ao erário municipal (art. 71, II, CF/88).","§ 3º A função de controle é de caráter político-administrativo e se exerce sobre o Prefeito, Vice- Prefeito, Secretários Municipais, Mesa do Legislativo e Vereadores, mas não se exerce sobre os agentes administrativos sujeitos à ação hierárquica.","§ 4º A função de assessoramento consiste em sugerir medidas de interesse público ao Executivo, mediante indicações.","§ 5º A função administrativa é restrita à sua organização interna, à regulamentação de seu funcionalismo e à estruturação e direção de seus serviços auxiliares (art. 51, IV, CF/88)."],"nt":[]},{"id":"ri:4º","n":"4º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["A Câmara Municipal instalar-se-á em sessão solene de posse no dia 1º de janeiro de cada legislatura, no ano subsequente ao da eleição, independentemente de número, sob a presidência do Vereador mais idoso entre os presentes ou, caso essa condição seja comum a dois ou mais Vereadores, do mais votado dentre eles na eleição municipal, que convidará dois Vereadores, de preferência de partidos diferentes, que servirão para secretariar os trabalhos e dar posse ao Prefeito, Vice-Prefeito e Vereadores."],"nt":[]},{"id":"ri:5º","n":"5º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["O Prefeito, Vice-Prefeito, os Vereadores eleitos e Vereadoras eleitas deverão apresentar seus diplomas à Diretoria Legislativa da Câmara antes da sessão solene de posse."],"nt":[]},{"id":"ri:6º","n":"6º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["Na sessão solene de posse, observar-se-á o seguinte procedimento:","I – o Prefeito, os Vereadores e as Vereadoras deverão apresentar, no ato da posse, documento comprobatório da desincompatibilização sob pena de extinção do mandato;","II – na mesma ocasião, o Prefeito, o Vice-Prefeito, os Vereadores e as Vereadoras deverão apresentar declaração pública de seus bens, a qual será devidamente arquivada, sob pena de cassação de mandato;","III – o Vice-Prefeito apresentará documento comprobatório de desincompatibilização no momento em que assumir o exercício do cargo de Prefeito;","IV – decididas pelo Presidente quaisquer reclamações, será tomado, pessoalmente, o compromisso solene dos Vereadores e das Vereadoras. De pé todos os presentes, o Presidente em exercício proferirá a seguinte declaração: \"Prometo desempenhar, fiel e lealmente, o mandato que me foi confiado, manter, defender e cumprir a Constituição, observar as leis, defendendo os interesses do Município e o bem geral de sua população\". Em ato contínuo, os demais Vereadores e Vereadoras presentes dirão: \"Assim o prometo\";","V – Após a posse dos Vereadores e das Vereadoras, o Presidente dos trabalhos conduzirá o processo de eleição da mesa diretora, nos termos em que dispuserem este Regimento Interno e a Lei Orgânica Municipal;","VI – Após a eleição da Mesa Diretora, o Prefeito e o Vice-Prefeito eleitos e regularmente diplomados serão convidados a prestarem o compromisso a que se refere o inciso IV, sendo, assim, declarados devidamente empossados;","VII – poderão fazer uso da palavra, pelo prazo máximo de dez minutos, um representante de cada bancada ou bloco parlamentar, o Prefeito, o Vice-Prefeito e o Presidente da Câmara;","VIII – O nome parlamentar será composto de dois elementos apenas: um prenome e um nome; dois nomes; ou dois prenomes. Havendo confusão entre dois nomes parlamentares, decidirá o Presidente.","Parágrafo único. Poderá o Presidente, mediante requerimento da parte interessada, colher o compromisso de posse por meio de videoconferência durante a sessão solene de posse excepcionalmente para os casos de licença-gestante, devendo o requerimento estar acompanhado da declaração de parto em período inferior a 120 (cento e vinte) dias, assegurando o direito à posse virtual à parlamentar diplomada."],"nt":[]},{"id":"ri:7º","n":"7º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["Na hipótese de a posse não se verificar na data prevista no artigo anterior, a posse deverá ocorrer:","I – dentro do prazo de 15 (quinze) dias a contar da referida data, quando se tratar de Vereador(a), salvo motivo justo aceito pela Câmara;","II – dentro do prazo de 10 (dez) dias da data fixada para a posse, quando se tratar de Prefeito e VicePrefeito, salvo motivo justo aceito pela Câmara;","III – na hipótese de não realização de sessão ordinária ou extraordinária nos prazos indicados neste artigo, a posse poderá ocorrer em sessão junto à Mesa, salvo em período de recesso, quando o compromisso deverá ser prestado perante o Presidente;","IV – prevalecerão, para os casos de posse superveniente ao início da legislatura, seja de Prefeito, VicePrefeito ou Suplente de Vereador(a), os prazos e critérios estabelecidos neste artigo."],"nt":["A data da posse (1º de janeiro) está no art. 4º, não no artigo anterior."]},{"id":"ri:8º","n":"8º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["O exercício do mandato dar-se-á automaticamente com a posse, assumindo o Prefeito, Vice-Prefeito, Vereadores e Vereadoras todos os direitos e deveres inerentes ao cargo.","Parágrafo único. A transmissão do cargo de Prefeito, quando houver, dar-se-á no Gabinete do Prefeito, após a posse."],"nt":[]},{"id":"ri:9º","n":"9º","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["A recusa do Vereador eleito a tomar posse importa em renúncia tácita ao mandato, devendo o Presidente da Câmara, após o decurso do prazo estipulado no art. 7º, inciso 1, declarar extinto o mandato e convocar o respectivo suplente."],"nt":[]},{"id":"ri:10","n":"10","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["Enquanto não ocorrer a posse do Prefeito, assumirá o cargo o Vice-Prefeito e, na falta ou impedimento deste, o Presidente da Câmara."],"nt":[]},{"id":"ri:11","n":"11","tag":"","b":"B","h":["TÍTULO I — DA CÂMARA MUNICIPAL","CAPÍTULO II — Da Instalação e da Posse"],"t":["A recusa do Prefeito eleito a tomar posse importa em renúncia tácita ao mandato, devendo o Presidente da Câmara, após o decurso do prazo estabelecido no Art. 70, inciso II -, declarar a vacância do cargo.","§ 1º Ocorrendo a recusa do Vice-Prefeito a tomar posse, observar-se-á o mesmo procedimento previsto no caput deste artigo.","§ 2º Ocorrendo a recusa do Prefeito e do Vice-Prefeito, o Presidente da Câmara assumirá o cargo de Prefeito até a posse dos novos eleitos ou até a conclusão do mandato, conforme dispõe a Lei Orgânica do Município."],"nt":[]},{"id":"ri:12","n":"12","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["A eleição da Mesa Diretora da Câmara Municipal de Mossoró para o primeiro biênio far-se-á logo após a posse dos Vereadores e Vereadoras, em 1º de janeiro do primeiro ano da legislatura."],"nt":[]},{"id":"ri:13","n":"13","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["Na eleição da Mesa Diretora, o Presidente em exercício tem direito a voto."],"nt":[]},{"id":"ri:14","n":"14","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["O mandato da Mesa Diretora da Câmara Municipal de Mossoró será de 02 (dois) anos, sendo permitida a reeleição na mesma legislatura ou em legislaturas distintas."],"nt":["STF: admite-se apenas uma recondução sucessiva ao mesmo cargo da Mesa (ADI 6.524 e precedentes como a ADPF 959)."]},{"id":"ri:15","n":"15","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["A Mesa da Câmara é composta pelo Presidente, 1º e 2º Secretários.","Parágrafo único. Haverá dois Vice-Presidentes, Terceiro e Quarto Secretários, que somente serão considerados integrantes da Mesa Diretora quando em efetivo exercício."],"nt":[]},{"id":"ri:16","n":"16","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["A eleição da Mesa dar-se-á em votação eletrônica por maioria simples de votos.","Parágrafo único. Na composição da Mesa é assegurada, na medida do possível, a participação proporcional dos partidos com representação na Câmara Municipal."],"nt":[]},{"id":"ri:17","n":"17","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["A eleição da Mesa Diretora far-se-á em votação por sistema eletrônico, observadas as seguintes exigências e formalidades:","I – protocolo, junto à Diretoria Legislativa, individualmente ou por chapa, dos requerimentos de registro de candidatura dos candidatos previamente escolhidos pelas bancadas dos partidos ou blocos parlamentares aos cargos da Mesa Diretora;","II – os requerimentos de registro de candidatura, individualmente ou por chapa, deverão ser entregues à Diretoria Legislativa, impreterivelmente, até uma hora antes do horário previsto para o início da sessão;","III – Realização, por ordem do Presidente, da chamada regimental, para a verificação do quórum;","IV – observar-se-á o quórum de maioria simples para o primeiro e, se houver, segundo escrutínio;","V – a votação dos requerimentos obedecerá à mesma ordem de protocolo da Diretoria Legislativa;","VI – leitura, pelo Presidente, dos nomes dos votados para os respectivos cargos;","VII – proclamação pelo Presidente do resultado final e posse imediata dos eleitos.","VIII – realização de segundo escrutínio com os Vereadores(as) mais votados(as) para o mesmo cargo, que tenham obtido igual número de votos;","IX – persistindo o empate, será declarado eleito o Vereador mais idoso e, caso tenham a mesma idade, será considerado vencedor o mais votado na eleição municipal;","X – proclamação, pelo Presidente, do resultado final em segundo escrutínio e posse imediata dos eleitos.","Parágrafo único. No caso de impossibilidade técnica do sistema eletrônico de votação, far-se-á a eleição por votação nominal em documento impresso, observados os incisos III a X deste artigo."],"nt":[]},{"id":"ri:18","n":"18","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["Na hipótese de não se realizar a sessão ou a eleição por falta de número legal, quando do início da legislatura, o Vereador mais idoso dentre os pares e, caso essa condição seja comum a dois ou mais Vereadores, o mais votado no pleito municipal, permanecerá na presidência e convocará sessões diárias, até que seja eleita a nova Mesa Diretora.","§ 1º Observar-se-á o mesmo procedimento na hipótese de eleição anterior nula.","§ 2º A posse do Prefeito e Vice-Prefeito eleitos, na hipótese do caput deste artigo, será dada pelo Vereador mais idoso dentre os pares, nos termos do artigo 4º deste Regimento Interno."],"nt":[]},{"id":"ri:19","n":"19","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["A convocação para eleição da Mesa Diretora da Câmara Municipal de Mossoró para o segundo biênio deverá ser realizada por convocação da Mesa Diretora ou por 2/3 (dois terços) dos Vereadores.","§ 1º O processo de eleição se dará nos termos do Art. 17 deste Regimento Interno.","§ 2º A posse da Mesa Diretora eleita para o segundo biênio ocorrerá no primeiro dia útil do mês de janeiro do terceiro ano da legislatura.","§ 3º Na hipótese de o Presidente da Mesa Diretora ter sido reeleito para o segundo biênio, a data da posse da Mesa Diretora prevista no §2º deste artigo poderá ser alterada mediante proposição do Presidente reeleito e aprovação de maioria do plenário da Câmara Municipal."],"nt":[]},{"id":"ri:20","n":"20","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["O Presidente da Mesa Diretora é o Presidente da Câmara Municipal."],"nt":[]},{"id":"ri:21","n":"21","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO I — Da Eleição da Mesa Diretora"],"t":["Os membros da Mesa Diretora não poderão fazer parte da liderança."],"nt":[]},{"id":"ri:22","n":"22","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção I — Das Atribuições da Mesa"],"t":["A Mesa Diretora reunir-se-á ordinariamente uma vez por quinzena, em dia e hora previamente fixados e, extraordinariamente, sempre que convocada pelo Presidente ou pela maioria de seus membros.","Parágrafo único. Perderá o cargo o membro da Mesa Diretora que deixar de comparecer a cinco reuniões ordinárias consecutivas, sem causa justificada."],"nt":[]},{"id":"ri:23","n":"23","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção I — Das Atribuições da Mesa"],"t":["A Mesa Diretora, na qualidade de órgão diretor do Poder Legislativo, incumbe-se da direção dos trabalhos legislativos e dos serviços administrativos da Câmara Municipal."],"nt":[]},{"id":"ri:24","n":"24","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção I — Das Atribuições da Mesa"],"t":["Compete à Mesa Diretora, dentre outras atribuições estabelecidas em lei, neste Regimento ou por Resolução da Câmara Municipal, ou delas implicitamente decorrentes:","I – propor projetos de lei ordinária ou complementar, conforme couber, nos termos do que dispõe o art. 61, caput, da Constituição Federal, inclusive dispondo sobre:","a) o subsídio do Prefeito, do Vice-Prefeito e Secretários municipais ou autoridades equivalentes, observado o que dispõe o art. 37, XXIV, da Lei Orgânica do Município, e o art. 29, V, da Constituição Federal, de uma legislatura para a outra;","b) o subsídio dos Vereadores, observado o que dispõe o art. 29, VI, da Constituição Federal, de uma legislatura para outra;","c) sua organização, funcionamento, polícia, criação, transformação ou extinção dos cargos, empregos ou funções de seus serviços e fixação da respectiva remuneração, observados os parâmetros estabelecidos na lei de diretrizes orçamentárias.","II – propor projetos de decreto legislativo dispondo sobre:","a) concessão de licença do Prefeito para afastamento do cargo;","b) autorização ao Prefeito para, por necessidade de serviço, ausentar-se do Município por mais de quinze dias;","III – propor projetos de resolução dispondo sobre matérias de interesse interno da Câmara Municipal.","IV – propor ação de inconstitucionalidade;","V – promulgar emendas à Lei Orgânica Municipal;","VI – conferir a seus membros atribuições ou encargos referentes aos serviços legislativos ou administrativos da Câmara;","VII – fixar diretrizes para a divulgação das atividades da Câmara;","VIII – adotar medidas adequadas para promover e valorizar o Poder Legislativo e resguardar o seu conceito perante a comunidade;","IX – adotar as providências cabíveis, por solicitação do interessado, para a defesa judicial ou extrajudicial de Vereador contra ameaças ou a prática de ato atentatório ao livre exercício e às prerrogativas constitucionais do mandato parlamentar;","X – declarar a perda de mandato de Vereador, nos termos da Lei Orgânica Municipal, por ato da Mesa Diretora;","XI – autorizar licitações, homologar seus resultados e aprovar o calendário de compras;","XII – apresentar ao Plenário, na sessão de encerramento do ano legislativo, resenha dos trabalhos realizados, precedida de sucinto relatório sobre seu desempenho;","XIII – encaminhar ao Poder Executivo a propositura de projeto de lei que disponha sobre abertura de créditos suplementares ou especiais, da Câmara Municipal, cobertos com recursos do Executivo;","XIV – elaborar e encaminhar ao Poder Executivo, até 15 de julho, a proposta orçamentária da Câmara, a ser incluída na proposta do Município e fazer, mediante ato, a discriminação analítica das dotações respectivas, bem como alterá-las, quando necessário;","XV – se a proposta não for encaminhada no prazo previsto no inciso anterior, será tomado como base o orçamento vigente para a Câmara Municipal;","XVI – suplementar, mediante ato, as dotações orçamentárias da Câmara, observado o limite da autorização constante de lei orçamentária, desde que os recursos para sua cobertura sejam provenientes de anulação total ou parcial de suas dotações;","XVII – devolver à Fazenda Municipal, até o dia 31 de dezembro, o saldo de numerário que lhe foi liberado durante o exercício;","XVIII – designar, mediante ato, Vereadores para missão de representação da Câmara Municipal, fixando o número de representantes em conformidade com os limites do orçamento;","XIX – abrir, mediante ato, sindicâncias e processos administrativos e aplicação de penalidades;","XX – atualizar, mediante ato, a remuneração dos Vereadores, nas épocas e segundo os critérios estabelecidos em lei;","XXI – assinar as atas das sessões da Câmara;","XXII – criar, mediante ato, Comissões Especiais de Inquérito, nos termos que dispuser este Regimento Interno.","§ 1º Os atos administrativos da Mesa Diretora serão numerados em ordem cronológica, com renovação a cada ano da legislatura.","§ 2º A recusa injustificada de assinatura dos atos da Mesa Diretora ensejará o processo de destituição do membro faltoso."],"nt":[]},{"id":"ri:25","n":"25","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção I — Das Atribuições da Mesa"],"t":["As decisões da Mesa Diretora serão tomadas de forma colegiada, por maioria de seus membros."],"nt":[]},{"id":"ri:26","n":"26","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["O Presidente da Mesa Diretora é o Presidente da Câmara Municipal, sendo o representante legal da instituição nas suas relações externas, competindo-lhe as funções administrativas e diretivas internas, além de outras expressas neste Regimento ou decorrentes da natureza de suas funções e prerrogativas."],"nt":[]},{"id":"ri:27","n":"27","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["Ao Presidente da Câmara compete, privativamente:","I – quanto à condução das sessões plenárias:","a) presidi-las, suspendê-las ou prorrogá-las, observando e fazendo observar as normas vigentes e as determinações deste Regimento;","b) determinar ao 2º Secretário a leitura da ata e, ao 1º Secretário, da pauta e das comunicações recebidas e expedidas pela Câmara;","c) determinar, de oficio ou a requerimento de qualquer Vereador, em qualquer fase dos trabalhos, a verificação de presença;","d) declarar a hora destinada ao Expediente, à Ordem do Dia e à Explicação Pessoal e os prazos facultados aos oradores;","e) anunciar a Ordem do Dia e submeter à discussão e votação a matéria dela constante;","f) conceder ou negar a palavra aos Vereadores e Vereadoras, nos termos deste Regimento, e não permitir divagações ou apartes estranhos ao assunto em discussão;","g) advertir o orador ou o aparteante quanto ao tempo de que dispõe, não permitindo que seja ultrapassado tempo regimental;","h) interromper o orador que se desviar da questão em debate ou falar sem o respeito devido à Câmara ou a qualquer de seus membros, advertindo-o e, em caso de insistência, cassando-lhe a palavra, podendo, ainda suspender a sessão, quando não atendido e se as circunstâncias assim exigirem;","i) chamar a atenção do orador quando se esgotar o tempo a que tem direito;","j) submeter à discussão e votação a matéria a isso destinada, bem como estabelecer o ponto da questão que será objeto da votação;","k) decidir sobre o impedimento de Vereador para votar; 1) anunciar o resultado da votação e declarar a prejudicialidade dos projetos por esta alcançados;","m) decidir as questões de ordem e as reclamações;","n) anunciar o término das sessões, informando previamente aos Vereadores e Vereadoras sobre a sessão seguinte;","o) convocar as sessões da Câmara;","p) presidir a sessão ou sessões de eleição da Mesa Diretora do segundo biênio ou de cargos vagos;","q) comunicar ao Plenário a declaração da extinção ou perda do mandato do Prefeito, Vice- Prefeito ou de Vereador, na primeira sessão subsequente à apuração do fato, fazendo constar em ata a declaração, convocando o respectivo suplente no caso de extinção de mandato de Vereador, nos termos deste Regimento Interno;","r) votar na eleição da Mesa Diretora, em casos de desempate e quando o voto for decisivo para que a matéria atinja o quórum necessário para sua aprovação.","II – quanto às atividades legislativas:","a) incluir em pauta de sessão ordinária, para a leitura do teor do texto e da respectiva exposição de motivos, qualquer projeto recebido, antes de remetê-lo às Comissões Permanentes;","b) Determinar a distribuição de matéria às Comissões Permanentes ou Temporárias, após sua leitura em Plenário;","c) deferir, por pedido escrito do autor, a retirada de proposição, mesmo que incluída na Ordem do Dia, nos termos que dispuser o Regimento;","d) despachar requerimentos que versem sobre assunto interno da Câmara Municipal;","e) determinar o arquivamento ou desarquivamento de proposições, nos termos regimentais;","f) determinar que se devolva ao autor, antes do protocolo, a proposição que não esteja devidamente formalizada, que verse sobre matéria alheia à competência da Câmara, ou que seja evidentemente inconstitucional ou antirregimental;","g) recusar o recebimento de substitutivos ou emendas que não sejam pertinentes à proposição inicial, determinando o devido arquivamento;","h) declarar prejudicada a proposição em face de rejeição ou aprovação de outra com o mesmo objetivo, salvo requerimento que consubstanciar reiteração de pedido não atendido ou resultante de modificação da situação de fatos anteriores;","i) incluir na Ordem do Dia da primeira sessão subsequente, sempre que tenha sido esgotado o prazo previsto para sua apreciação, os projetos de lei de iniciativa do Executivo submetidos à urgência, e os vetos por este aposto, ficando sobrestadas as demais proposições até que se ultime a votação;","j) Expedir os autógrafos aos projetos de lei destinados à sanção e promulgação pelo Chefe do Executivo, podendo delegar ao 1º Secretário;","k) promulgar as Resoluções e os Decretos Legislativos, bem como as Leis com sanção tácita ou cujo veto tenha sido rejeitado pelo Plenário; 1) Publicar os atos da Mesa Diretora e da Presidência, Portarias, Resoluções e Decretos.","III – quanto à sua competência geral:","a) Substituir o Prefeito ou sucedê-lo na falta deste e do Vice-Prefeito, completando, se for o caso, o seu mandato ou até que se realizem novas eleições;","b) Representar a Câmara em juízo ou fora dele;","c) Dar posse ao Prefeito, Vice-Prefeito e Vereadores e Vereadoras que não foram empossados no primeiro dia da legislatura, bem como aos suplentes de Vereadores;","d) Declarar extinto o mandato do Prefeito, Vice-Prefeito, Vereadores e Vereadoras nos casos previstos em lei;","e) Expedir Decreto Legislativo de cassação de mandato de Prefeito e Resolução de cassação de mandato de Vereador;","f) Declarar a vacância do cargo de Prefeito, nos termos da Lei;","g) Não permitir a publicação de pronunciamentos ou expressões atentatórias ao decoro parlamentar;","h) Zelar pelo prestígio e decoro da Câmara, bem como pela dignidade e respeito às prerrogativas constitucionais de seus membros:","i) Autorizar a realização de eventos culturais ou artísticos no edifício da Câmara, fixando- lhes data, local e horário;","j) Cumprir e fazer cumprir o Regimento Interno;","k) Expedir Decreto Legislativo autorizando referendo ou convocando plebiscito; 1) mandar publicar os pareceres do Tribunal de Contas sobre as contas do Prefeito e da Mesa da Câmara, com as respectivas decisões do Plenário, sendo estas remetidas, a seguir, aos Tribunais de Contas da União e do Estado.","IV – quanto às atividades da Mesa Diretora:","a) convocar reuniões e presidi-las;","b) tornar-se parte nas discussões e deliberações, com direito a voto;","c) distribuir a matéria que dependa de parecer;","d) executar as decisões da Mesa Diretora.","V – quanto às Comissões:","a) designar seus membros titulares e suplentes mediante comunicação dos Líderes dos Blocos Parlamentares;","b) destituir membro da Comissão Permanente em razão de faltas injustificadas;","c) assegurar os meios e condições necessários ao seu pleno funcionamento:","d) convidar o Relator ou outro membro de Comissão para esclarecimento de parecer;","e) nomear os membros das Comissões Temporárias;","f) preencher, por nomeação, as vagas verificadas nas Comissões Permanentes e Temporárias.","VI – quanto às atividades administrativas:","a) comunicar a cada Vereador, por escrito, com antecedência mínima de 24 horas, a convocação de sessões extraordinárias no período normal de funcionamento ou durante o recesso, excetuandose os casos de convocação de sessão extraordinária durante sessão plenária deliberativa.","b) encaminhar proposições às Comissões Permanentes e determinar suas inclusões na pauta;","c) zelar pelos prazos do processo legislativo e daqueles concedidos às Comissões e ao Prefeito;","d) dar ciência ao Plenário do relatório apresentado por Comissão Especial de Inquérito;","e) remeter ao Prefeito, quando se tratar de fato relativo ao Poder Executivo, e ao Ministério Público, cópia do inteiro teor do relatório, após votado em Plenário, apresentado por Comissão Especial de Inquérito quando ela concluir pela existência de infração;","f) organizar a Ordem do Dia, no mínimo 24 (vinte e quatro) horas antes da sessão respectiva, fazendo dela constar obrigatoriamente, com ou sem parecer das Comissões e antes do término do prazo, os projetos de lei com prazo de apreciação, bem como os projetos e o veto de que tratam os arts. 64, §2º, e 66, §6º, da Constituição Federal;","g) executar as deliberações do Plenário;","h) assinar a ata das sessões, os editais, as portarias e o expediente da Câmara.","VII – quanto aos serviços da Câmara:","a) admitir, remover e readmitir funcionários da Câmara, conceder-lhes férias, abono, de faltas e licenças especiais;","b) superintender o serviço administrativo da Câmara, autorizar nos limites do orçamento as suas despesas e requisitar o numerário ao Executivo;","c) apresentar ao Plenário o balancete relativo às verbas recebidas e às despesas realizadas, no mesmo prazo observado em relação ao Tribunal de Contas do Estado;","d) proceder às licitações para compras, obras e serviços da Câmara, obedecida a legislação pertinente;","e) fazer, ao fim de sua gestão, relatório dos trabalhos da Câmara.","VIII – quanto às relações externas da Câmara:","a) conceder audiências públicas na Câmara em dias e horários pré-fixados;","b) manter, em nome da Câmara, todos os contatos com o Prefeito e demais autoridades;","c) encaminhar ao Prefeito comunicações internas administrativas formuladas pela Câmara;","d) contratar advogado para a propositura de ações judiciais e para defesa nas ações que forem movidas contra a Câmara ou contra ato da Mesa ou da Presidência;","e) solicitar a intervenção no Município nos casos admitidos pela Constituição Estadual;","f) interpelar judicialmente o Prefeito, quando este deixar de colocar à disposição da Câmara, no prazo legal, as quantias requisitadas ou a parcela correspondente ao duodécimo das dotações orçamentárias:","g) celebrar convênios específicos e firmar com entidades públicas, privadas ou órgãos financeiros contratos de consignação e de consolidação de dívidas do Poder Legislativo.","IX – quanto à Polícia Interna:","a) policiar o recinto da Câmara com o auxílio de seus funcionários, podendo requisitar elementos de corporações civis ou militares para manter a ordem interna;","b) permitir que qualquer cidadão assista às sessões da Câmara, na parte do recinto que lhe é reservada, desde que não porte armas, não se manifeste de maneira desrespeitosa ou excessiva em apoio ou desaprovação ao que se passa no Plenário, não interpele os Vereadores e Vereadoras, devendo respeitá-los, atendendo às determinações da Presidência;","c) obrigar a se retirarem do recinto, sem prejuízo de outras medidas, os assistentes, assessores, servidores ou cidadãos que não observarem os deveres elencados na alínea b);","d) efetuar, se no recinto da Câmara for cometida qualquer infração penal, a prisão em flagrante, apresentando o infrator à autoridade competente, para lavratura do auto e instauração do processo crime correspondente;","e) comunicar, se não houver flagrante, o fato à autoridade policial competente, para a instauração de inquérito;","f) admitir no recinto do Plenário e em outras dependências da Câmara, a seu critério, somente a presença dos Vereadores e de funcionários quando em serviço;","g) credenciar representantes de cada órgão da imprensa escrita, falada ou televisada que o solicitar, para trabalhos correspondentes à cobertura jornalística das sessões.","Parágrafo único. O Presidente poderá delegar ao Vice-Presidente competência que lhe seja própria."],"nt":[]},{"id":"ri:28","n":"28","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["Quando o Presidente estiver com a palavra no exercício de suas funções, durante as sessões plenárias, não poderá ser interrompido nem aparteado."],"nt":[]},{"id":"ri:29","n":"29","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["Será sempre computada, para efeito de quórum, a presença do Presidente nos trabalhos."],"nt":[]},{"id":"ri:30","n":"30","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["O Presidente não poderá fazer parte de qualquer Comissão, ressalvadas as de representação."],"nt":[]},{"id":"ri:31","n":"31","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente"],"t":["Nenhum membro da Mesa Diretora ou Vereador poderá presidir a sessão durante a discussão e votação de matérias de sua autoria."],"nt":[]},{"id":"ri:32","n":"32","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção II — Das Atribuições do Presidente","Subseção Única — Da Forma dos Atos do Presidente"],"t":["Os atos do Presidente observarão a seguinte forma:","I – ato numerado, em ordem cronológica, com renovação a cada ano da legislatura, nos seguintes casos:","a) regulamentação dos serviços administrativos;","b) nomeação de membros das Comissões Permanentes e Temporárias;","c) matérias de caráter financeiro;","d) designação de substitutos nas Comissões;","e) outras matérias de competência da Presidência e que não estejam enquadradas como Portaria.","II – portaria numerada, em ordem cronológica, com renovação a cada ano da legislatura, nos seguintes casos:","a) admissão, remoção, readmissão, férias, abono de faltas, concessão de licenças especiais ou ainda quando se tratar de expedição de determinações aos servidores da Câmara;","b) outros casos determinados em Lei ou Resolução."],"nt":[]},{"id":"ri:33","n":"33","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção III — Das Atribuições do Vice-presidente"],"t":["O 1º Vice-presidente da Câmara, salvo o disposto no art. 35 e nas hipóteses de atuação como membro efetivo da Mesa Diretora e nos casos de competência privativa deste órgão, não possui atribuições próprias, limitando-se a substituir o Presidente nas suas faltas e impedimentos."],"nt":[]},{"id":"ri:34","n":"34","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção III — Das Atribuições do Vice-presidente"],"t":["O 1º Vice-presidente promulgará e fará publicar as resoluções e decretos legislativos sempre que o Presidente, ainda que se ache em exercício, deixar de fazê-lo dentro do prazo legal e, este não o fazendo, caberá ao 2º Vice-presidente.","Parágrafo único. O disposto neste artigo aplica-se às leis municipais, quando o Prefeito e o Presidente da Câmara, sucessivamente, tenham deixado precluir a oportunidade de sua promulgação e publicação subsequente."],"nt":[]},{"id":"ri:35","n":"35","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção IV — Dos Secretários"],"t":["Compete ao 1º Secretário:","I – Durante o transcorrer das sessões plenárias, organizar as inscrições dos oradores no Pequeno e Grande Expediente e fazer a leitura das matérias constantes em pauta para a Ordem do Dia;","II – fazer a chamada dos Vereadores ao abrir-se a sessão e nas ocasiões determinadas pelo Presidente, anotando os comparecimentos e as ausências;","III – ler as proposições e demais papéis que devam ser do conhecimento da Câmara Municipal;","IV – gerir a correspondência da Diretoria Legislativa da Câmara Municipal, providenciando a expedição de ofícios aos seus respectivos destinatários referentes às proposições deliberadas em plenário;","V – coadjuvar o Presidente na direção dos serviços auxiliares da Câmara;","VI – certificar frequência dos Vereadores e Vereadoras;","VII – manter à disposição do Plenário os textos legislativos de manuseio mais frequente;","VIII – exercer todas as atribuições administrativas delegadas c que não estejam reservadas à Mesa Diretora ou ao Presidente;","IX – Comunicar a todos os Vereadores e Vereadoras em exercício, no prazo de vinte e quatro horas após o protocolo, o recebimento de matérias de iniciativa do Poder Executivo."],"nt":[]},{"id":"ri:36","n":"36","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção IV — Dos Secretários"],"t":["Ao 2º Secretário compete:","I – substituir o 1º Secretário em suas faltas, ausências, impedimentos ou licenças, ficando, nas duas últimas hipóteses, investido na plenitude das respectivas funções;","II – Responsabilizar-se pelos serviços de elaboração das atas de sessões ordinárias, extraordinárias e audiências públicas, conferindo-lhes publicidade e disponibilidade em sistema eletrônico institucional;","III – Acompanhar o registro dos precedentes firmados para futura aplicação em eventuais casos análogos."],"nt":[]},{"id":"ri:37","n":"37","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção V — Da Delegação de Competência"],"t":["A delegação de competência será utilizada como instrumento de descentralização administrativa, visando a assegurar mais rapidez e objetividade às decisões e a situá-las na proximidade dos fatos, pessoas ou problemas a atender.","§ 1º É facultado à Mesa Diretora, a qualquer de seus membros e às demais autoridades responsáveis pelos serviços administrativos da Câmara delegar competência para a prática de atos administrativos.","§ 2º O ato de delegação identificará precisamente a autoridade delegante, a autoridade delegada e as atribuições objeto da delegação."],"nt":[]},{"id":"ri:38","n":"38","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO II — Da Competência da Mesa e seus Membros","Seção VI — Das Contas da Mesa Diretora"],"t":["As contas da Mesa Diretora compor-se-ão de:","I – balancetes mensais, relativos às verbas recebidas e aplicadas, que deverão ser apresentados ao Plenário pelo Presidente, no mesmo prazo observado em relação ao Tribunal de Contas do Estado TCE;","II – balanço geral anual, que deverá ser encaminhado ao Tribunal de Contas do Estado do Rio Grande do Norte ou órgão a que for atribuída tal competência."],"nt":[]},{"id":"ri:39","n":"39","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO III — Da Substituição da Mesa Diretora"],"t":["Em suas faltas ou impedimentos durante as sessões plenárias, o Presidente da Mesa Diretora será substituído pelo 1º Vice-presidente e, estando este ausente, pelo 2º Vice-presidente.","Parágrafo único. Não estando presentes ambos, substituirão o Presidente, sucessivamente, o 1º e o 2º Secretários."],"nt":[]},{"id":"ri:40","n":"40","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO III — Da Substituição da Mesa Diretora"],"t":["Ausentes do Plenário os Secretários, o Presidente convidará qualquer Vereador(a) para a substituição em caráter eventual."],"nt":[]},{"id":"ri:41","n":"41","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO III — Da Substituição da Mesa Diretora"],"t":["Na hora determinada para o início da sessão, verificada a ausência dos membros da Mesa Diretora e de seus substitutos, assumirá a Presidência o Vereador mais idoso entre os presentes e, caso esta condição seja comum a dois ou mais Vereadores, o mais votado dentre eles.","Parágrafo único. A Mesa Diretora, composta na forma deste artigo, dirigirá os trabalhos até o comparecimento de algum membro titular da Mesa Diretora ou de seus substitutos legais."],"nt":[]},{"id":"ri:42","n":"42","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção I — Disposições Preliminares"],"t":["As funções dos membros da Mesa Diretora cessarão:","I – pela posse da Mesa eleita para o mandato subsequente;","II – pela renúncia, apresentada por escrito;","III – pela destituição;","IV – pela cassação ou extinção do mandato de Vereador;","V – pela vacância do cargo ocasionada por outros motivos previstos neste Regimento Interno."],"nt":[]},{"id":"ri:43","n":"43","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção I — Disposições Preliminares"],"t":["Vagando-se qualquer cargo da Mesa Diretora, será realizada eleição no Expediente da primeira sessão ordinária seguinte, ou em sessão extraordinária convocada para esse fim, para completar o mandato.","Parágrafo único. Em caso de renúncia ou destituição total da Mesa Diretora, proceder-se-á à nova eleição, para se completar o período do mandato, na sessão imediata àquela em que ocorreu a renúncia ou destituição, sob a presidência do Vereador mais idoso e, caso esta condição seja comum a dois ou mais Vereadores, do mais votado dentre eles, que ficará investido na plenitude das funções até a posse da nova Mesa Diretora."],"nt":[]},{"id":"ri:44","n":"44","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção II — Da Renúncia da Mesa Diretora"],"t":["A renúncia do Vereador ao cargo que ocupa na Mesa Diretora dar-se-á por ofício a ela dirigido e efetivarse-á, independentemente de deliberação do Plenário, a partir do momento em que for lido em sessão plenária."],"nt":[]},{"id":"ri:45","n":"45","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção II — Da Renúncia da Mesa Diretora"],"t":["Em caso de renúncia total da Mesa Diretora, o ofício respectivo será levado ao conhecimento do Plenário pelo Vereador mais idoso e, em caso de empate, pelo mais votado dentre eles, que exercerá as funções de Presidente, nos termos do Art. 43, parágrafo único, deste Regimento Interno."],"nt":[]},{"id":"ri:46","n":"46","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["Os membros da Mesa Diretora, isoladamente ou em conjunto, poderão ser destituídos de seus cargos, mediante projeto de resolução aprovado por 2/3 (dois terços), no mínimo, dos membros da Câmara, assegurado o direito de ampla defesa.","§ 1º É passível de destituição o membro da Mesa Diretora quando faltoso, omisso ou ineficiente no desempenho de suas atribuições regimentais, ou quando exorbite das atribuições a ele conferidas por este Regimento.","§ 2º Será destituído, sem necessidade da aprovação de que trata o caput deste artigo, o membro da Mesa Diretora que deixar de comparecer a 05 (cinco) reuniões ordinárias consecutivas, sem causa justificada ou que tenha a destituição de suas funções na Mesa Diretora declarada por via judicial."],"nt":[]},{"id":"ri:47","n":"47","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["O processo de destituição terá início por denúncia subscrita necessariamente por no mínimo dois Vereadores, dirigida ao Plenário e lida pelo seu autor em qualquer fase da sessão, independentemente de prévia inscrição ou autorização da Presidência.","§ 1º Da denúncia constarão:","I – O membro ou os membros da Mesa Diretora denunciados;","II – descrição circunstanciada das irregularidades cometidas;","III – as provas que se pretendam produzir.","§ 2º Lida a denúncia, será imediatamente submetida ao Plenário pelo Presidente, salvo se este for envolvido nas acusações, caso em que essa providência e as demais relativas ao procedimento de destituição competirão a seus substitutos legais e, se estes também forem envolvidos, ao Vereador mais idoso dentre os presentes ou, se esta condição for comum a mais de um Vereador, ao mais votado dentre eles.","§ 3º O membro da Mesa Diretora envolvido nas acusações não poderá presidir nem secretariar os trabalhos quando e enquanto estiver sendo discutido ou deliberado qualquer ato relativo ao processo de sua destituição.","§ 4º Se o acusado for o Presidente, este será substituído na forma do §2º.","§ 5º Quando um dos secretários assumir a presidência na forma do §2º ou for o acusado, será substituído por qualquer Vereador convidado pelo Presidente em exercício.","§ 6º O denunciante e o denunciado (ou denunciados) são impedidos de deliberar sobre o recebimento da denúncia, não sendo necessária a convocação de suplente para esse ato.","§ 7º Considerar-se-á recebida a denúncia se esta for aprovada pela maioria absoluta dos Vereadores."],"nt":[]},{"id":"ri:48","n":"48","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["Recebida a denúncia, serão sorteados 03 (três) Vereadores para compor a Comissão Processante.","§ 1º Da Comissão não poderão fazer parte o denunciante e o denunciado (ou denunciados).","§ 2º Constituída a Comissão Processante, seus membros elegerão um deles para Presidente, o qual nomeará entre seus pares um relator e marcará reunião a ser realizada dentro das 48 (quarenta e oito) horas seguintes.","§ 3º O denunciado ou denunciados serão notificados dentro de 03 (três) dias, a contar da primeira reunião da Comissão, para apresentação, por escrito, de defesa prévia, no prazo de 10 (dez) dias.","§ 4º Findo o prazo estabelecido no §3º, a Comissão, de posse ou não da defesa prévia, procederá às diligências que entender necessárias, emitindo, no prazo de 20 (vinte) dias, seu parecer.","§ 5º O denunciado ou denunciados poderão acompanhar todas as diligências da Comissão."],"nt":[]},{"id":"ri:49","n":"49","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["Findo o prazo de 20 (vinte) dias e concluindo pela procedência das acusações, a Comissão deverá apresentar, na primeira sessão ordinária subsequente, Projeto de Resolução propondo a destituição do denunciado ou dos denunciados.","§ 1º O Projeto de Resolução será submetido à discussão e votação nominal única, desconsiderando- se para efeitos de quórum a presença do denunciado ou denunciados envolvidos.","§ 2º Os Vereadores e o relator da Comissão Processante e o denunciado ou denunciados terão cada um 30 (trinta) minutos para a discussão do Projeto de Resolução, vedada a cessão de tempo.","§ 3º Terão preferência na ordem de inscrição, respectivamente, o relator da Comissão Processante e o denunciado ou denunciados, obedecida, quanto aos denunciados, a ordem utilizada na denúncia."],"nt":[]},{"id":"ri:50","n":"50","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["Concluindo pela improcedência das acusações, a Comissão Processante deverá apresentar seu parecer na primeira sessão ordinária subsequente, para ser lido, discutido e votado nominalmente em turno único, na fase da Ordem do Dia.","§ 1º Cada Vereador terá o prazo máximo de 15 (quinze) minutos para discutir o parecer da Comissão Processante, cabendo ao relator e ao denunciado ou denunciados, respectivamente, o prazo de 30 (trinta) minutos, obedecendo-se, na ordem de inscrição, o previsto no §3º do artigo anterior.","§ 2º Não se concluindo nessa sessão a apreciação do parecer, a autoridade que estiver presidindo os trabalhos relativos ao processo de destituição convocará sessões extraordinárias destinadas, integral e exclusivamente ao exame da matéria, até deliberação definitiva do Plenário, estando suspensas as demais deliberações ordinárias.","§ 3º O parecer da Comissão Processante será aprovado ou rejeitado por maioria simples, procedendose:","a) ao arquivamento do processo, se aprovado o parecer;","b) à remessa do processo à Comissão de Constituição, Justiça e Redação, se rejeitado o parecer.","§ 4º Ocorrendo a rejeição do parecer, a Comissão de Constituição, Justiça e Redação deverá elaborar, dentro de 3 (três) dias, Projeto de Resolução propondo a destituição do denunciado ou dos denunciados.","§ 5º Para a votação e discussão do Projeto de Resolução de destituição, elaborado pela Comissão de Constituição, Justiça e Redação, observar-se-á o previsto nos §§1º, 2º e 3º do artigo anterior."],"nt":[]},{"id":"ri:51","n":"51","tag":"","b":"B","h":["TÍTULO II — DA MESA DIRETORA","CAPÍTULO IV — Da Extinção do Mandato da Mesa","Seção III — Da Destituição da Mesa Diretora"],"t":["A aprovação do Projeto de Resolução pelo quórum de 2/3 (dois terços) implicará o imediato afastamento do denunciado ou dos denunciados, devendo a Resolução respectiva ser dada à publicação pela autoridade que estiver presidindo os trabalhos, dentro do prazo de 48 (quarenta e oito) horas, contado a partir da deliberação do Plenário."],"nt":[]},{"id":"ri:52","n":"52","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["O Plenário é o órgão deliberativo e soberano da Câmara Municipal, constituído pela reunião de Vereadores em exercício, em local, forma e número estabelecidos neste Regimento.","§ 1º O local é o recinto de sua sede.","§ 2º A forma legal para deliberar é a sessão, regida pelos dispositivos referentes à matéria, estatuídos em leis ou neste Regimento.","§ 3º O número é o quórum determinado em lei ou neste Regimento, para a realização das sessões e para as deliberações."],"nt":[]},{"id":"ri:53","n":"53","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["As deliberações do Plenário serão tomadas por:","a) maioria simples;","b) maioria absoluta;","c) maioria qualificada.","§ 1º A maioria simples é a que representa o maior resultado de votação, dentre os presentes à reunião.","§ 2º A maioria absoluta é a que compreende mais da metade dos membros da Câmara.","§ 3º A maioria qualificada é a que atinge ou ultrapasse a 2/3 (dois terços) dos membros da Câmara Municipal."],"nt":[]},{"id":"ri:54","n":"54","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["O Plenário deliberará:","§ 1º Por maioria absoluta sobre:","I – projetos de lei complementar;","II – matéria tributária;","III – Código de Obras e Edificações e outros códigos;","IV – Estatuto dos Servidores Municipais;","V – criação de cargos, funções e empregos da administração direta, autárquica e fundacional, bem como sua remuneração;","VI – concessão de serviço público;","VII – concessão de direito real de uso;","VIII – alienação de bens e imóveis;","IX – autorização para obtenção de empréstimo de particular, inclusive para as autarquias, fundações e demais entidades controladas pelo Poder Público;","X – lei de diretrizes orçamentárias, plano plurianual e lei orçamentária anual;","XI – aquisição de bens imóveis por doação com encargo;","XII – criação, estruturação e atribuições dos Órgãos de Assessoria de Descentralização Administrativa, de deliberação coletiva e de execução da Administração Pública;","XIII – realização de operações de crédito para abertura de créditos adicionais, suplementares ou especiais com finalidade precisa;","XIV – rejeição de veto;","XV – isenções de impostos municipais;","XVI – todo e qualquer tipo de anistia;","XVII – acolhimento de denúncia contra Vereador;","XVIII – zoneamento urbano;","XIX – plano diretor;","XX – admissão de acusação contra Prefeito;","XXI – concessão de título de cidadão honorário ou qualquer outra honraria ou homenagem.","§ 2º Por maioria qualificada sobre:","I – rejeição do parecer prévio do Tribunal de Contas do Estado;","II – destituição dos membros da Mesa;","III – emendas à Lei Orgânica;","IV – alterações ao Regimento Interno da Câmara Municipal;","V – perda de mandato de Prefeito;","VI – perda de mandato de Vereador;","VII – criação, organização e supressão de distritos e subdistritos e divisão do território do município em áreas administrativas;","VIII – alteração de denominação de próprios, vias e logradouros públicos."],"nt":[]},{"id":"ri:55","n":"55","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["As deliberações do Plenário dar-se-ão sempre por voto aberto."],"nt":["Compare com o art. 309, § 2º, que menciona voto secreto."]},{"id":"ri:56","n":"56","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["As sessões da Câmara, exceto as solenes, que poderão ser realizadas em outro recinto, terão, obrigatoriamente, por local a sua sede, considerando-se nulas as que se realizarem fora dela.","§ 1º Por motivo de interesse público, devidamente justificado, as reuniões ou sessões da Câmara Municipal poderão ser realizadas em outro recinto, designado em ato da Mesa Diretora publicado, no mínimo, 3 (três) dias antes da reunião ou sessão.","§ 2º Na sede da Câmara não se realizarão atividades estranhas às suas finalidades, sendo restrito o uso do Plenário para as sessões regimentais, devendo outras atividades que demandem uso do recinto do Plenário ser, obrigatoriamente, autorizadas previamente pela Presidência."],"nt":[]},{"id":"ri:57","n":"57","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO I — Da Utilização do Plenário"],"t":["Nos dias de sessões, somente os Vereadores, desde que convenientemente trajados, poderão permanecer no recinto do Plenário.","§ 1º A critério do Presidente, serão convocados os funcionários necessários ao andamento dos trabalhos.","§ 2º A convite da Presidência, por iniciativa própria ou sugestão de qualquer Vereador, poderão assistir aos trabalhos, no recinto do Plenário, autoridades federais, estaduais e municipais, personalidades homenageadas e representantes credenciados da imprensa escrita e falada, que terão lugar reservado para esse fim.","§ 3º A saudação oficial ao visitante será feita, em nome da Câmara, pelo Vereador que o Presidente designar para esse fim.","§ 4º Os visitantes poderão, a critério da Presidência e pelo tempo por esta determinado, discursar para agradecer a saudação que lhes for feita."],"nt":[]},{"id":"ri:58","n":"58","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["Os vereadores serão agrupados por representações partidárias, blocos parlamentares e bancadas de situação e oposição, cabendo-lhes escolher o Líder.","§ 1º A escolha do líder será comunicada à Mesa Diretora, no início de cada Legislatura, ou após a criação das bancadas de situação e oposição, em documento subscrito pela maioria absoluta dos integrantes da respectiva bancada.","§ 2º Os líderes permanecerão no exercício de liderança até que nova indicação seja feita.","§ 3º Os líderes podem indicar à Mesa Diretora até 2 (dois) vice-líderes, que o substituem.","§ 4º Enquanto não indicado o líder, a Mesa Diretora assim considerará o vereador mais idoso e, em caso desta condição ser comum a mais de um vereador, o mais votado dentre eles. Igual procedimento adotará a Mesa Diretora em caso de impedimento ou ausência do líder e do vice-líder."],"nt":[]},{"id":"ri:59","n":"59","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["A liderança da bancada de situação e a liderança da bancada de oposição, além de outras atribuições regimentais, têm as seguintes prerrogativas:","I – usar da palavra, em única oportunidade, pessoalmente ou por intermédio de integrante de sua Bancada, por tempo não superior a 5 (cinco) minutos, para fazer comunicações que julguem urgentes sobre matéria de relevante interesse público ou para defesa da respectiva linha política, no período da Ordem do Dia.","II – participar dos trabalhos de qualquer Comissão de que não seja membro, sem direito a voto, mas podendo requerer diligências, levantar questões de ordem e pedir verificação de votação;","III – encaminhar a votação de qualquer proposição sujeita à deliberação do Plenário, para orientar sua Bancada;","IV – indicar à Mesa Diretora os membros da Bancada para compor as Comissões;","V – participar das Reuniões de Lideranças."],"nt":[]},{"id":"ri:60","n":"60","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["As representações de dois ou mais partidos, por deliberação das respectivas Bancadas, poderão constituir Bloco Parlamentar, sob liderança comum.","§ 1º O Bloco Parlamentar terá, no que couber, as mesmas atribuições das representações partidárias.","§ 2º As lideranças dos partidos que se coligarem em Bloco Parlamentar perdem suas atribuições e prerrogativas regimentais, exceto para indicação dos membros das Comissões.","§ 3º As representações partidárias, blocos parlamentares e as bancadas de situação e oposição têm existência limitada à Legislatura, devendo os atos de suas criações e as alterações posteriores ser apresentados à Mesa Diretora para publicação."],"nt":[]},{"id":"ri:61","n":"61","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["A bancada que, constituindo a Maioria ou Minoria, tenha posição divergente com relação ao Governo, será a Oposição. Seu Líder será o Líder da Oposição."],"nt":[]},{"id":"ri:62","n":"62","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["O Governo Municipal pode indicar um Vereador para exercer
