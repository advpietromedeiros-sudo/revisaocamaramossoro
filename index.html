 a liderança do Governo, com as prerrogativas constantes do art. 60."],"nt":["As prerrogativas de liderança estão no art. 59."]},{"id":"ri:63","n":"63","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["Os líderes são os intermediários autorizados para o diálogo entre as Bancadas ou com o Governo e os Órgãos da Câmara."],"nt":[]},{"id":"ri:64","n":"64","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO II — Das Bancadas e dos Líderes"],"t":["O Vereador que se desvincular de sua representação partidária, de seu bloco parlamentar ou de sua Bancada de situação ou oposição perderá, após o encerramento do ano legislativo, para todos os efeitos regimentais, o direito a cargos e funções que ocupar nas Comissões Permanentes."],"nt":[]},{"id":"ri:65","n":"65","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO III — Da Reunião de Lideranças"],"t":["O Presidente da Câmara Municipal e os Líderes da bancada de situação e bancada de oposição constituem a Reunião de Liderança, competente para deliberar acerca da matéria prevista deste Capítulo.","§ 1º Os Líderes de Partidos com até dois Vereadores ou de Partidos que participem de Bloco Parlamentar e o Líder do Governo terão direito a voz, mas não a voto na Reunião de Liderança.","§ 2º A Reunião de Lideranças se faz por solicitação direta ao Presidente, por qualquer de seus membros, devendo ser previamente cientificados os demais integrantes.","§ 3º Em virtude de Reunião de Lideranças, a Ordem do Dia não pode ser adiada, suspensa ou prorrogada."],"nt":[]},{"id":"ri:66","n":"66","tag":"","b":"C","h":["TÍTULO III — DO PLENÁRIO","CAPÍTULO III — Da Reunião de Lideranças"],"t":["Compete à Reunião de Liderança:","I – opinar sobre a fixação do número de membro de cada Comissão, bem como sobre a representação das Bancadas nas diversas Comissões;","II – estabelecer entendimento político entre as bancadas, sem prejuízo da competência legislativa do Plenário e das comissões;","III – dispensar exigências e formalidades regimentais para agilizar tramitação das proposições;","§ 1º A reunião de Lideranças delibera acerca de matéria constante no inciso IV, de ofício ou por requerimento de qualquer vereador.","§ 2º O requerimento deve ser escrito e devidamente justificado e, depois de lido em Plenário, é submetido aos Lideres na primeira oportunidade, podendo o Presidente consultá-los oralmente em sessão.","§ 3º Aprovadas as manifestações ou sugestões, o Presidente ou o Primeiro Secretário fará as devidas comunicações, das quais constará a informação de que foram aprovadas por deliberação das Lideranças.","§ 4º A Reunião de Lideranças, ao exercer a competência prevista no inciso III deste artigo, não poderá dispensar:","I – exigências e formalidades decorrentes de imperativo constitucional;","II – Parecer oral, em substituição ao das Comissões, pronunciado em Plenário;","III – anúncio da inclusão da matéria na pauta da Ordem do Dia com antecedência mínima de um dia, e convocação de sessão extraordinária, com a mesma antecedência.","§ 5º Quando deliberar acerca da matéria prevista no inciso III do caput deste artigo, as decisões da Reunião de Liderança devem ser tomadas por unanimidade de votos.","§ 6º O Presidente, na primeira oportunidade, comunicará ao Plenário as decisões da Reunião de Lideranças."],"nt":["O artigo tem incisos I a III; a remissão ao inciso IV parece referir-se ao inciso III."]},{"id":"ri:67","n":"67","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO I — Disposições Preliminares"],"t":["As Comissões, órgãos internos destinados a estudar, investigar e apresentar conclusões ou sugestões sobre o que for submetido à sua apreciação, serão permanentes ou temporárias."],"nt":[]},{"id":"ri:68","n":"68","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO I — Disposições Preliminares"],"t":["Na constituição de cada Comissão é assegurada, tanto quanto possível, a representação proporcional dos partidos, blocos parlamentares ou das bancadas de situação e oposição, com representação na Câmara Municipal."],"nt":[]},{"id":"ri:69","n":"69","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO I — Disposições Preliminares"],"t":["A representação dos partidos, blocos ou bancadas será obtida dividindo-se o número de membros da Câmara Municipal pelo número de membros de cada Comissão e o número de Vereadores de cada partido, bloco ou bancada pelo resultado assim alcançado, obtendo-se, então, o quociente partidário, que representará o número de lugares que cada partido, bloco ou bancada terá nas Comissões."],"nt":[]},{"id":"ri:70","n":"70","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO I — Disposições Preliminares"],"t":["Poderão assessorar os trabalhos das Comissões, desde que devidamente credenciados pelo respectivo Presidente da Comissão, técnicos de reconhecida competência na matéria em exame."],"nt":[]},{"id":"ri:71","n":"71","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["As Comissões Permanentes são as que subsistem nas legislaturas e têm por objetivo estudar os assuntos submetidos ao seu exame e sobre eles exarar parecer."],"nt":[]},{"id":"ri:72","n":"72","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["As Comissões Permanentes serão constituídas preferencialmente na mesma sessão legislativa em que for eleita a Mesa Diretora da Câmara Municipal, imediatamente após a eleição desta."],"nt":[]},{"id":"ri:73","n":"73","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["Os membros das Comissões Permanentes serão nomeados pelo Presidente da Câmara, por indicação dos líderes de bancada, para um período de 2 (dois) anos, observada a representação proporcional partidária, dos blocos ou bancadas, sempre que possível, sendo permitida a recondução uma vez."],"nt":[]},{"id":"ri:74","n":"74","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["Não havendo acordo, proceder-se-á à escolha por eleição, votando cada Vereador em um único nome para cada Comissão, considerando-se eleitos os mais votados, de acordo com o quociente partidário previamente fixado.","§ 1º Proceder-se-á a tantos escrutínios quantos forem necessários para completar o preenchimento de todos os lugares de cada Comissão.","§ 2º Havendo empate, considerar-se-á eleito o Vereador do Partido, Bloco Parlamentar ou Bancada ainda não representada na Comissão.","§ 30 Persistindo o empate, será considerado eleito o Vereador mais idoso.","§ 4º A votação para constituição de cada uma das Comissões Permanentes far-se-á mediante voto nominal, aberto, com indicação do nome do votado e assinada pelo votante.","§ 5º Após a comunicação do resultado em Plenário, o Presidente enviará à publicação a composição nominal de cada Comissão."],"nt":[]},{"id":"ri:75","n":"75","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["O Presidente da Câmara Municipal não poderá fazer parte das Comissões Permanentes.","Parágrafo único. O Vice-presidente da Mesa Diretora, no exercício da Presidência, nos casos de impedimento ou licença do Presidente, terá substituto nas Comissões Permanentes a que pertencer, enquanto substituir o Presidente da Mesa."],"nt":[]},{"id":"ri:76","n":"76","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["Na composição das Comissões Permanentes, figurará o nome do suplente enquanto estiver no exercício da vereança."],"nt":[]},{"id":"ri:77","n":"77","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["O preenchimento das vagas ocorridas nas Comissões, nos casos de impedimento, destituição ou renúncia, será apenas para completar o período do mandato."],"nt":[]},{"id":"ri:78","n":"78","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção I — Da Composição das Comissões Permanentes"],"t":["Em caso de mudança de partido, bloco parlamentar ou bancada de situação ou de oposição, o membro integrante da comissão perderá, após o encerramento do ano legislativo, o cargo que ocupa, devendo a vaga ser preenchida por nomeação do Presidente da Câmara, por indicação dos líderes de bancada."],"nt":[]},{"id":"ri:79","n":"79","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção II — Da Competência das Comissões Permanentes"],"t":["As Comissões Permanentes são compostas cada uma de 3 (três) membros e 2 (dois) suplentes, com as seguintes denominações:","I – Constituição, Justiça e Redação;","II – Orçamento, Finanças e Contabilidade;","III – Educação, Cultura e Esporte e Lazer;","IV – Saúde, Seguridade e Bem-Estar Social;","V – Desenvolvimento Social;","VI – Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos;","VII – Desenvolvimento Econômico e Turismo;","VIII – Agricultura e Cooperativismo;","IX – Defesa dos Direitos da Mulher, da Criança, do Adolescente e do Idoso;","X – Defesa dos Direitos da Pessoa com Deficiência;","XI – Meio Ambiente, Mudança de Clima e Proteção Animal."],"nt":[]},{"id":"ri:80","n":"80","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção II — Da Competência das Comissões Permanentes"],"t":["Às Comissões Permanentes, em razão da matéria de sua competência, cabe:","I – estudar proposições e outras matérias submetidas ao seu exame, apresentando, conforme o caso:","a) parecer;","b) substitutivos ou emendas;","c) relatório conclusivo sobre as averiguações e inquéritos.","II – promover estudos, pesquisas e investigações sobre assuntos de interesse público;","III – tomar a iniciativa de elaboração de proposições ligadas ao estudo de tais assuntos, ou decorrentes de indicação da Câmara ou de dispositivos regimentais;","IV – redigir o vencido em primeira discussão ou em discussão única e oferecer redação final aos projetos de acordo com o seu mérito, bem como, quando for o caso, propor a reabertura da discussão nos termos regimentais;","V – realizar audiências públicas com entidades da sociedade civil;","VI – convidar os Secretários Municipais ou equivalentes e os responsáveis pela administração direta ou indireta para prestarem informações sobre assuntos inerentes às suas atribuições no exercício de suas funções;","VII – receber petições, reclamações, representações ou queixas de associações e entidades comunitárias ou de qualquer pessoa contra atos e omissões de autoridades municipais ou entidades públicas;","VIII – solicitar ao Prefeito informações sobre assuntos referentes à Administração que sejam necessárias às atividades da Comissão e que guardem relação temática com a competência da Comissão;","IX – fiscalizar, inclusive efetuando diligências, vistorias e levantamentos in loco, os atos da administração direta e indireta nos termos da legislação pertinente, em especial para verificar a regularidade, a eficiência e a eficácia dos seus órgãos no cumprimento dos objetivos institucionais;","X – acompanhar, junto ao Executivo, os atos de regulamentação, velando por sua completa adequação;","XI – acompanhar, junto ao Executivo, a elaboração da proposta orçamentária, bem como a sua posterior execução;","XII – solicitar informações ou depoimentos de autoridades ou cidadãos, quando guardarem relação temática com a competência da Comissão;","XIII – apreciar programas de obras, planos regionais e setoriais de desenvolvimento e sobre eles emitir parecer;","XIV – requisitar aos responsáveis a exibição de documentos e a prestação dos esclarecimentos necessários.","§ 1º Os projetos e demais proposições distribuídas às Comissões serão examinados pelo relator designado ou, quando for o caso, por subcomissão que emitirá parecer sobre o mérito.","§ 2º A Comissão de Constituição, Justiça e Redação manifestar-se-á sobre a constitucionalidade e legalidade, e a Comissão de Orçamento, Finanças e Contabilidade, sobre os aspectos financeiros e orçamentários de qualquer proposição."],"nt":[]},{"id":"ri:81","n":"81","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção II — Da Competência das Comissões Permanentes"],"t":["É da competência específica:","I – da Comissão de Constituição, Justiça e Redação:","a) manifestar-se quanto ao aspecto constitucional, legal e regimental e quanto ao aspecto gramatical e lógico das proposições que tramitarem pela Câmara, excetuando-se as leis orçamentárias, os pareceres do Tribunal de Contas, os requerimentos e indicações;","b) manifestar-se quanto aos pedidos de tramitação de urgência especial, devendo o requerimento ser submetido ao Plenário em casos de manifestação contrária da Comissão;","c) apreciar, votar, aprovar ou reprovar em caráter terminativo os projetos de lei que dispuserem sobre o reconhecimento de instituição como de utilidade pública.","d) desincumbir-se de outras atribuições que lhe confere este Regimento;","II – da Comissão de Orçamento, Finanças e Contabilidade:","a) examinar e emitir parecer sobre projetos de lei relativos ao plano plurianual, às diretrizes orçamentárias, ao orçamento e aos créditos adicionais;","b) examinar e emitir parecer sobre os planos e programas municipais e setoriais previstos na Lei Orgânica, e exercer o acompanhamento e a fiscalização orçamentária;","c) receber as emendas às leis orçamentárias do Município;","d) elaboração da redação final do Projeto de Lei Orçamentária, do Projeto do Plano Plurianual e do Projeto de Lei de Diretrizes Orçamentárias, podendo, para tanto, solicitar ao Poder Executivo informações, documentos, arquivos, softwares e tabelas necessários à elaboração;","e) opinar sobre proposições referentes à matéria tributária, abertura de créditos, empréstimos públicos, dívida pública e outras que, direta ou indiretamente, alterem a despesa ou a receita do Município e acarretem responsabilidades para o erário municipal;","f) examinar e emitir parecer sobre projetos de lei relativos à administração pública;","g) examinar e emitir parecer sobre projetos de lei relativos à criação, estruturação, fusão e incorporação de secretarias e órgãos públicos municipais;","h) examinar e emitir parecer sobre obtenção de empréstimo de particulares;","i) examinar e emitir parecer sobre os pareceres prévios do Tribunal de Contas do Estado relativos à prestação de contas do Prefeito e da Mesa da Câmara;","j) examinar e emitir parecer sobre proposições que fixem os vencimentos do funcionalismo, a remuneração do Prefeito, Vice-Prefeito e Vereadores, verbas institucionais da Câmara Municipal, de gabinete e de manutenção;","k) examinar e emitir parecer sobre todas as proposituras que, direta ou indiretamente, representem a mutação patrimonial do Município.","III – da Comissão de Educação, Cultura e Esporte e Lazer:","a) examinar e emitir parecer sobre os projetos referentes à educação, ensino e artes, em especial sobre:","1. O Sistema Municipal de Ensino;","2. concessão de bolsas de estudos com finalidade de assistência à pesquisa tecnológica e científica para aperfeiçoamento do ensino;","3. programas de merenda escolar;","b) examinar e emitir parecer sobre os projetos referentes ao patrimônio histórico, artístico e cultural, em especial sobre:","1. preservação da memória da cidade no plano estético, paisagístico, de seu patrimônio histórico, cultural, artístico e arquitetônico;","2. denominação ou alterações de próprios, vias e logradouros públicos;","3. concessão de títulos honoríficos, outorga de honrarias, prêmios ou homenagens a pessoas que, reconhecidamente, tenham relevantes serviços prestados ao Município.","c) examinar e emitir parecer sobre os projetos referentes aos esportes e às atividades de lazer;","d) examinar e emitir parecer sobre os projetos referentes aos serviços, equipamentos e programas culturais, educacionais, esportivos, recreativos e de lazer voltados à comunidade, de forma geral.","IV – Saúde, Seguridade e Bem-Estar Social:","a) examinar e emitir parecer sobre todos os projetos referentes à saúde pública, à higiene e ao bemestar social, sobre:","1. Sistema Único de Saúde e seguridade social;","2. vigilância sanitária, epidemiológica e nutricional;","3. demais aspectos específicos da saúde pública, higiene e da assistência sanitária municipal.","b) examinar e emitir parecer sobre todos os projetos referentes à seguridade social, em especial sobre seguridade social, previdência, saúde e bem-estar do trabalhador.","V – da Comissão de Desenvolvimento Social:","a) examinar e emitir parecer sobre todas as proposições referentes ao desenvolvimento social e políticas de assistência social, especialmente sobre:","1. geração de emprego e renda;","2. projetos de reconhecimento do cidadão, buscando formas de integrá-lo ao meio social em que convive;","3. ações sociais e políticas assistenciais desenvolvidas no pelo Município;","VI – da Comissão de Planejamento, Uso, Ocupação e Parcelamento do Solo, Obras e Serviços Públicos:","a) examinar e emitir parecer sobre as matérias que se seguem, sem interferir na competência das demais:","1. processos atinentes à realização de obras e serviços, seu uso e gozo, doação de terra, venda, hipoteca, permuta, outorga de concessão administrativa ou direito real e uso de bens imóveis de propriedade do Município;","2. sobre serviços de utilidade pública, sejam ou não objeto de concessão municipal, planos habitacionais elaborados ou executados pelo Município, diretamente ou por intermédio de autarquias ou órgãos paraestatais;","3. sobre transportes coletivos e individuais, frete e carga, utilização das vias urbanas e estradas municipais e sua respectiva sinalização, bem como sobre os meios de comunicação;","4. sobre os serviços públicos realizados ou prestados pelo Município, diretamente ou por intermédio de autarquias ou órgãos paraestatais;","5. examinar, a título informativo, os serviços públicos de concessão estadual ou federal que interessem ao Município;","6. cadastro territorial do Município, planos gerais e parciais de urbanização ou reurbanização, zoneamento, uso e ocupação do solo;","7. criação, organização, ou supressão de distritos e subdistritos, divisão do território em áreas administrativas;","8. plano diretor.","VII – da Comissão de Desenvolvimento Econômico e Turismo:","a) examinar e emitir parecer sobre todas as proposições e matérias relativas ao disciplinamento das atividades econômicas desenvolvidas no Município;","b) examinar e emitir parecer sobre todas as proposições e matérias relativas ao fomento, por todos os meios, à instalação de indústrias e de empresas comerciais e de prestação de serviços, auxiliando o Poder Executivo no que for necessário ao melhor desenvolvimento econômico do Município;","c) examinar e emitir parecer sobre todas as proposições e matérias relativas a programas de turismo, em suas mais diversas formas.","VIII – da Comissão de Agricultura e Cooperativismo:","a) examinar e emitir parecer sobre política agrícola e assuntos atinentes à agricultura e ao cooperativismo, destacadamente:","1. organização do setor rural;","2. política municipal de cooperativismo;","3. estímulos financeiros à agricultura e ao cooperativismo;","4. política municipal de crédito rural;","5. política agrícola e de desenvolvimento tecnológico da agropecuária;","6. política de abastecimento, comercialização e exportação de produtos agropecuários;","7. política de eletrificação rural;","8. vigilância e defesa sanitária animal e vegetal.","IX – da Comissão de Defesa dos Direitos da Mulher, da Criança, do Adolescente e da Pessoa Idosa:","a) Examinar e emitir parecer acerca de proposições relativas à defesa dos direitos humanos das minorias, das mulheres, das crianças, adolescentes e da pessoa idosa;","b) Instituir e supervisionar as Políticas Públicas de cada segmento no Município, tendo como marco inicial a criação dos respectivos conselhos municipais;","c) Acompanhar e buscar prevenção para os indicadores sociais das diferentes manifestações intrafamiliares da Violência Doméstica Física, Violência Doméstica Psicológica; Violência Doméstica Sexual, Violência Doméstica Fatal e a Negligência;","d) Fiscalizar e acompanhar os Programas Governamentais no cumprimento das Políticas Públicas exigidas nas legislações específicas vigentes para cada segmento proposto;","e) Fiscalizar programas não governamentais relativos aos interesses dos segmentos representados na Comissão;","f) Promover campanhas de esclarecimento, encontros e seminários sobre as políticas públicas em parceria com instituições públicas e privadas legalmente constituídas para coibir, impedir e prevenir a violência física, emocional, social e psicológica;","g) Receber, avaliar e proceder a investigações relativas às ameaças ou violação aos direitos dos segmentos da Comissão;","h) Convidar Ministério Público, Defensoria Pública, Poder Judiciário, Segurança Pública e demais autoridades do Executivo e sociedade civil para compor um grupo de acompanhamento ao trabalho investigativo;","i) Colaborar com entidades não governamentais, nacionais e internacionais que atuem na defesa dos direitos dos segmentos da Comissão.","X – da Comissão de Defesa dos Direitos da Pessoa Com Deficiência:","a) Analisar projetos de lei e proposições relacionadas aos direitos das pessoas com deficiência;","b) Receber e avaliar denúncias relativas à ameaça ou violação dos direitos das pessoas com deficiência;","c) Colaborar com entidades não governamentais que atuem na defesa dos direitos das pessoas com deficiência;","d) Promover debates e audiências públicas sobre temas relevantes, convidando especialistas, representantes de organizações da sociedade civil, órgãos públicos e as próprias pessoas com deficiência para debater questões e propor soluções;","e) Atuar na fiscalização da aplicação de leis e políticas públicas que se ocupem das pessoas com deficiência, monitorando a eficácia dessas ações;","f) Atuar como canal de apoio para organizações que atuam na defesa dos direitos das pessoas com deficiência, além de fornecer informações à sociedade em geral sobre os direitos dessa população.","XI – da Comissão de Meio Ambiente, Mudança do Clima e Proteção Animal:","a) Analisar projetos de lei e proposições relacionadas à política e sistema municipal do meio ambiente, direito ambiental municipal, legislação de defesa ecológica;","b) Analisar projetos de lei e proposições relacionadas ao controle de poluição ambiental em todos os aspectos e preservação dos recursos renováveis;","c) Analisar projetos de lei e proposições relacionadas à flora, fauna, solo, edafologia e desertificação;","d) Analisar projetos de lei e proposições relacionadas ao desenvolvimento sustentável;","e) Analisar projetos de lei, bem como acompanhar políticas municipais e buscar iniciativas com entidades não governamentais relacionadas à proteção animal."],"nt":[]},{"id":"ri:82","n":"82","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção II — Da Competência das Comissões Permanentes"],"t":["É vedado às Comissões Permanentes, ao apreciarem proposição ou qualquer matéria submetida ao seu exame, opinar sobre aspectos que não sejam de sua atribuição específica."],"nt":[]},{"id":"ri:83","n":"83","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção II — Da Competência das Comissões Permanentes"],"t":["É obrigatório o parecer das Comissões Permanentes nos assuntos de sua competência, ainda que proferido oralmente, nos termos deste Regimento Interno."],"nt":[]},{"id":"ri:84","n":"84","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["As Comissões Permanentes, logo que constituídas, reunir-se-ão para eleger os respectivos Presidentes, Vice-presidentes e Secretários."],"nt":[]},{"id":"ri:85","n":"85","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Ao Presidente da Comissão Permanente compete:","I – convocar reuniões da Comissão, com antecedência mínima de 24 (vinte e quatro) horas, avisando, obrigatoriamente, todos os integrantes da Comissão, prazo este dispensado se contar o ato da convocação com a presença de todos os membros;","II – convocar audiências públicas, ouvida a Comissão;","III – presidir as reuniões e zelar pela ordem dos trabalhos;","IV – convocar reuniões extraordinárias, de ofício ou a requerimento da maioria dos membros da comissão;","V – determinar a leitura das atas das reuniões e submetê-las a voto;","VI – receber a matéria destinada à Comissão e designar-lhe relator no prazo improrrogável de 2 (dois) dias;","VII – submeter à votação as questões em debate e proclamar o resultado;","VIII – zelar pela observância dos prazos concedidos à Comissão;","IX – conceder pedido de vista aos membros da Comissão somente para as proposições em regime de tramitação ordinária, e pelo prazo máximo de 2 (dois) dias;","X – representar a Comissão nas relações com a Mesa Diretora e o Plenário;","XI – resolver, de acordo com o Regimento, todas as questões de ordem suscitadas nas reuniões da Comissão;","XII – enviar à Mesa Diretora toda as matérias da Comissão destinadas ao conhecimento do Plenário;","XIII – solicitar ao Presidente da Câmara Municipal, mediante ofício, providências junto às Lideranças Partidárias, no sentido de serem indicados substitutos para os membros da Comissão, em caso de vaga, licença, impedimento ou renúncia;","XIV – apresentar ao Presidente da Câmara relatório mensal e anual dos trabalhos da Comissão;","XV – Responsabilizar-se pelos serviços de elaboração e publicação em página institucional das atas das reuniões da Comissão, contendo o registro da presença dos membros que compareceram ou que faltaram e, resumidamente, a matéria tratada e a conclusão a que tenha chegado a Comissão;","XVI – Responsabilizar-se pelos serviços de publicação em página institucional dos pareceres, emendas, substitutivos ou demais documentos acessórios que forem elaborados pela Comissão.","Parágrafo único. As Comissões Permanentes não poderão reunir-se durante a fase da Ordem do Dia das sessões da Câmara, salvo disposição específica prevista neste Regimento Interno."],"nt":[]},{"id":"ri:86","n":"86","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["O Presidente da Comissão Permanente poderá atuar como relator e terá direito a voto, em caso de empate."],"nt":[]},{"id":"ri:87","n":"87","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Dos atos do Presidente da Comissão Permanente cabe, a qualquer membro, recurso ao Plenário, obedecendo-se o disposto neste Regimento."],"nt":[]},{"id":"ri:88","n":"88","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Quando duas ou mais Comissões Permanentes apreciarem qualquer matéria em reunião conjunta, a presidência dos trabalhos caberá ao mais idoso Presidente de Comissão, dentre os presentes, se desta reunião conjunta não estiver participando a Comissão de Constituição, Justiça e Redação, hipótese em que a direção dos trabalhos caberá ao Presidente desta Comissão."],"nt":[]},{"id":"ri:89","n":"89","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Ao Vice-presidente compete substituir o Presidente da Comissão Permanente em suas ausências eventuais ou licenças, devendo, entretanto, ser nomeado novo presidente em casos de impedimentos, destituição ou renúncia e licenças.","Parágrafo único. O Vice-presidente auxiliará o Presidente sempre que por ele convocado, cabendo- lhe representar a Comissão por delegação pessoal do Presidente."],"nt":[]},{"id":"ri:90","n":"90","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Os Presidentes das Comissões Permanentes poderão reunir-se mensalmente sob a presidência do Presidente da Câmara para examinar assuntos de interesse comum das Comissões e determinar providências sobre o melhor e mais rápido andamento das proposições."],"nt":[]},{"id":"ri:91","n":"91","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Ao Secretário da Comissão Permanente compete:","I – presidir as reuniões da Comissão nas ausências simultâneas do Presidente e Vice-presidente;","II – fazer observar os prazos regimentais dos processos que tramitam na Comissão;","III – providenciar a publicação dos extratos das atas e dos pareceres da Comissão;","IV – proceder à leitura das atas e correspondências recebidas pela Comissão."],"nt":[]},{"id":"ri:92","n":"92","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção III — Dos Presidentes, Vice-presidentes e Secretários das Comissões Permanentes"],"t":["Se, por qualquer razão, o Presidente deixar de fazer parte da Comissão, ou renunciar à Presidência, proceder-se-á a nova eleição, salvo se faltarem menos de 3 (três) meses para o término do mandato, sendo, neste caso, substituído pelo Vice-presidente."],"nt":[]},{"id":"ri:93","n":"93","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção IV — Das Reuniões"],"t":["As Comissões Permanentes reunir-se-ão:","I – ordinariamente, mediante convocação, duas vezes por semana, segunda e sextas-feiras, exceto nos dias feriados e de ponto facultativo;","II – extraordinariamente, sempre que necessário, mediante convocação de oficio pelos respectivos Presidentes, ou a requerimento da maioria dos membros da Comissão, mencionando-se, em ambos os casos, a matéria a ser apreciada.","§ 1º Quando a Câmara estiver em recesso, as Comissões só poderão reunir-se em caráter extraordinário para tratar de assunto relevante e inadiável.","§ 2º As Comissões não poderão reunir-se durante a Ordem do Dia das Sessões Ordinárias, ressalvados os casos expressamente previstos neste Regimento."],"nt":[]},{"id":"ri:94","n":"94","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção IV — Das Reuniões"],"t":["As Comissões Permanentes devem reunir-se em local destinado a esse fim, com a presença da maioria absoluta de seus membros.","Parágrafo único. Quando, por qualquer motivo, a reunião tiver de realizar-se em outro local, é indispensável a comunicação por escrito e com antecedência mínima de 24 (vinte e quatro) horas, a todos os membros da Comissão."],"nt":[]},{"id":"ri:95","n":"95","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção IV — Das Reuniões"],"t":["Das reuniões das Comissões lavrar-se-ão atas, com o sumário do que nelas houver ocorrido, assinadas pelos membros presentes.","§ 1º As atas das reuniões, uma vez aprovadas, deverão ser devidamente publicadas em página institucional da Câmara Municipal.","§ 2º Se a comissão, pela excepcionalidade do caso, queira realizar discussão em caráter secreto, a ata lavrada, após aprovada, será rubricada em todas as folhas pelo Presidente, Vice-Presidente e Secretário, e recolhida aos arquivos da Câmara Municipal de Mossoró.","§ 3º A reunião da Comissão poderá ser transmitida ao vivo, quando assim solicitado pelo Presidente da Comissão no ato de convocação e agendamento da reunião."],"nt":[]},{"id":"ri:96","n":"96","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["As Comissões somente deliberarão com a presença da maioria de seus membros."],"nt":[]},{"id":"ri:97","n":"97","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Salvo as exceções previstas neste Regimento, para emitir parecer sobre qualquer matéria, cada Comissão terá o prazo 15 (quinze) dias, prorrogável por mais 8 (oito) dias, pelo Presidente da Câmara, a requerimento devidamente fundamentado.","§ 1º O prazo previsto neste artigo começa a correr a partir da data em que o processo der entrada na Comissão.","§ 2º O Presidente da Comissão, dentro do prazo máximo de 2 (dois) dias, designará os respectivos relatores.","§ 3º O relator terá o prazo improrrogável de 8 (oito) dias para manifestar-se, por escrito, a partir da data da distribuição.","§ 4º Se houver pedido de vista, este será concedido pelo prazo máximo e improrrogável de 2 (dois) dias corridos, nunca, porém, com transgressão do limite dos prazos estabelecidos no caput deste artigo.","§ 5º Só se concederá vista do processo depois que ele estiver devidamente relatado.","§ 6º Não serão aceitos pedidos de vista para processos em fase de redação de acordo com o vencido em primeira discussão, nem em fase de redação final."],"nt":[]},{"id":"ri:98","n":"98","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Decorridos os prazos previstos no artigo anterior, deverá o processo ser devolvido à Diretoria Legislativa, com ou sem parecer, sendo que, na falta deste, o Presidente da Comissão declarará o motivo."],"nt":[]},{"id":"ri:99","n":"99","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Dependendo o parecer de exame de qualquer outro processo ainda não chegado à Comissão, deverá seu Presidente requisitá-lo ao Presidente da Câmara, sendo que, neste caso, os prazos estabelecidos no artigo 98 ficarão sem fluência, por 10 (dez) dias corridos, no máximo, a partir da data da requisição.","Parágrafo único. A entrada do processo requisitado na Comissão antes de decorridos os 10 (dez) dias dará continuidade à fluência do prazo interrompido."],"nt":[]},{"id":"ri:100","n":"100","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Nas hipóteses previstas no art. 81 deste Regimento, dependendo o parecer da realização de audiências públicas, os prazos estabelecidos no art. 98 ficarão sobrestados por 10 (dez) dias úteis, para a realização delas."],"nt":["Os prazos de parecer estão no art. 97."]},{"id":"ri:101","n":"101","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Decorridos os prazos de todas as Comissões a que tenham sido enviados, poderão os projetos ser incluídos na Ordem do Dia, com ou sem parecer escrito, pelo Presidente da Câmara, de oficio, ou a requerimento de qualquer Vereador, independentemente do pronunciamento do Plenário.","Parágrafo único. Para os fins do disposto neste artigo, o Presidente da Câmara, se necessário, determinará a pronta tramitação do processo."],"nt":[]},{"id":"ri:102","n":"102","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["As Comissões Permanentes deverão solicitar do Executivo, por intermédio do Presidente da Câmara, todas as informações julgadas necessárias.","§ 1º O pedido de informações dirigido ao Executivo interrompe os prazos previstos no art. 97.","§ 2º A interrupção mencionada no parágrafo anterior cessará ao cabo de 30 (trinta) dias corridos, contados da data em que for expedido o respectivo ofício, se o Executivo, dentro deste prazo, não tiver prestado as informações requisitadas.","§ 3º A remessa das informações antes de decorridos os 30 (trinta) dias dará continuidade à fluência do prazo interrompido.","§ 4º Além das informações prestadas, somente serão incluídos no processo sob exame da Comissão Permanente os pareceres desta emanados e as transcrições das audiências públicas realizadas."],"nt":[]},{"id":"ri:103","n":"103","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["O recesso da Câmara interrompe todos os prazos consignados na presente seção."],"nt":[]},{"id":"ri:104","n":"104","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Quando qualquer processo for distribuído a mais de uma Comissão, cada qual dará seu parecer separadamente, ouvida em primeiro lugar a Comissão de Constituição, Justiça e Redação quanto ao aspecto legal ou constitucional e, em último, a de Orçamento, Finanças e Contabilidade, quando for o caso."],"nt":[]},{"id":"ri:105","n":"105","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["Mediante comum acordo de seus Presidentes, em caso de urgência justificada, poderão as Comissões Permanentes realizar reuniões conjuntas para exame de proposições ou qualquer matéria a elas submetida, facultando-se, neste caso, a apresentação de parecer conjunto."],"nt":[]},{"id":"ri:106","n":"106","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["A manifestação de uma Comissão sobre determinada matéria não exclui a possibilidade de nova manifestação, mesmo em proposição de sua autoria, se o Plenário assim deliberar."],"nt":[]},{"id":"ri:107","n":"107","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção V — Dos Trabalhos"],"t":["As disposições estabelecidas nesta seção não se aplicam aos projetos com prazo para apreciação estabelecido em lei."],"nt":[]},{"id":"ri:108","n":"108","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VI — Dos Pareceres"],"t":["Parecer é o pronunciamento da Comissão sobre qualquer matéria sujeita ao seu estudo.","Parágrafo único. Salvo nos casos expressamente previstos neste Regimento, o parecer será escrito e constará de 4 (quatro) partes:","I – exposição da matéria em exame;","II – conclusões do relator com:","a) sua opinião sobre a legalidade ou ilegalidade, a constitucionalidade ou inconstitucionalidade total ou parcial do projeto, se pertencer à Comissão de Constituição, Justiça e Redação;","b) sua opinião sobre a conveniência e oportunidade da aprovação ou rejeição total ou parcial da matéria, se pertencer a alguma das demais comissões.","III – a decisão da Comissão, com a assinatura dos membros que votaram a favor ou contra;","IV – o oferecimento, se for o caso, de substitutivo ou emendas."],"nt":[]},{"id":"ri:109","n":"109","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VI — Dos Pareceres"],"t":["Os membros das Comissões Permanentes emitirão seu juízo sobre a manifestação do relator, mediante voto.","§ 1º O relatório somente será transformado em parecer se aprovado pela maioria dos membros da Comissão.","§ 2º A simples aposição da assinatura, sem qualquer outra observação, implicará a concordância total do signatário com a manifestação do relator.","§ 3º Poderá o membro da Comissão Permanente exarar voto em separado, devidamente fundamentado:","I – pelas conclusões, quando favorável às conclusões do relator, mas com diversa fundamentação;","II – aditivo, quando favorável às conclusões do relator, mas acrescente novos argumentos à sua fundamentação;","III – contrário, quando se oponha frontalmente às conclusões do relator.","§ 4º O voto do relator não acolhido pela maioria dos membros da Comissão constituirá voto vencido.","§ 5º O voto em separado, divergente ou não das conclusões do relator, desde que acolhido pela maioria da Comissão, passará a constituir seu parecer."],"nt":[]},{"id":"ri:110","n":"110","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VI — Dos Pareceres"],"t":["Para emitir parecer oral, nos casos expressamente previstos neste Regimento, o relator, ao fazê-lo, indicará sempre os nomes dos membros da Comissão ouvidos e declarará quais se manifestaram favoravelmente e quais foram contrários à proposição."],"nt":[]},{"id":"ri:111","n":"111","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VI — Dos Pareceres"],"t":["Concluindo o parecer da Comissão de Constituição, Justiça e Redação pela inconstitucionalidade ou ilegalidade de qualquer proposição, ocorrerá sua submissão ao Plenário para que, em discussão e votação únicas, seja apreciada essa preliminar.","Parágrafo único. Quando for aprovado parecer da Comissão de Constituição, Justiça e Redação que concluir pela inconstitucionalidade ou ilegalidade da proposição, esta será arquivada; quando o parecer for rejeitado, a proposição será encaminhada às demais Comissões."],"nt":[]},{"id":"ri:112","n":"112","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VI — Dos Pareceres"],"t":["O projeto de lei que receber parecer contrário quanto ao mérito de todas as Comissões será tido como rejeitado."],"nt":[]},{"id":"ri:113","n":"113","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VII — Das Vagas, Licenças e Impedimentos nas Comissões Permanentes"],"t":["As vagas das Comissões Permanentes verificar-se-ão com:","I – a renúncia;","II – a destituição,.","III – a perda do mandato de Vereador.","§ 1º A renúncia de qualquer membro da Comissão Permanente será ato acabado e definitivo, desde que manifesta, por escrito, à Presidência da Câmara.","§ 2º Os membros das Comissões Permanentes serão destituídos caso não compareçam, injustificadamente, a 3 (três) reuniões consecutivas, não podendo mais participar de qualquer Comissão Permanente até o fim da Sessão Legislativa.","§ 3º As faltas às reuniões da Comissão Permanente poderão ser justificadas no prazo de 5 (cinco) dias, quando ocorrer justo motivo.","§ 4º A destituição dar-se-á por simples representação de qualquer Vereador, dirigida ao Presidente da Câmara, que, depois de comprovar a ocorrência das faltas e a ausência de justificativa em tempo hábil, declarará vago o cargo na Comissão Permanente.","§ 5º O Presidente de Comissão Permanente poderá ser destituído quando deixar de cumprir decisão plenária relativa a recurso contra ato seu, mediante processo sumário, iniciado por representação subscrita por qualquer Vereador, sendo-lhe facultado o direito de defesa no prazo de 10 (dez) dias, cabendo a decisão final ao Presidente da Câmara.","§ 6º O Presidente de Comissão, destituído nos termos do parágrafo anterior, não poderá participar de qualquer Comissão Permanente até o fim da Sessão Legislativa.","§ 7º O Presidente da Câmara preencherá, por nomeação, as vagas verificadas nas Comissões Permanentes, de acordo com a indicação do Líder do partido respectivo, não podendo a nomeação recair sobre o denunciante ou o destituído."],"nt":[]},{"id":"ri:114","n":"114","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VII — Das Vagas, Licenças e Impedimentos nas Comissões Permanentes"],"t":["O Vereador que se recusar a participar das Comissões Permanentes ou for denunciante ou destituído de qualquer delas não poderá ser nomeado para integrar Comissão de Representação da Câmara até o fim da Sessão Legislativa."],"nt":[]},{"id":"ri:115","n":"115","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO II — Das Comissões Permanentes","Seção VII — Das Vagas, Licenças e Impedimentos nas Comissões Permanentes"],"t":["Nos casos de licença ou impedimento legal de qualquer membro das Comissões Permanentes, caberá ao Presidente da Câmara a designação do substituto, mediante indicação do Líder do partido a que pertença o Vereador licenciado ou impedido.","Parágrafo único. A substituição perdurará enquanto persistir a licença ou o impedimento."],"nt":[]},{"id":"ri:116","n":"116","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção I — Disposições Preliminares"],"t":["Comissões Temporárias são as constituídas com finalidades especiais e se extinguem com o término da Legislatura ou antes dele, quando atingidos os fins para os quais foram constituídas."],"nt":[]},{"id":"ri:117","n":"117","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção I — Disposições Preliminares"],"t":["As Comissões Temporárias poderão ser:","I – Comissões de Representação;","II – Comissões Processantes;","III – Comissões Especiais de Inquérito."],"nt":[]},{"id":"ri:118","n":"118","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção II — Das Comissões de Representação"],"t":["As Comissões de Representação têm por finalidade representar a Câmara em atos externos, de caráter social ou cultural, inclusive participação em congressos.","§ 1º As Comissões de Representação serão constituídas:","a) mediante projeto de resolução, aprovado por maioria simples e submetido a discussão e votação únicas na Ordem do Dia da sessão seguinte à de sua apresentação, se acarretar despesas;","b) mediante simples requerimento, submetido à discussão e votação única na fase da Ordem do Dia da mesma sessão de sua apresentação, quando não acarretar despesas.","§ 2º No caso da alínea \"a\" do parágrafo anterior, será obrigatoriamente ouvida a Comissão de Orçamento, Finanças e Contabilidade, no prazo de 3 (três) dias, contados da apresentação do projeto respectivo.","§ 3º Qualquer que seja a forma de constituição da Comissão de Representação, o ato constitutivo deverá conter:","a) a finalidade;","b) o número de membros;","c) o prazo de duração.","§ 4º Os membros da Comissão de Representação serão nomeados pelo Presidente da Câmara, que poderá, a seu critério, integrá-la ou não, observada, sempre que possível, a representação proporcional dos partidos.","§ 5º A Comissão de Representação será sempre presidida pelo único ou primeiro dos signatários do Projeto de Resolução que a criou, quando dela não faça parte o Presidente ou o Vice-presidente da Câmara.","§ 6º Os membros da Comissão de Representação requererão licença à Câmara, quando necessária.","§ 7º Os membros da Comissão de Representação, constituída nos termos da alínea \"a\" do parágrafo primeiro, deverão apresentar ao Plenário relatório das atividades desenvolvidas durante a representação, bem como prestação de contas das despesas efetuadas, no prazo de dez (10) dias após o seu término, que deverá ser publicado por afixação."],"nt":[]},{"id":"ri:119","n":"119","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção IV — Das Comissões Processantes"],"t":["As Comissões Processantes serão constituídas com as seguintes finalidades:","I – apurar infrações político-administrativas dos Vereadores, no desempenho de suas funções, nos termos deste Regimento;","II – destituição dos membros da Mesa Diretora, nos termos dos Art. 46 a Art. 51 deste Regimento.","Parágrafo único. As Comissões Processantes serão constituídas por requerimento subscrito por 1/3 (um terço) dos Vereadores ou por ato do Presidente da Câmara, independentemente de deliberação."],"nt":[]},{"id":"ri:120","n":"120","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção IV — Das Comissões Processantes"],"t":["Durante seus trabalhos, as Comissões Processantes observarão as disposições relativas ao decoro parlamentar e à cassação do mandato de que trata este Regimento."],"nt":[]},{"id":"ri:121","n":"121","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["As Comissões Especiais de Inquérito destinar-se-ão a apurar irregularidades sobre fato determinado e por prazo certo, que se inclua na competência municipal, além de outros previstos em Lei e neste Regimento.","§ 1º Independe de deliberação do Plenário o requerimento de constituição de Comissão Especial de Inquérito, subscrito por 1/3 (um terço) dos membros da Câmara.","§ 2º Do requerimento deverá constar:","a) o fato a ser investigado, com clareza e precisão, considerando-se tal o acontecimento, devidamente caracterizado de relevante interesse para a vida pública e a ordem constitucional, legal, econômica ou social do Município;","b) identificação dos prováveis autor e beneficiário ou autores e beneficiários do fato especificado;","c) denominação do órgão, serviço ou entidade a que se referir;","d) a indicação, se for o caso, dos Vereadores que servirão como testemunhas;","e) as provas que pretendam produzir.","§ 3º O número de membros que integrarão a Comissão não pode ser inferior a 3 (três), e o prazo de funcionamento da Comissão deverá ser de 90 (noventa) dias, podendo ser prorrogado mediante requerimento deferido pelo Presidente da Câmara."],"nt":["CF, art. 58, § 3º. Criação de CPI é direito das minorias (STF, MS 24.831)."]},{"id":"ri:122","n":"122","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Apresentado o requerimento, o Presidente da Câmara nomeará de imediato os membros da Comissão Especial, assegurando às Bancadas o princípio da proporcionalidade dentre os Vereadores desimpedidos.","§ 1º Consideram-se impedidos os Vereadores que estiverem envolvidos no fato a ser apurado, aqueles que tiverem interesse pessoal na apuração e os que foram indicados como testemunhas.","§ 2º Não havendo número de Vereadores desimpedidos suficiente para a formação, deverá o Presidente da Câmara designar para compor a Comissão o Vereador ou os Vereadores que inicialmente se encontravam impedidos."],"nt":[]},{"id":"ri:123","n":"123","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Composta a Comissão Especial de Inquérito, seus membros elegerão, desde logo, o Presidente e o Relator."],"nt":[]},{"id":"ri:124","n":"124","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Caberá ao Presidente da Comissão designar local, horário e data das reuniões e requisitar funcionário, se for o caso, para secretariar os trabalhos da Comissão, com comunicação aos membros feita com antecedência mínima de 24 horas.","Parágrafo único. A Comissão poderá reunir-se em qualquer local."],"nt":[]},{"id":"ri:125","n":"125","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["As reuniões da Comissão Especial de Inquérito somente serão realizadas com a presença da maioria de seus membros."],"nt":[]},{"id":"ri:126","n":"126","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Todos os atos e diligências da Comissão serão transcritos e autuados em processo próprio, em folhas numeradas, datadas e rubricadas pelo Presidente da Comissão, contendo também a assinatura dos depoentes, quando se tratar de depoimentos tomados de autoridades ou de testemunhas."],"nt":[]},{"id":"ri:127","n":"127","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Os membros da Comissão Especial de Inquérito, no interesse da investigação, poderão, em conjunto ou isoladamente:","1. proceder a vistorias e levantamentos nas repartições públicas municipais e entidades descentralizadas, onde terão livre ingresso e permanência;","2. requisitar de seus responsáveis a exibição de documentos e a prestação dos esclarecimentos necessários;","3. transportar-se aos lugares onde se fizer mister a sua presença, ali realizando os atos que lhe competem.","Parágrafo único. É de 30 (trinta) dias, prorrogáveis por igual período, desde que solicitado e devidamente justificado, o prazo para que os responsáveis pelos órgãos da Administração Direta e Indireta prestem as informações e encaminhem os documentos requisitados pelas Comissões Especiais de Inquérito."],"nt":[]},{"id":"ri:128","n":"128","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["No exercício de suas atribuições, poderão ainda as Comissões Especiais de Inquérito, por meio de seu Presidente, após deliberação de seus componentes:","1. determinar as diligências que reputarem necessárias;","2. realizar a convocação de Secretário Municipal;","3. tomar o depoimento de quaisquer autoridades, intimar testemunhas e inquiri-Ias sob compromisso;","4. proceder a verificações contábeis em livros, papéis e documentos dos órgãos da Administração Direta e Indireta."],"nt":[]},{"id":"ri:129","n":"129","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["O não atendimento às determinações contidas nos artigos anteriores, no prazo estipulado, faculta ao Presidente da Comissão solicitar, na conformidade da legislação federal, a intervenção do Poder Judiciário."],"nt":[]},{"id":"ri:130","n":"130","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["As testemunhas serão intimadas e deporão sob as penas do falso testemunho previstas na Legislação Penal e, em caso de não comparecimento sem motivo justificado, a intimação será solicitada ao Juiz Criminal da localidade onde reside ou se encontra, na forma que dispuser o Código de Processo Penal."],"nt":[]},{"id":"ri:131","n":"131","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Se não concluir seus trabalhos no prazo que lhe tiver sido estipulado, a Comissão ficará extinta, salvo se, antes do término do prazo, seu Presidente requerer a prorrogação por menor ou igual prazo ao Presidente da Câmara, acompanhado, necessariamente, de justificativa convincente."],"nt":[]},{"id":"ri:132","n":"132","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["A Comissão concluirá seus trabalhos por relatório final, que deverá conter:","I – a exposição dos fatos submetidos à apuração;","II – a exposição e análise das provas colhidas;","III – a conclusão sobre a comprovação ou não da existência dos fatos;","IV – a conclusão sobre a autoria dos fatos apurados como existentes;","V – a sugestão das medidas a serem tomadas, com sua fundamentação legal, e a indicação das autoridades ou quaisquer outras pessoas que tiverem competência para a adoção das providências reclamadas."],"nt":[]},{"id":"ri:133","n":"133","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Considera-se relatório final o elaborado pelo Relator eleito, desde que aprovado pela maioria dos membros da Comissão."],"nt":[]},{"id":"ri:134","n":"134","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Rejeitado o Relatório a que se refere o artigo anterior, considera-se Relatório Final o elaborado por um dos membros com voto vencedor, designado pelo Presidente da Comissão."],"nt":[]},{"id":"ri:135","n":"135","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["O relatório será assinado primeiramente por quem o redigiu e, em seguida, pelos demais membros da Comissão.","Parágrafo único. Poderá o membro da Comissão exarar voto em separado, nos termos do §3º do Art. 109 deste Regimento."],"nt":[]},{"id":"ri:136","n":"136","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["Elaborado e assinado o relatório final, será protocolado na Secretaria da Câmara, para ser lido em Plenário, na fase do Expediente da primeira sessão ordinária subsequente."],"nt":[]},{"id":"ri:137","n":"137","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["A Secretaria da Câmara deverá fornecer cópia do Relatório Final da Comissão Especial de Inquérito ao Vereador que a solicitar, independentemente de requerimento."],"nt":[]},{"id":"ri:138","n":"138","tag":"","b":"D","h":["TÍTULO IV — DAS COMISSÕES","CAPÍTULO III — Das Comissões Temporárias","Seção V — Das Comissões Especiais de Inquérito"],"t":["O Relatório Final deverá ser apreciado pelo Plenário, que deverá ter aprovação por 2/3 (dois terços), cabendo ao Presidente da Câmara dar-lhe encaminhamento de acordo com as recomendações nele propostas."],"nt":["A CF não exige quórum qualificado para as conclusões de CPI; ver comentários no Bloco D."]},{"id":"ri:139","n":"139","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção I — Disposições Preliminares"],"t":["As sessões da Câmara serão:","I – ordinárias;","II – extraordinárias;","III – solenes."],"nt":[]},{"id":"ri:140","n":"140","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção I — Disposições Preliminares"],"t":["As sessões serão públicas, transmitidas pelos canais institucionais dos quais o Poder Legislativo dispuser."],"nt":[]},{"id":"ri:141","n":"141","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção I — Disposições Preliminares"],"t":["As sessões ordinárias e extraordinárias somente poderão ser abertas com a presença de, no mínimo, 1/3 (um terço) dos membros da Câmara, constatada por meio de chamada nominal."],"nt":[]},{"id":"ri:142","n":"142","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção I — Disposições Preliminares"],"t":["Em sessão plenária cuja abertura e prosseguimento dependa de quórum, este poderá ser constatado por meio de registro em painel eletrônico ou por meio de verificação de presença feita de oficio pelo Presidente ou a pedido de qualquer Vereador."],"nt":[]},{"id":"ri:143","n":"143","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção I — Disposições Preliminares"],"t":["Declarando aberta a sessão, o Presidente proferirá as seguintes palavras: \"Declaro os trabalhos abertos em nome de Deus e da Lei\"."],"nt":[]},{"id":"ri:144","n":"144","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção II — Da Duração e Prorrogação das Sessões"],"t":["As sessões da Câmara terão duração por tempo indeterminado, independentemente de prorrogação, até que se ultime toda a matéria constante na pauta, incluindo os Expedientes, Ordem do Dia e Explicação Pessoal."],"nt":[]},{"id":"ri:145","n":"145","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção III — Da Suspensão e Encerramento das Sessões"],"t":["A sessão poderá ser suspensa pelo Presidente:","I – para a preservação da ordem;","II – para permitir, quando for o caso, que a Comissão possa apresentar parecer oral ou escrito;","III – para recepcionar visitantes ilustres.","§ 1º A suspensão da sessão, no caso do inciso II, não poderá exceder 15 (quinze) minutos."],"nt":[]},{"id":"ri:146","n":"146","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção III — Da Suspensão e Encerramento das Sessões"],"t":["A sessão será encerrada antes do previsto nos seguintes casos:","I – por falta de quórum regimental para o prosseguimento dos trabalhos;","II – em caráter excepcional, por motivo de luto nacional, pelo falecimento de autoridade ou alta personalidade ou na ocorrência de calamidade pública em qualquer fase dos trabalhos, mediante solicitação aprovada pelo Plenário;","III – tumulto grave."],"nt":[]},{"id":"ri:147","n":"147","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção IV — Da Publicidade das Sessões"],"t":["Será dada ampla publicidade às sessões da Câmara, facilitando-se, para isso, o trabalho da imprensa."],"nt":[]},{"id":"ri:148","n":"148","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção IV — Da Publicidade das Sessões"],"t":["As sessões da Câmara serão transmitidas, de forma obrigatória, por meios oficiais de comunicação, ainda que digitais, incluindo intemet e redes sociais, e, se couber, por emissoras locais ou próprias, a fim de garantir a máxima publicidade e transparência dos trabalhos."],"nt":[]},{"id":"ri:149","n":"149","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção V — Das Atas das Sessões"],"t":["De cada sessão ordinária, extraordinária ou audiência pública da Câmara Municipal será produzida a ata dos trabalhos, que conterá resumidamente os assuntos tratados, a qual deverá ser publicada em página institucional oficial da Câmara Municipal de Mossoró.","§ 1º As proposições apresentadas e deliberadas em sessão serão indicadas apenas pela numeração do objeto a que se referirem, salvo requerimento de transcrição integral, aprovado pelo Plenário.","§ 2º A transcrição de declaração de voto, feita resumidamente, quando por escrito, deve ser requerida ao Presidente.","§ 30 Será dado conhecimento da ata da sessão anterior na fase do Expediente da sessão subsequente.","§ 4º A ata poderá ser impugnada, quando for totalmente inválida, por não descrever os fatos e situações realmente ocorridos mediante requerimento de invalidação.","§ 5º Poderá ser requerida a retificação da ata, quando nela houver omissão ou equívoco parcial.","§ 6º Feita a impugnação ou solicitada a retificação da ata, o Plenário deliberará a respeito.","§ 7º Aceita a impugnação, lavrar-se-á nova ata; aprovada a retificação, ela será incluída na ata da sessão em que ocorrer sua votação.","§ 8º Os pedidos de impugnação e/ou retificação de que trata este artigo só poderão ser feitos durante a sessão ordinária em que se der conhecimento da ata, conforme §3º.","§ 9º Não havendo pedidos de impugnação e/ou retificação, considerar-se-á aprovada a ata da qual foi dado conhecimento em plenário."],"nt":[]},{"id":"ri:150","n":"150","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção V — Das Atas das Sessões"],"t":["A ata da última sessão de cada legislatura será redigida e submetida à aprovação do Plenário, independentemente de quórum, antes de encerrada a sessão."],"nt":[]},{"id":"ri:151","n":"151","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção I — Disposições Preliminares"],"t":["As sessões ordinárias serão realizadas às terças e quartas-feiras, com inicio às 9h00."],"nt":[]},{"id":"ri:152","n":"152","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção I — Disposições Preliminares"],"t":["As sessões ordinárias compõem-se de três partes:","I – Expedientes;","II – Ordem do Dia;","III – Explicação Pessoal."],"nt":[]},{"id":"ri:153","n":"153","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção I — Disposições Preliminares"],"t":["O Presidente declarará aberta a sessão à hora prevista para o inicio dos trabalhos após constatação do comparecimento de no mínimo 1/3 (um terço) dos membros da Câmara, feita pelo 1º Secretário.","§ 1º Não havendo número regimental para a instalação, o Presidente aguardará 15 (quinze) minutos, após o que declarará prejudicada a sessão, lavrando-se ata resumida do ocorrido, que independerá de aprovação.","§ 2º Instalada a sessão, mas não constatada a presença da maioria absoluta dos Vereadores, após a leitura da ata da sessão anterior e da pauta da ordem do dia, passar-se-á à fase destinada ao uso da Tribuna.","§ 3º Quando a sessão for encerrada ou prejudicada por falta de quórum, ficam mantidas as inscrições dos oradores do Pequeno e Grande Expediente para a sessão seguinte.","§ 4º Não havendo oradores inscritos na Tribuna, antecipar-se-á o inicio da Ordem do Dia, com a respectiva chamada regimental.","§ 5º Persistindo a falta da maioria absoluta dos Vereadores na fase da Ordem do Dia e observado o prazo de tolerância de 15 (quinze) minutos, o Presidente declarará encerrada a sessão, lavrando-se ata do ocorrido, que independerá de aprovação.","§ 6º As matérias constantes da Ordem do Dia que não forem votadas em virtude da ausência da maioria absoluta dos Vereadores passarão à pauta da sessão ordinária seguinte.","§ 70 A verificação de presença poderá ocorrer em qualquer fase da sessão, a requerimento de Vereador ou por iniciativa do Presidente e sempre será feita nominalmente, constando da ata os nomes dos ausentes.","§ 8º A sessão legislativa não será interrompida sem aprovação dos projetos de lei de diretrizes orçamentárias, do projeto de plano plurianual e do projeto de orçamento anual."],"nt":[]},{"id":"ri:154","n":"154","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["O Expediente destina-se à leitura da ata da sessão anterior, da pauta da ordem do dia, das matérias recebidas e expedidas e ao uso da Tribuna."],"nt":[]},{"id":"ri:155","n":"155","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["Instalada a sessão e inaugurada a fase do Expediente, o Presidente determinará ao 2º Secretário que dê conhecimento sobre a ata da sessão anterior."],"nt":[]},{"id":"ri:156","n":"156","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["Dado conhecimento sobre a ata de sessão anterior, o Presidente determinará ao 1º Secretário a leitura das matérias recebidas e expedidas, devendo ser obedecida a seguinte ordem:","I – documentos recebidos do Prefeito;","II – documentos apresentados pelos Vereadores:","III – documentos recebidos diversos.","§ 1º A pauta da ordem do dia a ser lida deverá obedecer à seguinte ordem:","a) veto;","b) projeto de lei;","c) projeto de decreto legislativo;","d) projeto de resolução;","e) substitutivo;","f) emenda e subemenda;","g) parecer;","h) requerimento;","i) indicação.","§ 2º Dos documentos apresentados no Expediente, serão fornecidas cópias digitais quando solicitadas pelos interessados.","§ 3º A ordem estabelecida neste artigo é taxativa, não sendo permitida a leitura de papéis ou proposições fora do respectivo grupo ou fora da ordem cronológica de apresentação, vedando-se, igualmente, qualquer pedido de preferência neste sentido."],"nt":[]},{"id":"ri:157","n":"157","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["Terminada a leitura das matérias mencionadas no artigo anterior, o Presidente dará início ao uso da Tribuna, que seguirá a seguinte ordem:","I – Discurso dos cidadãos inscritos na Tribuna Popular;","II – Discurso dos parlamentares inscritos para uso do Pequeno Expediente;","III – Discurso dos parlamentares inscritos para uso do Grande Expediente."],"nt":[]},{"id":"ri:158","n":"158","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["A Tribuna Popular será destinada a qualquer cidadão que, tendo se inscrito na forma que dispuser este artigo, possa fazer uso da tribuna para discursar por até 10 minutos, sem apartes.","§ 1º O cidadão que desejar utilizar o espaço destinado à Tribuna Popular deverá ser eleitor em Mossoró, representante de organizações não governamentais, entidades sociais e sindicais, conselhos populares e partidos políticos..","§ 2º Para fazer uso da Tribuna Popular, o cidadão interessado deverá apresentar requerimento escrito à Presidência da Câmara, entregue com antecedência mínima de três dias da data requerida, informando dados pessoais, o segmento ou o organismo da sociedade civil que representa e o assunto a ser tratado.","§ 3º O requerimento para uso da Tribuna Popular deverá ser subscrito por, no mínimo, dez outros cidadãos, eleitores em Mossoró, devidamente qualificados.","§ 4º O cidadão inscrito terá o direito de utilizar a Tribuna Popular uma vez por ano legislativo, na seguinte ordem de prioridade:","I – aquele que ainda não tenha feito uso da Tribuna Popular;","II – aquele que tenha feito uso da Tribuna há mais tempo;","III – o primeiro a inscrever-se, segundo data e o horário de entrega da solicitação no ato do protocolo na Câmara.","§ 5º Após a manifestação do inscrito, será garantido tempo de 02 (dois) minutos para manifestação de um representante de cada Bancada, a propósito do tema abordado na Tribuna Popular.","§ 6º O uso da palavra na Tribuna Popular deverá obedecer aos princípios éticos e morais aplicáveis aos Vereadores desta Câmara, vedando-se o uso de expressões chulas e caluniosas, contra a moral e os bons costumes ou ofensivas a outrem, sendo o orador responsável por todo e qualquer conteúdo expresso por intermédio de sua fala.","§ 7º A Mesa Diretora conduzirá os trabalhos da Tribuna Popular, dando e retirando a palavra, se assim o for exigido, ou tomando qualquer medida que se fizer necessária para o bom andamento dos trabalhos."],"nt":[]},{"id":"ri:159","n":"159","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["As inscrições dos oradores para o uso da Tribuna no Pequeno e Grande Expediente serão feitas em registro próprio, sob a fiscalização do 1º secretário.","§ 1º O Vereador que, inscrito para falar na Tribuna, não se achar presente na hora que lhe for dada a palavra perderá a vez e só poderá ser de novo inscrito em último lugar na lista organizada.","§ 2º O Vereador inscrito no Pequeno Expediente terá direito a 5 (cinco) minutos, sem apartes.","§ 3º O Vereador inscrito no Grande Expediente terá direito a 10 (dez) minutos corridos, podendo conceder apartes de até 1 (um) minuto."],"nt":[]},{"id":"ri:160","n":"160","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção II — Do Expediente"],"t":["Findo o Expediente, o Presidente determinará ao 1º Secretário a verificação de quórum para que se possa iniciar a Ordem do Dia."],"nt":[]},{"id":"ri:161","n":"161","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["Ordem do Dia é a fase da sessão durante a qual serão discutidas e deliberadas as matérias previamente organizadas em pauta.","§ 1º A Ordem do Dia somente será iniciada com a presença da maioria absoluta dos Vereadores.","§ 2º Não havendo número legal, a sessão será encerrada nos termos do Art. 146 deste Regimento."],"nt":[]},{"id":"ri:162","n":"162","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["A pauta da Ordem do Dia, que deverá ser organizada 24 horas antes da sessão de acordo com deliberação da Presidência, obedecerá à seguinte disposição:","a) veto;","b) matéria em Redação Final;","c) matéria em 2ª Discussão e Votação;","d) matéria em 1ª Discussão e Votação;","e) matéria em Discussão e Votação única;","f) Indicações.","§ 1º Obedecida essa classificação, as matérias figurarão, ainda, segundo a ordem cronológica de antiguidade.","§ 2º Por sessão ordinária, cada vereador poderá apresentar até 5 (cinco) proposições para constarem na pauta da Ordem do Dia.","§ 3º A disposição das matérias na Ordem do Dia só poderá ser interrompida ou alterada por requerimento de Urgência Especial, de Preferência ou de Adiamento, apresentados no início ou no transcorrer da sessão ordinária e aprovados pelo Plenário.","§ 4º Caso haja matérias na pauta da Ordem do Dia apresentadas por Vereador ausente à sessão, cabe ao Presidente a decisão sobre retirada da matéria da pauta da Ordem do Dia.","§ 4º A Secretaria Legislativa encaminhará aos Vereadores e Vereadoras a pauta da Ordem do Dia da sessão até 24 (vinte e quatro) horas antes do início da sessão."],"nt":["O texto publicado tem dois §§ 4º."]},{"id":"ri:163","n":"163","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["Nenhuma proposição poderá ser colocada em discussão e votação sem que tenha sido incluída na Ordem do Dia, ressalvados os casos de urgência especial e os demais previstos neste Regimento."],"nt":[]},{"id":"ri:164","n":"164","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["Não serão admitidas a discussão e votação de projetos sem prévia manifestação das Comissões, ainda que para isso o parecer seja proferido oralmente, considerando os casos expressamente previstos neste Regimento."],"nt":[]},{"id":"ri:165","n":"165","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["O Presidente anunciará o item da pauta que se tenha de discutir e votar, determinando ao 1º Secretário que proceda à sua leitura.","Parágrafo único. A leitura de determinada matéria ou de todas as constantes da Ordem do Dia poderá ser dispensada a requerimento de qualquer Vereador, aprovado pelo Plenário."],"nt":[]},{"id":"ri:166","n":"166","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["As proposições constantes da Ordem do Dia poderão ser objeto de:","I – preferência para votação;","II – adiamento;","III – retirada da pauta.","§ 1º Se houver uma ou mais proposições constituindo processos distintos, anexadas à proposição que se encontra em pauta, a preferência para votação de uma delas dar-se-á mediante requerimento verbal ou escrito de qualquer Vereador, com assentimento do Plenário.","§ 2º O requerimento de preferência será votado sem discussão, não se admitindo encaminhamento de votação nem declaração de voto.","§ 3º Votada uma proposição, todas as demais tratando do mesmo assunto, ainda que não anexadas a ela, serão consideradas prejudicadas e remetidas ao arquivo."],"nt":[]},{"id":"ri:167","n":"167","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["O adiamento de discussão ou de votação de proposição poderá, ressalvado o disposto no §4º deste artigo, ser formulado em qualquer fase de sua apreciação em Plenário, por meio de requerimento oral ou escrito de qualquer Vereador, que deverá especificar a finalidade e o número de sessões do adiamento proposto.","§ 1º O requerimento de adiamento é prejudicial à continuação da discussão ou votação de matéria a que se refira até que o Plenário delibere sobre ele.","§ 2º Quando houver orador na Tribuna discutindo a matéria ou encaminhando sua votação, o requerimento de adiamento só poderá ser proposto por ele.","§ 3º Apresentado um requerimento de adiamento, outros poderão ser formulados, antes de se proceder à votação, que se fará rigorosamente pela ordem de apresentação dos requerimentos, não se admitindo, nesse caso, pedidos de preferência.","§ 4º O adiamento da votação de qualquer matéria será admitido desde que não tenha sido ainda votado nenhum parecer, proposição acessória ou matéria anexa ao projeto.","§ 5º A aprovação de um requerimento de adiamento prejudica os demais.","§ 6º Rejeitados todos os requerimentos formulados nos termos do §3º, não se admitirão novos pedidos de adiamento com a mesma finalidade.","§ 7º O adiamento de discussão ou de votação por determinado número de sessões importará sempre no adiamento da discussão ou da votação da matéria por igual número de sessões ordinárias.","§ 8º Não serão admitidos pedidos de adiamento da votação de requerimento de adiamento.","§ 9º Os requerimentos de adiamento não comportarão discussão, encaminhamento de votação nem declaração de voto."],"nt":[]},{"id":"ri:168","n":"168","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["A retirada definitiva para arquivamento de proposição que esteja prevista para deliberação na Ordem do Dia dar-se-á:","I – por solicitação de seu autor, quando o parecer da Comissão de Constituição, Justiça e Redação tenha concluído pela inconstitucionalidade ou ilegalidade ou quando a proposição não tenha parecer favorável de comissão de mérito;","II – por requerimento do autor, sujeito à deliberação do Plenário, sem discussão, encaminhamento de votação e declaração de voto, quando a proposição tenha parecer favorável, mesmo que de apenas uma das comissões de mérito que sobre ela se manifestaram.","Parágrafo único. Obedecido o disposto no presente artigo, as proposições de a
