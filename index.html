cial' são marcas da LOM."],"a":["lom:1º"],"src":"Questão inédita"},{"id":"mc-lom-2","lei":"lom","tp":"mc","b":"A","e":"Quanto aos símbolos e à publicidade do Município, a Lei Orgânica estabelece que","o":["o Executivo somente poderá usar em peças publicitárias o brasão e, como slogan, a frase 'Prefeitura Municipal de Mossoró'.","os símbolos do Município são apenas a Bandeira e o Hino.","o Executivo pode adotar livremente marca de gestão a cada mandato.","é permitida a fixação da imagem do Prefeito nas repartições, desde que sem fins eleitorais.","outros símbolos podem ser criados por decreto do Prefeito."],"c":0,"k":["📌 Art. 7º, §§ 1º a 3º, da LOM","► Símbolos: Bandeira, Hino e Brasão; outros, só por lei.","► Publicidade: brasão + slogan 'Prefeitura Municipal de Mossoró'.","► Vedada a fixação de imagem do Chefe de Poder (Executivo ou Legislativo) nas repartições."],"a":["lom:7º"],"src":"Questão inédita"},{"id":"mc-lom-3","lei":"lom","tp":"mc","b":"A","e":"A criação de distrito no Município de Mossoró","o":["exige, no povoado-sede, ao menos cem moradias e posto policial.","depende de lei, após consulta plebiscitária às populações diretamente interessadas, exigindo-se, no povoado-sede, ao menos cinquenta moradias, escola pública e unidade de saúde.","depende apenas de decreto do Prefeito.","exige população, eleitorado e arrecadação não inferiores à metade dos exigidos para criar Município.","depende de lei, dispensada a consulta popular."],"c":1,"k":["📌 Arts. 11 e 12 da LOM","► Lei + consulta plebiscitária prévia.","► Requisitos: população, eleitorado e arrecadação ≥ 1/6 do exigido para criar Município; 50 moradias, escola pública e unidade de saúde no povoado-sede.","► Criação de distritos exige maioria qualificada no Regimento (art. 54, § 2º, VII)."],"a":["lom:11","lom:12"],"src":"Questão inédita"},{"id":"mc-lom-4","lei":"lom","tp":"mc","b":"A","e":"É vedado ao Município de Mossoró, nos termos da Lei Orgânica,","o":["conceder títulos de cidadão honorário.","denominar com nomes de pessoas vivas vias, logradouros ou bens públicos.","manter colaboração de interesse público com entidades religiosas, na forma da lei.","criar distritos administrativos.","divulgar atos oficiais na internet."],"c":1,"k":["📌 Art. 16, V, da LOM","► Vedações: cultos/igrejas (ressalvada a colaboração de interesse público), recusar fé a documento público, distinções arbitrárias, propaganda político-partidária com recursos públicos, nomes de pessoas vivas em vias e bens públicos.","⚠️ A colaboração de interesse público com entidades religiosas é ressalva, não vedação."],"a":["lom:16"],"src":"Questão inédita"},{"id":"mc-lom-5","lei":"lom","tp":"mc","b":"B","e":"Segundo a Lei Orgânica, o prazo de validade do concurso público é de","o":["até dois anos, prorrogável duas vezes.","até um ano, prorrogável uma vez por igual período.","dois anos, improrrogável.","até quatro anos, sem prorrogação.","até dois anos, prorrogável uma vez por igual período."],"c":4,"k":["📌 Art. 17, III, da LOM (simetria com o art. 37, III, da CF)","► Até 2 anos, prorrogável uma vez por igual período.","► Aprovado dentro do prazo improrrogável do edital tem prioridade sobre novos concursados (inciso IV)."],"a":["lom:17"],"src":"Questão inédita"},{"id":"mc-lom-6","lei":"lom","tp":"mc","b":"B","e":"É direito do servidor público municipal assegurado na Lei Orgânica:","o":["licença à gestante de cento e vinte dias.","remuneração do serviço extraordinário superior, no mínimo, em 30% à do normal.","licença especial de três meses após cada cinco anos de efetivo exercício.","licença especial de seis meses a cada dez anos de efetivo exercício.","férias anuais com metade a mais da remuneração."],"c":2,"k":["📌 Art. 23 da LOM","► Licença especial: 3 meses a cada 5 anos (XIII). Hora extra: +50% no mínimo (VII). Férias: +1/3 (VIII). Licença à gestante: 180 dias (IX).","⚠️ A LOM fala em 180 dias de licença à gestante, não 120."],"a":["lom:23"],"src":"Questão inédita"},{"id":"mc-lom-7","lei":"lom","tp":"mc","b":"C","e":"A Câmara Municipal de Mossoró é composta por","o":["23 vereadores","15 vereadores","21 vereadores","19 vereadores","25 vereadores"],"c":0,"k":["📌 Art. 28 da LOM (Emenda 10/2020)","► 23 vereadores; legislatura de 4 anos, cada ano uma sessão legislativa.","► O número é fixado pela Lei Orgânica, dentro do limite do art. 29, IV, da CF (art. 29, § 3º)."],"a":["lom:28","lom:29"],"src":"Questão inédita"},{"id":"mc-lom-8","lei":"lom","tp":"mc","b":"C","e":"A Câmara Municipal de Mossoró reúne-se anual e ordinariamente","o":["de 2 de fevereiro a 17 de julho e de 1º de agosto a 22 de dezembro.","de 1º de fevereiro a 18 de julho e de 1º de agosto a 23 de dezembro.","de 15 de fevereiro a 30 de junho e de 1º de agosto a 15 de dezembro.","de 1º de fevereiro a 31 de julho e de 15 de agosto a 23 de dezembro.","de 1º de março a 30 de junho e de 1º de agosto a 15 de dezembro."],"c":1,"k":["📌 Art. 30 da LOM (Emenda 09/2019)","► Períodos: 1º/02 a 18/07 e 1º/08 a 23/12.","► Reunião inaugural em sábado, domingo ou feriado é transferida para o primeiro dia útil seguinte (§ 1º).","► A sessão legislativa não se interrompe sem deliberar sobre o projeto de lei orçamentária (art. 32)."],"a":["lom:30"],"src":"Questão inédita"},{"id":"mc-lom-9","lei":"lom","tp":"mc","b":"C","e":"As sessões da Câmara Municipal de Mossoró são públicas, salvo deliberação em contrário","o":["de um terço dos vereadores.","da maioria absoluta dos vereadores.","da Mesa Diretora.","do Presidente da Câmara, em caso de tumulto.","de dois terços dos vereadores, adotada em razão de motivo relevante."],"c":4,"k":["📌 Art. 34 da LOM","► Sessão secreta: 2/3 dos vereadores + motivo relevante."],"a":["lom:34"],"src":"Questão inédita"},{"id":"mc-lom-10","lei":"lom","tp":"mc","b":"C","e":"É competência exclusiva da Câmara Municipal, segundo a Lei Orgânica,","o":["solicitar intervenção do Estado no Município por maioria absoluta.","encaminhar pedidos de informação a secretários, para atendimento em quinze dias.","fixar o subsídio dos Vereadores até 60 dias antes das eleições para a nova legislatura.","conceder título de cidadão honorário por dois terços dos membros.","autorizar o Prefeito a ausentar-se do Município quando a ausência exceder oito dias."],"c":2,"k":["📌 Art. 37 da LOM","► Ausência do Prefeito: autorização quando exceder 15 dias (VI).","► Pedidos de informação: atendimento em 30 dias (XV).","► Subsídio dos Vereadores: até 60 dias antes da eleição (XXIII).","► Intervenção: 2/3 (XX). Título de cidadão honorário: maioria dos membros (XIX)."],"a":["lom:37"],"src":"Questão inédita"},{"id":"mc-lom-11","lei":"lom","tp":"mc","b":"C","e":"No julgamento das contas do Prefeito, a Lei Orgânica determina que","o":["o parecer prévio do Tribunal de Contas é vinculante e não pode ser afastado.","não deliberando a Câmara em 60 dias, prevalece automaticamente o parecer.","o julgamento deve ocorrer em até 60 dias do recebimento do parecer, vedado o julgamento ficto, e o parecer só deixa de prevalecer por 2/3 dos membros.","as contas ficam à disposição apenas dos vereadores.","o parecer só deixa de prevalecer por maioria absoluta."],"c":2,"k":["📌 Art. 37, VIII, e art. 65, §§ 2º a 4º, da LOM","► 60 dias; vedado o julgamento ficto (o Legislativo tem de deliberar); 2/3 para afastar o parecer.","► Contas à disposição de qualquer contribuinte durante o prazo.","⚠️ 'Prevalece automaticamente' = julgamento ficto = vedado."],"a":["lom:37","lom:65"],"src":"Questão inédita"},{"id":"mc-lom-12","lei":"lom","tp":"mc","b":"C","e":"Sobre a Comissão Representativa, a Lei Orgânica prevê que","o":["funciona durante as sessões legislativas ordinárias.","é constituída por número ímpar de Vereadores, reúne-se ordinariamente uma vez por semana e pode autorizar o Prefeito a ausentar-se por mais de quinze dias.","não pode convocar extraordinariamente a Câmara.","é presidida pelo Vereador mais idoso.","é composta por número par de Vereadores."],"c":1,"k":["📌 Art. 38 da LOM","► Eleita ao fim de cada sessão legislativa; funciona nos interregnos; número ímpar; reunião semanal.","► Pode convocar extraordinariamente a Câmara (V) e autorizar ausência do Prefeito por mais de 15 dias (IV).","► No Regimento (art. 345), o Presidente da Câmara é o seu presidente nato."],"a":["lom:38"],"src":"Questão inédita"},{"id":"mc-lom-13","lei":"lom","tp":"mc","b":"C","e":"Nos termos da Lei Orgânica, a perda do mandato do Vereador que deixar de comparecer à terça parte das sessões ordinárias da sessão legislativa será","o":["automática, sem direito de defesa.","decidida pelo Plenário, por maioria absoluta.","declarada pela Mesa, de ofício ou mediante provocação, assegurada ampla defesa.","decretada pela Justiça Eleitoral.","decidida pelo Plenário, por 2/3."],"c":2,"k":["📌 Art. 41, IV e § 3º, da LOM","► Incisos I, II e VIII (proibições, decoro, condenação criminal) → maioria absoluta do Plenário (§ 2º).","► Incisos IV, V e VII (faltas, domicílio, Justiça Eleitoral) → declarada pela Mesa (§ 3º).","⚠️ O Regimento (arts. 320 e 321) atribui ao Presidente declarar a extinção e conta 1/3 das sessões ordinárias e extraordinárias."],"a":["lom:41"],"src":"Questão inédita"},{"id":"mc-lom-14","lei":"lom","tp":"mc","b":"C","e":"Ocorrendo vaga de Vereador e não havendo suplente, o Presidente da Câmara comunicará o fato à Justiça Eleitoral dentro de","o":["5 dias","15 dias","24 horas","10 dias","48 horas"],"c":4,"k":["📌 Art. 43 da LOM","► Suplente convocado: posse em 15 dias, prorrogáveis por igual período com justo motivo.","► Sem suplente: comunicação em 48 horas à Justiça Eleitoral; o quórum é calculado sobre os remanescentes."],"a":["lom:43"],"src":"Questão inédita"},{"id":"mc-lom-15","lei":"lom","tp":"mc","b":"C","e":"Segundo a Lei Orgânica, a Mesa da Câmara compõe-se","o":["do Presidente e de dois Secretários.","do Presidente, de um Vice-Presidente e de dois Secretários.","do Presidente, do 1º e do 2º Vice-Presidentes e do 1º ao 4º Secretários, que se substituem nessa ordem.","do Presidente e de quatro Secretários.","de cinco membros eleitos pela maioria absoluta."],"c":2,"k":["📌 Art. 46 da LOM","► Sete cargos: Presidente, 1º e 2º Vice, 1º, 2º, 3º e 4º Secretários.","► Destituição de membro da Mesa: 2/3 (§ 3º). Na ausência da Mesa, assume o mais idoso (empate: o mais votado).","⚠️ O Regimento (art. 15) considera membros efetivos só o Presidente e o 1º e 2º Secretários."],"a":["lom:46"],"src":"Questão inédita"},{"id":"mc-lom-16","lei":"lom","tp":"mc","b":"C","e":"Compete ao Presidente da Câmara apresentar ao Plenário o balancete relativo aos recursos recebidos e às despesas realizadas no mês anterior até o dia","o":["5 de cada mês","20 de cada mês","último dia útil de cada mês","10 de cada mês","15 de cada mês"],"c":1,"k":["📌 Art. 52, VIII, da LOM","► Balancete até o dia 20.","► Coincidência útil: os duodécimos da Câmara são entregues até o dia 20 de cada mês (art. 158)."],"a":["lom:52"],"src":"Questão inédita"},{"id":"mc-lom-17","lei":"lom","tp":"mc","b":"D","e":"O processo legislativo municipal, segundo a Lei Orgânica de Mossoró, compreende a elaboração de","o":["emendas à Lei Orgânica, leis complementares, leis ordinárias e resoluções, apenas.","leis ordinárias, decretos e portarias.","emendas, leis e regulamentos autônomos.","emendas à Lei Orgânica, leis complementares, leis ordinárias, leis delegadas, medidas provisórias, decretos legislativos e resoluções.","leis ordinárias, leis complementares e decretos executivos."],"c":3,"k":["📌 Art. 53 da LOM","► Sete espécies, inclusive leis delegadas e medidas provisórias (simetria com o art. 59 da CF).","► MP municipal: só em calamidade pública, para crédito extraordinário (art. 62)."],"a":["lom:53"],"src":"Questão inédita"},{"id":"mc-lom-18","lei":"lom","tp":"mc","b":"D","e":"A Lei Orgânica de Mossoró poderá ser emendada mediante proposta","o":["de um terço, no mínimo, dos membros da Câmara, do Prefeito ou de iniciativa popular, votada em dois turnos com interstício mínimo de dez dias e aprovada por dois terços.","de qualquer Vereador, votada em turno único.","da maioria absoluta da Câmara, votada em dois turnos com interstício de cinco dias.","exclusivamente do Prefeito.","de um terço dos Vereadores, sendo promulgada pelo Prefeito."],"c":0,"k":["📌 Art. 54 da LOM","► Iniciativa: 1/3 dos Vereadores, Prefeito, iniciativa popular.","► Dois turnos, interstício de 10 dias, 2/3; promulgação pela Mesa da Câmara.","► Vedada emenda na vigência de estado de sítio ou de intervenção no Município."],"a":["lom:54"],"src":"Questão inédita"},{"id":"mc-lom-19","lei":"lom","tp":"mc","b":"D","e":"NÃO é matéria de lei complementar, conforme o rol da Lei Orgânica,","o":["o Código Tributário do Município.","a lei de criação de cargos, funções ou empregos públicos.","o Código de Posturas.","a Lei de Diretrizes Orçamentárias.","a lei que institua o Plano Diretor."],"c":3,"k":["📌 Art. 56, parágrafo único, da LOM","► LC (maioria absoluta): Código Tributário, de Obras, de Posturas, regime jurídico único, Código urbanístico, de zoneamento, guarda municipal, criação de cargos, Plano Diretor, parcelamento do solo.","► A LDO não está no rol (mas exige maioria absoluta pelo Regimento, art. 54, § 1º, X)."],"a":["lom:56"],"src":"Questão inédita"},{"id":"mc-lom-20","lei":"lom","tp":"mc","b":"D","e":"É de iniciativa exclusiva do Prefeito a lei que disponha sobre","o":["fixação do subsídio dos Vereadores.","organização dos serviços administrativos da Câmara.","criação, estruturação e atribuições das Secretarias e órgãos da Administração Pública.","concessão de título de cidadão honorário.","abertura de créditos com aproveitamento das consignações orçamentárias da Câmara."],"c":2,"k":["📌 Arts. 57 e 58 da LOM","► Prefeito: cargos da Administração Direta e Autárquica, servidores do Executivo, Secretarias e órgãos, matéria orçamentária.","► Mesa da Câmara: créditos com consignações da Câmara e organização dos serviços da Câmara.","⚠️ Nos projetos de iniciativa exclusiva do Prefeito não se admite aumento de despesa (art. 57, parágrafo único)."],"a":["lom:57","lom:58"],"src":"Questão inédita"},{"id":"mc-lom-21","lei":"lom","tp":"mc","b":"D","e":"Solicitada pelo Prefeito urgência para projeto de sua iniciativa, a Câmara deverá manifestar-se em até","o":["45 dias","60 dias","30 dias","15 dias","10 dias"],"c":2,"k":["📌 Art. 59 da LOM","► 30 dias; esgotado o prazo, o projeto entra na Ordem do Dia sobrestando as demais (exceto MP, vetos e leis orçamentárias).","► O prazo não corre no recesso nem se aplica a projetos de códigos (§ 3º)."],"a":["lom:59"],"src":"Questão inédita"},{"id":"mc-lom-22","lei":"lom","tp":"mc","b":"D","e":"Segundo a Lei Orgânica, o veto será apreciado pelo Plenário","o":["em 15 dias úteis, em dois turnos, rejeitado por 2/3.","em 30 dias úteis, em uma só discussão e votação, considerado rejeitado pelo voto da maioria absoluta dos Vereadores.","em 10 dias úteis, rejeitado por maioria absoluta.","em 45 dias, rejeitado por 2/3.","em 30 dias corridos, rejeitado por maioria simples."],"c":1,"k":["📌 Art. 60, § 4º, da LOM","► Veto: Prefeito tem 15 dias úteis e comunica os motivos em 48 h (§ 1º).","► Apreciação: 30 dias ÚTEIS, discussão e votação únicas, rejeição por maioria absoluta.","⚠️ O Regimento (art. 263, § 6º) fala em '30 dias', sem 'úteis'. Leia o comando da questão!"],"a":["lom:60"],"src":"Questão inédita"},{"id":"mc-lom-23","lei":"lom","tp":"mc","b":"D","e":"Quanto às leis delegadas, a Lei Orgânica estabelece que","o":["são elaboradas pela Mesa da Câmara.","podem tratar de matéria reservada à lei complementar.","dispensam qualquer apreciação posterior.","a delegação ao Prefeito é feita por decreto legislativo, vedada a delegação de atos de competência privativa da Câmara, de matéria de lei complementar e dos planos plurianuais e orçamentos.","a delegação é feita por resolução da Câmara."],"c":3,"k":["📌 Art. 61 da LOM","► Elaboradas pelo Prefeito, que solicita a delegação; forma: decreto legislativo.","► Se o decreto legislativo exigir apreciação, ela é em votação única, vedada emenda (§ 3º)."],"a":["lom:61"],"src":"Questão inédita"},{"id":"mc-lom-24","lei":"lom","tp":"mc","b":"D","e":"A medida provisória municipal","o":["tem prazo de 60 dias, prorrogável por igual período.","pode ser editada em caso de calamidade pública, para abertura de crédito extraordinário, e perde a eficácia desde a edição se não convertida em lei em 30 dias da publicação.","não pode ser editada durante o recesso.","é convertida em lei automaticamente se a Câmara não deliberar.","pode ser editada para qualquer matéria urgente."],"c":1,"k":["📌 Art. 62 da LOM","► Só calamidade pública e crédito extraordinário.","► Câmara em recesso: convocação extraordinária para reunir-se em 5 dias.","► 30 dias para conversão; senão perde a eficácia desde a edição."],"a":["lom:62"],"src":"Questão inédita"},{"id":"mc-lom-25","lei":"lom","tp":"mc","b":"D","e":"A matéria constante de projeto de lei rejeitado somente poderá ser objeto de novo projeto, na mesma sessão legislativa, mediante proposta","o":["de 1/3 dos membros da Câmara","da maioria absoluta dos membros da Câmara","da Mesa Diretora","de qualquer Vereador","de 2/3 dos membros da Câmara"],"c":1,"k":["📌 Art. 64 da LOM (simetria com o art. 67 da CF)","► Reapresentação na mesma sessão legislativa: maioria absoluta.","► O Regimento repete a ideia ao vedar o recebimento de proposição rejeitada ou vetada sem essa subscrição (art. 187, V)."],"a":["lom:64"],"src":"Questão inédita"},{"id":"mc-lom-26","lei":"lom","tp":"mc","b":"E","e":"A idade mínima para Prefeito e Vice-Prefeito exigida pela Lei Orgânica é de","o":["30 anos","18 anos","25 anos","35 anos","21 anos"],"c":4,"k":["📌 Art. 67, parágrafo único, da LOM","► Prefeito e Vice: 21 anos. Vereador: 18 anos (art. 29, § 1º, VI)."],"a":["lom:67"],"src":"Questão inédita"},{"id":"mc-lom-27","lei":"lom","tp":"mc","b":"E","e":"Decorridos determinados dias da data fixada para a posse, se o Prefeito ou o Vice-Prefeito, salvo motivo de força maior, não tiver assumido o cargo, ,"b":"E","e":"Sobre a consulta popular prevista na Lei Orgânica, é correto afirmar:","o":["a proposição é aprovada pela maioria dos votantes, desde que tenha comparecido pelo menos metade dos eleitores envolvidos; são no máximo duas consultas por ano.","exige proposição de 10% do eleitorado.","pode ser realizada mediante proposição de 1/3 dos Vereadores.","pode ser realizada a qualquer tempo, inclusive no período eleitoral.","a votação é organizada pela Câmara em até seis meses."],"c":0,"k":["📌 Art. 95 da LOM","► Proposição: maioria absoluta da Câmara ou 5% do eleitorado.","► Organizada pelo Executivo em 2 meses; aprovação pela maioria dos que comparecerem, com presença mínima de 50%.","► Máximo de 2 por ano; vedada nos 4 meses anteriores às eleições."],"a":["lom:95"],"src":"Questão inédita"},{"id":"mc-lom-32","lei":"lom","tp":"mc","b":"F","e":"A Prefeitura e a Câmara são obrigadas a fornecer certidões de atos, contratos e decisões a qualquer interessado, requeridas para fim de direito determinado, no prazo máximo de","o":["15 dias","5 dias","30 dias","10 dias","48 horas"],"c":0,"k":["📌 Art. 104 da LOM","► 15 dias, sob pena de responsabilidade de quem negar ou retardar.","► Certidão de efetivo exercício do Prefeito: fornecida pelo Presidente da Câmara."],"a":["lom:104"],"src":"Questão inédita"},{"id":"mc-lom-33","lei":"lom","tp":"mc","b":"F","e":"Em relação aos bens imóveis do Município, a Lei Orgânica prevê que","o":["o bem doado nunca reverte ao patrimônio municipal.","a venda de imóvel depende de autorização legislativa por maioria simples.","a venda depende de autorização legislativa aprovada por 2/3, e os donatários de terrenos ficam impedidos de adquirir outros terrenos da municipalidade por cinco anos.","os terrenos doados a entidades filantrópicas terão área livre de, no mínimo, 50% da construção.","o comprador tem prazo de dois anos para iniciar a construção."],"c":2,"k":["📌 Arts. 109 e 112 da LOM","► Venda: autorização por 2/3; comprador tem 1 ano para iniciar e 2 para concluir a construção.","► Doação: área livre ≥ 30%; donatário impedido por 5 anos; descumprida a função social, o bem reverte."],"a":["lom:109","lom:112"],"src":"Questão inédita"},{"id":"mc-lom-34","lei":"lom","tp":"mc","b":"G","e":"A remissão de créditos tributários, segundo a Lei Orgânica,","o":["pode ser concedida por decreto do Prefeito.","somente pode ocorrer em calamidade pública ou notória pobreza do contribuinte, por lei aprovada por 2/3 dos membros da Câmara.","exige lei complementar aprovada por maioria absoluta.","é vedada em qualquer hipótese.","depende de lei aprovada por maioria simples."],"c":1,"k":["📌 Art. 135 da LOM","► Hipóteses: calamidade pública ou notória pobreza; quórum: 2/3.","⚠️ Isenções e anistias exigem maioria absoluta (Regimento, art. 54, § 1º, XV e XVI) — a remissão é mais rígida."],"a":["lom:135"],"src":"Questão inédita"},{"id":"mc-lom-35","lei":"lom","tp":"mc","b":"G","e":"As emendas parlamentares ao projeto de Lei Orçamentária Anual aprovadas pela Câmara de Mossoró observam o limite global de","o":["5% da receita corrente líquida","2,5% da receita corrente líquida","1,2% da receita corrente líquida","2% da receita corrente líquida","1% da receita corrente líquida"],"c":2,"k":["📌 Art. 148-A da LOM","► 1,2% da RCL prevista no projeto; execução obrigatória e isonômica no mesmo percentual da RCL realizada no exercício anterior.","► As emendas são divulgadas em audiências públicas (§ 2º)."],"a":["lom:148-A"],"src":"Questão inédita"},{"id":"mc-lom-36","lei":"lom","tp":"mc","b":"I","e":"A Emenda à Lei Orgânica nº 11/2022 fixou a alíquota de contribuição dos segurados ativos do RPPS municipal em","o":["13%","12%","15%","14%","11%"],"c":3,"k":["📌 EC 11/2022, art. 14","► 14% sobre a totalidade da remuneração de contribuição (EC 103/2019, art. 9º, § 4º).","► Na pensão por morte, a condição de dependente do filho menor se encerra aos 21 anos (art. 12, III)."],"a":["lom:EC-14"],"src":"Questão inédita"},{"id":"mc-lom-37","lei":"lom","tp":"mc","b":"I","e":"Pelas disposições transitórias da Lei Orgânica, a revisão da Lei Orgânica será realizada após","o":["8 anos","5 anos","4 anos","15 anos","10 anos"],"c":4,"k":["📌 ADCT, art. 6º, da LOM","► Revisão após 10 anos da promulgação.","► ADCT, art. 5º: convênio com empresa privada para uso de terrenos públicos exige 2/3."],"a":["lom:ADCT-6º"],"src":"Questão inédita"},{"id":"mc-cmp-1","lei":"cmp","tp":"mc","b":"X","e":"Sobre o prazo de apreciação do veto pela Câmara, comparando a Lei Orgânica e o Regimento Interno, é correto afirmar:","o":["a LOM fixa 15 dias úteis; o Regimento, 30 dias.","ambos fixam 15 dias corridos.","ambos fixam 30 dias úteis.","a LOM fixa 30 dias; o Regimento, 45 dias.","a LOM fixa 30 dias úteis; o Regimento, 30 dias, sem a expressão 'úteis'."],"c":4,"k":["📌 LOM, art. 60, § 4º × Regimento, art. 263, § 6º","► LOM: 30 dias úteis. Regimento: 30 dias (a contar do recebimento), prazo que não corre no recesso.","► Em ambos: rejeição por maioria absoluta.","🔑 Leia o comando: 'segundo a LOM' ou 'segundo o Regimento'."],"a":["lom:60","ri:263"],"src":"Questão inédita"},{"id":"mc-cmp-2","lei":"cmp","tp":"mc","b":"X","e":"A perda (ou extinção) do mandato de Vereador por faltas é tratada de forma distinta. Assinale a correta.","o":["Nenhum dos dois diplomas trata do tema.","Ambos: metade das sessões ordinárias.","LOM: cinco sessões consecutivas; Regimento: dez sessões alternadas.","LOM: terça parte das sessões ordinárias; Regimento: 1/3 ou mais das sessões ordinárias e extraordinárias do ano legislativo.","LOM: 1/3 das extraordinárias; Regimento: 1/3 das ordinárias."],"c":3,"k":["📌 LOM, art. 41, IV × Regimento, art. 320, III","► LOM: terça parte das sessões ordinárias (salvo doença, licença ou missão autorizada), declarada pela Mesa.","► Regimento: 1/3 ou mais das ordinárias E extraordinárias do ano legislativo, declarada pelo Presidente."],"a":["lom:41","ri:320"],"src":"Questão inédita"},{"id":"mc-cmp-3","lei":"cmp","tp":"mc","b":"X","e":"Qua 8/07 | 1º/08 | 23/12 | 1º/02"],"a":["lom:30","ri:344"],"src":"Questão inédita"},{"id":"mc-cmp-6","lei":"cmp","tp":"mc","b":"X","e":"O prazo para posse superveniente de Prefeito e Vice-Prefeito é de","o":["30 dias na LOM e 10 dias no Regimento.","10 dias, tanto na LOM quanto no Regimento.","15 dias, tanto na LOM quanto no Regimento.","5 dias na LOM e 10 dias no Regimento.","10 dias na LOM e 15 dias no Regimento."],"c":1,"k":["📌 LOM, art. 70, parágrafo único × Regimento, art. 7º, II","► Prefeito/Vice: 10 dias nos dois diplomas; vencidos, os cargos são declarados vagos (LOM).","► Vereador: 15 dias (Regimento, art. 7º, I); suplente convocado: 15 dias, prorrogáveis por igual período (LOM, art. 43, § 1º)."],"a":["lom:70","ri:7º"],"src":"Questão inédita"},{"id":"ce-lom-1","lei":"lom","tp":"ce","b":"A","e":"São Poderes do Município de Mossoró, independentes e harmônicos entre si, o Legislativo e o Executivo.","g":true,"k":["📌 Art. 6º, literal."],"a":["lom:6º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-2","lei":"lom","tp":"ce","b":"A","e":"A Lei Orgânica permite a fixação de imagem do Prefeito nas repartições públicas municipais, desde que sem fins eleitorais.","g":false,"k":["📌 Art. 7º, § 3º: é vedada a fixação de imagem do Chefe de Poder, executivo ou legislativo, nas repartições públicas municipais."],"a":["lom:7º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-3","lei":"lom","tp":"ce","b":"A","e":"A criação, a organização, a supressão ou a fusão de distritos dependem de lei, dispensada a consulta às populações interessadas.","g":false,"k":["📌 Art. 11: dependem de lei, após a consulta plebiscitária às populações diretamente interessadas."],"a":["lom:11"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-4","lei":"lom","tp":"ce","b":"A","e":"Entre os requisitos para criar distrito está a existência, no povoado-sede, de pelo menos cinquenta moradias, escola pública e unidade de saúde.","g":true,"k":["📌 Art. 12, II."],"a":["lom:12"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-5","lei":"lom","tp":"ce","b":"B","e":"O prazo de validade do concurso público municipal é de até dois anos, prorrogável duas vezes por igual período.","g":false,"k":["📌 Art. 17, III: prorrogável uma vez, por igual período."],"a":["lom:17"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-6","lei":"lom","tp":"ce","b":"B","e":"O texto compilado da Lei Orgânica admite, com compatibilidade de horários, a acumulação de um cargo de professor com outro técnico ou científico; segundo a nota do professor, a EC 138/2025 ampliou a hipótese na Constituição Federal.","g":true,"k":["📌 Art. 17, XVI, b, e a nota “Divergência de hierarquia” deste caderno."],"a":["lom:17"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-7","lei":"lom","tp":"ce","b":"B","e":"A Lei Orgânica assegura ao servidor licença especial de três meses após cada cinco anos de efetivo exercício.","g":true,"k":["📌 Art. 23, XIII."],"a":["lom:23"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-8","lei":"lom","tp":"ce","b":"B","e":"Os benefícios previdenciários a cargo do RPPS municipal incluem aposentadorias, pensão por morte e auxílio-doença.","g":false,"k":["📌 Art. 19, § 1º: restringem-se a aposentadorias e pensão por morte; o § 5º exclui o auxílio-doença do rol de benefícios previdenciários."],"a":["lom:19"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-9","lei":"lom","tp":"ce","b":"C","e":"A Câmara Municipal de Mossoró é composta por 23 vereadores, conforme a Emenda à Lei Orgânica nº 10/2020.","g":true,"k":["📌 Art. 28."],"a":["lom:28"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-10","lei":"lom","tp":"ce","b":"C","e":"As sessões da Câmara são públicas, salvo deliberação em contrário da maioria absoluta dos vereadores.","g":false,"k":["📌 Art. 34: a exceção exige dois terços (2/3) dos vereadores, adotada em razão de motivo relevante."],"a":["lom:34"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-11","lei":"lom","tp":"ce","b":"C","e":"Ocorrendo vaga e não havendo suplente, o Presidente da Câmara comunicará o fato à Justiça Eleitoral dentro de 48 horas.","g":true,"k":["📌 Art. 43, § 2º."],"a":["lom:43"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-12","lei":"lom","tp":"ce","b":"C","e":"Os Vereadores são invioláveis por suas opiniões, palavras e votos em qualquer parte do território nacional.","g":false,"k":["📌 Art. 39: a inviolabilidade vale no exercício do mandato e na circunscrição do Município."],"a":["lom:39"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-13","lei":"lom","tp":"ce","b":"C","e":"Membro da Mesa faltoso, omisso ou ineficiente pode ser destituído pelo voto de dois terços dos membros da Câmara.","g":true,"k":["📌 Art. 46, § 3º."],"a":["lom:46"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-14","lei":"lom","tp":"ce","b":"D","e":"A proposta de emenda à Lei Orgânica é votada em dois turnos, com interstício mínimo de cinco dias, e aprovada por maioria absoluta.","g":false,"k":["📌 Art. 54, § 1º: interstício mínimo de dez dias e aprovação por dois terços dos membros da Câmara."],"a":["lom:54"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-15","lei":"lom","tp":"ce","b":"D","e":"A Lei Orgânica pode ser emendada mediante proposta de um terço, no mínimo, dos membros da Câmara, do Prefeito ou de iniciativa popular.","g":true,"k":["📌 Art. 54, I a III."],"a":["lom:54"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-16","lei":"lom","tp":"ce","b":"D","e":"As leis complementares somente são aprovadas por maioria absoluta dos votos dos membros da Câmara.","g":true,"k":["📌 Art. 56."],"a":["lom:56"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-17","lei":"lom","tp":"ce","b":"D","e":"O veto é apreciado em trinta dias úteis, em uma só discussão e votação, e só se considera rejeitado pelo voto de dois terços dos Vereadores.","g":false,"k":["📌 Art. 60, § 4º: rejeita-se o veto pelo voto da maioria absoluta dos Vereadores."],"a":["lom:60"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-18","lei":"lom","tp":"ce","b":"D","e":"A medida provisória editada em calamidade pública perde a eficácia desde a edição se não for convertida em lei em sessenta dias.","g":false,"k":["📌 Art. 62, parágrafo único: o prazo é de trinta dias, a partir da publicação."],"a":["lom:62"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-19","lei":"lom","tp":"ce","b":"D","e":"O parecer prévio do Tribunal de Contas do Estado só deixa de prevalecer por decisão de dois terços dos membros da Câmara.","g":true,"k":["📌 Art. 65, § 3º (e art. 37, VIII, a)."],"a":["lom:65","lom:37"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-20","lei":"lom","tp":"ce","b":"E","e":"Decorridos dez dias da data fixada para a posse, se o Prefeito ou o Vice não tiverem assumido, salvo força maior, os cargos serão declarados vagos.","g":true,"k":["📌 Art. 70, parágrafo único."],"a":["lom:70"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-21","lei":"lom","tp":"ce","b":"E","e":"O Prefeito pode ausentar-se do Município por até trinta dias sem licença da Câmara.","g":false,"k":["📌 Art. 75: sem licença da Câmara, a ausência não pode passar de quinze dias, sob pena de perda do cargo."],"a":["lom:75"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-22","lei":"lom","tp":"ce","b":"E","e":"O Prefeito goza férias anuais de trinta dias, sem prejuízo da remuneração, e escolhe a época.","g":true,"k":["📌 Art. 76."],"a":["lom:76"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-23","lei":"lom","tp":"ce","b":"E","e":"A consulta popular pode ser realizada quando a maioria absoluta dos membros da Câmara ou pelo menos cinco por cento do eleitorado a propuserem.","g":true,"k":["📌 Art. 95, § 1º."],"a":["lom:95"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-24","lei":"lom","tp":"ce","b":"F","e":"A Prefeitura e a Câmara devem fornecer certidões a qualquer interessado no prazo máximo de trinta dias.","g":false,"k":["📌 Art. 104: o prazo máximo é de quinze dias."],"a":["lom:104"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-25","lei":"lom","tp":"ce","b":"F","e":"A venda de imóvel do patrimônio municipal depende de autorização do Legislativo aprovada por dois terços dos seus membros.","g":true,"k":["📌 Art. 109."],"a":["lom:109"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-26","lei":"lom","tp":"ce","b":"F","e":"Os donatários de terrenos do Município ficam impedidos de adquirir outros terrenos da municipalidade pelo prazo de dez anos.","g":false,"k":["📌 Art. 112, § 1º: o impedimento é de cinco anos."],"a":["lom:112"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-27","lei":"lom","tp":"ce","b":"G","e":"A remissão de créditos tributários só pode ocorrer em calamidade pública ou notória pobreza do contribuinte, por lei aprovada por dois terços dos membros da Câmara.","g":true,"k":["📌 Art. 135."],"a":["lom:135"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-28","lei":"lom","tp":"ce","b":"G","e":"As emendas parlamentares ao projeto de Lei Orçamentária Anual têm limite global de 2% da receita corrente líquida prevista no projeto.","g":false,"k":["📌 Art. 148-A: o limite global é de 1,2% da receita corrente líquida."],"a":["lom:148-A"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-29","lei":"lom","tp":"ce","b":"G","e":"Os recursos das dotações orçamentárias destinados à Câmara Municipal são entregues até o dia vinte de cada mês.","g":true,"k":["📌 Art. 158."],"a":["lom:158"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-30","lei":"lom","tp":"ce","b":"H","e":"Na tarifa social do transporte público, a gratuidade aos maiores de sessenta anos independe de condição econômica.","g":false,"k":["📌 Art. 202, II: a gratuidade é para os maiores de sessenta anos reconhecidamente pobres, na forma da lei."],"a":["lom:202"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-31","lei":"lom","tp":"ce","b":"H","e":"A Presidência do Conselho Municipal de Turismo é de indicação exclusiva do Prefeito, com mandato de dois anos e direito a uma recondução.","g":true,"k":["📌 Art. 212, § 2º."],"a":["lom:212"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-32","lei":"lom","tp":"ce","b":"H","e":"A investidura nos cargos de guarda municipal se faz por concurso público de provas ou de provas e títulos.","g":true,"k":["📌 Art. 215, § 2º."],"a":["lom:215"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-33","lei":"lom","tp":"ce","b":"I","e":"Pelas disposições finais e transitórias, a revisão da Lei Orgânica é feita após dez anos da promulgação.","g":true,"k":["📌 ADCT, art. 6º."],"a":["lom:ADCT-6º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-34","lei":"lom","tp":"ce","b":"I","e":"Convênio com empresa privada para uso de terrenos públicos, pago com obras de interesse social, depende de autorização legislativa por maioria simples.","g":false,"k":["📌 ADCT, art. 5º: a autorização exige dois terços (2/3) dos membros do Legislativo."],"a":["lom:ADCT-5º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-35","lei":"lom","tp":"ce","b":"I","e":"A Emenda à Lei Orgânica nº 11/2022 fixou em 14% a alíquota de contribuição dos segurados ativos do RPPS municipal.","g":true,"k":["📌 EC 11/2022, art. 14."],"a":["lom:EC-14"],"src":"Caderno do Prof. Pietro"},{"id":"ce-lom-36","lei":"lom","tp":"ce","b":"I","e":"Para a pensão por morte no RPPS municipal, a condição de dependente do filho menor se encerra aos 24 anos.","g":false,"k":["📌 EC 11/2022, art. 12, III: encerra-se aos 21 anos."],"a":["lom:EC-12"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-1","lei":"ri","tp":"ce","b":"F","e":"O Regimento Interno da Câmara de Mossoró, por disciplinar matéria de interesse local, foi aprovado por lei ordinária sujeita à sanção do Prefeito.","g":false,"k":["📌 Foi aprovado pela Resolução nº 25/2025. Resolução trata da economia interna da Câmara e não vai à sanção (art. 211, § 1º, \"b\", e art. 264 do Regimento)."],"a":["ri:211","ri:264"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-2","lei":"ri","tp":"ce","b":"A","e":"Segundo o Regimento, a função de controle político-administrativo da Câmara alcança o Prefeito e os Secretários, mas não os agentes administrativos sujeitos à ação hierárquica.","g":true,"k":["📌 Literalidade do art. 3º, § 3º."],"a":["ri:3º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-3","lei":"ri","tp":"ce","b":"B","e":"O vereador eleito que não tomar posse na sessão solene terá prazo de 10 dias para fazê-lo, sob pena de renúncia tácita.","g":false,"k":["📌 Para vereador, o prazo é de 15 dias (art. 7º, I). Os 10 dias valem para Prefeito e Vice (art. 7º, II)."],"a":["ri:7º"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-4","lei":"ri","tp":"ce","b":"B","e":"Pelo Regimento, os Vice-Presidentes só são considerados integrantes da Mesa Diretora quando em efetivo exercício.","g":true,"k":["📌 Art. 15, parágrafo único: Vice-Presidentes, 3º e 4º Secretários integram a Mesa apenas quando em efetivo exercício."],"a":["ri:15"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-5","lei":"ri","tp":"ce","b":"B","e":"A proposta orçamentária da Câmara deve ser encaminhada ao Executivo até 30 de agosto, mesma data de envio do projeto de lei orçamentária anual.","g":false,"k":["📌 A proposta da Câmara vai ao Executivo até 15 de julho (art. 24, XIV). O 30 de agosto é a data de envio da LOA e do PPA pelo Executivo à Câmara (art. 274, § 5º)."],"a":["ri:24","ri:274"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-6","lei":"ri","tp":"ce","b":"B","e":"No processo de destituição de membro da Mesa, o recebimento da denúncia exige maioria absoluta, e a destituição final exige 2/3 dos membros da Câmara.","g":true,"k":["📌 Art. 47, § 7º (recebimento) e arts. 46 e 51 (2/3 para destituir)."],"a":["ri:47","ri:46"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-7","lei":"ri","tp":"ce","b":"C","e":"A rejeição de veto do Prefeito exige o voto de 2/3 dos membros da Câmara Municipal de Mossoró.","g":false,"k":["📌 Maioria absoluta (art. 54, § 1º, XIV; art. 263, § 6º), como no modelo federal do art. 66, § 4º, da CF."],"a":["ri:54","ri:263","ri:66"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-8","lei":"ri","tp":"ce","b":"C","e":"A dispensa de formalidades regimentais pela Reunião de Lideranças exige unanimidade e não alcança exigências decorrentes de imperativo constitucional.","g":true,"k":["📌 Art. 66, §§ 4º, I, e 5º."],"a":["ri:66"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-9","lei":"ri","tp":"ce","b":"D","e":"Cabe à Comissão de Constituição, Justiça e Redação apreciar em caráter terminativo os projetos de lei de reconhecimento de utilidade pública.","g":true,"k":["📌 Arts. 81, I, \"c\", e 209."],"a":["ri:81"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-10","lei":"ri","tp":"ce","b":"D","e":"O pedido de vista na comissão pode ser concedido antes de o processo ser relatado, pelo prazo de cinco dias.","g":false,"k":["📌 Vista só depois de relatado (art. 97, § 5º) e por no máximo 2 dias corridos (§ 4º)."],"a":["ri:97"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-11","lei":"ri","tp":"ce","b":"D","e":"O requerimento de constituição de Comissão Especial de Inquérito subscrito por um terço dos vereadores independe de deliberação do Plenário.","g":true,"k":["📌 Art. 121, § 1º, e art. 221, \"b\", em simetria com o art. 58, § 3º, da CF."],"a":["ri:121","ri:221","ri:58"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-12","lei":"ri","tp":"ce","b":"E","e":"Aberta a sessão ordinária com 1/3 dos vereadores, a Ordem do Dia pode ser iniciada com esse mesmo quórum.","g":false,"k":["📌 A Ordem do Dia só começa com maioria absoluta (art. 161, § 1º)."],"a":["ri:161"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-13","lei":"ri","tp":"ce","b":"E","e":"O requerimento para uso da Tribuna Popular deve ser apresentado com antecedência mínima de três dias e subscrito por pelo menos dez outros eleitores de Mossoró.","g":true,"k":["📌 Art. 158, §§ 2º e 3º."],"a":["ri:158"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-14","lei":"ri","tp":"ce","b":"E","e":"Na Explicação Pessoal, cada orador dispõe de cinco minutos e pode ser aparteado.","g":false,"k":["📌 Três minutos, sem apartes (art. 172, § 4º; art. 246, § 3º)."],"a":["ri:172","ri:246"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-15","lei":"ri","tp":"ce","b":"E","e":"Na sessão extraordinária não há Expedientes nem Explicação Pessoal, e somente podem ser votadas as proposições objeto da convocação.","g":true,"k":["📌 Arts. 175 e 176."],"a":["ri:175"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-16","lei":"ri","tp":"ce","b":"F","e":"Ao fim da legislatura, todos os projetos de iniciativa do Prefeito que ainda tramitam são arquivados.","g":false,"k":["📌 Os de iniciativa do Prefeito estão entre as exceções ao arquivamento (art. 190, IV)."],"a":["ri:190"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-17","lei":"ri","tp":"ce","b":"F","e":"Não se admite requerimento de urgência especial para proposição protocolada há menos de oito dias.","g":true,"k":["📌 Art. 193, VI."],"a":["ri:193"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-18","lei":"ri","tp":"ce","b":"F","e":"A proposta de emenda à Lei Orgânica é votada em dois turnos, com interstício mínimo de cinco dias, e aprovada pela maioria absoluta da Câmara.","g":false,"k":["📌 Interstício de 10 dias e quórum de 2/3 (art. 200; CF, art. 29, caput)."],"a":["ri:200","ri:29"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-19","lei":"ri","tp":"ce","b":"F","e":"A emenda modificativa é a que altera apenas a redação do dispositivo, sem mudar sua substância.","g":true,"k":["📌 Art. 214, § 1º, IV."],"a":["ri:214"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-20","lei":"ri","tp":"ce","b":"G","e":"Na discussão de matérias da Ordem do Dia, o vereador pode ceder seu tempo a outro colega.","g":false,"k":["📌 Art. 247, § 2º."],"a":["ri:247"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-21","lei":"ri","tp":"ce","b":"G","e":"Matéria sujeita a dois turnos que for rejeitada no primeiro deve, ainda assim, ser submetida ao segundo turno, prevalecendo o resultado deste.","g":true,"k":["📌 Art. 252."],"a":["ri:252"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-22","lei":"ri","tp":"ce","b":"G","e":"O Prefeito pode vetar parcialmente expressões isoladas de um artigo, desde que justifique a contrariedade ao interesse público.","g":false,"k":["📌 O veto parcial só abrange texto integral de artigo, parágrafo, inciso ou alínea (art. 263, § 1º)."],"a":["ri:263"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-23","lei":"ri","tp":"ce","b":"G","e":"Cada vereador pode apresentar até dez emendas impositivas ao orçamento anual, no prazo destinado às emendas perante a Comissão de Orçamento.","g":true,"k":["📌 Art. 277, caput, c/c art. 275, § 1º."],"a":["ri:277","ri:275"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-24","lei":"ri","tp":"ce","b":"H","e":"Projeto de iniciativa popular com imperfeições de técnica legislativa deve ser rejeitado liminarmente pela Presidência.","g":false,"k":["📌 Não se rejeita liminarmente por vícios de linguagem ou técnica; a CCJR corrige (art. 283, V)."],"a":["ri:283"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-25","lei":"ri","tp":"ce","b":"H","e":"O parecer prévio do Tribunal de Contas sobre as contas do Prefeito só deixa de prevalecer por decisão de dois terços dos membros da Câmara.","g":true,"k":["📌 Art. 296, III, e art. 54, § 2º, I; CF, art. 31, § 2º."],"a":["ri:296","ri:54","ri:31"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-26","lei":"ri","tp":"ce","b":"B","e":"Segundo a jurisprudência do STF, o vereador goza de imunidade formal, de modo que só pode ser processado criminalmente mediante licença da Câmara Municipal.","g":false,"k":["📌 A CF (art. 29, VIII) só garante ao vereador a imunidade material; o STF (ADI 371) afastou a imunidade formal, apesar da redação do art. 309, § 1º, do Regimento."],"a":["ri:29","ri:309"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-27","lei":"ri","tp":"ce","b":"H","e":"Há incompatibilidade de horários para o servidor eleito vereador ainda que o expediente da repartição coincida apenas em parte com o horário das sessões.","g":true,"k":["📌 Art. 308, § 2º."],"a":["ri:308"],"src":"Caderno do Prof. Pietro"},{"id":"ce-ri-28","lei":"ri","tp":"ce","b":"H","e":"A extinção do mandato de vereador depende d function artLabel(a){ var p = a.tag==='ADCT' ? 'ADCT, art. ' : a.tag==='EC 11/2022' ? 'EC 11/2022, art. ' : a.tag ? 'Res. 25/2025, art. ' : 'Art. '; return p + a.n; }

/* ================= formatação de texto legal ================= */
var NUMW='(?:\\d+(?:[.,]\\d+)?|um|uma|dois|duas|tr[eê]s|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|quinze|vinte|trinta|quarenta|cinquenta|sessenta|noventa|cento e vinte|cento e oitenta|setenta e cinco)';
var RX_MARK = new RegExp(
  '('+NUMW+'(?:\\s*\\([^)]{1,30}\\))?\\s+(?:dias? (?:úteis|corridos)|dias?|horas?|anos?|meses|mês|minutos?|sessões|reuniões|semanas?)' +
  '|maioria absoluta|maioria simples|maioria qualificada|maioria (?:de seus|dos) membros|dois terços(?: \\(2\\/3\\))?|um terço(?: \\(1\\/3\\))?|terça parte|\\b[12]\\/[2345]\\b(?: \\([^)]{1,15}\\))?|\\d+(?:,\\d+)?\\s?%(?: \\([^)]{1,40}\\))?|unanimidade)', 'gi');
function accentRx(q){ var map={a:'[aáàâãä]',e:'[eéèêë]',i:'[iíìîï]',o:'[oóòôõö]',u:'[uúùûü]',c:'[cç]',n:'[nñ]'}; var o=''; q=norm(q); for(var i=0;i<q.length;i++){ var ch=q.charAt(i); if(map[ch]) o+=map[ch]; else if(/[\w]/.test(ch)) o+=ch; else if(/\s/.test(ch)) o+='\\s+'; else o+='\\'+ch; } return o; }
function fmt(t, q, mark){
  var s = esc(t);
  if(q){ try{ s = s.replace(new RegExp('('+accentRx(q)+')','gi'), '<mark class="hl">$1</mark>'); }catch(e){} return s; }
  if(mark){ s = s.replace(RX_MARK, function(m){ if(/^\d$/.test(m)) return m; return '<mark class="mt">'+m+'</mark>'; }); }
  return s;
}
function pClass(t){
  if(/^(§|Parágrafo único)/.test(t)) return 'par';
  if(/^[IVXLC]+\s*[–-]/.test(t)) return 'inc';
  if(/^[a-z]\)/.test(t)) return 'ali';
  if(/^\d+[.)]\s/.test(t)) return 'ite';
  return '';
}
function artBody(a, q){
  var h='';
  each(a.t, function(t, i){
    var c = i===0 ? '' : pClass(t);
    var rev = /^\s*(?:[§\w ]+?)?\s*\(?Revogad[oa]/i.test(t) && t.length<90;
    var html = fmt(t, q, P.set.mark).replace(/\((Redação dada[^)]*|Acrescid[^)]*|Incluíd[^)]*)\)/g, '<span class="red">($1)</span>');
    h += '<p class="'+c+(rev?' rev':'')+'">'+html+'</p>';
  });
  return h;
}

/* ================= modal ================= */
function modal(title, body, foot, onopen){
  var r=$('modal-root');
  r.innerHTML='<div class="modal" id="mdl"><div class="mbox" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="mh"><h3>'+esc(title)+'</h3><button class="ib" data-x aria-label="Fechar">✕</button></div><div class="mb">'+body+'</div>'+(foot?'<div class="mf">'+foot+'</div>':'')+'</div></div>';
  var m=$('mdl');
  m.addEventListener('click', function(e){ if(e.target===m || (e.target.getAttribute && e.target.getAttribute('data-x')!==null)) closeModal(); });
  if(onopen) onopen(m);
  return m;
}
function closeModal(){ $('modal-root').innerHTML=''; }
function confirmBox(title, msg, okLabel, cb, danger){
  var m = modal(title, '<p>'+msg+'</p>', '<button class="btn ghost" data-x>Cancelar</button><button class="btn '+(danger?'danger':'')+'" id="cf-ok">'+esc(okLabel)+'</button>');
  $('cf-ok').onclick=function(){ closeModal(); cb(); };
}
function showArt(id){
  var a=ART[id]; if(!a) return;
  var body='<div class="art '+a.lei+'"><div class="art-n">'+esc(a.n)+'<small>'+(a.tag?esc(a.tag==='Resolução nº 25/2025'?'Res.':a.tag):'art.')+'</small></div><div class="art-h"><span class="chip '+a.lei+'">'+esc(D.meta[a.lei].curto)+'</span>'+(a.h.length?'<span class="faint" style="font-size:.82rem">'+esc(a.h[a.h.length-1])+'</span>':'')+'</div><div class="art-b">'+artBody(a)+'</div>'+notesHtml(a)+'</div>';
  modal(artLabel(a)+' · '+D.meta[a.lei].sigla, body, '<button class="btn soft" id="ma-go">Abrir na lei seca</button><button class="btn" data-x>Fechar</button>');
  $('ma-go').onclick=function(){ closeModal(); goArt(id); };
}
function notesHtml(a){
  var h='';
  each(a.nt||[], function(n){ h+='<div class="pnote"><b>📌 Nota do professor:</b> '+esc(n)+'</div>'; });
  if(P.notes[a.id]) h+='<div class="unote">✎ '+esc(P.notes[a.id])+'</div>';
  return h;
}

var VIEWS=[['inicio','⌂','Início'],['lei','§','Lei seca'],['questoes','✓','Questões'],['revisao','↻','Revisão'],['desempenho','▦','Desempenho'],['ajustes','⚙','Ajustes']];

}

/* ================= início ================= */
function readCount(l){ var n=0,t=0; each(LAWS[l], function(a){ t++; if(P.read[a.id]) n++; }); return [n,t]; }
function ringSvg(p, color){ var r=26, c=2*Math.PI*r, o=c*(1-p/100); return '<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">'+p+'%</text></svg>'; }
function ansStats(filter){ var n=0, ok=0; each(D.q, function(q){ if(filter && !filter(q)) return; var a=P.ans[q.id]; if(a){ n++; if(a.last) ok++; } }); return [ok,n]; }
function streak(){ var d=new Date(), n=0; for(var i=0;i<400;i++){ var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); if(P.days[k]) n++; else if(i>0) break; d.setDate(d.getDate()-1); } return n; }

  h+='<div class="panel"><h3>Prova</h3>'+dias+'<div style="display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap"><input type="date" class="sel" id="i-prova" value="'+esc(P.prova||'')+'" aria-label="Data da prova"><button class="btn sm soft" id="i-sv">Salvar data</button></div></div></div>';
  h+='<div class="quick">';
  h+='<button class="qa" id="q-dia"><div class="ic">⚡</div><b>Questões do dia</b><span>10 questões misturadas, priorizando as que você errou e as inéditas.</span></button>';
  h+='<button class="qa" id="q-cont"><div class="ic">📖</div><b>'+(lastA?'Continuar a leitura':'Começar a lei seca')+'</b><span>'+(lastA?esc(artLabel(lastA))+' · '+esc(D.meta[lastA.lei].curto):'Comece pela Lei Orgânica, art. 1º.')+'</span></button>';
  h+='<button class="qa" id="q-flash"><div class="ic">🗂️</div><b>Prazos e quóruns</b><span>'+D.fc.length+' cartões com revisão espaçada. Os números que mais caem.</span></button>';

/* ================= lei seca ================= */
var LS={lei:'lom', q:'', f:'todos', lim:80};
function lsFiltered(){
  var arr=LAWS[LS.lei], out=[], q=LS.q.trim();
  var nq = norm(q), m = /^(?:art\.?\s*)?(\d+(?:-[a-z])?)\s*[ºo°]?$/i.exec(q);
  each(arr, function(a){
    if(LS.f==='fav' && !P.fav[a.id]) return;
    if(LS.f==='nota' && !P.notes[a.id]) return;
    if(LS.f==='nlido' && P.read[a.id]) return;
    if(q){
      if(m){ if(norm(a.n).replace('º','')!==norm(m[1])) return; }
      else if(norm(a.t.join(' ')+' '+(a.nt||[]).join(' ')).indexOf(nq)<0) return;
    }
    out.push(a);
  });
  return out;
}
function rLei(){
  var v=$('v-lei');
  if(!v.getAttribute('data-built')){
    v.setAttribute('data-built','1');
    v.innerHTML='<div class="view-h"><div><h2>Lei seca</h2><p>Texto integral, com prazos e quóruns marcados. Toque em ★ para favoritar, ✓ para marcar como lido e ✎ para anotar.</p></div></div>'+
    '<div class="tabs" role="tablist"><button class="tab lom" data-l="lom" role="tab">Lei Orgânica<small>'+LAWS.lom.length+' dispositivos</small></button><button class="tab ri" data-l="ri" role="tab">Regimento Interno<small>'+LAWS.ri.length+' dispositivos</small></button></div>'+
    '<div class="binder" id="ls-b"><div class="ls-tools"><div class="search"><span class="mg">⌕</span><input id="ls-q" type="search" placeholder="Buscar palavra ou número do artigo" aria-label="Buscar na lei"></div>'+
    '<div class="seg" id="ls-f"><button data-f="todos">Todos</button><button data-f="nlido">Não lidos</button><button data-f="fav">★ Favoritos</button><button data-f="nota">✎ Com nota</button></div>'+
    '<button class="btn sm ghost" id="ls-toc">☰ Sumário</button></div><div class="ls-meta" id="ls-meta"></div><div class="ls-list" id="ls-list"></div></div>';
    each(v.querySelectorAll('.tab'), function(b){ b.onclick=function(){ LS.lei=b.getAttribute('data-l'); LS.lim=80; LS.q=''; $('ls-q').value=''; drawLei(); window.scrollTo(0,0); }; });
    var tq; $('ls-q').oninput=function(){ clearTimeout(tq); tq=setTimeout(function(){ LS.q=$('ls-q').value; LS.lim=80; drawLei(); }, 220); };
    $('ls-f').onclick=function(e){ var f=e.target.getAttribute('data-f'); if(f){ LS.f=f; LS.lim=80; drawLei(); } };
    $('ls-toc').onclick=toc;
    $('ls-list').onclick=lsClick;
  }
  drawLei();
}
function drawLei(target){
  each(document.querySelectorAll('#v-lei .tab'), function(b){ b.className='tab '+b.getAttribute('data-l')+(b.getAttribute('data-l')===LS.lei?' on':''); b.setAttribute('aria-selected', b.getAttribute('data-l')===LS.lei?'true':'false'); });
  each(document.querySelectorAll('#ls-f button'), function(b){ b.className = b.getAttribute('data-f')===LS.f?'on':''; });
  $('ls-b').className='binder '+LS.lei;
  var list=lsFiltered(), rc=readCount(LS.lei);
  if(target){ for(var k=0;k<list.length;k++){ if(list[k].id===target){ if(LS.lim<=k) LS.lim=k+20; break; } } }
  $('ls-meta').innerHTML='<span>'+esc(D.meta[LS.lei].nome)+' · '+esc(D.meta[LS.lei].fonte)+'</span><span style="display:flex;gap:10px;align-items:center">'+rc[0]+'/'+rc[1]+' lidos<span class="pbar"><i style="width:'+pct(rc[0],rc[1])+'%"></i></span></span>';
  var h='', last=['','','',''], shown=list.slice(0, LS.lim);
  if(!list.length){ $('ls-list').innerHTML='<div class="empty">'+(LS.q?'Nenhum dispositivo com “'+esc(LS.q)+'”. Tente outra palavra ou só o número do artigo.':LS.f==='fav'?'Você ainda não favoritou artigos. Toque em ★ em qualquer artigo para guardá-lo aqui.':LS.f==='nota'?'Nenhuma anotação ainda. Toque em ✎ em um artigo para escrever.':'Tudo lido por aqui. 👏')+'</div>'; return; }
  each(shown, function(a){
    var hh=a.h||[]; var showH = !LS.q && LS.f==='todos';
    if(showH){
      var block='';
      for(var i=0;i<4;i++){ if((hh[i]||'')!==last[i]){ for(var j=i;j<4;j++){ if(hh[j]) block+='<div class="'+(j===0?'t':j===1?'c':'s')+'">'+esc(hh[j])+'</div>'; } break; } }
      if(a.tag && last.tag!==a.tag){ block = '<div class="c">'+(a.tag==='ADCT'?'Ato das Disposições Transitórias':a.tag==='EC 11/2022'?'Emenda à Lei Orgânica nº 11/2022':'Resolução nº 25/2025 (aprova o Regimento)')+'</div>' + block; }
      if(block) h+='<div class="hd">'+block+'</div>';
      last=[hh[0]||'',hh[1]||'',hh[2]||'',hh[3]||'']; last.tag=a.tag;
    }
    h+=artCard(a, isNumQ(LS.q)?'':LS.q);
  });
  if(list.length>LS.lim) h+='<button class="btn soft more" id="ls-more">Mostrar mais ('+(list.length-LS.lim)+' restantes)</button>';
  $('ls-list').innerHTML=h;
  if(LS.q) $('ls-meta').innerHTML+= '<span class="avail">'+list.length+' resultado(s)</span>';
}
function isNumQ(q){ return /^(?:art\.?\s*)?\d+(?:-[a-z])?\s*[ºo°]?$/i.test(String(q).trim()); }
function artCard(a, q){
  var nq=(QBYART[a.id]||[]).length;
  return '<article class="art '+a.lei+(P.read[a.id]?' read':'')+'" id="A_'+a.id.replace(/[^\w]/g,'_')+'" data-id="'+esc(a.id)+'">'+
    '<div class="art-n">'+esc(a.n)+'<small>'+(a.tag?esc(a.tag==='Resolução nº 25/2025'?'Res.':a.tag==='EC 11/2022'?'EC 11':a.tag):'art.')+'</small></div>'+
    '<div class="art-h"><span class="chip" title="'+esc(blocoName(a.lei,a.b))+'">Bloco '+esc(a.b)+'</span><span class="sp"></span>'+
    '<button class="ib fav'+(P.fav[a.id]?' on':'')+'" data-a="fav" title="Favoritar" aria-label="Favoritar">'+(P.fav[a.id]?'★':'☆')+'</button>'+
    '<button class="ib'+(P.notes[a.id]?' on':'')+'" data-a="nota" title="Anotar" aria-label="Anotar">✎</button>'+
    '<button class="ib" data-a="copy" title="Copiar texto" aria-label="Copiar texto">⧉</button>'+
    '<button class="ib'+(P.read[a.id]?' on':'')+'" data-a="read" title="Marcar como lido" aria-label="Marcar como lido">'+(P.read[a.id]?'✔':'✓')+'</button></div>'+
    '<div class="art-b">'+artBody(a, q)+'</div>'+notesHtml(a)+
    (nq?'<div class="art-f"><button class="lnk" data-a="qs">Resolver '+nq+' '+(nq===1?'questão':'questões')+' deste artigo</button></div>':'')+
    '</article>';
}
function lsClick(e){
  var t=e.target; if(t.id==='ls-more'){ LS.lim+=120; drawLei(); return; }
  var act=t.getAttribute && t.getAttribute('data-a'); if(!act) return;
  var card=t; while(card && !card.getAttribute('data-id')) card=card.parentNode; if(!card) return;
  var id=card.getAttribute('data-id'), a=ART[id]; P.lastArt=id;
  if(act==='fav'){ if(P.fav[id]) delete P.fav[id]; else P.fav[id]=1; save(); refreshCard(a); toast(P.fav[id]?'Adicionado aos favoritos.':'Removido dos favoritos.'); }
  if(act==='read'){ if(P.read[id]) delete P.read[id]; else { P.read[id]=1; touchDay(); } save(); refreshCard(a); updMeta(); }
  if(act==='nota'){ editNote(a); }
  if(act==='copy'){ copyText(artLabel(a)+' — '+D.meta[a.lei].nome+'\n'+a.t.join('\n')); }
  if(act==='qs'){ startRun(shuffle((QBYART[id]||[]).map(function(x){ return QID[x]; })), 'treino', artLabel(a)+' · '+D.meta[a.lei].sigla); }
}
function updMeta(){ var rc=readCount(LS.lei); var pb=document.querySelector('#ls-meta .pbar i'); if(pb) pb.style.width=pct(rc[0],rc[1])+'%'; var sp=document.querySelector('#ls-meta span:nth-child(2)'); if(sp && sp.firstChild) sp.firstChild.nodeValue=rc[0]+'/'+rc[1]+' lidos'; }
function refreshCard(a){ var el=document.querySelector('[data-id="'+a.id+'"]'); if(!el) return; var tmp=document.createElement('div'); tmp.innerHTML=artCard(a, isNumQ(LS.q)?'':LS.q); el.parentNode.replaceChild(tmp.firstChild, el); }
function editNote(a){
  modal('Anotação · '+artLabel(a)+' ('+D.meta[a.lei].sigla+')', '<textarea class="note" id="nt-t" placeholder="Escreva sua anotação: macete, pegadinha, ligação com outro artigo…">'+esc(P.notes[a.id]||'')+'</textarea>', '<button class="btn ghost" id="nt-del">Apagar</button><button class="btn" id="nt-ok">Salvar anotação</button>');
  $('nt-t').focus();
  $('nt-ok').onclick=function(){ var v=$('nt-t').value.trim(); if(v) P.notes[a.id]=v; else delete P.notes[a.id]; save(); closeModal(); refreshCard(a); toast('Anotação salva.'); };
  $('nt-del').onclick=function(){ delete P.notes[a.id]; save(); closeModal(); refreshCard(a); toast('Anotação apagada.'); };
}
function copyText(s){
  function fb(){ var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Texto copiado.'); }catch(e){ toast('Não foi possível copiar neste aparelho.'); } document.body.removeChild(ta); }
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(s).then(function(){ toast('Texto copiado.'); }, fb); } else fb(); }catch(e){ fb(); }
}
function toc(){
  var arr=LAWS[LS.lei], last=['','','',''], h='<div class="toc">';
  each(arr, function(a){

function pool(){

function startDaily(){
  var wrong=[], fresh=[], rest=[];

function startRun(list, mode, lbl){

function fmtTime(ms){ var s=Math.floor(ms/1000), m=Math.floor(s/60); s=s%60; return m+'min '+pad(s)+'s'; }
var TICK=null;
function drawRun(){
  var v=$('v-questoes'), R=RUN, q=R.list[R.i];

      h+='<div class="'+c+'" data-i="'+i+'" role="button" tabindex="0"><span class="l">'+'ABCDE'.charAt(i)+'</span><span class="x">'+esc(t)+'</span>'+(answered&&R.mode==='treino'?'':'<button class="cut" data-cut="'+i+'" title="Riscar alternativa" aria-label="Riscar alternativa">✂</button>')+'</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="ce">';
    each([[true,'Certo'],[false,'Errado']], function(o){
      var c='alt';
      if(answered && R.mode==='treino'){ if(o[0]===q.g) c+=' ok'; else if(mine===o[0]) c+=' bad'; }
      else if(mine===o[0]) c+=' sel';

    });

    h+='<div class="qact"><span class="verdict '+(right?'ok':'bad')+'">'+(right?'✔ Você acertou.':'✕ Resposta errada. Gabarito: '+(q.tp==='mc'?'ABCDE'.charAt(q.c):(q.g?'Certo':'Errado'))+'.')+'</span></div>';
    h+=commHtml(q);
  }
  h+='<div class="qact"><button class="btn ghost sm" id="r-prev"'+(R.i?'':' disabled')+'>← Anterior</button>';
  if(R.mode==='treino'){
    if(!answered) h+='<button class="btn" id="r-conf"'+(mine===undefined?' disabled':'')+'>Responder</button>';
    else h+='<button class="btn" id="r-next">'+(R.i<R.list.length-1?'Próxima →':'Ver resultado')+'</button>';
  } else {
    h+='<button class="btn" id="r-next">'+(R.i<R.list.length-1?'Próxima →':'Entregar simulado')+'</button>';
  }
  h+='</div></div></div>';
  v.innerHTML=h; v.onclick=null;
  window.scrollTo(0,0);
  clearInterval(TICK); if(R.mode==='simulado'){ TICK=setInterval(function(){ var t=$('r-tm'); if(t&&RUN) t.textContent=fmtTime(Date.now()-RUN.t0); else clearInterval(TICK); }, 1000); }
  $('r-exit').onclick=function(){ confirmBox('Sair da sessão?', 'As respostas já confirmadas ficam salvas no seu desempenho.', 'Sair', function(){ RUN=null; clearInterval(TICK); rQ(); }); };
  $('r-prev').onclick=function(){ if(R.i){ R.i--; drawRun(); } };
  if($('r-conf')) $('r-conf').onclick=function(){ R.done[q.id]=1; record(q, mine); drawRun(); };
  if($('r-next')) $('r-next').onclick=function(){
    if(R.mode==='simulado' && R.i===R.list.length-1){ var miss=0; each(R.list,function(x){ if(R.ans[x.id]===undefined) miss++; }); var fin=function(){ finishSim(); }; if(miss) confirmBox('Entregar simulado?', 'Há '+miss+' questão(ões) sem resposta. Elas contam como erro.', 'Entregar', fin); else fin(); return; }

    }

  });
  each(v.querySelectorAll('[data-art]'), function(b){ b.onclick=function(){ showArt(b.getAttribute('data-art')); }; });
}
function commHtml(q){

    var nq=norm(RV.q), rows='';
    each(fcPool(), function(k){ if(nq && norm(k.f+' '+k.v).indexOf(nq)<0) return; var a=ART[k.a]; rows+='<tr><td>'+esc(k.f)+'</td><td class="v">'+hiNum(k.v)+'</td><td><button class="lnk" data-art="'+esc(k.a)+'">'+esc(artLabel(a))+' · '+esc(D.meta[k.lei].sigla)+'</button></td></tr>'; });
    $('qd-t').innerHTML = rows ? '<table class="qd"><thead><tr><th>Ponto de prova</th><th>Resposta</th><th>Fonte</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<div class="empty">Nada encontrado.</div>';
  }
  draw();
  var tq; $('qd-q').oninput=function(){ var s=this.value; clearTimeout(tq); tq=setTimeout(function(){ RV.q=s; draw(); }, 180); };
  $('qd-t').onclick=function(e){ var a=e.target.getAttribute('data-art'); if(a) showArt(a); };
}

/* ================= desempenho ================= */
function rDes(){
  var v=$('v-desempenho');
  var all=ansStats(), lom=ansStats(function(q){return q.lei==='lom';}), ri=ansStats(function(q){return q.lei==='ri';}), cmp=ansStats(function(q){return q.lei==='cmp';});
  var lr=readCount('lom'), rr=readCount('ri'), dom=0; each(D.fc, function(c){ if(box(c)>=3) dom++; });
  var h='<div class="view-h"><div><h2>Desempenho</h2><p>Acerto calculado pela última resposta de cada questão.</p></div></div>';
  h+='<div class="grid g3"><div class="panel kpi"><b>'+(all[1]?pct(all[0],all[1])+'%':'—')+'</b><span>acerto geral ('+all[1]+' de '+D.q.length+' respondidas)</span></div><div class="panel kpi"><b>'+(lr[0]+rr[0])+'</b><span>artigos lidos de '+(lr[1]+rr[1])+'</span></div><div class="panel kpi"><b>'+dom+'</b><span>cartões dominados de '+D.fc.length+'</span></div></div>';
  h+='<div class="grid g2" style="margin-top:14px"><div class="panel"><h3 style="font-size:1.05rem;margin-bottom:12px">Por lei</h3><div class="bars">'+barRow('Lei Orgânica',lom)+barRow('Regimento Interno',ri)+barRow('Pegadinhas LOM × RI',cmp)+'</div></div>';
  h+='<div class="panel"><h3 style="font-size:1.05rem;margin-bottom:12px">Simulados</h3>'+simChart()+'</div></div>';
  each(['lom','ri'], function(l){
    h+='<div class="panel" style="margin-top:14px"><h3 style="font-size:1.05rem;margin-bottom:12px">'+esc(D.meta[l].curto)+' · por bloco</h3><div class="bars">';
    var bl=D.blocos[l]; for(var k in bl){ if(!bl.hasOwnProperty(k)) continue; (function(k){ var s=ansStats(function(q){ return q.lei===l && q.b===k; }); var tot=D.q.filter(function(q){ return q.lei===l && q.b===k; }).length; if(tot) h+=barRow(k+' · '+bl[k], s, tot); })(k); }
    h+='</div></div>';
  });
  var weak=[]; each(D.q, function(q){ var a=P.ans[q.id]; if(a && a.w>0 && !a.last) weak.push(q); });
  h+='<div class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="font-size:1.05rem">Pontos fracos agora</h3>'+(weak.length?'<button class="btn sm" id="ds-w">Refazer '+weak.length+' questão(ões)</button>':'')+'</div>';
  if(!weak.length) h+='<p class="muted">Quando você errar uma questão, ela aparece aqui até acertar de novo.</p>';
  else { var arts={}; each(weak, function(q){ each(q.a||[], function(id){ arts[id]=(arts[id]||0)+1; }); }); var al=[]; for(var id in arts) if(arts.hasOwnProperty(id)) al.push([id,arts[id]]); al.sort(function(a,b){return b[1]-a[1];}); h+='<p class="muted" style="margin-top:8px">Artigos ligados aos seus erros:</p><div style="display:flex;gap:8px;flex-wrap:wrap">'; each(al.slice(0,14), function(x){ var a=ART[x[0]]; h+='<button class="chip '+a.lei+'" data-art="'+esc(x[0])+'" style="cursor:pointer">'+esc(artLabel(a))+' · '+esc(D.meta[a.lei].sigla)+'</button>'; }); h+='</div>'; }
  h+='</div>';
  v.innerHTML=h;
  if($('ds-w')) $('ds-w').onclick=function(){ startRun(shuffle(weak),'treino','Pontos fracos'); };
  v.onclick=function(e){ var a=e.target.getAttribute && e.target.getAttribute('data-art'); if(a) showArt(a); };
}
function barRow(lbl, s, tot){ var p=pct(s[0],s[1]); return '<div class="bar"><span>'+esc(lbl)+(tot?' <span class="faint">('+s[1]+'/'+tot+')</span>':'')+'</span><span class="tr"><i class="'+(s[1]&&p<60?'low':'')+'" style="width:'+(s[1]?p:0)+'%"></i></span><span class="pc">'+(s[1]?p+'%':'—')+'</span></div>'; }
function simChart(){
  var s=P.sims.slice(-12); if(!s.length) return '<p class="muted">Faça um simulado na aba Questões para acompanhar sua evolução aqui.</p>';
  var W=420,H=160,pd=26, n=s.length, pts='', dots='';
  each(s, function(x,i){ var X=pd+(n===1?(W-2*pd)/2:i*(W-2*pd)/(n-1)), Y=H-pd-(pct(x.ok,x.n)/100)*(H-2*pd); pts+=(i?' ':'')+X.toFixed(1)+','+Y.toFixed(1); dots+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="4" fill="var(--blue)"><title>'+pct(x.ok,x.n)+'% em '+x.d+'</title></circle>'; });
  var grid=''; each([0,50,100], function(g){ var Y=H-pd-(g/100)*(H-2*pd); grid+='<line x1="'+pd+'" x2="'+(W-pd)+'" y1="'+Y+'" y2="'+Y+'" stroke="var(--line)"/><text x="2" y="'+(Y+4)+'" font-size="10" fill="var(--ink3)">'+g+'%</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolução nos simulados">'+grid+'<polyline points="'+pts+'" fill="none" stroke="var(--blue)" stroke-width="2.5"/>'+dots+'</svg>';
}

/* ================= ajustes ================= */
function rAj(){
  var v=$('v-ajustes');
  var th=P.set.theme||'auto';
  var h='<div class="view-h"><div><h2>Ajustes e materiais</h2><p>Personalize a leitura, faça backup do progresso e consulte os PDFs do kit.</p></div></div>';
  h+='<div class="panel"><div class="row"><div><b>Tema</b><small>Claro para estudar de dia, escuro para a noite.</small></div><div class="seg" id="aj-th"><button data-t="auto" class="'+(th==='auto'?'on':'')+'">Automático</button><button data-t="light" class="'+(th==='light'?'on':'')+'">Claro</button><button data-t="dark" class="'+(th==='dark'?'on':'')+'">Escuro</button></div></div>';
  h+='<div class="row"><div><b>Tamanho do texto</b><small>Atual: '+(P.set.fs||17)+' px</small></div><div class="seg"><button id="aj-fm">A−</button><button id="aj-fp">A+</button></div></div>';
  h+='<div class="row"><div><b>Marca-texto automático</b><small>Destaca prazos, quóruns e percentuais na lei seca.</small></div><div class="seg"><button id="aj-mk" class="'+(P.set.mark?'on':'')+'">'+(P.set.mark?'Ligado':'Desligado')+'</button></div></div></div>';
  h+='<div class="panel" style="margin-top:14px"><h3 style="font-size:1.05rem;margin-bottom:10px">Materiais do kit</h3><div class="grid g2"><div class="pdf"><div class="pi">PDF</div><div><b>Caderno · Lei Orgânica do Município de Mossoró</b><br><small class="muted">147 páginas · 46 tópicos comentados · fichário com a lei integral</small></div></div><div class="pdf"><div class="pi">PDF</div><div><b>Caderno · Regimento Interno da Câmara de Mossoró</b><br><small class="muted">160 páginas · 35 tópicos · jurisprudência do STF</small></div></div></div><p class="muted" style="margin-top:10px">Os PDFs ficam disponíveis para download na área de membros onde você recebeu este aplicativo. Use-os para a leitura comentada; use o aplicativo para treinar.</p></div>';
  h+='<div class="panel" style="margin-top:14px"><h3 style="font-size:1.05rem;margin-bottom:4px">Seu progresso</h3><div class="row"><div><b>Fazer backup</b><small>Gera um código com tudo o que você estudou, para guardar ou levar a outro aparelho.</small></div><button class="btn sm soft" id="aj-exp">Gerar backup</button></div><div class="row"><div><b>Restaurar backup</b><small>Cole o código gerado em outro aparelho.</small></div><button class="btn sm soft" id="aj-imp">Restaurar</button></div><div class="row"><div><b>Zerar progresso</b><small>Apaga respostas, leituras, notas e cartões deste aparelho.</small></div><button class="btn sm danger" id="aj-zero">Zerar</button></div></div>';
  h+='<div class="panel" style="margin-top:14px"><h3 style="font-size:1.05rem;margin-bottom:4px">Licença</h3><div class="row"><div><b>'+esc(LIC.nome||'')+'</b><small>'+esc(LIC.email)+' · chave '+esc(LIC.key)+'</small></div><button class="btn sm ghost" id="aj-out">Desativar neste aparelho</button></div><p class="faint" style="font-size:.85rem;margin-top:8px">Licença de uso pessoal e intransferível. O compartilhamento do arquivo ou da chave viola os termos de compra. Textos legais reproduzidos das compilações oficiais; para citação formal, consulte as publicações da Câmara Municipal de Mossoró. Suporte: '+esc(CFG.sup)+'. Versão '+esc(CFG.v)+'.</p></div>';
  v.innerHTML=h;
  $('aj-th').onclick=function(e){ var t=e.target.getAttribute('data-t'); if(t){ P.set.theme=t; save(); applyTheme(); rAj(); } };
  $('aj-fm').onclick=function(){ P.set.fs=Math.max(14,(P.set.fs||17)-1); save(); applyTheme(); rAj(); };
  $('aj-fp').onclick=function(){ P.set.fs=Math.min(22,(P.set.fs||17)+1); save(); applyTheme(); rAj(); };
  $('aj-mk').onclick=function(){ P.set.mark=!P.set.mark; save(); var v2=$('v-lei'); v2.removeAttribute('data-built'); rAj(); };
  $('aj-exp').onclick=function(){
    var code='CMMBK1.'+btoa(unescape(encodeURIComponent(JSON.stringify(P))));
    modal('Backup do progresso','<p class="muted">Copie o código abaixo e guarde-o (por exemplo, envie para você mesmo no WhatsApp).</p><textarea class="note" id="bk-t" readonly>'+esc(code)+'</textarea>','<button class="btn" id="bk-c">Copiar código</button>');
    $('bk-c').onclick=function(){ copyText(code); };
  };
  $('aj-imp').onclick=function(){
    modal('Restaurar backup','<p class="muted">Cole o código do backup. O progresso atual deste aparelho será substituído.</p><textarea class="note" id="bk-i" placeholder="CMMBK1…"></textarea>','<button class="btn ghost" data-x>Cancelar</button><button class="btn" id="bk-ok">Restaurar</button>');
    $('bk-ok').onclick=function(){ try{ var s=$('bk-i').value.trim(); if(s.indexOf('CMMBK1.')!==0) throw 0; var o=JSON.parse(decodeURIComponent(escape(atob(s.slice(7))))); P=o; P0(); save(); closeModal(); applyTheme(); $('v-lei').removeAttribute('data-built'); toast('Progresso restaurado.'); rAj(); }catch(e){ toast('Código inválido. Confira se copiou o backup inteiro.'); } };
  };
  $('aj-zero').onclick=function(){ confirmBox('Zerar todo o progresso?', 'Respostas, leituras, anotações, favoritos e cartões deste aparelho serão apagados. Faça um backup antes, se quiser guardar.', 'Zerar progresso', function(){ var set=P.set, prova=P.prova; P={}; P0(); P.set=set; P.prova=prova; save(); $('v-lei').removeAttribute('data-built'); toast('Progresso zerado.'); rAj(); }, true); };
  $('aj-out').onclick=function(){ confirmBox('Desativar neste aparelho?', 'Você precisará digitar o e-mail e a chave de novo para entrar. Seu progresso continua salvo.', 'Desativar', function(){ store.del('lic'); location.reload(); }); };
}
function applyTheme(){
  var t=P.set.theme||'auto', dark = t==='dark' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  document.documentElement.style.setProperty('--fs', (P.set.fs||17)+'px');
  watermark();
}
function watermark(){
  if(!LIC) return;
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var col = dark ? 'rgba(230,235,245,0.05)' : 'rgba(19,32,58,0.05)';
  var txt = (LIC.nome? LIC.nome+' · ' : '') + LIC.email;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="460" height="260"><text x="10" y="150" transform="rotate(-24 230 130)" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="'+col+'">'+esc(txt)+'</text></svg>';
  $('wm').style.backgroundImage='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';
}

/* ================= ativação ================= */
function showGate(){
  $('gate').hidden=false; $('app').hidden=true; $('g-sup').textContent=CFG.sup;
  var ok=$('g-ok');
  function act(){
    var nome=$('g-nome').value.trim(), email=normEmail($('g-email').value), key=$('g-key').value.trim(), er=$('g-err');
    er.hidden=true;
    if(!email || email.indexOf('@')<1){ er.textContent='Informe o e-mail usado na compra.'; er.hidden=false; return; }
    if(cleanKey(key).length<15){ er.textContent='A chave tem o formato '+CFG.p+'-XXXX-XXXX-XXXX.'; er.hidden=false; return; }
    var l={nome:nome, email:email, key:key.toUpperCase()};
    if(!validLic(l)){ er.textContent='Chave e e-mail não conferem. Use exatamente o e-mail da compra e confira a chave recebida.'; er.hidden=false; return; }
    store.set('lic', l); LIC=l; start();
  }
  ok.onclick=act;
  each(['g-nome','g-email','g-key'], function(id){ $(id).onkeydown=function(e){ if(e.keyCode===13) act(); }; });
}
function start(){
  $('gate').hidden=true; $('app').hidden=false;
  $('lic').innerHTML='Licenciado para<br><b>'+esc(LIC.nome||LIC.email)+'</b><br>'+esc(LIC.email);
  applyTheme(); buildNav();
  if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addListener(function(){ applyTheme(); }); }catch(e){} }
  go('inicio');
}
applyTheme();
if(validLic(LIC)) start(); else { LIC=null; showGate(); }
})();

</script>
</body>
