ei que dispensar, na forma do Regimento Interno, a competência do Plenário, salvo se houver recurso de um terço (1/3) dos membros da Casa;","II – realizar audiências públicas com caridades da sociedade civil;","III – convocar os secretários municipais ou Diretores equivalentes, para prestarem informações sobre assuntos inerentes ás suas atribuições;","IV – receber petições, reclamações, representações ou queixas de qualquer pessoa contra atos ou omissões das autoridades ou entidades públicas;","V – solicitar depoimento de qualquer autoridade ou cidadão;","VI – exercer, no âmbito de sua competência, a fiscalização dos atos do Executivo e da Administração Indireta.","§ 2º As comissões especiais, criadas por deliberação do Plenário, serão destinadas ao estudo de assuntos específicos.","§ 3º Na formação das comissões assegurar-se-á, tanto quanto possível, a representação proporcional dos Partidos ou dos blocos parlamentares que participem da Câmara.","§ 4º As comissões parlamentares de inquérito que terão poderes previstos no Regimento Interno da Casa, serão criadas pela Câmara Municipal, mediante requerimento de um terço de seus membros, para a apuração de fato determinado e por prazo certo, independentemente de deliberação posterior, sendo suas conclusões, se for o caso, encaminhado ao Ministério Público, para que promova a responsabilidade civil ou criminal dos infratores. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:48","n":"48","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["A Maioria, a Minoria, as Representações Partidárias, mesmo com apenas um membro, e os blocos parlamentares terão Líder e Vice-Líder, quando for o caso."],"nt":[]},{"id":"lom:49","n":"49","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["Além de outras atribuições previstas no Regimento Interno, os Líderes indicarão os representantes partidários nas comissões, conforme art. 47, §3º desta Lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Ausente ou impedido o Líder, suas atribuições serão exercidas pelo Vice-Líder."],"nt":[]},{"id":"lom:50","n":"50","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["A Câmara Municipal, observado o disposto nesta Lei Orgânica, compete elaborar seu regimento Interno, dispondo sobre sua organização política e provimento de cargos de seus serviços e especialmente sobre:","I – sua instalação e funcionamento;","II – posse de seus membros;","III – eleição da Mesa, sua composição e suas atribuições.","IV – periodicidade das reuniões;","V – Comissões;","VI – sessões;","VII – deliberações;","VIII – todo e qualquer assunto de sua administração interna."],"nt":[]},{"id":"lom:51","n":"51","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["À Mesa, dentre outras atribuições, compete:","I – tomar todas as medidas necessárias à regularidade dos trabalhos legislativos;","II – propor projetos que criem ou extingam cargos nos serviços da Câmara e fixem os respectivos vencimentos;","III – apresentar projetos de lei dispondo sobre abertura de créditos suplementares ou especiais, através do aproveitamento total ou parcial das consignações orçamentárias da Câmara;","IV – promulgar a Lei Orgânica e suas emendas;","V – representar, junto ao Executivo, sobre necessidades de economia interna;","VI – contratar, na forma da lei, por tempo determinado, para atender a necessidade temporária de excepcional interesse público."],"nt":[]},{"id":"lom:52","n":"52","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["Compete ao Presidente da Câmara:","I – exercer, em substituição a chefia do Executivo Municipal nos casos previstos em lei.","II – representar a Câmara em juízo e fora dele:","III – dirigir, executar e disciplinar os trabalhos legislativos e administrativos da Câmara;","IV – interpretar e fazer cumprir o Regimento Interno;","V – promulgar as resoluções e os decretos legislativos;","VI – promulgar as leis com sanção tácita ou cujo veto tenha sido rejeitado pelo plenário, desde que não aceita esta decisão, em tempo hábil pelo chefe do Executivo Municipal;","VII – fazer publicar os atos da Mesa, as resoluções, decretos legislativos e as leis que vier a promulgar;","VIII – apresentar ao Plenário até o dia 20 de cada mês, o balancete relativo aos recursos recebidos e às despesas realizadas no mês anterior;","IX – requisitar o duodécimo destinado às despesas da Câmara;","X – autorizar as despesas da Câmara;","XI – representar, por decisão da Câmara, sobre a inconstitucionalidade de lei ou ato municipal;","XII – solicitar, por decisão de dois terços (2/3) da Câmara, a intervenção no Município nos casos admitidos pela Constituição Federal e pela Constituição Estadual;","XIII – prestar informações requeridas por certidões para esclarecimentos de situações;","XIV – encaminhar, para parecer prévio, a prestação de contas do Município ao Tribunal de Contas do Estado do Rio Grande do Norte ou órgão a que for atribuída tal competência;","XV – requisitar força policial quando necessárias à preservação da regularidade e funcionamento da Câmara; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVI – empossar o Prefeito e o Vice-Prefeito após a investidura dos mesmos nos respectivos cargos perante o Plenário;","XVII – empossar os Vereadores que, por motivo justificado, não tomaram posse com os demais, nos termos desta Lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVIII – declarar extintos os mandatos do Prefeito, do Vice-Prefeito e de Vereadores, nos casos previstos em Lei, em face de deliberação do Plenário, expedindo Decreto Legislativo de cassação dos respectivos mandatos. (Redação dada pela Emenda 04/2016)"],"nt":[]},{"id":"lom:53","n":"53","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["O processo legislativo municipal compreende a elaboração de:","I – emendas à Lei Orgânica Municipal;","II – leis complementares;","III – leis ordinárias;","IV – leis delegadas;","V – medidas provisórias;","VI – decretos legislativos; e","VII – resoluções."],"nt":[]},{"id":"lom:54","n":"54","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["A Lei Orgânica Municipal poderá ser emendada mediante proposta:","I – de um terço, no mínimo, dos membros da Câmara Municipal;","II – do Prefeito Municipal;","III – de iniciativa popular;","§ 1º A proposta será votada em dois turnos com interstício mínimo de dez dias, e aprovada por dois terços dos membros da Câmara Municipal.","§ 2º A emenda à Lei Orgânica Municipal será promulgada pela Mesa da Câmara com o respectivo número de ordem.","§ 3º A Lei Orgânica não poderá ser emendada na vigência de estado de sítio ou de intervenção no Município."],"nt":[]},{"id":"lom:55","n":"55","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["A iniciativa das leis complementares e ordinárias cabe a qualquer Vereador, Comissão Permanente da Câmara ao Prefeito e aos cidadãos, na forma e nos casos previstos nesta Lei Orgânica. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único : A iniciativa popular poderá ser exercida pela apresentação à Câmara Municipal de proposição legislativa subscrita por no mínimo cinco por cento do eleitorado municipal. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:56","n":"56","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["As leis complementares somente serão aprovadas se obtiverem maioria absoluta dos votos dos membros da Câmara Municipal, observados os demais termos de votação das leis ordinárias.","Parágrafo único Serão leis complementares dentre outras previstas nesta Lei Orgânica:","I – Código Tributário do Município;","II – Código de Obras;","III – Código de Posturas;","IV – Lei instituidora do regime jurídico único dos servidores municipais,","V – Código urbanístico;","VI – Código de zoneamento;","VII – Lei Orgânica instituidora da guarda municipal;","VIII – Lei de criação de cargos, funções ou empregos públicos;","IX – Lei que institua o Plano Diretor do Município;","X – Código de parcelamento do solo."],"nt":[]},{"id":"lom:57","n":"57","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["São de iniciativa exclusiva do Prefeito as leis que disponham sobre:","I – criação, transformação ou extinção de cargos, funções ou empregos públicos na Administração Direta e Autárquica e sua remuneração; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – servidores públicos do Poder Executivo, da Administração Indireta e autárquicas, seu regime jurídico, provimento de cargos, estabilidade e aposentadorias;","III – criação, estruturação e atribuições das Secretarias, Departamentos ou Diretorias equivalentes e órgãos de Administração Pública;","IV – matéria orçamentária, e a que autorize a abertura de créditos ou conceda auxílios e subvenções;","Parágrafo único Não será admitido aumento da despesa prevista nos projetos de iniciativa exclusiva do Prefeito Municipal, ressalvado o disposto no inciso IV, primeira parte, deste artigo."],"nt":[]},{"id":"lom:58","n":"58","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["É da competência exclusiva da Mesa da Câmara a iniciativa das proposições legislativa que disponham sobre: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – autorização para abertura de créditos suplementares ou especiais, através do aproveitamento total ou parcial das consignações orçamentárias da Câmara; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – organização dos serviços administrativos da Câmara, criação, transformação ou extinção de seus cargos, empregos e funções e fixação da respectiva remuneração.","Parágrafo único Nos projetos de competência exclusiva da Mesa da Câmara não serão admitidas emendas que aumentem a despesa prevista, ressaltando o disposto na parte final do inciso II deste artigo, se assinada pela metade dos Vereadores. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:59","n":"59","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["O Prefeito poderá solicitar urgência para apreciação de Projetos de sua iniciativa.","§ 1º Solicitada a urgência, a Câmara deverá se manifestar em até trinta dias sobre a proposição, contados da data em, que for feita a solicitação.","§ 2º Esgotado o prazo previsto no parágrafo anterior sem deliberação pela Câmara, será a proposição incluída na Ordem do Dia, sobrestando-se ás demais proposições, para que se ultime a votação, exceto Medida Provisória, Vetos e Leis Orçamentárias.","§ 3º O prazo do § 1º não corre no período de recesso da Câmara, nem se aplica aos projetos de códigos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:60","n":"60","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["Aprovado o projeto de lei será este enviado ao Prefeito no prazo de dez dias úteis que, aquiescendo, o sancionará.","§ 1º O Prefeito, considerando o projeto, no todo ou em parte, inconstitucional ou contrário ao interesse público, vetá-lo-á total ou parcialmente, no prazo de quinze dias úteis, contados da data do recebimento, comunicando dentro do prazo de 48 (quarenta e oito) horas ao Presidente da Câmara Municipal os motivos do veto. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Decorrido o prazo do parágrafo anterior, o silêncio do Prefeito importará sanção.","§ 3º O veto parcial somente abrangerá texto integral de artigo, de parágrafo, de inciso ou de alínea.","§ 4º A apreciação do veto, pelo plenário da Câmara, será feita dentro de trinta dias úteis a contar do seu recebimento, em uma só discussão e votação, com parecer escrito ou sem ele, considerando-se rejeitado pelo voto da maioria absoluta dos Vereadores. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 5º Rejeitado o veto, será o projeto enviado ao Prefeito em quarenta e oito horas para promulgação.","§ 6º Esgotado sem deliberação o prazo estabelecido no § 4º, o veto será colocado na Ordem do Dia da sessão imediata, sobrestados as demais proposições, até a sua votação final, ressalvadas as matérias de que trata o art. 59 dessa Lei Orgânica.","§ 7º A não promulgação da lei no prazo de quarenta e oito horas pelo Prefeito nos casos dos §§ 2º e 5º, autoriza o Presidente da Câmara a fazê-lo em igual prazo e, no caso deste, não promulgá-la, caberá ao Vice- Presidente obrigatoriamente fazê-lo."],"nt":[]},{"id":"lom:61","n":"61","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["As leis delegadas serão elaboradas pelo Prefeito, que deverá solicitar a delegação à Câmara Municipal.","§ 1º Os atos de competência privativa da Câmara, a matéria reservada à lei complementar, os planos plurianuais e orçamentos não serão objeto de delegação.","§ 2º A delegação ao Prefeito será efetuada sob a forma de decreto legislativo, que especificará o seu conteúdo e os termos de seu exercício.","§ 3º O decreto legislativo poderá determinar a apreciação do projeto pela Câmara, que fará em votação única, vedada a apresentação de emenda."],"nt":[]},{"id":"lom:62","n":"62","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["O Prefeito Municipal, em caso de calamidade pública, poderá adotar a medida provisória, com força de lei, para a abertura de crédito extraordinário, devendo submetê-lo de imediato à Câmara Municipal, que estando em recesso, será convocada extraordinariamente para se reunir no prazo de cinco dias.","Parágrafo único A medida provisória perderá a eficácia desde a edição, se não for convertida em lei no prazo de trinta dias, a partir de sua publicação, devendo a Câmara Municipal disciplinar as relações jurídicas dela decorrentes. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:63","n":"63","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["Os projetos de resolução disporão sobre matérias de interesse interno da Câmara e os projetos e decreto legislativo sobre os demais casos de sua competência privativa.","Parágrafo único Nos casos de projeto de resolução e de projeto de decreto legislativo, considerar-se-á concluída a deliberação com a votação final a elaboração da norma jurídica, que será promulgada pelo Presidente da Câmara."],"nt":[]},{"id":"lom:64","n":"64","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO V — Do Processo Legislativo"],"t":["A matéria constante de projeto de lei rejeitado somente poderá ser objeto de novo projeto, na mesma sessão legislativa, mediante proposta da maioria absoluta dos membros da Câmara."],"nt":[]},{"id":"lom:65","n":"65","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO VI — Da Fiscalização Contábil, Financeira e Orçamentária"],"t":["A fiscalização contábil, financeira, orçamentária, operacional e patrimonial do Município de Mossoró, será exercida pela Câmara Municipal, mediante controle externo, e pelos sistemas de controle interno do Executivo, instituídos em lei.","§ 1º O controle externo da Câmara será exercido com o auxílio do Tribunal de Contas do Estado ou órgão estadual a que for atribuído essa competência, e compreenderá a apreciação das Contas do Prefeito e da Mesa da Câmara, o acompanhamento das atividades financeiras e orçamentárias bem como o julgamento das contas dos administradores e demais responsáveis por bens e valores públicos.","§ 2º As contas do Prefeito e da Câmara Municipal, prestadas anualmente, serão julgadas pela Câmara, dentro de sessenta dias após o recebimento do parecer prévio do Tribunal de Contas ou órgão estadual a que for atribuída essa competência, vedado o julgamento ficto, ou seja, o parecer deverá ser necessariamente deliberado pelo Poder Legislativo, único com atribuição e competência para julgar aludidas contas.","§ 3º Somente por decisão de dois terços dos membros da Câmara Municipal deixará de prevalecer o parecer emitido pelo Tribunal de Contas do Estado ou órgão estadual incumbido dessa missão.","§ 4º As contas do Município ficarão, no decurso do prazo previsto no §2º deste artigo, à disposição de qualquer contribuinte para exame e apreciação, o qual poderá questionar- lhes a legalidade, nos termos da lei.","§ 5º As contas relativas à aplicação dos recursos transferidos pela União e Estado serão prestadas na forma da legislação federal e estadual em vigor, podendo o Município suplementá-las sem prejuízo de sua inclusão na prestação anual de contas."],"nt":[]},{"id":"lom:66","n":"66","tag":"","b":"D","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO VI — Da Fiscalização Contábil, Financeira e Orçamentária"],"t":["O Executivo manterá sistema de controle interno, a fim de: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – criar condições indispensáveis para assegurar eficácia ao controle externo e regularidade à realização da receita e despesa;","II – acompanhar as execuções de programas de trabalho e do orçamento;","III – avaliar os resultados alcançados pelos administradores;","IV – verificar a execução dos contratos."],"nt":[]},{"id":"lom:67","n":"67","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["O Poder Executivo Municipal é exercido pelo Prefeito, auxiliado pelos Secretários Municipais ou Diretores com atribuições equivalentes ou assemelhadas.","Parágrafo único Aplicar-se a elegibilidade para Prefeito e Vice-Prefeito o disposto no § 1º do art. 29 desta Lei Orgânica, no que couber, e a idade mínima de vinte e um anos."],"nt":[]},{"id":"lom:68","n":"68","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["A eleição do Prefeito e do Vice-Prefeito realizar-se-á simultaneamente com a de Vereadores, nos termos estabelecido no art. 29, inciso I e II da Constituição Federal. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A eleição do Prefeito importará a do Vice-Prefeito com ele registrado."],"nt":[]},{"id":"lom:69","n":"69","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["No ato da posse e no término do mandato, o Prefeito e o Vice-Prefeito farão declaração pública de seus bens, as quais serão transcritas em livro próprio, resumidas em atas e divulgadas para o conhecimento público."],"nt":[]},{"id":"lom:70","n":"70","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["Ressalvados os pleitos suplementares, o Prefeito e o Vice-Prefeito tomarão posse no dia 1º de janeiro do ano subsequente à eleição, em sessão da Câmara Municipal prestando o compromisso de manter, defender e cumprir a Lei Orgânica, observar as leis da União do Estado e do Município, promover o bem geral dos munícipes e exercer cargo sob a inspiração da democracia, da legitimidade e da legalidade. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Decorridos dez dias da data fixada para a posse, se o Prefeito e/ou o Vice-Prefeito, salvo motivo de força maior, não tiverem assumido os cargos, estes serão declarados vagos."],"nt":[]},{"id":"lom:71","n":"71","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["Substituirá o Prefeito, no caso de impedimento o suceder-lhe-á, no caso de vaga, o Vice-Prefeito.","§ 1º O Vice-Prefeito não poderá recusar-se a substituir o Prefeito, sob pena de extinção do mandato.","§ 2º O Vice-Prefeito, além de outras atribuições que lhe forem conferidas por lei, auxiliará o Prefeito sempre que por ele for convocado para missões especiais."],"nt":[]},{"id":"lom:72","n":"72","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["Em caso de impedimento do Prefeito e do Vice- Prefeito, ou vacância do cargo, assumirá a administração municipal o Presidente da Câmara.","Parágrafo único A recusa do Presidente da Câmara, por qualquer motivo, a assumir o cargo do Prefeito, importará, automaticamente, em renúncia à sua função de dirigente do Legislativo, ensejando, assim, a eleição de outro membro para ocupar, como Presidente da Câmara, a chefia do Poder Executivo."],"nt":[]},{"id":"lom:73","n":"73","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["Verificando-se a vacância do cargo de Prefeito e inexistindo Vice- Prefeito, observar-se-á o seguinte:","I – Ocorrendo a vacância nos dois primeiros anos de mandato, dar-se-á eleição até noventa dias após a sua abertura, cabendo aos eleitos completar o período de seus anteriores. (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Ocorrendo a vacância nos dois últimos anos de mandato, assumirá o Presidente da Câmara, que completará o período. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:74","n":"74","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["O mandato de Prefeito é estipulado nos termos do que determina a Constituição Federal, tendo início em 1º de janeiro do ano seguinte ao da sua eleição."],"nt":[]},{"id":"lom:75","n":"75","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["O Prefeito e o Vice-Prefeito, quando no exercício dos respectivos cargos, não poderão, sem licença da Câmara Municipal, ausentar-se do Município por período superior a quinze dias, sob pena de perda do cargo ou de mandato.","Parágrafo único O Prefeito regularmente licenciado terá direito a receber a remuneração, quando:","I – Impossibilidade de exercer o cargo, por motivo de doença devidamente comprovada;","II – Em gozo de férias;","III – A serviço ou em missão de representação do Município."],"nt":[]},{"id":"lom:76","n":"76","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["O Prefeito gozará férias anuais de trinta dias, sem prejuízo da remuneração, ficando a seu critério a época para usufruir do descanso."],"nt":[]},{"id":"lom:77","n":"77","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO I — Do Prefeito e do Vice-Prefeito"],"t":["A remuneração do Prefeito será estipulada na forma do inciso XXIII do art. 37 dessa Lei Orgânica."],"nt":[]},{"id":"lom:78","n":"78","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO II — Das Atribuições do Prefeito"],"t":["Compete ao Prefeito, entre outras atribuições:","I – Iniciar o processo legislativo, na forma e casos previstos nesta Lei Orgânica;","II – Exercer a direção Superior da Administração Municipal;","III – Representar o Município em juízo e fora dele;","IV – Sancionar, promulgar e fazer publicar as leis aprovadas pela Câmara e expedir os Regulamentos para sua fiel execução; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Vetar, no todo ou em parte, os projetos de lei aprovados pela Câmara;","VI – Editar medidas provisórias na forma desta lei orgânica;","VII – Nomear e exonerar os secretários municipais e os diretores dos órgãos da Administração Pública Direta e Indireta; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VIII – Decretar, nos termos da lei a desapropriação por necessidade ou utilidade pública, ou por interesse Social;","IX – Expedir decretos, portarias e outros atos administrativos;","X – Permitir ou autorizar o uso de bens municipais, por terceiros;","XI – Prover os cargos públicos e expedir os demais atos referentes à situação funcional dos servidores;","XII – Enviar à Câmara Municipal: (Redação dada pela Emenda à Lei Orgânica 04/2016) a) Até 30 de agosto, antes do encerramento do primeiro exercício de cada novo mandato executivo, o projeto de lei relativo ao Plano Plurianual (PPA) e devolvido para sanção até o fim da sessão legislativa; (Redação dada pela Emenda à Lei Orgânica 04/2016) b) Até 15 de abril o projeto relativo à Lei de Diretrizes Orçamentárias e devolvido para sanção até o final do primeiro período da sessão legislativa; (Redação dada pela Emenda à Lei Orgânica 04/2016) c) Até e até 30 de agosto o projeto de lei orçamentária Anual e devolvido para sanção até o final da sessão legislativa; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XXIII – Encaminhar à Câmara, até 1º de março, a prestação de contas, bem como os balanços do exercício findo; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIV – Encaminhar aos órgãos competentes os planos de aplicação e as prestações de contas exigidas em lei;","XV – Fazer publicar os atos oficiais;","XVI – Informar à Câmara Municipal dentro do prazo de 30 (trinta) dias sobre os a celebração de convênio, acordo ou qualquer outro instrumento celebrado pelo Município com a União, Estado, pessoa jurídica de direito público interno, de direito privado, instituições estrangeiras ou multinacionais, quando se tratar de matéria assistencial, educacional, cultural ou técnica. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único O Prefeito poderá enviar mensagem à Câmara para propor modificação aos projetos de que trata as alíneas “a”, “b” e “c” do Inciso XII deste artigo enquanto não iniciada a votação na Comissão Permanente de Orçamento e Finanças da Câmara da parte cuja alteração é proposta. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:79","n":"79","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO II — Das Atribuições do Prefeito"],"t":["O Prefeito poderá delegar, por decreto, a seus auxiliares, as funções administrativas previstas no inciso XI e do Art. 78. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:80","n":"80","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO III — Da Perda e Extinção do Mandato"],"t":["É vedado ao Prefeito assumir outro cargo ou função na Administração Pública direta ou indireta, ressalvada a posse em virtude de concurso público e observado o disposto no Art. 22 desta Lei Orgânica.","§ 1º Ao Prefeito e ao Vice-Prefeito é vedado desempenhar cargo ou função, a qualquer título, em empresa privada. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º A infringência ao disposto neste artigo e em seu § 1º, implicará perda do mandato."],"nt":[]},{"id":"lom:81","n":"81","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO III — Da Perda e Extinção do Mandato"],"t":["As incompatibilidades declaradas no art. 40, seus incisos e letras desta Lei Orgânica, estendem-se, no que forem aplicáveis, ao Prefeito e aos Secretários Municipais ou autoridades equivalentes."],"nt":[]},{"id":"lom:82","n":"82","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO III — Da Perda e Extinção do Mandato"],"t":["São crimes de responsabilidade do Prefeito os previstos em lei federal."],"nt":[]},{"id":"lom:83","n":"83","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO III — Da Perda e Extinção do Mandato"],"t":["São infrações político-administrativas do Prefeito as previstas em lei federal.","Parágrafo único O Prefeito será julgado, pela prática de infrações político administrativas, perante a Câmara."],"nt":[]},{"id":"lom:84","n":"84","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO III — Da Perda e Extinção do Mandato"],"t":["Será declarado vago, pela Câmara Municipal, o cargo de Prefeito quando:","I – Ocorrer falecimento, renúncia até condenação por crime funcional ou eleitoral;","II – Deixar de tomar posse, salvo por motivo justo aceito pela Câmara, dentro de dez dias; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Infringir as normas dos artigos 40 e 75 desta Lei Orgânica;","IV – Perder ou tiver suspensos os direitos políticos."],"nt":[]},{"id":"lom:85","n":"85","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["O Prefeito Municipal, por intermédio de ato administrativo, estabelecerá as atribuições dos seus auxiliares diretos, definindo-lhes competências, deveres e responsabilidades."],"nt":[]},{"id":"lom:86","n":"86","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["São auxiliares diretos do Prefeito.","I – Os secretários municipais;","II – Os Diretores de órgãos da Administração Pública Direta e indireta.","§ 1º Os cargos são de livre nomeação e exoneração do Prefeito. (Redação dada pela Emenda à Lei Orgânica 04/2016) 2º. Os auxiliares diretos somente poderão usar veículo de propriedade do Poder Público Municipal, devidamente identificado, quando exclusivamente em serviço. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:87","n":"87","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["A lei municipal estabelecerá as atribuições dos auxiliares diretos do Prefeito, definindo-lhes competência, deveres e responsabilidades."],"nt":[]},{"id":"lom:88","n":"88","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["São condições essenciais para a investidura no cargo de secretário, Diretor ou assemelhado:","I – Ser brasileiro, nato ou naturalizado; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Estar no exercício dos direitos públicos políticos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Ser maior de vinte e um anos."],"nt":[]},{"id":"lom:89","n":"89","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["Além das atribuições fixadas em lei, compete aos secretários, Diretores ou assemelhados:","I – Subscrever atos e regulamentos referentes aos seus órgãos;","II – Expedir instruções para a boa execução das leis, decretos e regulamentações, nos limites de sua competência; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Apresentar ao Prefeito relatório anual dos serviços requisitados por suas Secretarias ou Órgãos;","IV – Comparecer à Câmara Municipal, sempre que convocados pela mesma, para prestação de esclarecimentos oficiais.","§ 1º Os decretos, atos e regulamentos referentes aos serviços autônomos ou autárquicos serão referenciados pelo Secretário da Administração.","§ 2º A infringência ao inciso IV deste artigo, sem justificação, importa em crime de responsabilidade, nos termos da lei federal."],"nt":[]},{"id":"lom:90","n":"90","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["Os secretários ou diretores são solidariamente responsáveis com o Prefeito pelos atos que assinarem, ordenarem ou praticarem."],"nt":[]},{"id":"lom:91","n":"91","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["Lei Municipal, de iniciativa do Prefeito, poderá criar Administração de Bairros e Subprefeituras nos Distritos.","§ 1º Aos Administradores de bairros ou subprefeitos, como delegados do Poder Executivo, compete.","I – Cumprir e fazer cumprir as leis, resoluções, regulamentos e mediante instruções expedidas pelo Prefeito, os atos da Câmara por ele aprovados;","II – Atender as reclamações das partes e encaminhá-las ao Prefeito, quando se tratar de matéria estranha às suas atribuições ou quando for o caso;","III – Indicar ao Prefeito as providências necessárias ao Bairro ou Distrito;","IV – Fiscalizar os serviços que lhes são afetos;","V – Prestar contas ao Prefeito mensalmente ou quando lhes forem solicitadas."],"nt":[]},{"id":"lom:92","n":"92","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["O subprefeito, em caso de licença ou impedimento, será substituído por pessoa de livre escolha do Prefeito."],"nt":[]},{"id":"lom:93","n":"93","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO IV — Dos Auxiliares Diretos do Prefeito"],"t":["Os auxiliares diretos do Prefeito apresentarão declaração de bens no ato da posse e no término do exercício do cargo, que constará dos arquivos da Prefeitura."],"nt":[]},{"id":"lom:94","n":"94","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO V — Da Participação e Consulta Popular"],"t":["A soberania popular será exercida pelo sufrágio universal e pelo voto direto e secreto, com valor igual para todos, e nos termos da lei, mediante:","I – Plebiscito;","II – Referendo;","III – Iniciativa popular."],"nt":[]},{"id":"lom:95","n":"95","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO V — Da Participação e Consulta Popular"],"t":["O Prefeito Municipal poderá realizar consultas populares para decidir sobre assuntos de interesse específico do Município, de bairro ou de distrito, cujas medidas devem ser tomadas diretamente pela administração municipal.","§ 1º A consulta popular poderá ser realizada sempre que a maioria absoluta dos membros da Câmara ou pelo menos cinco por cento do eleitorado do Município, com a identificação do título eleitoral apresentarem proposições nesse sentido. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º A votação será organizada pelo Poder Executivo no prazo de dois meses após a apresentação da proposição, adotando-se cédula oficial, que conterá as palavras SIM e NÃO, indicando respectivamente, aprovação ou rejeição da proposição.","I – A proposição será considerada aprovada se o resultado lhe tiver sido favorável pelo voto da maioria dos eleitores que comparecerem às urnas, em manifestação a que se tenham apresentado pelo menos cinquenta por cento da totalidade dos eleitores envolvidos;","II – Serão realizadas, no máximo, duas consultas por ano;","III – Vedada a realização de consulta popular nos quatro meses que antecedem as eleições para qualquer nível de governo."],"nt":[]},{"id":"lom:96","n":"96","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO V — Da Participação e Consulta Popular"],"t":["O Prefeito Municipal proclamará o resultado da consulta popular, que será considerado como decisão sobre a questão proposta, devendo o governo municipal, adotar as providências legais para a sua execução."],"nt":[]},{"id":"lom:97","n":"97","tag":"","b":"E","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO II — Do Poder Executivo","SEÇÃO V — Da Participação e Consulta Popular"],"t":["Todos os órgãos e instituições dos poderes do Município são acessíveis ao cidadão, por petição ou representação, em defesa de direito ou em salvaguarda cívica do interesse coletivo e do meio ambiente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A autoridade municipal a qual for dirigida a petição ou representação deverá oficializar o seu ingresso, assegurando- lhe tramitação rápida, dando-lhe fundamento legal ao exarar a decisão.","§ 2º O interessado deverá ser informado da solução aprovada, por correspondência oficial, no prazo de sessenta dias a contar do protocolo, sendo-lhe fornecida certidão, se a requerer.","§ 3º É facultado a todos o acesso gratuito ao conhecimento do que constar a seu respeito nos registros em banco de dados do Município, públicos, ou privados, bem como do fim a que se destinam essas informações, podendo exigir, a qualquer tempo, sua retificação e atualização.","§ 4º qualquer cidadão é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural, ficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da sucumbência.","§ 5º Qualquer cidadão, partido político, associação ou sindicato de classe é parte legitima para denunciar irregularidades ou abusos, perante a autoridade competente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 6º A denúncia deverá ser instruída com documentos que revelem indícios suficientes a apuração dos fatos.","§ 7º Assiste ao cidadão legitimidade para postular perante os órgãos públicos municipais, a apuração de responsabilidade, em caso de danos ao meio ambiente, conforme o disposto em lei."],"nt":[]},{"id":"lom:98","n":"98","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO III — Da Estrutura Administrativa"],"t":["A Administração Municipal é constituída dos órgãos integrados na estrutura administrativa da Prefeitura e de entidades dotadas de personalidade jurídicas próprias que a compõem. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º Os órgãos da administração direta que compõem a estrutura administrativa da Prefeitura se organizam e se coordenam atendendo aos princípios técnicos recomendáveis ao bom desempenho de suas atribuições.","§ 2º As entidades dotadas de personalidade jurídica própria que compõem a Administração Indireta do município se classificam em:","I – Autarquia - o serviço autônomo, criado por Lei, com personalidade jurídica, patrimônio e receita próprios, para executar atividades típicas da administração pública, que requeiram, para seu melhor funcionamento, gestão administrativa e financeira descentralizadas;","II – Empresa pública - a entidade dotada de personalidade jurídica de direito privado, com patrimônio e capital exclusivo do Município, criada por lei para exploração de atividades econômicas que o governo municipal seja levado a exercer, por força de contingência ou conveniência administrativa, podendo revestir-se de qualquer das formas admitidas em direito;","III – Sociedade de economia mista - a entidade dotada de personalidade jurídica de direito privado, criada por lei, para exploração de atividades econômicas, sob a forma de sociedade anônima, cujas ações com direito a voto pertençam, em sua maioria, ao Município ou entidade da Administração Indireta;","IV – Fundação pública - a entidade dotada de personalidade jurídica de direito privado, sem fins lucrativos, criada em virtude da autorização legislativa, para o desenvolvimento de atividades que não exijam execução por órgão.","§ 3º A entidade de que trata o inciso IV do § 2º deste artigo adquire personalidade jurídica com a inscrição de escritura pública de sua constituição ao registro civil de Pessoas Jurídicas, não se lhe aplicando as demais disposições do Código Civil concernentes às fundações."],"nt":[]},{"id":"lom:99","n":"99","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO I — Da Publicidade dos Atos Municipais"],"t":["A publicação das leis e atos municipais far-se-á por meio de veículo oficial de imprensa, nos meios eletrônicos e físicos. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º (Revogado pela Emenda à Lei Orgânica à Lei Orgânica 04/2016)","§ 2º Nenhum ato produzirá efeito antes de sua publicação.","§ 3º A publicação dos atos não normativos pela imprensa poderá ser resumida."],"nt":[]},{"id":"lom:100","n":"100","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO I — Da Publicidade dos Atos Municipais"],"t":["O Prefeito fará publicar:","I – Diariamente, por edital, o movimento de caixa do dia anterior;","II – Mensalmente, o balancete resumido da receita e da despesa;","III – Mensalmente, os montantes de cada um dos tributos arrecadados e recursos recebidos;","IV – Anualmente, até 15 de março, pelo órgão oficial do Estado, as contas da administração, constituídas do balanço financeiro, do balanço patrimonial, do balanço orçamentário e demonstração das variações patrimoniais, sua forma sintética.","Parágrafo único A infringência aos incisos deste artigo, sem justificação, importa em crime de responsabilidade, nos termos da lei federal. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:101","n":"101","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO II — Dos Atos Administrativos"],"t":["Os atos administrativos de competência do Prefeito devem ser expedidos com obediência às seguintes normas:","I – decreto, numerado em ordem cronológica, nos seguintes casos:","a) regulamentação de leis;","b) instituição, modificação ou extinção de atribuições não constantes de lei;","c) regulamentação interna dos órgãos que forem criados na administração municipal;","d) abertura de créditos especiais e suplementares, até o limite autorizado por lei, assim como de créditos extraordinários;","e) declaração de utilidade pública ou necessidade social, para luta de desapropriação ou de servidão administrativa;","f) aprovação de regulamento ou de regimento das entidades que compõem a administração municipal;","g) Permissão para exploração de serviços públicos e uso dos bens municipais;","h) Medidas exercidas do Plano Diretor do Município; i) Normas de efeitos externos, não privativos de lei; j) Fixação e alteração de preços dos serviços prestados pelo Município.","II – portarias, nos seguintes casos:","a) Provimento e vacância dos cargos públicos e demais atos de efeitos individuais;","b) lotação e relotação nos quadros de pessoal;","c) Abertura de sindicância e processos administrativos, aplicação de penalidades e demais atos individuais de efeitos internos;","d) Instituir e destituir grupos de trabalhos;","e) Outros casos determinados em lei ou decreto.","III – contrato, nos seguintes casos:","a) Admissão de servidores para serviços de caráter temporário, nos termos do art. 17º, IX, Lei Orgânica;","b) Execução de obras e serviços municipais, nos termos da Lei.","§ 1º Os atos constantes dos itens II e III deste artigo poderão ser delegados.","§ 2º Os casos não previstos neste artigo obedecerão à forma de atos, instruções ou avisos da autoridade responsável."],"nt":[]},{"id":"lom:102","n":"102","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO III — Das Proibições"],"t":["O Prefeito, o Vice-Prefeito, os Vereadores e os servidores municipais, bem como as pessoas ligadas a qualquer deles por patrimônio ou parentesco, afim ou consanguíneo, até o segundo grau, ou por adoção, não poderão contratar com o Município, subsistindo a proibição até seis meses depois de findas as respectivas funções.","Parágrafo único Não se incluem nesta proibição os contratos cujas cláusulas e condições sejam uniformes para todos os interessados."],"nt":[]},{"id":"lom:103","n":"103","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO III — Das Proibições"],"t":["A pessoa jurídica em débito com o sistema de seguridade social, como estabelecido em lei federal, não poderá contratar como Poder Público Municipal nem dele receber benefícios ou incentivos fiscais ou creditícios."],"nt":[]},{"id":"lom:104","n":"104","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO IV — Dos Atos Municipais","SEÇÃO IV — Das Certidões"],"t":["A Prefeitura e a Câmara são obrigadas a fornecer a qualquer interessado, no prazo máximo de quinze dias, certidões dos atos, contratos e decisões, desde que requeridas para fim de direito determinado, sob pena de responsabilidade da autoridade ou servidor que negar ou retardar a sua expedição. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único As certidões relativas ao Poder Executivo serão fornecidas pelo Secretário da Administração da Prefeitura, exceto as declaratórias de efetivo exercício do Prefeito, que serão fornecidas pelo Presidente da Câmara."],"nt":[]},{"id":"lom:105","n":"105","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["Cabe ao Prefeito a administração dos bens municipais, respeitada a competência da Câmara quanto àqueles utilizados em seus serviços."],"nt":[]},{"id":"lom:106","n":"106","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["Todos os bens municipais deverão ser cadastrados, com a identificação respectiva, numerando-se os móveis segundo o que for estabelecido em regulamento, os quais ficarão sob a responsabilidade do chefe da Secretaria ou Diretoria a que forem distribuídos.","Parágrafo único : Compete ao órgão responsável dar publicidade da descrição detalhada e a localização do bem móvel adquirido. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:107","n":"107","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["Os bens patrimoniais do Município deverão ser classificados:","I – Pela sua natureza;","II – Em relação a cada serviço;","Parágrafo único Deverá ser feita anualmente a conferência da escrituração patrimonial com os bens existentes e, na prestação de contas de cada exercício, será incluído o inventário de todos os bens, quando móveis, dependerá apenas de concorrência pública, dispensada esta nos casos de doação, que será permitida exclusivamente para fins assistenciais ou quando houver interesse público relevante, justificada pelo Executivo. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:108","n":"108","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["A alienação de bens municipais, subordinada à existência de interesse público devidamente justificado, será sempre precedida de avaliação e obedecerá às seguintes normas:","I – Quando imóveis, dependerá de autorização legislativa e concorrência pública, dispensada esta nos casos de doação e permuta; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Quando móveis, dependerá apenas de concorrência pública, dispensada esta nos casos de doação, que será permitida exclusivamente para fins assistenciais ou quando houver interesse público relevante, justificada pelo Executivo."],"nt":[]},{"id":"lom:109","n":"109","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["O Poder Executivo Municipal mediante autorização do Poder Legislativo, aprovado por dois terços (2/3) dos seus membros, poderá vender qualquer imóvel pertencente ao patrimônio público municipal.","§ 1º Os recursos oriundos da venda de imóveis mencionados neste artigo deverão ser investidos em construção de moradias destinadas às pessoas pobres, na forma da Lei, à aquisição de outros bens públicos cuja destinação atenda à sua função social, bem como à manutenção destes. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º O adquirente, mediante acordo com o Executivo, poderá pagar o móvel adquirido construindo as moradias previstas no parágrafo anterior.","§ 3º O comprador, adquirindo imóvel do Município por força desta Lei, terá prazo de um ano para iniciar a construção e dois para concluí-la, a contar da transmissão do bem. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:110","n":"110","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["O Município, preferentemente à venda ou doação de seus bens imóveis, outorgará concessão de direito real de uso, mediante prévia autorização legislativa e concorrência pública.","§ 1º A concorrência poderá ser dispensada por lei quando o uso se destinar a concessionária de serviço público, a entidades assistenciais ou quando houver relevante interesse público devidamente justificado.","§ 2º A venda aos proprietários de imóveis lindeiros de áreas urbanas remanescentes e inaproveitáveis para edificações, resultante de obras públicas, dependerá apenas de prévia avaliação e autorização legislativa, dispensada a licitação.","§ 3º As áreas resultantes de modificações de alinhamentos serão alienadas nas mesmas condições previstas no parágrafo anterior."],"nt":[]},{"id":"lom:111","n":"111","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["O Poder Executivo poderá regularizar a situação dos terrenos que tenham sido invadidos, loteando-os a preços acessíveis, na forma da Lei. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:112","n":"112","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["Os terrenos de propriedade do Município que forem doados a entidades filantrópicas, religiosas ou de representação profissional, terão área livre nunca inferior a trinta por cento (30%) da construção.","§ 1º Os donatários de terrenos de propriedade do Município ficam impedidos de aquisição de outros terrenos da municipalidade pelo prazo de cinco anos. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Deixando de ser cumprida sua função social a que foi inicialmente estabelecida, o bem doado será revertido ao patrimônio do município. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:113","n":"113","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["A aquisição de bens imóveis, por compra ou permuta, dependerá de prévia avaliação e autorização legislativa."],"nt":[]},{"id":"lom:114","n":"114","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["É proibida a doação, venda ou concessão de uso de qualquer fração dos parques, praças, jardins ou largos públicos, salvo se previsto no projeto urbanístico. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:115","n":"115","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["O uso de bens municipais por terceiros só poderá ser feito mediante concessão ou permissão a título precário e por tempo determinado, conforme exigência do interesse público.","§ 1º A concessão de uso dos bens públicos de uso especial e dominicais dependerá de lei e concorrência e será feita mediante contrato, sob pena de nulidade de ato, ressalvada a hipótese do § 1º do art. 110º desta Lei Orgânica.","§ 2º A concessão administrativa de bens públicos do uso comum somente poderá ser outorgada para finalidades escolares, de assistência social ou turística, mediante autorização legislativa.","§ 3º A permissão de uso, que poderá incidir sobre qualquer bem público, será feita, a titulo precário por ato unilateral do Prefeito, por meio de decreto."],"nt":[]},{"id":"lom:116","n":"116","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO V — Dos Bens Municipais"],"t":["A utilização e administração dos bens públicos de uso especial, como mercados, matadouros, terminais rodoviários, recintos de espetáculos e campos de esporte, serão feitas na forma da Lei e regulamentos respectivos."],"nt":[]},{"id":"lom:117","n":"117","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["É responsabilidade do Município, mediante licitação e de conformidade com os interesses e necessidades da população, prestar serviços públicos, diretamente ou sob regime de concessão ou permissão, bem como realizar obras públicas, podendo contratá-las em particular por meio de processo licitatório."],"nt":[]},{"id":"lom:118","n":"118","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["Nenhuma obra pública será realizada sem que conste no mínimo: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – O respectivo Projeto;","II – O orçamento do seu custo;","III – A Indicação dos recursos financeiros para o atendimento das respectivas despesas;","IV – A viabilidade do empreendimento, sua conveniência e oportunidade para o interesse público;","V – Apresentar Licença de Regularização de Operação válida emitida por órgão ambiental Municipal, Estadual ou Federal (Redação dada pela Emenda à Lei Orgânica 07/2018)"],"nt":[]},{"id":"lom:119","n":"119","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["A concessão ou a permissão de serviço público somente será efetivada com autorização da Câmara Municipal e mediante contrato, precedido de licitação.","§ 1º Serão nulas de pleno direito as concessões e permissões, bem como qualquer autorização para a exploração de serviço público, feitas em desacordo com o estabelecido neste artigo.","§ 2º Os serviços concedidos ou permitidos ficarão sempre sujeitos à regulamentação e à fiscalização da administração municipal, cabendo ao Prefeito Municipal aprovar as tarifas respectivas."],"nt":[]},{"id":"lom:120","n":"120","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["Os usuários estarão representados nas entidades prestadoras de serviços públicos nas formas que dispuser a legislação municipal, assegurando-se sua participação em decisões relativas a:","I – Planos e programas de expansão dos serviços;","II – Revisão da base de cálculo dos custos operacionais;","III – Política tarifária;","IV – Nível de atendimento da população em termos de quantidade e qualidade;","V – Mecanismos para atendimento de pedidos e reclamações dos usuários, inclusive para apuração de danos causados a terceiros.","Parágrafo único Em se tratando de empresas concessionárias ou permissionárias de serviços públicos, a obrigatoriedade mencionada neste artigo poderá constar do contrato de concessão ou permissão."],"nt":[]},{"id":"lom:121","n":"121","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["As entidades prestadoras de serviços públicos são obrigadas, no mínimo uma vez por ano, a dar ampla divulgação de suas atividades, informando em especial sobre planos de expansão, aplicação de recursos financeiros e realização de programas de trabalho."],"nt":[]},{"id":"lom:122","n":"122","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["Nos contratos de concessão ou permissão de serviços públicos, serão estabelecidos, dentre outros:","I – Os direitos dos usuários, inclusive as hipóteses de gratuidade;","II – As regras para a remuneração do capital e para garantir o equilíbrio econômico e financeiro de contrato;","III – As normas que possam comprovar eficiência no atendimento do interesse público, bem como permitir a fiscalização pelo Município, de modo a manter o serviço contínuo adequado e acessível;","IV – As regras para orientar a revisão periódica das bases de cálculo dos custos operacionais e de remuneração de capital, ainda que estipuladas em contrato anterior;","V – A remuneração dos serviços prestados aos usuários diretos, assim como a possibilidade de cobertura dos custos por cobrança a outros agentes beneficiados pela existência dos serviços;","IV – As condições de prorrogação, caducidade, rescisão e reversão da concessão ou permissão;","Parágrafo único Na concessão ou na permissão de serviços públicos, o Município reprimirá qualquer forma de abuso do poder econômico, principalmente as que visem à dominação do mercado, à exploração monopolista e aumento abusivo de lucros. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:123","n":"123","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["O Município poderá revogar a concessão ou a permissão dos serviços que forem executados em desconformidade com o contrato ou ato pertinente, bem como daqueles que se revelarem manifestamente insatisfatórios para o atendimento dos usuários. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:124","n":"124","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["As licitações para a concessão ou a permissão de serviços públicos deverão ser procedidas de ampla publicidade, com a devida publicação em veículo oficial de imprensa, bem como em jornais de ampla circulação no estado, mediante edital ou comunicado resumido. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:125","n":"125","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["As tarifas dos serviços públicos prestados diretamente pelo Município ou por órgão de sua administração descentralizada serão fixadas pelo Prefeito Municipal, cabendo à Câmara Municipal definir os serviços que serão remunerados pelo custo, acima do custo e abaixo do custo, tendo em vista seu interesse econômico e social.","Parágrafo único Na formação do custo dos serviços de natureza industrial, computar-se-ão, além das despesas operacionais e administrativas, as reservas para depreciação e reposição dos equipamentos e instalações, bem como previsão para expansão de serviços."],"nt":[]},{"id":"lom:126","n":"126","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["O Município poderá consorciar-se com outros municípios para a realização de obras ou prestação de serviços públicos do interesse comum.","Parágrafo único O Município deverá propiciar meios para criação, nos consórcios, de órgãos consultivos constituídos por cidadãos não pertencentes ao serviço público municipal."],"nt":[]},{"id":"lom:127","n":"127","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["Ao Município é facultado conveniar com a União ou com o Estado a prestação de serviços públicos de sua competência para a execução de serviços em padrões adequados ou quando houver interesse mútuo para a celebração do convênio.","Parágrafo único Na celebração de convênios de que trata este artigo, deverá o Município:","I – Propor os planos de expansão dos serviços públicos;","II – Propor critérios para fixação de tarifas;","III – Realizar avaliação periódica da prestação dos serviços."],"nt":[]},{"id":"lom:128","n":"128","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["A criação pelo Município de entidade de administração indireta para execução de obras ou prestação de serviços públicos só será permitida caso a entidade possa assegurar sua autossustentação financeira."],"nt":[]},{"id":"lom:129","n":"129","tag":"","b":"F","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO VI — Das Obras e Serviços Municipais"],"t":["Os órgãos colegiados das entidades de administração indireta do Município terão a participação obrigatória de um representante de seus servidores, eleito por estes mediante voto direto e secreto, conforme regulamentação a ser expedida por ato do Prefeito Municipal."],"nt":[]},{"id":"lom:130","n":"130","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["Compete ao Município instituir os seguintes tributos:","I – Imposto sobre:","a) Propriedade predial e territorial urbana;","b) Transmissão Inter vivos, a qualquer título, por ato oneroso de bens imóveis, por natureza ou acessão física e de direitos reais sobre imóveis, exceto de garantia, bem como cessão de direito à sua aquisição;","c) (Revogado pela Emenda à Lei Orgânica 01/2012);","d) Serviço de qualquer natureza, definidos em lei complementar.","II – Taxas, em razão do exercício do poder de polícia ou pela utilização efetiva ou potencial de serviços públicos específicos e divisíveis, prestados ao contribuinte ou postos à sua disposição;","III – Contribuição de melhoria, decorrente de obras públicas.","§ 1º O imposto previsto no inciso I poderá ser progressivo, nos termos da lei, de forma a assegurar o cumprimento da função social da propriedade.","§ 2º O imposto previsto no inciso I, alínea “b”, não incide sobre a transmissão de bens ou direitos incorporados ao patrimônio de pessoa jurídica em realização de capital, nem sobre a transmissão de bens ou direitos decorrentes de fusão, incorporação, cisão ou extinção de pessoa jurídica, salvo se, nestes casos, a atividade preponderante do adquirente for a compra e venda desses bens ou direitos, locação de bens imóveis ou arrendamento mercantil. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:131","n":"131","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["Sempre que possível os impostos terão caráter pessoal e serão graduados segundo a capacidade econômica do contribuinte, facultado, à administração municipal, especialmente para conferir efetividade a esses objetivos, identificar, respeitados os direitos individuais e nos termos da lei o patrimônio, os rendimentos e as atividades econômicas do contribuinte.","Parágrafo único As taxas não poderão ter base de cálculo própria de impostos."],"nt":[]},{"id":"lom:131-A","n":"131-A","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["Nenhum contribuinte será obrigado ao pagamento de qualquer tributo lançado pelo Município, sem prévia notificação. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º Da notificação do lançamento do crédito tributário, o contribuinte poderá ser cientificado pessoalmente, por via postal, por correspondência eletrônica ou por meio de publicação de edital em veículo oficial de imprensa. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Da notificação do lançamento do crédito tributário caberá reclamações e recursos, na forma disciplinada em lei, à Secretaria da Fazenda Municipal, competindo aos órgãos de julgamento decidir em nível de primeira e segunda instâncias administrativas. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:132","n":"132","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["O Município criará, na forma da lei, colegiado constituído paritariamente por servidores designados pelo Prefeito Municipal e contribuintes indicados por entidades representativas de categorias econômicas e profissionais, com atribuições para decidir, em grau de recurso, as reclamações sobre lançamentos e demais questões tributárias.","Parágrafo único (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:133","n":"133","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["O Prefeito Municipal promoverá, anualmente, a atualização da base de cálculo dos tributos municipais de acordo com os índices oficiais de atualização. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A base de cálculo do Imposto Predial e Territorial Urbano- IPTU, será atualizado anualmente, antes do término do exercício, para vigorar no seguinte, podendo ser criada comissão da qual participarão além dos servidores do Município, representantes dos contribuintes na forma prevista em Decreto do Prefeito Municipal.","§ 2º A atualização de base de cálculo do imposto municipal sobre serviços de qualquer natureza, cobrado de autônomos e sociedade civil, obedecerá aos índices oficiais de atualização e deverá ser realizada anualmente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º A atualização de base de cálculo das taxas decorrentes do exercício do poder de polícia municipal obedecerá aos índices de atualização e deverá ser realizada anualmente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º A atualização da base de cálculo das taxas de serviços será realizada de acordo com o disciplinado em Lei Complementar. (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – (Revogado pela Emenda à Lei Orgânica 04/2016)","II – (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:134","n":"134","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["Qualquer subsídio ou isenção, redução de base de cálculo, concessão de crédito presumido, anistia ou remissão, relativos a impostos, taxas ou contribuições, só poderá ser concedido mediante lei específica municipal, que regule exclusivamente as matérias tratadas neste capítulo ou correspondente a qualquer tributo, aprovada por 2/3 (dois terços) da Câmara Municipal. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:135","n":"135","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["A remissão de créditos tributários somente poderá ocorrer nos casos de calamidade pública ou notória pobreza do contribuinte, devendo a lei que a autorize ser aprovada por maioria de dois terços (2/3) dos membros da Câmara Municipal."],"nt":[]},{"id":"lom:136","n":"136","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["A isenção, ainda quando prevista em contrato, é sempre decorrente de lei que especifique as condições e requisitos exigidos para a sua concessão, os tributos a que se aplica e, sendo caso, o prazo de sua duração. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A isenção pode ser restrita a determinada região do território da entidade tributante, em função de condições a ela peculiares. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:137","n":"137","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["É de responsabilidade do órgão competente da Prefeitura Municipal a inscrição em dívida ativa de créditos provenientes de tributos de competência municipal e multas decorrentes de infrações à legislação tributária, com o prazo de pagamento fixado pela legislação ou por decisão proferida em processo com regular tramitação. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:138","n":"138","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO I — Dos Tributos Municipais"],"t":["Ocorrendo a decadência do direito de constituir crédito tributário ou a prescrição da ação de cobrá-lo, abrir-se-á inquérito administrativo para apurar as responsabilidades, na forma da lei, contra o servidor que praticar referidos atos.","Parágrafo único A autoridade municipal, qualquer que seja seu cargo, emprego ou função e independente do vínculo que possuir com o Município responderá civil, criminal e administrativamente pela prescrição ou decadência ocorridas sob sua responsabilidade, cumprindo-lhe indenizar o Município do valor dos créditos prescritos ou não lançados, em tempo hábil."],"nt":[]},{"id":"lom:139","n":"139","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO II — Dos Preços Públicos"],"t":["Para se obter o ressarcimento da prestação de natureza comercial ou industrial ou de sua atuação na organização e exploração de atividades econômicas, o Município poderá cobrar preços públicos.","Parágrafo único Os preços devidos pela utilização de bens e serviços municipais deverão ser fixados de modo a cobrir os custos dos respectivos serviços e serão reajustados quando se tomarem deficitários."],"nt":[]},{"id":"lom:139-A","n":"139-A","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO II — Dos Preços Públicos"],"t":["A fixação dos preços públicos, devidos pela utilização de bens, serviços e atividades municipais, será feita pelo Prefeito mediante edição de decreto. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único As tarifas dos serviços públicos deverão cobrir os seus custos, sendo reajustáveis quando se tornarem deficientes ou excedentes. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:140","n":"140","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["A receita municipal constituir-se-á de todos os recursos instituídos ou arrecadados pela Administração Pública com a finalidade de atender as necessidades da sociedade, recursos estes com fontes e fatos geradores próprios que são incorporados definitivamente ao patrimônio do Município, observada a legislação vigente. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":["Conferido no PDF oficial da compilação de 2024: o texto passa do art. 140 ao art. 142; não há art. 141."]},{"id":"lom:142","n":"142","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["(Revogado pela Emenda à Lei Orgânica 04/2016)","Parágrafo único (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:143","n":"143","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["Nenhum contribuinte será obrigado ao pagamento de qualquer tributo lançado pela Prefeitura, sem prévia notificação.","§ 1º Considera-se notificação a entrega do aviso de lançamento no domicílio fiscal do contribuinte, nos termos da lei complementar prevista na art.146 da Constituição Federal.","§ 2º Do lançamento do tributo cabe recursos ao Prefeito, assegurado para sua interposição o prazo de quinze dias, contados da notificação."],"nt":[]},{"id":"lom:144","n":"144","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["A despesa pública atenderá aos princípios estabelecidos na Constituição Federal e às normas de direito financeiro."],"nt":[]},{"id":"lom:145","n":"145","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["Nenhuma despesa será ordenada ou satisfeita sem que exista recurso disponível e crédito votado pela Câmara Municipal, salvo a que correr por conta de crédito extraordinário."],"nt":[]},{"id":"lom:146","n":"146","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["Nenhuma lei que crie ou aumente despesa será executada sem que dela conste a indicação do recurso para atendimento do correspondente encargo."],"nt":[]},{"id":"lom:147","n":"147","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO I — Da Receita e Da Despesa"],"t":["As disponibilidades de caixa do Município, de suas autarquias e fundações e das empresas por ele controladas serão depositadas em instituições financeiras oficiais, salvo os casos previstos em lei."],"nt":[]},{"id":"lom:148","n":"148","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["A elaboração e a execução do Plano Plurianual, da Lei de Diretrizes Orçamentárias e da Lei Orçamentária Anual obedecerão às regras estabelecidas na Constituição Federal, na Constituição do Estado, nas normas de Direito Financeiro e Orçamentário.","Parágrafo único O Poder Executivo publicará até trinta dias após o encerramento de cada bimestre, relatório resumido da execução orçamentária."],"nt":[]},{"id":"lom:148-A","n":"148-A","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["As emendas parlamentares ao projeto de Lei Orçamentária Anual, aprovadas pela Câmara Municipal de Mossoró, serão no limite global de 1,2% (um vírgula dois por cento) da receita corrente líquida prevista no projeto. (Redação dada pela Emenda à Lei Orgânica nº 02/2013 e 05/2017)","§ 1º É obrigatória a execução orçamentária e financeira, de forma isonômica e impositiva, da programação incluída em lei orçamentária por emendas parlamentares, em montante correspondente a 1,2 (um vírgula dois por cento) da receita corrente líquida realizada no exercício anterior.","§ 2º As emendas parlamentares serão divulgadas em audiências públicas.","§ 3º Se for verificado que a reestimativa da receita e da despesa poderá resultar no não cumprimento da meta de resultado fiscal estabelecida na Lei de Diretrizes Orçamentárias, o montante previsto no §1º deste artigo poderá ser reduzido em até a mesma proporção da limitação incidente sobre o conjunto das despesas discricionárias.","§ 4º Para fins do disposto no §1º deste artigo, a execução da programação será:","I – demonstrada no relatório de que trata o Art. 148, parágrafo único;","II – objeto de manifestação específica na prestação de contas prevista no art. 78, inciso XIII; e,","III – fiscalizada e avaliada quanto aos resultados obtidos.","§ 5º Consideram-se obrigatórias, nos termos da Lei de Diretrizes Orçamentárias, as transferências constitucionais para execução de programação prevista no §1º desse artigo. (Redação dada pela Emenda à Lei Orgânica nº 05/2017)"],"nt":[]},{"id":"lom:149","n":"149","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["Os projetos de lei relativos ao Plano Plurianual, Lei De Diretrizes Orçamentárias e ao Orçamento Anual, bem como os créditos adicionais serão apreciados pela Comissão Permanente de Orçamento e Finanças da Câmara, a qual caberá:","I – Examinar e emitir parecer sobre os projetos e as contas apresentadas anualmente pelo Prefeito Municipal;","II – Examinar e emitir parecer sobre os planos programas de investimentos e exercer o acompanhamento e fiscalização orçamentária, sem prejuízo de atuação das demais Comissões da Câmara;","III – As emendas serão apresentadas na Comissão, que sobre elas emitirá parecer, e apreciadas na forma regimental.","§ 2º As emendas ao projeto de lei do orçamento anual ou aos projetos que o modifiquem somente podem ser aprovadas caso:","I – Sejam compatíveis com o plano plurianual e Lei de Diretrizes Orçamentárias; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Indiquem os recursos necessário, admitidos apenas os provenientes de anulação de despesa, excluída as que incidam sobre:","a) Dotações para pessoal e seus encargos;","b) Serviço de dívida; ou c) Sejam relacionados com a correção de erros ou omissões; ou com os dispositivos do texto do projeto de lei.","§ 3º Os recursos que, em decorrência de veto, emenda ou rejeição do projeto de lei orçamentária anual, ficarem sem despesas correspondentes poderão ser utilizados, conforme o caso, mediante créditos especiais ou suplementares, com prévia e específica autorização legislativa."],"nt":[]},{"id":"lom:150","n":"150","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["A Lei Orçamentária Anual compreenderá: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – O orçamento fiscal referente aos Poderes do Município, seus fundos, órgãos e entidades da administração direta e indireta, inclusive fundações instituídas e mantidas pelo Poder Público; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – O orçamento de investimento das empresas em que o Município, direta ou indiretamente detenha a maioria do capital social com direito a voto;","III – O orçamento da seguridade social, abrangendo todas as entidades e órgãos a ela vinculados, da administração direta ou indireta, bem como os fundos e fundações instituídos e mantidos pelo Poder Público. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:151","n":"151","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["O Prefeito enviará à Câmara, no prazo consignado na lei complementar federal, a proposta de orçamento anual do Município para o exercício seguinte.","§ 1º (Revogado pela Emenda à Lei Orgânica 01/2012)","§ 2º O Prefeito poderá enviar mensagem à Câmara, para propor a modificação do projeto de lei orçamentária, enquanto não iniciada a votação da parte que deseja alterar."],"nt":[]},{"id":"lom:152","n":"152","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["A Câmara não enviando, no prazo consignado na Lei Complementar Federal, o projeto de lei orçamentária à sanção, será promulgada como lei, pelo Prefeito, o projeto originário do Executivo."],"nt":[]},{"id":"lom:153","n":"153","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["Rejeitado pela Câmara o projeto de lei orçamentária anual, prevalecerá, para o ano seguinte o orçamento do exercício em curso, aplicando-lhe a atualização dos valores."],"nt":[]},{"id":"lom:154","n":"154","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["Aplicam-se ao projeto de lei orçamentária, no que não contrariarem o disposto nesse Capitulo, as regras do processo legislativo."],"nt":[]},{"id":"lom:155","n":"155","tag":"","b":"G","h":["TÍTULO IV — Da Tributação Municipal e do Orçamento","CAPÍTULO III — Das Finanças Públicas","SEÇÃO II — Do Orçamento"],"t":["O orçamento será uno, in
