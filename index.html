será incluído na Ordem do Dia da primeira sessão ordinária subsequente, sendo vedada a apresentação de emendas em Plenário.","§ 2º Havendo emendas, o projeto será incluído na Ordem do Dia da primeira sessão após a publicação do parecer, que conterá a decisão sobre as emendas.","§ 3º Se a Comissão de Orçamento, Finanças e Contabilidade não observar os prazos a ela estipulados, o projeto será incluído na Ordem do Dia da sessão seguinte, como item único, independentemente de parecer, inclusive o de Relator Especial."],"nt":[]},{"id":"ri:280","n":"280","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["As sessões nas quais se discutem as leis orçamentárias terão a Ordem do Dia preferencialmente reservada a essas matérias, e só haverá o tempo destinado ao Grande Expediente.","§ 1º A Câmara funcionará, se necessário, em sessões extraordinárias, de modo que a discussão e votação dos projetos de plano plurianual, da lei de diretrizes orçamentárias e do orçamento anual estejam concluídas no prazo a que se referem os §§4º e 5º do art. Art. 274 deste Regimento.","§ 2º Se não apreciados pela Câmara nos prazos legais previstos, os projetos de lei a que se refere esta seção serão automaticamente incluídos na Ordem do Dia, sobrestando-se a deliberação quanto aos demais assuntos, para que se ultime a votação.","§ 3º Terão preferência na discussão o Relator da Comissão e os autores das emendas."],"nt":[]},{"id":"ri:281","n":"281","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["A sessão legislativa não será interrompida sem a manifestação sobre os projetos referidos nesta seção, suspendendo-se o recesso até que ocorra deliberação."],"nt":[]},{"id":"ri:282","n":"282","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["Aplicam-se aos projetos de lei do plano plurianual, de diretrizes orçamentárias e do orçamento anual, no que não contrariarem esta seção, as demais normas relativas ao processo legislativo."],"nt":[]},{"id":"ri:283","n":"283","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO I — Da Iniciativa Popular no Processo Legislativo"],"t":["A iniciativa popular pode ser exercida pela apresentação à Câmara Municipal de propostas de emendas à Lei Orgânica Municipal ou projetos de lei de interesse específico do Município, da cidade ou de bairros, a partir da manifestação de no mínimo 5% (cinco por cento) do eleitorado local, obedecidas as seguintes condições:","I – a assinatura de cada eleitor deverá ser acompanhada de seu nome completo e legível e dados identificadores de seu título eleitoral;","II – o projeto de lei de iniciativa popular terá a mesma tramitação dos demais, integrando sua numeração geral;","III – nas comissões ou em Plenário, poderá usar da palavra para discutir o projeto de lei, pelo prazo de 30 (trinta) minutos, o primeiro signatário ou quem este tiver escolhido quando da apresentação do projeto, com indicação de seu endereço para correspondência;","IV – cada projeto de lei deverá circunscrever-se a um mesmo assunto, podendo, caso contrário, ser desdobrado pela Comissão de Constituição, Justiça e Redação em proposições autônomas, para tramitação em separado;","V – não se rejeitará, liminarmente, projeto de lei de iniciativa popular por vícios de linguagem, lapsos ou imperfeições de técnica legislativa, incumbindo à Comissão de Constituição, Justiça e Redação corrigir os vícios formais para sua regular tramitação;","VI – a Mesa designará Vereador para exercer, em relação ao projeto de lei de iniciativa popular, os poderes ou atribuições conferidos por este Regimento ao autor de proposição, devendo a escolha recair sobre quem tenha sido previamente indicado com essa finalidade pelo primeiro signatário do projeto."],"nt":[]},{"id":"ri:284","n":"284","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO I — Da Iniciativa Popular no Processo Legislativo"],"t":["A participação popular no processo legislativo orçamentário far-se-á:","I – pelo acesso das entidades da sociedade civil à apreciação dos projetos de lei do plano plurianual, das diretrizes orçamentárias e do orçamento anual, no âmbito da Comissão Permanente de Orçamento, Finanças e Contabilidade, por meio da realização de audiências públicas, nos termos do Capítulo II deste Título.","II – pela apresentação de emendas populares nos projetos referidos no inciso anterior, desde que subscritas por no mínimo 5% (cinco por cento) do eleitorado, nos termos do Art. 283 deste Regimento e atendidas as disposições constitucionais reguladoras do poder de emenda."],"nt":[]},{"id":"ri:285","n":"285","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO I — Da Iniciativa Popular no Processo Legislativo"],"t":["Recebidos pela Câmara, os projetos de lei referidos no inciso I do artigo anterior serão imediatamente publicados ou afixados em local público, designando-se o prazo de 10 (dez) dias para o recebimento de emendas populares e as datas para a realização das audiências públicas, nos termos deste Regimento.","Parágrafo único. As emendas populares a que se refere este artigo serão recebidas e apreciadas pela Câmara na forma dos Art. 214 e Art. 215 deste Regimento."],"nt":[]},{"id":"ri:286","n":"286","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO II — Das Audiências Públicas"],"t":["A Câmara Municipal de Mossoró poderá realizar audiências públicas com entidades da sociedade civil para instruir matéria legislativa em trâmite, bem como para tratar de assuntos de interesse público relevante, mediante requerimento de qualquer vereador, aprovado em Plenário, por determinação da Presidência ou por deliberação de Comissão Permanente.","§ 1º As Comissões Permanentes poderão convocar audiência, atinente à sua área de atuação, englobando dois ou mais projetos de lei relativos à mesma matéria, bem como poderão realizar audiências conjuntas com outras comissões.","§ 2º A Presidência agendará as audiências públicas que forem exigidas por lei, inclusive para fins de tramitação de projeto de lei que dispuser sobre o plano diretor, conforme Lei Orgânica Municipal."],"nt":[]},{"id":"ri:287","n":"287","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO II — Das Audiências Públicas"],"t":["Aprovada a solicitação de audiência pública, serão convidadas, para serem ouvidas, as autoridades, as pessoas interessadas e os especialistas ligados às entidades cuja atividade seja afeta ao tema para expedição dos convites.","§ 1º Na hipótese de haver defensores e opositores relativamente à matéria objeto de exame, a condução da audiência deverá proceder de forma a possibilitar a participação das diversas correntes de opinião.","§ 2º Resolução própria definirá as regras, formas de participação, trâmites necessários e demais formalidades relativas à realização das audiências públicas."],"nt":[]},{"id":"ri:288","n":"288","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO II — Das Audiências Públicas"],"t":["A realização de audiências públicas solicitadas pela sociedade civil dependerá de:","I – requerimento subscrito por 0,1% (um décimo por cento) de eleitores do Município;","II – requerimento de entidades legalmente constituídas e em funcionamento há mais de um ano, sobre assunto de interesse público.","§ 1º O requerimento de eleitores deverá conter o nome legível, o número do título, zona e seção eleitoral e a assinatura ou impressão digital, se analfabeto.","§ 2º As entidades legalmente constituídas deverão instruir o requerimento com a cópia autenticada de seus estatutos sociais, registrado em cartório, ou do Cadastro Geral de Contribuintes (CGC), bem como cópia da ata da reunião ou assembleia que decidiu solicitar a audiência."],"nt":[]},{"id":"ri:289","n":"289","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO II — Das Audiências Públicas"],"t":["Da reunião de audiência pública lavrar-se-á ata, que conterá o resumo dos pronunciamentos e documentos tratados, devendo esta ser publicada em página institucional e arquivada no âmbito da Diretoria Legislativa."],"nt":[]},{"id":"ri:290","n":"290","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO III — Das Petições, Reclamações e Representações"],"t":["As petições, reclamações e representações de qualquer munícipe ou de entidade local, regularmente constituída há mais de 1 (um) ano, contra ato ou omissão das autoridades e entidades públicas, ou imputadas a membros da Câmara, serão recebidas e examinadas pelas Comissões ou pela Mesa desde que:","I – encaminhadas por escrito, vedado o anonimato do autor ou autores;","II – o assunto envolva matéria de competência da Câmara.","Parágrafo único. O membro da Comissão a que for distribuído o processo, exaurida a fase de instrução, apresentará relatório circunstanciado na conformidade do Art. 132 deste Regimento, no que couber, do qual se dará ciência aos interessados."],"nt":[]},{"id":"ri:291","n":"291","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO III — Das Petições, Reclamações e Representações"],"t":["A participação popular poderá, ainda, ser exercida por meio do oferecimento de pareceres técnicos, exposições e propostas oriundas de entidades cientificas ou culturais, de associações ou sindicatos e demais instituições representativas locais.","Parágrafo único. A contribuição da sociedade civil será examinada por Comissão cuja área de atuação tenha pertinência com a matéria contida no documento recebido."],"nt":[]},{"id":"ri:292","n":"292","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO IV — Do Plebiscito e do Referendo"],"t":["As questões de relevante interesse do Município ou do Distrito serão submetidas a plebiscito, mediante proposta fundamentada de iniciativa da maioria dos membros da Câmara Municipal ou de no mínimo 5% (cinco por cento) dos eleitores inscritos no Município.","Parágrafo único. A aprovação da proposta a que se refere este artigo depende do voto favorável de 2/3 (dois terços) dos membros da Câmara."],"nt":[]},{"id":"ri:293","n":"293","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO IV — Do Plebiscito e do Referendo"],"t":["Aprovada a proposta, caberá ao Poder Executivo, no prazo de 180 (cento e oitenta) dias, a realização do plebiscito, nos termos da lei municipal que o instituir.","§ 1º Só poderá ser realizado um plebiscito em cada sessão legislativa.","§ 2º A proposta que já tenha sido objeto de plebiscito somente poderá ser reapresentada depois de 5 (cinco) anos de carência."],"nt":[]},{"id":"ri:294","n":"294","tag":"","b":"H","h":["TÍTULO VIII — DA PARTICIPAÇÃO POPULAR","CAPÍTULO IV — Do Plebiscito e do Referendo"],"t":["A efetiva vigência dos projetos de lei que tratem de interesses relevantes do Município ou do Distrito dependerá de referendo popular quando propostos pela maioria dos membros da Câmara Municipal ou por no mínimo 5% (cinco por cento) dos eleitores inscritos no Município.","§ 1º A aprovação da proposta a que se refere este artigo depende do voto favorável de 2/3 (dois terços) dos membros da Câmara.","§ 2º A utilização e realização do referendo popular serão regulamentadas por lei complementar municipal."],"nt":[]},{"id":"ri:295","n":"295","tag":"","b":"H","h":["TÍTULO IX — DO JULGAMENTO DAS CONTAS DO PREFEITO E DA MESA","CAPÍTULO ÚNICO — Do Procedimento do Julgamento"],"t":["Recebidos os processos do Tribunal de Contas do Estado, com os respectivos pareceres prévios a respeito da aprovação ou rejeição das contas do Prefeito e da Mesa, o Presidente, independentemente de sua leitura em Plenário, mandará publicá-los, remetendo-os à Diretoria Legislativa, onde permanecerá à disposição dos Vereadores.","§ 1º Após a publicação, os processos serão enviados à Comissão de Orçamento, Finanças e Contabilidade, que terá prazo de 30 (trinta) dias para emitir pareceres, opinando sobre a aprovação ou rejeição dos pareceres do Tribunal de Contas.","§ 2º Se a Comissão de Orçamento, Finanças e Contabilidade não observar o prazo fixado, o Presidente designará um Relator Especial, que terá o prazo improrrogável de 10 (dez) dias, para emitir pareceres.","§ 3º O Prefeito responsável pelas contas julgadas pelo Tribunal de Contas do Estado deverá ser notificado conforme as normas processuais civis para a apresentação de manifestação escrita, no prazo de 15 (quinze) dias.","§ 4º Se o notificado não apresentar a manifestação escrita no prazo previsto no parágrafo anterior, será considerado revel.","§ 5º Exarados os pareceres pela Comissão de Orçamento, Finanças e Contabilidade ou pelo Relator Especial, nos prazos estabelecidos, ou mesmo sem eles, o Presidente incluirá os pareceres do Tribunal de Contas na Ordem do Dia da sessão imediatamente posterior, para discussão e votação únicas, salvo se o prazo para a apresentação da manifestação escrita por parte do notificado ainda esteja aberto, caso no qual será aguardado o decurso do prazo.","§ 6º Nas sessões em que se discutirem as contas, a Ordem do Dia ficará, preferencialmente, reservada a essa finalidade.","§ 7º O resultado do julgamento das contas, após deliberação em plenário, deverá ser transformado em Decreto Legislativo e promulgado pela Presidência nos termos da Lei Orgânica Municipal."],"nt":[]},{"id":"ri:296","n":"296","tag":"","b":"H","h":["TÍTULO IX — DO JULGAMENTO DAS CONTAS DO PREFEITO E DA MESA","CAPÍTULO ÚNICO — Do Procedimento do Julgamento"],"t":["A Câmara tem o prazo máximo de 60 (sessenta) dias, a contar do recebimento dos pareceres prévios do Tribunal de Contas, para julgar as contas do Prefeito e da Mesa do Legislativo, observados os seguintes preceitos:","I – as contas do Município deverão ficar anualmente, durante 60 (sessenta) dias, à disposição de qualquer contribuinte, em local de fácil acesso, para exame e apreciação, o qual poderá questionarlhes a legitimidade nos termos da lei (art. 31, §3º, CF);","II – no período previsto no inciso anterior, a Câmara Municipal manterá servidores aptos a esclarecer os contribuintes;","III – o parecer do Tribunal de Contas somente poderá ser rejeitado por decisão de 2/3 (dois terços) dos membros da Câmara (art. 31, §2º CF);","IV – aprovadas ou rejeitadas as contas do Prefeito e da Mesa, serão publicados os pareceres do Tribunal de Contas com as respectivas decisões da Câmara Municipal e remetidos aos Tribunais de Contas da União e do Estado."],"nt":["CF, art. 31, §§ 2º e 3º; STF, Temas 835 e 157."]},{"id":"ri:297","n":"297","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador"],"t":["O Vereador deve comparecer às sessões plenárias e reuniões de comissões de que faça parte à hora regimental, ou no horário constante da convocação, só se escusando do cumprimento de tal dever em caso de licença, enfermidade, luto, missão autorizada ou investidura em cargo prevista neste Regimento.","Parágrafo único. Nos casos de enfermidade ou luto, o Vereador fará a prévia comunicação ao Presidente, com a comprovação que for necessária, sendo cientificado o Plenário."],"nt":[]},{"id":"ri:298","n":"298","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador"],"t":["A todo Vereador compete:","I – oferecer proposições, discutir as matérias, votar e ser votado;","II – encaminhar, por meio da Mesa Diretora, pedidos de informação a autoridades municipais sobre fatos relativos ao serviço público ou úteis à elaboração legislativa, observado o disposto neste Regimento;","III – usar da palavra, nos termos regimentais;","IV – integrar as comissões e representações externas e desempenhar missão autorizada;","V – examinar quaisquer documentos em tramitação ou existentes no arquivo, podendo deles tirar cópias ou obter certidões;","VI – utilizar-se dos serviços da Câmara, desde que para fins relacionados às suas funções;","VII – promover, perante quaisquer autoridades, entidades ou órgãos da administração municipal, direta ou indireta, os interesses públicos ou reivindicações coletivas de âmbito municipal ou das comunidades representadas;","VIII – indicar à Mesa Diretora, para nomeação em comissão, servidores de sua confiança, bem como requisitar servidores da Câmara para a sua assessoria, ficando o serviço sob sua inteira e absoluta responsabilidade;","IX – realizar outros cometimentos inerentes ao exercício do mandato ou atender a obrigações político-partidárias decorrentes da representação."],"nt":[]},{"id":"ri:299","n":"299","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador"],"t":["O Vereador que se afastar do exercício do mandato para ser investido em cargos referidos no art. 40, II, a, da Lei Orgânica do Município, deverá fazer comunicação escrita à Mesa, bem como ao reassumir seu lugar."],"nt":[]},{"id":"ri:300","n":"300","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador"],"t":["O comparecimento efetivo do Vereador às sessões na Câmara será registrado por meio de sua confirmação de presença em painel eletrônico, a partir de uso de senha pessoal e intransferível, e o devido registro de presenças deverá ser emitido em cada sessão para fins de comprovação de seu comparecimento. J IM §1º. Cabe ao Vereador registrar sua presença em todos os momentos em que se fizer necessária a verificação de quórum.","§ 2º Nos dias em que não houver sessão plenária, mas houver reunião de comissões, a presença do vereador será registrada pelo controle das mesmas comissões, sob a responsabilidade de seus Presidentes."],"nt":[]},{"id":"ri:301","n":"301","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador","Seção I — Do Uso da Palavra"],"t":["Durante as sessões, o Vereador somente poderá usar da palavra para:","I – versar sobre assunto de sua livre escolha no período destinado ao Expediente;","II – na fase destinada à Explicação Pessoal;","III – discutir matéria em debate;","IV – apartear;","V – declarar voto;","VI – apresentar ou reiterar requerimento;","VII – levantar questão de ordem;","VIII – encaminhar votação, nos termos do artigo Art. 59, III, deste Regimento."],"nt":[]},{"id":"ri:302","n":"302","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador","Seção I — Do Uso da Palavra"],"t":["O uso da palavra será regulado pelas seguintes normas:","I – é permitido ao Vereador falar sentado quando solicitar aparte, questão de ordem ou pedido de informações;","II – o orador deverá falar da Tribuna no momento dos Expedientes, exceto quando apartear Vereador que já esteja no uso desta, ou nos casos em que o Presidente permita o contrário, sendo obrigatória, no entanto, a utilização dos microfones no Plenário;","III – a nenhum Vereador será permitido falar sem pedir a palavra e sem que o Presidente a conceda;","IV – com exceção do aparte, nenhum Vereador poderá interromper o orador que estiver na Tribuna;","V – o vereador que pretender falar sem que lhe tenha sido concedida a palavra ou permanecer na Tribuna além do tempo que lhe tenha sido concedido será advertido pelo Presidente, que o convidará a sentar-se;","VI – se, apesar da advertência e do convite, o Vereador insistir em falar, o Presidente dará seu discurso por terminado; VII — persistindo a insistência do Vereador em falar e em perturbar a ordem ou o andamento regimental da sessão, o Presidente convidá-lo-á a retirar-se do recinto;","VIII – qualquer Vereador, ao falar, dirigirá a palavra ao Presidente ou aos demais Vereadores e só poderá falar voltado para a Mesa, salvo quando responder a aparte;","IX – referindo-se em discurso a outro(a) Vereador(a), o orador deverá preceder seu nome do tratamento \"Senhor(a)\" ou \"Vereador(a)\";","X – dirigindo-se a qualquer de seus pares, o vereador dar-lhe-á o tratamento \"Excelência\", \"Nobre colega\" ou \"Nobre Vereador\";","XI – nenhum Vereador poderá referir-se a seus pares e, de modo geral, a qualquer representante do Poder Público, de forma descortês ou injuriosa; XII — Nenhum Vereador poderá utilizar-se, para apresentação em seus pronunciamentos ou manifestações, de objetos, artifícios, equipamentos, mídias digitais, megafones, animais, armas ou quaisquer outros apetrechos de qualquer outra natureza no recinto do Plenário, excetuando-se aqueles indispensáveis ao exercício de sua religiosidade, às suas especificidades manifestamente étnicas ou culturais, bem como os necessários ao atendimento de condições relacionadas à deficiência, incluindo o uso de cães-guia ou tecnologia assistiva."],"nt":[]},{"id":"ri:303","n":"303","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador","Seção II — Do Tempo do Uso da Palavra"],"t":["O tempo de que dispõe o vereador para uso da palavra é assim fixado:","I – cinco minutos:","a) discussão de vetos;","b) discussão de projetos.","II – três minutos:","a) discussão de requerimentos;","b) discussão de redação final;","c) discussão de pareceres, ressalvado o prazo assegurado ao denunciado e ao relator no processo de destituição de membro da Mesa;","d) apresentação de requerimento de retificação da ata;","e) apresentação de requerimento de invalidação da ata, quando da sua impugnação.","f) encaminhamento da votação;","g) questão de ordem;","h) explicação pessoal;","i) exposição de assuntos relevantes pelos líderes de bancadas, nos termos do Art. 59, I, deste Regimento;","j) declaração de voto. III — um minuto para:","a) apartear;","b) fazer sua defesa pessoal quando citado nominalmente, por concessão do Presidente.","§ 1º O Vereador, para uso da Tribuna, na fase do Expediente, que será subdividido em Pequeno e Grande Expediente, disporá de 5 (cinco) e 10 (dez) minutos, respectivamente, versando sobre tema livre.","§ 2º O tempo disponível para o Vereador será controlado pelo 1º secretário, não descontando-se de seu tempo a interrupção por aparte concedido."],"nt":[]},{"id":"ri:304","n":"304","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO I — Das Atribuições do Vereador","Seção III — Da Questão de Ordem"],"t":["Questão de ordem é toda manifestação do Vereador em Plenário, feita em qualquer fase da sessão, para reclamar contra o não cumprimento de formalidade regimental ou para suscitar dúvidas quanto à interpretação do Regimento.","§ 1º O Vereador deverá pedir a palavra \"pela ordem\" e formular a questão com clareza, indicando as disposições regimentais que pretende sejam elucidadas ou aplicadas.","§ 2º Cabe ao Presidente da Câmara resolver, soberanamente, a questão de ordem ou submetê-la ao Plenário quando omisso o Regimento.","§ 3º Cabe ao Vereador recurso da decisão do Presidente, que será encaminhado à Comissão de Constituição, Justiça e Redação, cujo parecer, em forma de Projeto de Resolução, será submetido ao Plenário, nos termos deste Regimento."],"nt":[]},{"id":"ri:305","n":"305","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO II — Das Obrigações e Deveres do Vereador"],"t":["São deveres do Vereador, além de outros previstos na legislação vigente:","I – respeitar, defender e cumprir as Constituições Federal e Estadual, Lei Orgânica Municipal e demais leis;","II – agir com respeito ao Executivo e ao Legislativo, colaborando para o bom desempenho de cada um desses Poderes;","III – usar de suas prerrogativas exclusivamente para atender ao interesse público;","IV – obedecer às normas regimentais;","V – representar a comunidade, comparecendo convenientemente trajado, à hora regimental, nos dias designados, para a abertura das sessões, nelas permanecendo até o seu término;","VI – participar dos trabalhos do Plenário e comparecer às reuniões das Comissões Permanentes ou Temporárias das quais seja integrante, prestando informações, emitindo pareceres nos processos que lhe forem distribuídos, sempre com observância dos prazos regimentais;","VII – votar as proposições submetidas à deliberação da Câmara, salvo quando tiver, ele próprio, interesse manifesto na deliberação, sob pena de nulidade da votação quando seu voto for decisivo;","VIII – desempenhar os encargos que lhe forem atribuídos, salvo motivo justo alegado perante a Presidência ou à Mesa, conforme o caso;","IX – propor à Câmara todas as medidas que julgar convenientes aos interesses do Município e à segurança e bem estar da comunidade, bem como impugnar as que lhe pareçam contrárias ao interesse público;","X – comunicar suas faltas ou ausências, quando tiver motivo justo para deixar de comparecer às sessões plenárias ou às reuniões das comissões;","XI – observar o disposto no Art. 332 deste Regimento (art. 29, VII cc. art. 54, CF);","XII – desincompatibilizar-se e fazer declaração pública de bens, no ato da posse e ao término do mandato;","XIII – comportar-se em Plenário com respeito, não conversando em tom que perturbe os trabalhos."],"nt":[]},{"id":"ri:306","n":"306","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO II — Das Obrigações e Deveres do Vereador"],"t":["À Presidência da Câmara compete zelar pelo cumprimento dos deveres, bem como tomar as providências necessárias à defesa dos direitos dos Vereadores, quando no exercício do mandato."],"nt":[]},{"id":"ri:307","n":"307","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO II — Das Obrigações e Deveres do Vereador"],"t":["Se qualquer Vereador cometer, dentro do recinto da Câmara, excesso que deva ser reprimido, o Presidente conhecerá do fato e tomará as seguintes providências, conforme sua gravidade:","I – advertência pessoal:","II – advertência em Plenário;","III – cassação da palavra;","IV – determinação para retirar-se do Plenário;","V – denúncia para a cassação do mandato, por falta de decoro parlamentar.","Parágrafo único. Para manter a ordem no recinto, o Presidente poderá solicitar a força policial necessária."],"nt":[]},{"id":"ri:308","n":"308","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO III — Das Proibições e incompatibilidades"],"t":["O Vereador não poderá:","I – desde a expedição do diploma:","a) firmar ou manter contrato com pessoa jurídica de direito público, empresa pública, sociedade de economia mista, empresa concessionária ou permissionária de serviço público municipal, salvo quando o contrato obedecer a cláusulas uniformes;","b) aceitar ou exercer cargo, função ou emprego remunerado, inclusive os de que seja demissível ad nutum, nas entidades constantes da alínea anterior;","II – desde a posse:","a) ser proprietário, controlador ou diretor de empresa que goze de favor decorrente de contrato com pessoa jurídica de direito público, ou nela exercer função remunerada;","b) ocupar cargo ou função de que seja demissível ad nutum nas entidades referidas no inciso 1, \"a\";","c) patrocinar causa em que seja interessada qualquer das entidades a que se refere o inciso 1, \"a\";","d) ser titular de mais de um cargo ou mandato público eletivo (art. 29, VII, cc. art. 54, CF).","§ 1º Ao Vereador que, na data da posse, seja servidor público federal, estadual ou municipal aplicam- se as seguintes normas:","I – havendo compatibilidade de horários:","a) exercerá o cargo, emprego ou função juntamente com o mandato;","b) perceberá, cumulativamente, os vencimentos do cargo, emprego ou função, com a remuneração do mandato;","II – não havendo compatibilidade de horários:","a) será afastado do cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração;","b) seu tempo de serviço será contado para todos os efeitos legais, exceto para a promoção por merecimento;","c) para efeito de benefício previdenciário, os valores serão determinados como se no exercício estivesse (art. 38, III a V, CF).","§ 2º Haverá incompatibilidade de horários ainda que o horário normal e regular de trabalho do servidor na repartição coincida apenas em parte com o da vereança nos dias de sessão da Câmara Municipal."],"nt":[]},{"id":"ri:309","n":"309","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador"],"t":["O Vereador é inviolável, no exercício do mandato e na circunscrição do Município, por suas opiniões, palavras e votos.","§ 1º Desde a expedição do diploma, os membros da Câmara Municipal não poderão ser presos, salvo em flagrante de crime inafiançável, nem processados criminalmente, sem prévia licença da Casa, observado o disposto no §2º do art. 53, da Constituição Federal.","§ 2º No caso de flagrante de crime inafiançável, os autos serão remetidos, dentro de 24 (vinte e quatro) horas à Câmara Municipal, para que, pelo voto secreto da maioria de seus membros, resolva sobre a prisão e autorize ou não a formação de culpa.","§ 3º Os Vereadores serão submetidos a julgamento perante o Tribunal de Justiça.","§ 4º Os Vereadores não serão obrigados a testemunhar sobre informações recebidas ou prestadas em razão do exercício do mandato."],"nt":["O vereador tem só imunidade material (CF, art. 29, VIII; STF, Tema 469). A imunidade formal dos §§ 1º e 2º não foi estendida pela CF (STF, ADI 371)."]},{"id":"ri:310","n":"310","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção I — Da Remuneração","Subseção I — Da Remuneração dos Vereadores"],"t":["Os Vereadores farão jus a uma remuneração mensal condigna, fixada pela Câmara Municipal, no fim da legislatura para vigorar na que lhe é subsequente, observados os limites estabelecidos na Constituição Federal. (art. 29, V; 37, XI; 150, 11; 153, 111 e 153, §2º da Constituição Federal)."],"nt":[]},{"id":"ri:311","n":"311","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção I — Da Remuneração","Subseção I — Da Remuneração dos Vereadores"],"t":["Caberá à Mesa propor projeto dispondo sobre a remuneração dos Vereadores para a legislatura seguinte, até 180 (cento e oitenta) dias antes das eleições.","§ 2º A ausência de fixação da remuneração dos Vereadores nos termos do parágrafo anterior, implica prorrogação automática da norma fixadora da remuneração para a legislatura anterior."],"nt":[]},{"id":"ri:312","n":"312","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção I — Da Remuneração","Subseção I — Da Remuneração dos Vereadores"],"t":["A remuneração dos Vereadores não poderá ser superior aos valores percebidos como remuneração, em espécie, pelo Prefeito (art. 37, XI, CF)."],"nt":[]},{"id":"ri:313","n":"313","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção I — Da Remuneração","Subseção I — Da Remuneração dos Vereadores"],"t":["A remuneração dos Vereadores sofrerá desconto proporcional ao número de sessões realizadas no respectivo mês, quando ocorrer falta injustificada, na forma do Art. 315 deste Regimento."],"nt":[]},{"id":"ri:314","n":"314","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção I — Da Remuneração","Subseção I — Da Remuneração dos Vereadores"],"t":["O Vereador que até 90 (noventa) dias antes do término de seu mandato não apresentar ao Presidente da Câmara declaração de bens atualizada não perceberá a correspondente remuneração."],"nt":[]},{"id":"ri:315","n":"315","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção II — Das Faltas e Licenças"],"t":["Será atribuída falta ao Vereador que não comparecer às sessões plenárias ou às reuniões das Comissões Permanentes, salvo motivo justo aceito pela Câmara.","§ 1º Para efeito de justificação das faltas, consideram-se motivos justos:","I – doença;","II – luto.","§ 2º A justificação das faltas far-se-á por comunicação fundamentada, dirigida ao Presidente da Câmara que a julgará, nos termos do Art. 27 deste Regimento."],"nt":[]},{"id":"ri:316","n":"316","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção II — Das Faltas e Licenças"],"t":["O Vereador poderá licenciar-se, somente:","I – por moléstia, devidamente comprovada por atestado médico;","II – para desempenhar missões de caráter cultural ou de interesse do Município;","III – para tratar de interesses particulares, por prazo determinado, nunca inferior a 30 (trinta) dias nem superior a 120 (cento e vinte) dias por sessão legislativa, não podendo reassumir o exercício do mandato antes do término da licença;","IV – em razão de adoção, maternidade ou paternidade, conforme dispuser a lei;","V – em virtude de investidura na função de Ministro de Estado, Secretário do Estado, Secretário Municipal, Chefe de autarquia estadual ou municipal, chefe de missão diplomática, podendo optar pelos vencimentos do cargo ou pela remuneração do mandato, a partir da respectiva posse.","§ 1º Para fins de remuneração, considerar-se-á como em exercício o Vereador licenciado nos termos dos incisos I, II e IV deste artigo.","§ 2º O Vereador investido no cargo de Secretário Municipal considerar-se-á automaticamente licenciado, podendo optar pela sua remuneração.","§ 3º O Suplente de Vereador, para licenciar-se, deve ter assumido e estar no exercício do mandato.","§ 4º No caso do inciso I, a licença será por prazo determinado, prescrito por médico."],"nt":[]},{"id":"ri:317","n":"317","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção II — Das Faltas e Licenças"],"t":["Os requerimentos de licença deverão ser apresentados, discutidos e votados na Ordem do Dia da sessão de sua apresentação, tendo preferência regimental sobre qualquer outra matéria.","§ 1º Encontrando-se o Vereador impossibilitado, física ou mentalmente, de subscrever requerimento de licença para tratamento de saúde, a iniciativa caberá ao Líder ou a qualquer Vereador de sua bancada.","§ 2º É facultado ao Vereador prorrogar o seu período de licença, por meio de novo requerimento, atendidas as disposições desta seção."],"nt":[]},{"id":"ri:318","n":"318","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IV — Dos Direitos do Vereador","Seção II — Das Faltas e Licenças"],"t":["Em caso de incapacidade civil absoluta, julgada por sentença de interdição, será o Vereador suspenso do exercício do mandato, sem perda da remuneração, enquanto durarem os seus efeitos.","Parágrafo único. A suspensão do mandato, neste caso, será declarada pelo Presidente na primeira sessão que se seguir ao conhecimento da sentença de interdição."],"nt":[]},{"id":"ri:319","n":"319","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO V — Da Substituição"],"t":["A substituição de Vereador dar-se-á no caso de vaga, em razão de morte ou renúncia, de suspensão do mandato, de investidura em função prevista no art. Art. 316, V deste Regimento e em caso de licença superior a 30 (trinta) dias.","§ 1º Efetivada a licença e nos casos previstos neste artigo, o Presidente da Câmara convocará o respectivo Suplente, que deverá tomar posse dentro de 15 (quinze) dias, salvo motivo justo aceito pela Câmara.","§ 2º A substituição do titular, suspenso do exercício do mandato, pelo respectivo Suplente, dar-se-á até o fim da suspensão.","§ 3º Na falta de Suplente, o Presidente da Câmara comunicará o fato, dentro de 48 (quarenta e oito) horas, diretamente ao Tribunal Regional Eleitoral."],"nt":[]},{"id":"ri:320","n":"320","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VI — Da Extinção do Mandato"],"t":["Extingue-se o mandato do Vereador e assim será declarado pelo Presidente da Câmara Municipal, quando:","I – ocorrer falecimento, renúncia por escrito, condenação por crime funcional ou eleitoral, perda ou suspensão dos direitos políticos;","II – incidir nos impedimentos para o exercício do mandato e não se desincompatibilizar até a posse e, nos casos supervenientes, no prazo de 15 (quinze) dias, contados do recebimento de notificação para isso promovida pelo Presidente da Câmara Municipal;","III – deixar de comparecer, sem justificativa, ou sem que esteja licenciado ou autorizado pela Câmara em missão fora do Município, a 1/3 (um terço) ou mais das sessões ordinárias e extraordinárias da Câmara realizadas dentro do ano legislativo;","IV – deixar de tomar posse, sem motivo justo aceito pela Câmara, dentro do prazo estabelecido."],"nt":["Compare com o art. 8º, III, do DL 201/1967 ( 1/3 das sessões ordinárias ou 5 extraordinárias convocadas pelo Prefeito)."]},{"id":"ri:321","n":"321","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VI — Da Extinção do Mandato"],"t":["Ao Presidente da Câmara compete declarar a extinção do mandato.","§ 1º A extinção do mandato torna-se efetiva pela declaração do ato ou fato extintivo pela Presidência, comunicada ao Plenário e inserida na ata, na primeira sessão após sua ocorrência e comprovação.","§ 2º Efetivada a extinção, o Presidente convocará imediatamente o respectivo Suplente.","§ 3º O Presidente que deixar de declarar a extinção ficará sujeito às sanções de perda do cargo e proibição de nova eleição para cargo da Mesa durante a legislatura.","§ 4º Se o Presidente omitir-se nas providências consignadas no §1º, Suplente de Vereador interessado poderá requerer a declaração da extinção do mandato."],"nt":[]},{"id":"ri:322","n":"322","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VI — Da Extinção do Mandato"],"t":["Considera-se formalizada a renúncia e, por conseguinte, como tendo produzido todos os seus efeitos para fins de extinção do mandato, quando protocolada na Diretoria Legislativa da Câmara.","Parágrafo único. A renúncia se torna irretratável após sua comunicação ao Plenário."],"nt":[]},{"id":"ri:323","n":"323","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VI — Da Extinção do Mandato"],"t":["A extinção do mandato em virtude de faltas às sessões obedecerá ao seguinte procedimento:","I – Constatado que o Vereador incidiu no número de faltas previsto no inciso III do Art. 320, o Presidente comunicar-lhe-á este fato por escrito e, sempre que possível, pessoalmente, a fim de que apresente a defesa que tiver, no prazo de 5 (cinco) dias.","II – findo esse prazo, apresentada a defesa, ao Presidente compete deliberar a respeito;","III – não apresentada a defesa no prazo previsto ou julgada improcedente, o Presidente declarará extinto o mandato, na primeira sessão subsequente.","§ 1º Para os efeitos deste artigo, computar-se-á a ausência dos Vereadores mesmo que a sessão não se realize por falta de quórum, excetuados somente aqueles que compareceram e registraram a presença.","§ 2º Considera-se ausente o Vereador que não registrar sua presença em nenhum momento durante a sessão."],"nt":[]},{"id":"ri:324","n":"324","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VI — Da Extinção do Mandato"],"t":["Para os casos de impedimentos supervenientes à posse, observar-se-á o seguinte procedimento:","I – O Presidente da Câmara notificará, por escrito, o Vereador impedido, a fim de que comprove a sua desincompatibilização no prazo de 15 (quinze) dias;","II – findo esse prazo sem restar comprovada a desincompatibilização, o Presidente declarará a extinção do mandato;","III – o extrato da ata da sessão em que for declarada a extinção do mandato será publicado na imprensa local."],"nt":[]},{"id":"ri:325","n":"325","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["A Câmara Municipal cassará o mandato de Vereador quando, em processo regular em que se concederá ao acusado amplo direito de defesa, concluir pela prática de infração político- administrativa."],"nt":[]},{"id":"ri:326","n":"326","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["São infrações político-administrativas do Vereador, nos termos da Lei:","I – deixar de prestar contas ou tê-las rejeitadas, na hipótese de adiantamentos;","II – utilizar-se do mandato para a prática de atos de corrupção ou de improbidade administrativa;","III – proceder de modo incompatível com a dignidade da Câmara ou faltar com o decoro na sua conduta pública, nos termos deste Regimento."],"nt":[]},{"id":"ri:327","n":"327","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["O processo de cassação do mandato de Vereador obedecerá, no que couber, ao rito estabelecido neste Regimento e, sob pena de arquivamento, deverá estar concluído em até 90 (noventa) dias, a contar do recebimento da denúncia, Parágrafo único. O arquivamento do processo de cassação, por falta de conclusão no prazo previsto neste artigo, não impede nova denúncia sobre os mesmos fatos nem a apuração de contravenções ou crimes comuns."],"nt":[]},{"id":"ri:328","n":"328","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["Recebida a denúncia, o Presidente da Câmara deverá afastar de suas funções o Vereador acusado, convocando o respectivo Suplente até o fim do julgamento."],"nt":[]},{"id":"ri:329","n":"329","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["Considerar-se-á cassado o mandato do Vereador quando, pelo voto de no mínimo 2/3 (dois terços) dos membros da Câmara, for declarado incurso em qualquer das infrações especificadas na denúncia.","Parágrafo único. Todas as votações relativas ao processo de cassação serão feitas nominalmente, devendo os resultados ser proclamados imediatamente obrigatoriamente, consignados em ata."],"nt":["Súmula Vinculante 46; DL 201/1967."]},{"id":"ri:330","n":"330","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VII — Da Cassação do Mandato"],"t":["Cassado o mandato do Vereador, a Mesa Diretora expedirá a respectiva Resolução.","Parágrafo único. Na hipótese deste artigo, ao Presidente compete convocar imediatamente o respectivo Suplente."],"nt":[]},{"id":"ri:331","n":"331","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO VIII — Do Suplente de Vereador"],"t":["O Suplente de Vereador sucederá o titular no caso de vaga e o substituirá nos casos de impedimento.","§ 1º O Suplente de Vereador, quando no exercício do mandato, tem os mesmos direitos, prerrogativas, deveres e obrigações do Vereador e como tal deve ser considerado.","§ 2º Quando convocado, o Suplente deverá tomar posse no prazo de 15 (quinze) dias, contados da data da convocação, salvo motivo justo aceito pela Câmara, quando o prazo poderá ser prorrogado por igual período.","§ 3º Enquanto não ocorrer a posse do Suplente, o quórum será calculado em função dos Vereadores remanescentes."],"nt":[]},{"id":"ri:332","n":"332","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["O Vereador que descumprir os deveres inerentes a seu mandato ou praticar ato que afete sua dignidade estará sujeito ao processo e às medidas disciplinares previstas neste Regimento, além das seguintes:","I – censura;","II – perda temporária do exercício do mandato, não excedente a 30 (trinta) dias;","III – perda do mandato.","§ 1º Considera-se atentatório ao decoro parlamentar usar, em discurso ou proposição, expressões que configurem crimes contra a honra ou contenham incitamento à prática de crimes.","§ 2º É incompatível com o decoro parlamentar:","I – o abuso das prerrogativas inerentes ao mandato;","II – a percepção de vantagens indevidas;","III – a prática de irregularidades no desempenho do mandato ou de encargos dele decorrentes."],"nt":[]},{"id":"ri:333","n":"333","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["Incide em pena de censura o Vereador que:","I – usar de expressões descorteses ou insultuosas;","II – agredir, por atos ou palavras, outro Vereador ou a Mesa, nas dependências da Câmara;","III – insistir em usar da palavra, quando negada ou retirada pelo Presidente;","IV – perturbar a ordem das sessões da Câmara ou das reuniões das Comissões;","V – negar-se a deixar o recinto do Plenário, quando determinado pelo Presidente."],"nt":[]},{"id":"ri:334","n":"334","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["Nos casos do artigo anterior, o Vereador será censurado oralmente, em sessão pública, pelo Presidente."],"nt":[]},{"id":"ri:335","n":"335","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["Considera-se incurso na sanção de perda temporária do exercício do mandato, por falta de decoro parlamentar, o Vereador que:","I – reincidir nas hipóteses previstas no Art. 333;","II – praticar transgressão grave ou reiterada aos preceitos regimentais;","III – revelar informações e documentos oficiais de caráter reservado, de que tenha tido conhecimento na forma regimental.","Parágrafo único. A penalidade prevista neste artigo será aplicada pelo Plenário, por maioria absoluta, assegurando ao infrator o direito de ampla defesa."],"nt":[]},{"id":"ri:336","n":"336","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["Quando, no curso de uma discussão, um Vereador for acusado de ato que ofenda sua honorabilidade, poderá solicitar ao Presidente da Câmara ou de Comissão que mande apurar a veracidade da arguição e o cabimento de censura ao ofensor, no caso de improcedência da acusação."],"nt":[]},{"id":"ri:337","n":"337","tag":"","b":"H","h":["TÍTULO X — DOS VEREADORES","CAPÍTULO IX — Do Decoro Parlamentar"],"t":["A perda do mandato aplicar-se-á na forma e nos casos previstos no Capítulo VII do Título X deste Regimento."],"nt":[]},{"id":"ri:338","n":"338","tag":"","b":"H","h":["TÍTULO XI — DO REGIMENTO INTERNO","CAPÍTULO ÚNICO — Dos Precedentes Regimentais e a Reforma do Regimento"],"t":["Os casos não previstos neste Regimento serão submetidos ao Plenário, e as soluções constituirão precedentes regimentais, mediante requerimento aprovado pela maioria absoluta dos Vereadores."],"nt":[]},{"id":"ri:339","n":"339","tag":"","b":"H","h":["TÍTULO XI — DO REGIMENTO INTERNO","CAPÍTULO ÚNICO — Dos Precedentes Regimentais e a Reforma do Regimento"],"t":["As interpretações do Regimento serão feitas pelo Presidente da Câmara em assunto controvertido e somente constituirão precedentes regimentais a requerimento de qualquer Vereador, aprovado pela maioria absoluta dos membros da Câmara."],"nt":[]},{"id":"ri:340","n":"340","tag":"","b":"H","h":["TÍTULO XI — DO REGIMENTO INTERNO","CAPÍTULO ÚNICO — Dos Precedentes Regimentais e a Reforma do Regimento"],"t":["Os precedentes regimentais serão registrados pela Diretoria Legislativa para orientação na futura solução de eventuais casos análogos."],"nt":[]},{"id":"ri:341","n":"341","tag":"","b":"H","h":["TÍTULO XI — DO REGIMENTO INTERNO","CAPÍTULO ÚNICO — Dos Precedentes Regimentais e a Reforma do Regimento"],"t":["O Regimento Interno poderá ser alterado ou reformado por meio de Projeto de Resolução de iniciativa de qualquer Vereador ou da Mesa Diretora.","§ 1º A apreciação do projeto de alteração ou reforma do Regimento obedecerá às normas vigentes para os demais projetos de Resolução, e sua aprovação dependerá do voto favorável da maioria qualificada dos membros da Câmara.","§ 2º Ao fim de cada sessão legislativa, a Mesa Diretora fará a consolidação de todas as alterações procedidas no Regimento Interno, bem como dos precedentes regimentais aprovados, publicando-os."],"nt":[]},{"id":"ri:342","n":"342","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["Os prazos previstos neste Regimento não correrão durante os períodos de recesso da Câmara.","§ 1º Excetuam-se ao disposto neste artigo os prazos relativos às matérias objeto de convocação extraordinária da Câmara e os prazos estabelecidos às Comissões Processantes.","§ 2º Quando não se mencionarem expressamente dias úteis, o prazo será contado em dias corridos.","§ 3º Na contagem dos prazos regimentais, observar-se-ão, no que for aplicável, as disposições da legislação processual civil."],"nt":[]},{"id":"ri:343","n":"343","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["A legislatura compreenderá 4 (quatro) sessões legislativas, com início cada uma a 1º de fevereiro e término em 23 de dezembro de cada ano, ressalvada a de inauguração da legislatura, que se inicia em 1º de janeiro.","Parágrafo único. Sessão Legislativa corresponde ao período normal de funcionamento da Câmara durante um ano."],"nt":[]},{"id":"ri:344","n":"344","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["Serão considerados como de recesso legislativo os períodos compreendidos de 19 de julho a 31 de julho e de 24 de dezembro a 31 de janeiro de cada ano."],"nt":[]},{"id":"ri:345","n":"345","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["Nos interregnos das sessões legislativas, a Mesa Diretora nomeará uma Comissão Representativa cuja composição observará, tanto quanto possível, a proporcionalidade partidária na Casa, com as seguintes atribuições:","I – zelar pelas prerrogativas do Poder Legislativo;","II – zelar pela observância da Lei Orgânica e dos direitos e garantias individuais;","III – autorizar o Prefeito a se ausentar do Município por mais de 15 (quinze) dias, observado o disposto no inciso VI do art. 37 da Lei Orgânica.","Parágrafo único. O Presidente da Câmara será o presidente no ato da Comissão Representativa."],"nt":[]},{"id":"ri:346","n":"346","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["As dúvidas que eventualmente surjam quanto à tramitação a ser dada a qualquer proposição ou atividade legislativa serão submetidas ao Presidente da Câmara, e as soluções constituirão precedentes regimentais, mediante requerimento aprovado pela maioria absoluta dos membros da Câmara."],"nt":[]},{"id":"ri:347","n":"347","tag":"","b":"H","h":["TÍTULO XII — DISPOSIÇÕES FINAIS"],"t":["Esta Resolução entra em vigor na data de sua publicação, revogando-se a Resolução nº 01/1997, suas alterações e seus precedentes regimentais, bem como as Resoluções Nº 03/2011, Nº 02/2012 e Nº05/2019. Texto da Resolução nº 25/2025 e do Regimento Interno extraído do PDF oficial (camada de OCR), com correção de erros evidentes de digitalização. Para citação formal, confira o documento publicado pela Câmara Municipal de Mossoró."],"nt":[]}]},"blocos":{"lom":{"A":"Fundamentos, organização e competências","B":"Administração pública e servidores","C":"A Câmara Municipal e os Vereadores","D":"Processo legislativo e fiscalização","E":"O Poder Executivo","F":"Estrutura administrativa, atos, bens e obras","G":"Tributação, finanças e orçamento","H":"Ordem econômica e social","I":"Disposições transitórias e Emenda nº 11/2022"},"ri":{"A":"Fundamentos do Regimento","B":"Posse, Mesa Diretora e Presidência","C":"Plenário, quóruns e lideranças","D":"Comissões e CEI","E":"Sessões: Expediente, Ordem do Dia e Explicação Pessoal","F":"Proposições e regimes de tramitação","G":"Discussão, votação, sanção, veto e orçamento","H":"Participação popular, contas e estatuto do vereador","I":"Revisão final: prazos e quóruns"}},"q":[{"id":"mc-ri-1","lei":"ri","tp":"mc","b":"B","e":"Segundo o Regimento Interno da Câmara Municipal de Mossoró, não se verificando a posse na data prevista, o prazo para que ela ocorra é de","o":["15 dias para Vereador e 10 dias para Prefeito e Vice-Prefeito, salvo motivo justo aceito pela Câmara.","10 dias para todos os eleitos, contados da diplomação.","30 dias para Vereador e 15 dias para Prefeito e Vice-Prefeito.","10 dias para Vereador e 15 dias para Prefeito e Vice-Prefeito, salvo motivo justo aceito pela Câmara.","15 dias para todos os eleitos, improrrogáveis."],"c":0,"k":["📌 Art. 7º, I e II, do Regimento (Posse superveniente)","► Vereador: 15 dias a contar da data da posse; Prefeito e Vice: 10 dias — nos dois casos, salvo motivo justo aceito pela Câmara.","⚠️ A banca adora inverter os números: 15 é do Vereador, 10 é do Executivo.","🔑 Vereador = 15 | Prefeito/Vice = 10"],"a":["ri:7º"],"src":"Questão inédita"},{"id":"mc-ri-2","lei":"ri","tp":"mc","b":"B","e":"A sessão solene de instalação da Câmara, em 1º de janeiro de cada legislatura, é presidida","o":["pelo Vereador mais idoso, desde que presente a maioria absoluta da Câmara.","pelo Vereador mais idoso entre os presentes; se a condição for comum a dois ou mais, pelo mais votado entre eles.","pelo Presidente da Mesa da legislatura anterior.","pelo Juiz Eleitoral da zona, que dá posse aos eleitos.","pelo Vereador mais votado na eleição municipal."],"c":1,"k":["📌 Art. 4º do Regimento (Instalação)","► A instalação ocorre independentemente de número, sob a presidência do mais idoso; empate de idade → o mais votado.","► Ele convida dois Vereadores, de preferência de partidos diferentes, para secretariar.","⚠️ 'Independentemente de número': não se exige quórum para instalar."],"a":["ri:4º"],"src":"Questão inédita"},{"id":"mc-ri-3","lei":"ri","tp":"mc","b":"B","e":"Quanto à composição da Mesa Diretora, o Regimento Interno estabelece que","o":["o 3º e o 4º Secretários integram a Mesa permanentemente, e os Vice-Presidentes, apenas no recesso.","os Vice-Presidentes integram a Mesa em qualquer hipótese, mas sem direito a voto.","a Mesa é composta pelo Presidente, pelo 1º e pelo 2º Secretários; os Vice-Presidentes e o 3º e 4º Secretários só integram a Mesa quando em efetivo exercício.","a Mesa é composta apenas pelo Presidente e pelo 1º Vice-Presidente.","a Mesa é composta pelo Presidente, dois Vice-Presidentes e quatro Secretários, todos membros efetivos."],"c":2,"k":["📌 Art. 15 e parágrafo único do Regimento","► Núcleo da Mesa: Presidente + 1º Secretário + 2º Secretário.","► Vice-Presidentes, 3º e 4º Secretários: integrantes apenas quando em efetivo exercício.","⚠️ Não confunda com a LOM (art. 46), que lista sete cargos que se substituem nessa ordem."],"a":["ri:15"],"src":"Questão inédita"},{"id":"mc-ri-4","lei":"ri","tp":"mc","b":"B","e":"Na eleição da Mesa Diretora, persistindo o empate após o segundo escrutínio, será declarado eleito","o":["o candidato do partido com maior bancada.","o Vereador mais idoso e, se tiverem a mesma idade, o mais votado na eleição municipal.","o Vereador mais votado na eleição municipal e, persistindo o empate, o mais idoso.","aquele escolhido por sorteio realizado pelo Presidente.","o candidato com maior número de mandatos anteriores."],"c":1,"k":["📌 Art. 17, VIII e IX, do Regimento","► Empate no primeiro escrutínio → segundo escrutínio entre os empatados.","► Persistindo o empate → o mais idoso; mesma idade → o mais votado no pleito municipal.","🔑 Critério 1: idade | Critério 2: votação"],"a":["ri:17"],"src":"Questão inédita"},{"id":"mc-ri-5","lei":"ri","tp":"mc","b":"B","e":"Sobre a eleição da Mesa para o segundo biênio, assinale a alternativa correta.","o":["É convocada pela Mesa Diretora ou por 2/3 dos Vereadores, e a posse ocorre no primeiro dia útil de janeiro do terceiro ano da legislatura.","É convocada por 1/3 dos Vereadores, e a posse ocorre em 1º de fevereiro do terceiro ano.","Dispensa convocação, pois se realiza automaticamente na última sessão do segundo ano.","É convocada exclusivamente pelo Presidente da Câmara.","É convocada pela maioria absoluta, e a posse ocorre em 15 de dezembro do segundo ano."],"c":0,"k":["📌 Art. 19, caput e § 2º, do Regimento","► Convocação: Mesa Diretora OU 2/3 dos Vereadores.","► Posse: primeiro dia útil de janeiro do 3º ano da legislatura (pode ser alterada se o Presidente for reeleito, com aprovação da maioria do Plenário — § 3º)."],"a":["ri:19"],"src":"Questão inédita"},{"id":"mc-ri-6","lei":"ri","tp":"mc","b":"B","e":"O membro da Mesa Diretora que deixar de comparecer, sem causa justificada, a determinado número de reuniões ordinárias consecutivas perde o cargo. Esse número é","o":["cinco","três","seis","quatro","dez"],"c":0,"k":["📌 Art. 22, parágrafo único, e art. 46, § 2º, do Regimento","► Cinco reuniões ordinárias consecutivas sem justificativa → destituição sem necessidade da votação de 2/3.","⚠️ Nas Comissões Permanentes o número é outro: três reuniões consecutivas (art. 113, § 2º).","🔑 Mesa = 5 | Comissão Permanente = 3"],"a":["ri:22","ri:46"],"src":"Questão inédita"},{"id":"mc-ri-7","lei":"ri","tp":"mc","b":"B","e":"Compete à Mesa Diretora elaborar e encaminhar ao Poder Executivo a proposta orçamentária da Câmara até","o":["15 de julho","15 de abril","31 de março","31 de dezembro","30 de agosto"],"c":0,"k":["📌 Art. 24, XIV e XV, do Regimento","► Prazo: até 15 de julho. Se não for encaminhada, toma-se por base o orçamento vigente da Câmara.","⚠️ 30 de agosto é a data de envio do PPA e da LOA pelo Prefeito (LOM, art. 78, XII). 31 de dezembro é o prazo para devolver o saldo de numerário (art. 24, XVII)."],"a":["ri:24"],"src":"Questão inédita"},{"id":"mc-ri-8","lei":"ri","tp":"mc","b":"B","e":"No processo de destituição de membro da Mesa Diretora, é correto afirmar que","o":["a denúncia deve ser subscrita por 1/3 dos Vereadores e a destituição exige maioria absoluta.","a denúncia deve ser subscrita por no mínimo dois Vereadores, é recebida pela maioria absoluta e a destituição exige 2/3 dos membros da Câmara.","aprovada a destituição, a resolução deve ser publicada em até 10 dias.","a denúncia pode ser subscrita por um único Vereador e é recebida por maioria simples.","o denunciante pode votar no recebimento da denúncia, mas o denunciado não."],"c":1,"k":["📌 Arts. 46, 47 e 51 do Regimento","► Denúncia: no mínimo dois Vereadores (art. 47, caput).","► Recebimento: maioria absoluta (art. 47, § 7º). Denunciante e denunciado ficam impedidos (§ 6º).","► Destituição: projeto de resolução aprovado por 2/3; publicação em 48 horas (art. 51)."],"a":["ri:47","ri:51"],"src":"Questão inédita"},{"id":"mc-ri-9","lei":"ri","tp":"mc","b":"C","e":"Pelo Regimento Interno, exige maioria absoluta, e não maioria qualificada, a deliberação sobre","o":["concessão de título de cidadão honorário ou qualquer outra honraria ou homenagem.","emendas à Lei Orgânica.","destituição dos membros da Mesa.","perda de mandato de Vereador.","alteração de denominação de próprios, vias e logradouros públicos."],"c":0,"k":["📌 Art. 54, §§ 1º e 2º, do Regimento","► Maioria absoluta (§ 1º): lei complementar, matéria tributária, rejeição de veto, título de cidadão honorário, plano diretor, LDO/PPA/LOA, entre outras.","► Maioria qualificada (§ 2º): rejeição do parecer do TCE, destituição da Mesa, emendas à LOM, alteração do Regimento, perda de mandato de Prefeito e de Vereador, distritos, denominação de vias.","⚠️ Pegadinha clássica: denominação de vias é qualificada, mas título honorário é absoluta."],"a":["ri:54"],"src":"Questão inédita"},{"id":"mc-ri-10","lei":"ri","tp":"mc","b":"C","e":"Na Reunião de Lideranças, têm direito a voz, mas não a voto,","o":["apenas os Vice-Presidentes da Mesa.","todos os líderes partidários, sem distinção.","os líderes de partidos com até dois Vereadores ou de partidos integrantes de Bloco Parlamentar, e o Líder do Governo.","o Presidente da Câmara e o Líder da Oposição.","os líderes da bancada de situação e de oposição."],"c":2,"k":["📌 Art. 65, § 1º, do Regimento","► Compõem a Reunião de Liderança, com voto: o Presidente da Câmara e os líderes da situação e da oposição.","► Voz sem voto: líderes de partidos com até dois Vereadores, de partidos em Bloco Parlamentar e o Líder do Governo.","⚠️ Para dispensar formalidades regimentais, a decisão é por unanimidade (art. 66, § 5º)."],"a":["ri:65","ri:66"],"src":"Questão inédita"},{"id":"mc-ri-11","lei":"ri","tp":"mc","b":"D","e":"As Comissões Permanentes da Câmara Municipal de Mossoró são compostas, cada uma, de","o":["7 membros, observada a proporcionalidade.","5 membros e 3 suplentes.","3 membros e 2 suplentes.","3 membros, sem suplentes.","número de membros definido livremente pela Mesa a cada sessão legislativa."],"c":2,"k":["📌 Art. 79 do Regimento","► Cada Comissão Permanente: 3 membros e 2 suplentes. São 11 comissões.","► O Presidente da Câmara não pode integrá-las (arts. 30 e 75), salvo as de representação."],"a":["ri:79"],"src":"Questão inédita"},{"id":"mc-ri-12","lei":"ri","tp":"mc","b":"D","e":"Em regra, para emitir parecer, cada Comissão Permanente dispõe do prazo de","o":["30 dias, contados da leitura no Expediente.","8 dias, prorrogável por mais 8 dias pelo Presidente da Comissão.","15 dias, prorrogável por mais 8 dias pelo Presidente da Câmara, a requerimento fundamentado.","10 dias, improrrogável.","15 dias, prorrogável por igual período pelo Plenário."],"c":2,"k":["📌 Art. 97 do Regimento","► Comissão: 15 dias + 8 (prorrogação pelo Presidente da Câmara).","► Presidente da Comissão designa relator em até 2 dias; relator tem 8 dias improrrogáveis.","► Vista: só depois de relatado, por no máximo 2 dias corridos.","🔑 15 + 8 | relator 8 | vista 2"],"a":["ri:97"],"src":"Questão inédita"},{"id":"mc-ri-13","lei":"ri","tp":"mc","b":"D","e":"Os membros das Comissões Permanentes serão destituídos caso não compareçam, injustificadamente, a","o":["um terço das reuniões da sessão legislativa.","duas reuniões consecutivas.","cinco reuniões consecutivas.","três reuniões consecutivas.","três reuniões alternadas no mesmo mês."],"c":3,"k":["📌 Art. 113, §§ 2º e 3º, do Regimento","► Três faltas consecutivas injustificadas → destituição, sem poder integrar comissão permanente até o fim da sessão legislativa.","► As faltas podem ser justificadas em 5 dias.","⚠️ Mesa Diretora = 5 reuniões ordinárias consecutivas (art. 46, § 2º)."],"a":["ri:113"],"src":"Questão inédita"},{"id":"mc-ri-14","lei":"ri","tp":"mc","b":"D","e":"Acerca da Comissão Especial de Inquérito, segundo o Regimento, é correto afirmar:","o":["não pode investigar fatos relativos à Administração indireta.","o requerimento deve ser subscrito pela maioria absoluta dos Vereadores, e o prazo é de 120 dias improrrogáveis.","depende de aprovação do Plenário, por maioria absoluta.","o requerimento subscrito por 1/3 dos membros da Câmara independe de deliberação do Plenário; a comissão terá no mínimo 3 membros e prazo de 90 dias, prorrogável.","suas reuniões podem ocorrer com qualquer número de membros."],"c":3,"k":["📌 Arts. 121, §§ 1º e 3º, 125 e 221, 'b', do Regimento","► 1/3 dos membros → criação sem deliberação do Plenário (direito da minoria, simetria com o art. 58, § 3º, da CF).","► Mínimo de 3 membros; prazo de 90 dias, prorrogável por requerimento deferido pelo Presidente da Câmara.","► Reuniões só com a maioria de seus membros (art. 125)."],"a":["ri:121","ri:221"],"src":"Questão inédita"},{"id":"mc-ri-15","lei":"ri","tp":"mc","b":"E","e":"As sessões ordinárias da Câmara Municipal de Mossoró são realizadas","o":["diariamente, de terça a quinta, às 14h.","às quartas e quintas-feiras, às 9h.","às terças e quartas-feiras, com início às 9h.","às terças e quintas-feiras, às 18h.","às segundas e terças-feiras, às 8h."],"c":2,"k":["📌 Art. 151 do Regimento","► Terças e quartas-feiras, às 9h00.","► Partes da sessão ordinária (art. 152): Expedientes, Ordem do Dia e Explicação Pessoal."],"a":["ri:151","ri:152"],"src":"Questão inédita"},{"id":"mc-ri-16","lei":"ri","tp":"mc","b":"E","e":"Sobre a Tribuna Popular, assinale a alternativa correta.","o":["Basta ser residente em Mossoró, independentemente de ser eleitor.","Após o orador, cada Vereador presente dispõe de 5 minutos para comentar o tema.","O requerimento deve ser apresentado com antecedência mínima de três dias e subscrito por, no mínimo, dez outros cidadãos eleitores em Mossoró.","O cidadão pode falar por até 15 minutos, admitidos apartes.","Cada cidadão pode usar a Tribuna Popular uma vez por mês."],"c":2,"k":["📌 Art. 158 do Regimento","► Até 10 minutos, sem apartes; requerimento com 3 dias de antecedência, subscrito por 10 cidadãos eleitores em Mossoró.","► Uso uma vez por ano legislativo; depois, 2 minutos para um representante de cada Bancada.","🔑 10 min | 3 dias | 10 assinaturas | 1 vez/ano | 2 min por bancada"],"a":["ri:158"],"src":"Questão inédita"},{"id":"mc-ri-17","lei":"ri","tp":"mc","b":"E","e":"Quanto ao uso da tribuna nos Expedientes, o Vereador inscrito","o":["no Pequeno Expediente fala por 10 minutos, com apartes.","no Grande Expediente fala por 15 minutos, prorrogáveis.","no Pequeno Expediente fala por 5 minutos, sem apartes; no Grande Expediente, por 10 minutos corridos, podendo conceder apartes de até 1 minuto.","em qualquer dos Expedientes fala por 3 minutos.","no Grande Expediente fala por 5 minutos, sem apartes."],"c":2,"k":["📌 Art. 159, §§ 2º e 3º, do Regimento","► Pequeno Expediente: 5 min, sem apartes. Grande Expediente: 10 min corridos, apartes de até 1 min.","► Quem não estiver presente na sua vez perde a vez e só se reinscreve em último lugar (§ 1º)."],"a":["ri:159"],"src":"Questão inédita"},{"id":"mc-ri-18","lei":"ri","tp":"mc","b":"E","e":"Na organização da pauta da Ordem do Dia, a primeira matéria a figurar é","o":["matéria em Redação Final.","o veto.","matéria em discussão e votação única.","as indicações.","matéria em 1ª discussão."],"c":1,"k":["📌 Art. 162 do Regimento","► Ordem: a) veto; b) redação final; c) 2ª discussão; d) 1ª discussão; e) discussão única; f) indicações.","► Pauta organizada 24 horas antes; cada Vereador pode apresentar até 5 proposições por sessão ordinária.","🔑 Veto abre, indicação fecha."],"a":["ri:162"],"src":"Questão inédita"},{"id":"mc-ri-19","lei":"ri","tp":"mc","b":"E","e":"A Ordem do Dia somente será iniciada com a presença","o":["da maioria absoluta dos Vereadores.","da maioria simples dos presentes.","de 1/3 dos Vereadores.","de 2/3 dos Vereadores.","de qualquer número de Vereadores."],"c":0,"k":["📌 Art. 161, § 1º, e art. 250, § 2º, do Regimento","► Ordem do Dia e votação: maioria absoluta presente.","⚠️ Na sessão extraordinária, a abertura pode se dar com 1/3, mas a discussão e votação exigem maioria absoluta (art. 175, parágrafo único)."],"a":["ri:161","ri:250"],"src":"Questão inédita"},{"id":"mc-ri-20","lei":"ri","tp":"mc","b":"E","e":"A fase de Explicação Pessoal","o":["permite a cessão de tempo entre Vereadores.","tem duração máxima e improrrogável de 15 minutos, e cada orador dispõe de até 3 minutos, sem apartes.","tem duração máxima de 30 minutos, e cada orador fala por 5 minutos, com apartes.","destina-se à discussão das matérias da Ordem do Dia.","ocorre também nas sessões extraordinárias."],"c":1,"k":["📌 Art. 172 do Regimento","► Duração: 15 minutos, improrrogáveis; cada orador: 3 minutos, sem apartes, sem desviar da finalidade.","► Não há Explicação Pessoal nem Expedientes na sessão extraordinária (art. 175)."],"a":["ri:172"],"src":"Questão inédita"},{"id":"mc-ri-21","lei":"ri","tp":"mc","b":"E","e":"Segundo o Regimento Interno, no período de recesso legislativo a Câmara poderá ser convocada extraordinariamente","o":["pelo Prefeito, pela maioria dos Vereadores ou pela Comissão Representativa.","pelo Prefeito ou por qualquer líder partidário.","somente pelo Prefeito.","apenas pela Comissão Representativa.","por 1/3 dos Vereadores ou pelo Presidente do Tribunal de Contas."],"c":0,"k":["📌 Art. 177 do Regimento","► Três legitimados: Prefeito; maioria dos Vereadores; Comissão Representativa (LOM, art. 38, V).","► Na sessão extraordinária só se vota o que foi objeto da convocação (art. 176)."],"a":["ri:177"],"src":"Questão inédita"},{"id":"mc-ri-22","lei":"ri","tp":"mc","b":"F","e":"Finda a legislatura, NÃO serão arquivadas as proposições","o":["de iniciativa popular.","de iniciativa de Vereador sem parecer.","apresentadas no último ano da legislatura.","que estejam com vista concedida.","que abram crédito suplementar."],"c":0,"k":["📌 Art. 190 do Regimento","► Exceções ao arquivamento: pareceres favoráveis de todas as comissões; já aprovadas em algum turno; de iniciativa popular; de iniciativa do Prefeito.","► Desarquivamento: requerimento do Vereador nos primeiros 180 dias da legislatura seguinte.","⚠️ As que abrem crédito suplementar são arquivadas."],"a":["ri:190"],"src":"Questão inédita"},{"id":"mc-ri-23","lei":"ri","tp":"mc","b":"F","e":"Sobre a Urgência Especial, é correto afirmar:","o":["o requerimento é discutido por até 10 minutos antes da votação.","depende sempre de 2/3 dos membros da Câmara.","rejeitada pela CCJR, a urgência não pode ser submetida ao Plenário.","não se admite para proposições com menos de 8 dias de protocoladas.","pode ser requerida por qualquer Vereador isoladamente."],"c":3,"k":["📌 Art. 193 do Regimento","► Requerentes: a Mesa (proposição de sua autoria) ou 1/3 dos Vereadores. O requerimento não sofre discussão.","► Rejeitado pela CCJR → vai ao Plenário e exige maioria absoluta.","► Vedada para proposição com menos de 8 dias de protocolo (inciso VI)."],"a":["ri:193"],"src":"Questão inédita"},{"id":"mc-ri-24","lei":"ri","tp":"mc","b":"F","e":"No Regime de Urgência aplicável aos projetos do Executivo, a Comissão Permanente tem o prazo total de","o":["30 dias","8 dias","6 dias","15 dias","3 dias"],"c":2,"k":["📌 Art. 195 do Regimento","► Envio às comissões em 3 dias; Presidente da comissão designa relator em 24 horas; relator tem 3 dias; prazo total da comissão: 6 dias.","► Vencido o prazo, o processo segue sem o parecer da comissão faltosa.","🔑 3 dias → 24 h → 3 dias → total 6"],"a":["ri:195"],"src":"Questão inédita"},{"id":"mc-ri-25","lei":"ri","tp":"mc","b":"F","e":"A emenda que se refere apenas à redação do dispositivo, sem alterar sua substância, denomina-se","o":["subemenda","modificativa","supressiva","aditiva","substitutiva"],"c":1,"k":["📌 Art. 214, § 1º, do Regimento","► Supressiva: suprime. Substitutiva: põe outra no lugar. Aditiva: acrescenta. Modificativa: só redação, sem mudar a substância.","► Subemenda: emenda apresentada a outra emenda (§ 2º)."],"a":["ri:214"],"src":"Questão inédita"},{"id":"mc-ri-26","lei":"ri","tp":"mc","b":"G","e":"Nos processos de cassação de mandato, o denunciado terá, para sua defesa, o prazo de","o":["30 minutos","1 hora","2 horas","15 minutos","3 minutos"],"c":1,"k":["📌 Art. 247, § 1º, do Regimento","► Cassação: 1 hora para defesa. Destituição da Mesa: 30 minutos para o relator e para o denunciado.","► Regra geral: 5 min com apartes (vetos e projetos); 3 min (pareceres, redação final, requerimentos).","⚠️ Na Ordem do Dia não se admite cessão de tempo (§ 2º)."],"a":["ri:247"],"src":"Questão inédita"},{"id":"mc-ri-27","lei":"ri","tp":"mc","b":"G","e":"Considere a matéria sujeita a dois turnos de votação que foi rejeitada no primeiro turno. Segundo o Regimento, ela","o":["depende de requerimento de 1/3 para ir ao segundo turno.","está definitivamente arquivada.","somente volta à pauta na sessão legislativa seguinte.","é encaminhada à CCJR para nova redação.","deve passar obrigatoriamente pelo segundo turno, prevalecendo o resultado deste."],"c":4,"k":["📌 Art. 252 do Regimento","► Mesmo rejeitada no 1º turno, a matéria passa obrigatoriamente pelo 2º, que prevalece.","► O Vereador impedido por interesse pessoal não vota, mas conta para o quórum (art. 251, § 1º)."],"a":["ri:251","ri:252"],"src":"Questão inédita"},{"id":"mc-ri-28","lei":"ri","tp":"mc","b":"G","e":"Entre as hipóteses de votação nominal obrigatória previstas no Regimento NÃO se inclui","o":["a apreciação do veto.","a eleição da Mesa.","a concessão de título de cidadania honorária.","a composição das Comissões Permanentes.","o requerimento de dispensa da leitura de matéria da Ordem do Dia."],"c":4,"k":["📌 Art. 254, § 3º, do Regimento","► Nominal obrigatória: quórum de 2/3 ou maioria absoluta; pareceres do TC; composição das comissões; eleição da Mesa; cassação; títulos e honrarias; veto.","► A dispensa de leitura é requerimento comum, aprovado pelo Plenário (art. 165, parágrafo único)."],"a":["ri:254"],"src":"Questão inédita"},{"id":"mc-ri-29","lei":"ri","tp":"mc","b":"G","e":"Em relação à sanção e ao veto, o Regimento Interno dispõe que","o":["o autógrafo é enviado ao Prefeito em 15 dias úteis, e o veto deve ocorrer em 10 dias úteis.","o prazo de apreciação do veto corre normalmente durante o recesso.","o autógrafo é enviado em 10 dias úteis; o Prefeito tem 15 dias úteis para vetar; o veto é apreciado em 30 dias e só é rejeitado por maioria absoluta.","o veto parcial pode abranger palavras ou expressões isoladas.","o veto é rejeitado por 2/3 dos membros da Câmara."],"c":2,"k":["📌 Arts. 262 e 263 do Regimento","► Autógrafo ao Prefeito: 10 dias úteis. Sanção tácita após 15 dias úteis sem manifestação.","► Veto: 15 dias úteis; parcial só abrange texto integral de artigo, parágrafo, inciso ou alínea.","► Apreciação: 30 dias; rejeição por maioria absoluta; o prazo não corre no recesso (§ 10)."],"a":["ri:262","ri:263"],"src":"Questão inédita"},{"id":"mc-ri-30","lei":"ri","tp":"mc","b":"G","e":"Cada parlamentar pode apresentar emendas impositivas ao orçamento anual no limite de","o":["12 emendas","8 emendas","5 emendas","10 emendas","20 emendas"],"c":3,"k":["📌 Art. 277, caput, c/c art. 275, § 1º, do Regimento","► Até 10 emendas impositivas por parlamentar, no prazo de 10 dias de recebimento de emendas pela Comissão de Orçamento.","► Nota técnica da Comissão em 5 dias; o Vereador tem 2 dias para reapresentar as correções.","► Limite global das emendas: 1,2% da RCL (LOM, art. 148-A)."],"a":["ri:277","ri:275"],"src":"Questão inédita"},{"id":"mc-ri-31","lei":"ri","tp":"mc","b":"H","e":"A iniciativa popular de projetos de lei e de emendas à Lei Orgânica depende da manifestação de, no mínimo,","o":["3% do eleitorado","5% do eleitorado","10% do eleitorado","1/3 do eleitorado","1% do eleitorado"],"c":1,"k":["📌 Art. 283 do Regimento (e LOM, art. 55, parágrafo único)","► 5% do eleitorado local.","► O primeiro signatário (ou quem indicar) pode falar por 30 minutos nas comissões ou no Plenário.","► Não se rejeita liminarmente por vícios de linguagem ou técnica legislativa: a CCJR corrige."],"a":["ri:283"],"src":"Questão inédita"},{"id":"mc-ri-32","lei":"ri","tp":"mc","b":"H","e":"Sobre o julgamento das contas do Prefeito e da Mesa, é correto afirmar:","o":["o parecer do Tribunal de Contas só deixa de prevalecer por decisão de 2/3 dos membros da Câmara.","a Câmara tem 90 dias para julgá-las, contados do recebimento do parecer prévio.","o parecer do Tribunal de Contas pode ser rejeitado por maioria absoluta.","o julgamento ficto é admitido quando a Câmara não delibera no prazo.","as contas ficam à disposição dos contribuintes por 30 dias."],"c":0,"k":["📌 Art. 296 do Regimento (CF, art. 31, §§ 2º e 3º)","► Prazo de julgamento: 60 dias do recebimento dos pareceres prévios.","► Contas à disposição dos contribuintes por 60 dias. Rejeição do parecer: 2/3.","⚠️ A LOM veda expressamente o julgamento ficto (art. 37, VIII, 'b')."],"a":["ri:296"],"src":"Questão inédita"},{"id":"mc-ri-33","lei":"ri","tp":"mc","b":"H","e":"A licença do Vereador para tratar de interesses particulares","o":["não tem prazo mínimo nem máximo.","permite reassumir o mandato a qualquer tempo.","pode ser de até 180 dias por sessão legislativa.","é concedida por prazo determinado, nunca inferior a 30 nem superior a 120 dias por sessão legislativa, sem reassunção antes do término.","garante a remuneração integral do mandato."],"c":3,"k":["📌 Art. 316, III, do Regimento","► Mínimo 30, máximo 120 dias por sessão legislativa; não pode reassumir antes do fim.","► Consideram-se em exercício, para fins de remuneração, as licenças por moléstia, missão cultural/de interesse do Município e adoção/maternidade/paternidade (§ 1º).","⚠️ A LOM (art. 42, § 4º) só fixa o mínimo de 30 dias."],"a":["ri:316"],"src":"Questão inédita"},{"id":"mc-ri-34","lei":"ri","tp":"mc","b":"H","e":"Sobre a extinção do mandato de Vereador por faltas, segundo o Regimento, é correto afirmar:","o":["não se computa a ausência quando a sessão não se realiza por falta de quórum.","exige julgamento pelo Plenário por 2/3 dos membros.","ocorre com a ausência a 5 sessões extraordinárias, apenas.","o Vereador tem 15 dias para apresentar defesa.","ocorre com a ausência injustificada a 1/3 ou mais das sessões ordinárias e extraordinárias realizadas no ano legislativo, e é declarada pelo Presidente da Câmara."],"c":4,"k":["📌 Arts. 320, III, 321 e 323 do Regimento","► Faltas a 1/3 ou mais das sessões ordinárias e extraordinárias do ano legislativo.","► Extinção é declarada pelo Presidente (ato declaratório); defesa em 5 dias.","► A ausência é computada mesmo se a sessão não ocorrer por falta de quórum (§ 1º).","⚠️ Extinção ≠ cassação: a cassação é que depende de julgamento."],"a":["ri:320","ri:321","ri:323"],"src":"Questão inédita"},{"id":"mc-ri-35","lei":"ri","tp":"mc","b":"H","e":"De acordo com o Regimento, são períodos de recesso legislativo","o":["de 19 a 31 de julho e de 24 de dezembro a 31 de janeiro.","todo o mês de julho e todo o mês de janeiro.","de 1º a 31 de julho e de 16 de dezembro a 1º de fevereiro.","de 19 de julho a 1º de agosto e de 20 de dezembro a 15 de janeiro.","de 18 a 31 de julho e de 23 de dezembro a 31 de janeiro."],"c":0,"k":["📌 Arts. 343 e 344 do Regimento","► Sessão legislativa: 1º de fevereiro a 23 de dezembro (a inaugural começa em 1º de janeiro).","► Recesso: 19 a 31 de julho e 24 de dezembro a 31 de janeiro.","► Na LOM (art. 30): reuniões de 1º/fev a 18/jul e de 1º/ago a 23/dez."],"a":["ri:343","ri:344"],"src":"Questão inédita"},{"id":"mc-ri-36","lei":"ri","tp":"mc","b":"F","e":"Constitui matéria de projeto de resolução de iniciativa exclusiva da Mesa","o":["a destituição da Mesa.","a cassação de mandato de Vereador.","a elaboração e reforma do Regimento Interno.","o julgamento de recursos e a organização, criação e extinção de cargos dos serviços da Câmara.","a constituição de Frentes Parlamentares."],"c":3,"k":["📌 Art. 211, §§ 1º e 2º, do Regimento","► A iniciativa de resolução é da Mesa ou dos Vereadores; exclusiva da Mesa nas alíneas 'c' (julgamento de recursos) e 'e' (organização, cargos e remuneração dos serviços).","► Resolução regula economia interna e não vai à sanção do Prefeito."],"a":["ri:211"],"src":"Questão inédita"},{"id":"mc-ri-37","lei":"ri","tp":"mc","b":"D","e":"A Comissão de Representação que acarretar despesas será constituída","o":["por requerimento de 1/3 dos Vereadores.","por projeto de resolução aprovado por maioria simples, ouvida a Comissão de Orçamento em 3 dias.","por simples requerimento votado na mesma sessão.","por ato do Presidente, sem deliberação.","por decreto legislativo aprovado por 2/3."],"c":1,"k":["📌 Art. 118, §§ 1º e 2º, do Regimento","► Com despesas: projeto de resolução (maioria simples), com oitiva da Comissão de Orçamento em 3 dias.","► Sem despesas: simples requerimento, votado na mesma sessão.","► Relatório e prestação de contas em 10 dias após o término (§ 7º)."],"a":["ri:118"],"src":"Questão inédita"},{"id":"mc-ri-38","lei":"ri","tp":"mc","b":"F","e":"Da decisão do Presidente que deixa de receber uma proposição no ato do protocolo cabe recurso do autor no prazo de","o":["5 dias","15 dias","3 dias","10 dias","48 horas"],"c":3,"k":["📌 Art. 187, parágrafo único, do Regimento","► Recurso em 10 dias → CCJR → parecer em forma de projeto de resolução → Plenário.","► Entre as causas de não recebimento: proposição rejeitada ou vetada na mesma sessão legislativa não subscrita pela maioria absoluta (inciso V)."],"a":["ri:187"],"src":"Questão inédita"},{"id":"mc-lom-1","lei":"lom","tp":"mc","b":"A","e":"Entre os fundamentos do Município de Mossoró previstos na Lei Orgânica, e que não constam do rol do art. 1º da Constituição Federal, está","o":["a transparência e a participação social.","os valores sociais do trabalho e da livre iniciativa.","a dignidade da pessoa humana.","a cidadania.","o pluralismo político."],"c":0,"k":["📌 Art. 1º, VI, da LOM (Emenda 04/2016)","► Fundamentos: autonomia; cidadania; dignidade da pessoa humana; valores sociais do trabalho e da livre iniciativa; pluralismo político; transparência e participação social.","⚠️ 'Autonomia' (no lugar da soberania) e 'transparência e participação so
