utoria da Mesa Diretora ou de Comissão Permanente só poderão ser retiradas mediante requerimento subscrito pela maioria dos respectivos membros."],"nt":[]},{"id":"ri:169","n":"169","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["A discussão e a votação das matérias propostas serão feitas na forma determinada nos capítulos referentes ao assunto."],"nt":[]},{"id":"ri:170","n":"170","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção III — Da Ordem do Dia"],"t":["Não havendo mais matéria sujeita à deliberação do Plenário na Ordem do Dia, o Presidente declarará aberta a fase da Explicação Pessoal.","Parágrafo único. Se nenhum Vereador solicitar a palavra em Explicação Pessoal, o Presidente dará por encerrados os trabalhos."],"nt":[]},{"id":"ri:171","n":"171","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção IV — Da Explicação Pessoal"],"t":["Esgotada a pauta da Ordem do Dia, desde que presente no mínimo 1/3 (um terço) dos Vereadores, passar-se-á à Explicação Pessoal."],"nt":[]},{"id":"ri:172","n":"172","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção IV — Da Explicação Pessoal"],"t":["Explicação Pessoal é a fase destinada à manifestação dos Vereadores sobre atitudes pessoais assumidas durante a sessão ou no exercício do mandato.","§ 1º A fase de Explicação Pessoal terá a duração máxima e improrrogável de 15 (quinze) minutos.","§ 2º O Presidente concederá a palavra aos oradores inscritos, segundo a ordem de inscrição.","§ 3º A inscrição para falar em Explicação Pessoal será solicitada durante a sessão e coordenada cronologicamente pelo 1º Secretário em registro próprio.","§ 4º O Orador terá o prazo máximo de 3 (três) minutos para uso da palavra e não poderá desviar-se da finalidade da Explicação Pessoal, nem ser aparteado.","§ 5º O não atendimento ao disposto no parágrafo anterior sujeitará o orador à advertência pelo Presidente e, na reincidência, à cassação da palavra."],"nt":[]},{"id":"ri:173","n":"173","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VI — Das Sessões Ordinárias","Subseção IV — Da Explicação Pessoal"],"t":["Não havendo mais Oradores para falar em Explicação Pessoal, o Presidente comunicará aos senhores Vereadores a data da próxima sessão, anunciando a respectiva pauta, se já tiver sido organizada, e declarará encerrada a sessão, ainda que antes do prazo regimental de encerramento."],"nt":[]},{"id":"ri:174","n":"174","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VII — Das Sessões Extraordinárias"],"t":["No período normal de funcionamento da Câmara, as sessões extraordinárias serão convocadas:","I – pelo Prefeito, quando este considerar necessário;","II – pela Maioria absoluta dos Vereadores, em caso de urgência ou interesse público relevante;","III – pelo Presidente da Câmara, em sessão ou fora dela.","§ 1º A convocação de sessão extraordinária será levada ao conhecimento dos Vereadores pelo Presidente da Câmara por meio de comunicação pessoal e escrita com a obrigatoriedade de antecedência mínima de 24 (vinte e quatro) horas, exceto quando a convocação for realizada pelo Presidente da Câmara no transcorrer de sessão plenária.","§ 2º Sempre que possível, a convocação de sessão extraordinária pelo Presidente da Câmara far-se-á durante o transcorrer de sessão plenária.","§ 3º Exclusivamente nos casos em que a sessão extraordinária for convocada pelo Presidente da Câmara durante o transcorrer de sessão plenária, considerar-se-á dispensada a exigência de comunicação pessoal e escrita com 24 (vinte e quatro) horas de antecedência, mantendo-se, nos demais casos, a previsão exigida no §1º."],"nt":[]},{"id":"ri:175","n":"175","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VII — Das Sessões Extraordinárias"],"t":["Na sessão extraordinária, não haverá Expedientes nem Explicação Pessoal, sendo todo o seu tempo destinado à Ordem do Dia.","Parágrafo único. Aberta a sessão extraordinária com a presença de 1/3 (um terço) dos membros da Câmara, mas não contando, após a tolerância de 15 (quinze) minutos, com a maioria absoluta para discussão e votação das proposições, o Presidente encerrará os trabalhos, determinando a lavratura da respectiva ata, que independerá de aprovação."],"nt":[]},{"id":"ri:176","n":"176","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VII — Das Sessões Extraordinárias"],"t":["Só poderão ser discutidas e votadas nas sessões extraordinárias as proposições que tenham sido objeto da convocação, mantendo-se as exigências regimentais que couberem quanto ao regime ordinário de tramitação da proposição."],"nt":[]},{"id":"ri:177","n":"177","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VII — Das Sessões Extraordinárias"],"t":["No período de recesso legislativo, a Câmara poderá ser convocada extraordinariamente:","I – pelo Prefeito;","II – pela maioria dos Vereadores;","III – pela Comissão Representativa da Câmara, conforme previsto no art. 38, V da Lei Orgânica."],"nt":[]},{"id":"ri:178","n":"178","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção VII — Das Sessões Extraordinárias"],"t":["No período de recesso legislativo, as convocações extraordinárias deverão ser feitas mediante ofício dirigido ao Presidente da Câmara Municipal, para se reunir, no mínimo, dentro de 3 (três) dias, salvo motivo de extrema urgência devidamente justificada.","§ 1º A Câmara poderá ser convocada para uma única sessão, para um período determinado de várias sessões em dias sucessivos ou para todo o período de recesso.","§ 2º Se do oficio de convocação não constar o horário da sessão ou das sessões a serem realizadas, será obedecido o previsto no Art. 151 deste Regimento para as sessões ordinárias.","§ 3º A convocação extraordinária da Câmara implicará a imediata inclusão do projeto, constante da convocação, na Ordem do Dia, dispensadas todas as formalidades regimentais anteriores, exceto os pareceres das Comissões Permanentes, que serão proferidos oralmente.","§ 4º Se o projeto constante da convocação não contar com emendas ou substitutivos, a sessão poderá ser suspensa por 30 (trinta) minutos, mediante requerimento de qualquer Vereador submetido ao Plenário, após a leitura do projeto e antes de iniciada a fase de sua discussão, para o oferecimento daquelas proposições acessórias, podendo esse prazo ser prorrogado ou dispensado por deliberação do Plenário.","§ 5º Continuará a correr na sessão extraordinária e por todo o período de sua duração o prazo a que estiverem submetidos os projetos objeto da convocação."],"nt":[]},{"id":"ri:179","n":"179","tag":"","b":"E","h":["TÍTULO V — DAS SESSÕES","CAPÍTULO I — Das Sessões Ordinárias, Extraordinárias, Secretas e Solenes","Seção IX — Das Sessões Solenes"],"t":["As sessões solenes serão convocadas pelo Presidente ou por deliberação da Câmara mediante requerimento aprovado por maioria simples, destinando-se às solenidades cívicas oficiais.","§ 1º Estas sessões poderão ser realizadas fora do recinto da Câmara e independem de quórum para sua instalação e desenvolvimento.","§ 2º Não haverá Expediente, Ordem do Dia e Explicação Pessoal nas sessões solenes, sendo, inclusive, dispensadas a verificação de presença e a leitura da ata da sessão anterior.","§ 3º Nas sessões solenes, não haverá tempo determinado para o seu encerramento.","§ 4º Será elaborado, previamente e com ampla divulgação, o programa a ser obedecido na sessão solene, podendo, a critério da Presidência da Câmara, usar da palavra autoridades, homenageados e representantes de classe e de associações.","§ 5º Normativo próprio da Câmara Municipal de Mossoró disporá sobre a realização e organização das sessões solenes de forma detalhada.","§ 6º Independe de convocação a sessão solene de posse e instalação da Legislatura, que deverá ocorrer em 1º de janeiro de cada Legislatura."],"nt":[]},{"id":"ri:180","n":"180","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares"],"t":["Proposição é toda matéria sujeita à apresentação ou deliberação do Plenário.","§ 1º As proposições poderão consistir em:","a) proposta de emenda à Lei Orgânica;","b) projetos de lei;","c) projetos de Decreto Legislativo;","d) projetos de Resolução;","e) substitutivos;","f) emendas ou subemendas;","g) Mensagens Modificativas do Chefe do Poder Executivo;","g) vetos;","h) pareceres;","i) requerimentos;","j) indicações.","§ 2º As proposições deverão ser redigidas em termos claros, devendo conter ementa de seu assunto e assinatura de seu autor propositor."],"nt":[]},{"id":"ri:181","n":"181","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["As proposições de Vereadores e do Poder Executivo serão apresentadas digitalmente por seus autores conforme disposto nesta seção.","Parágrafo único. As proposições de iniciativa popular obedecerão ao disposto nos Art. 283, Art. 2844 e Art. 2855 deste Regimento Interno."],"nt":[]},{"id":"ri:182","n":"182","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["A rotina de protocolo de proposições no âmbito da Diretoria Legislativa se dará por meio de plataforma eletrônica instituída para esta finalidade, visando à consolidação da sistemática de informatização e digitalização dos processos legislativos da Diretoria Legislativa, a qual será regulamentada em normativo próprio definido pela Presidência da Câmara Municipal de Mossoró."],"nt":[]},{"id":"ri:183","n":"183","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["Para o protocolo digital das proposições junto à Diretoria Legislativa, o autor deverá assinar digitalmente suas proposições nos termos da Lei nº 14.063, de 23 de setembro de 2020."],"nt":[]},{"id":"ri:184","n":"184","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["O acompanhamento, tramitação e arquivo de matérias legislativas serão exclusivamente digitais, em banco de dados eletrônico e com o respectivo backup e segurança digital."],"nt":[]},{"id":"ri:185","n":"185","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["Os pareceres e proposições de autoria das Comissões deverão ser recebidos e protocolados nos moldes desta seção."],"nt":[]},{"id":"ri:186","n":"186","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção I — Da Apresentação das Proposições"],"t":["Em virtude da ausência de regulamento ou de impedimentos técnicos que impossibilitem as assinaturas digitais nos termos do art. 183 deste Regimento, o protocolo apenas se concluirá com a apresentação das matérias de forma física, devendo ser assinadas de próprio punho pelos seus respectivos autores e entregues presencialmente na Diretoria Legislativa, no setor correspondente de Protocolo Legislativo."],"nt":[]},{"id":"ri:187","n":"187","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção II — Do Recebimento das Proposições"],"t":["A Presidência deixará de receber, no ato do protocolo, qualquer proposição:","I – que, aludindo a Lei, Decreto ou Regulamento ou qualquer outra norma legal, não venha acompanhada de seu texto;","II – que, fazendo menção à cláusula de contratos ou de convênios, não os tenha anexado;","III – que seja antirregimental;","IV – que, sendo de iniciativa popular, não atenda aos requisitos do Art. 283 deste Regimento;","V – que tenha sido rejeitada ou vetada na mesma sessão legislativa e não seja subscrita pela maioria absoluta da Câmara;","VI – que configure emenda, subemenda, ou substituição não pertinente à matéria contida no Projeto;","VII – que, contendo matéria de indicação, seja apresentada em forma de requerimento.","Parágrafo único. Da decisão do Presidente caberá recurso, que deverá ser apresentado pelo autor dentro de 10 (dez) dias e encaminhado pelo Presidente à Comissão de Constituição, Justiça e Redação, cujo parecer em forma de projeto de Resolução será incluído na Ordem do Dia e apreciado pelo Plenário."],"nt":[]},{"id":"ri:188","n":"188","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção II — Do Recebimento das Proposições"],"t":["Considerar-se-á autor da proposição, para efeitos regimentais, o seu primeiro signatário, sendo de simples apoio as assinaturas que se seguirem à primeira, ressalvadas as proposições de iniciativa popular, que atenderão ao disposto nos Art. 283, Art. 284 e Art. 285 deste Regimento."],"nt":[]},{"id":"ri:189","n":"189","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção III — Da Retirada das Proposições"],"t":["A retirada da proposição em curso na Câmara é permitida:","a) quando de iniciativa popular, mediante requerimento assinado por metade mais um dos subscritores da proposição;","b) quando de autoria de um ou mais Vereadores, mediante requerimento do único signatário ou do primeiro deles;","c) quando de autoria de Comissão, pelo requerimento da maioria de seus membros;","d) quando de autoria da Mesa Diretora, mediante o requerimento da maioria de seus membros;","e) quando de autoria do Prefeito, por requerimento subscrito pelo Chefe do Executivo;","§ 1º A solicitação de retirada de proposição só poderá ser recebida antes de iniciada a discussão e votação da matéria.","§ 2º Se a proposição ainda não estiver incluída na Ordem do Dia, caberá ao Presidente apenas determinar o seu arquivamento.","§ 3º Se a matéria já estiver incluída na Ordem do Dia, caberá ao Plenário a decisão sobre a solicitação de retirada.","§ 4º As assinaturas de apoio, quando constituírem quórum para apresentação, não poderão ser retiradas após a proposição ter sido encaminhada à Mesa Diretora ou protocolada na Diretoria Legislativa.","§ 5º A proposição retirada na forma deste artigo será arquivada e não poderá ser reapresentada na mesma sessão legislativa, salvo deliberação do Plenário."],"nt":[]},{"id":"ri:190","n":"190","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção IV — Do Arquivamento e do Desarquivamento"],"t":["Finda a legislatura, arquivar-se-ão todas as proposições que no seu decurso tenham sido submetidas à deliberação da Câmara e ainda se encontrem em tramitação bem como as que abram crédito suplementar, com pareceres ou sem eles, salvo as:","I – com pareceres favoráveis de todas as Comissões pertinentes à sua análise;","II -já aprovadas em turno único, em primeiro ou segundo turno;","III – de iniciativa popular;","IV – de iniciativa do Prefeito.","Parágrafo único. A proposição poderá ser desarquivada mediante requerimento do vereador interessado, dirigido ao Presidente, dentro dos primeiros 180 (cento e oitenta) dias da legislatura subsequente, retomando a tramitação desde o estágio em que se encontrava."],"nt":[]},{"id":"ri:191","n":"191","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["As proposições serão submetidas aos seguintes regimes de tramitação:","I – Urgência Especial;","II – Urgência;","III – Ordinária."],"nt":[]},{"id":"ri:192","n":"192","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["A Urgência Especial é a dispensa de exigências regimentais, salvo a de número legal e de parecer, para que determinado projeto seja imediatamente considerado, a fim de evitar grave prejuízo ou perda de sua oportunidade."],"nt":[]},{"id":"ri:193","n":"193","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["Para a concessão do regime de tramitação em Urgência Especial, serão obrigatoriamente observadas as seguintes normas e condições:","I – A concessão de Urgência Especial dependerá de apresentação de requerimento escrito devidamente justificado e deverá ser apresentado:","a) pela Mesa Diretora, em proposição de sua autoria;","b) por 1/3 (um terço), no mínimo, dos Vereadores.","II – o requerimento de Urgência Especial poderá ser apresentado em qualquer fase da sessão, mas somente será submetido à Mesa Diretora durante o tempo destinado à Ordem do Dia;","III – o requerimento de Urgência Especial não sofrerá discussão.","IV – não poderá ser concedida Urgência Especial para qualquer projeto, com prejuízo de outra Urgência Especial já votada, salvo nos casos de segurança e calamidade pública;","V – O requerimento de Urgência Especial, quando rejeitado pela Comissão de Constituição, Justiça e Redação, será submetido ao plenário e dependerá, para a sua aprovação, de quórum da maioria absoluta;","VI – Não será admitido Requerimento de Urgência Especial para proposições com menos de 08 (oito) dias de protocoladas na Diretoria Legislativa da Câmara Municipal."],"nt":[]},{"id":"ri:194","n":"194","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["A matéria submetida ao regime de Urgência Especial entrará automaticamente na pauta da Ordem do Dia, com preferência sobre todas as demais matérias, com exceção dos vetos com prazos vencidos, nos termos da Constituição Federal e deste Regimento Interno."],"nt":[]},{"id":"ri:195","n":"195","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["O Regime de Urgência implica redução dos prazos regimentais e se aplica somente aos projetos de autoria do Executivo submetidos ao prazo de até 30 (trinta) dias para apreciação.","§ 1º Os projetos submetidos ao Regime de Urgência serão enviados às Comissões Permanentes pelo Presidente, dentro do prazo de 3 (três) dias da entrada na Secretaria da Câmara, independentemente da leitura no Expediente da sessão.","§ 2º O Presidente da Comissão Permanente terá o prazo de 24 (vinte e quatro) horas para designar relator, a contar da data do seu recebimento.","§ 3º O relator designado terá o prazo de 3 (três) dias para apresentar parecer, findo o qual sem que tenha sido apresentado, o Presidente da Comissão Permanente avocará o processo e emitirá parecer.","§ 4º A Comissão Permanente terá o prazo total de 6 (seis) dias para exarar seu parecer, a contar do recebimento da matéria.","§ 5º Findo o prazo para a Comissão competente emitir seu parecer, o processo será enviado a outra Comissão Permanente ou incluído na Ordem do Dia, sem o parecer da Comissão faltosa."],"nt":[]},{"id":"ri:196","n":"196","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO I — Disposições Preliminares","Seção V — Do Regime de Tramitação das Proposições"],"t":["A tramitação ordinária aplica-se às proposições que não estejam submetidas ao Regime de Urgência Especial ou ao Regime de Urgência."],"nt":[]},{"id":"ri:197","n":"197","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção I — Disposições Preliminares"],"t":["A Câmara Municipal exerce a sua função legislativa por meio de:","I – propostas de emenda à Lei Orgânica;","II – projetos de lei;","III – projetos de Decreto Legislativo;","IV – projetos de Resolução.","Parágrafo único. São requisitos para apresentação dos projetos:","a) ementa de seu conteúdo;","b) enunciação exclusivamente da vontade legislativa;","c) divisão em artigos numerados, claros e concisos;","d) menção da revogação das disposições em contrário, quando for o caso;","e) assinatura do autor;","f) Justificativa, com a exposição circunstanciada dos motivos de mérito que fundamentam a adoção da medida proposta, bem como a assinatura do autor;","g) observância, no que couber, ao disposto no Art. 187 deste Regimento."],"nt":[]},{"id":"ri:198","n":"198","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção II — Da Proposta de Emenda à Lei Orgânica"],"t":["Proposta de emenda à Lei Orgânica é a proposição destinada a modificar, suprimir ou acrescentar dispositivo à Lei Orgânica do Município."],"nt":[]},{"id":"ri:199","n":"199","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção II — Da Proposta de Emenda à Lei Orgânica"],"t":["A Câmara apreciará proposta de emenda à Lei Orgânica, desde que:","I – apresentada por, no mínimo, 1/3 (um terço) dos membros da Câmara, pelo Prefeito ou por, no mínimo, 5% (cinco por cento) do eleitorado;","II – não esteja sob intervenção estadual, estado de sítio ou de defesa;","III – não proponha a abolição da Federação, do voto direto, secreto e universal e periódico, da separação dos poderes e dos direitos e garantias constitucionais (art. 60, CF)."],"nt":[]},{"id":"ri:200","n":"200","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção II — Da Proposta de Emenda à Lei Orgânica"],"t":["A proposta de emenda à Lei Orgânica será submetida a dois turnos de votação, com interstício mínimo de 10 (dez) dias e será aprovada pelo quórum de 2/3 (dois terços) dos membros da Câmara (art. 29, caput da CF)."],"nt":[]},{"id":"ri:201","n":"201","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção II — Da Proposta de Emenda à Lei Orgânica"],"t":["Aplicam-se à proposta de emenda à Lei Orgânica, no que não colidir com o estatuído nesta seção, as disposições regimentais relativas ao trâmite e apreciação dos projetos de lei."],"nt":[]},{"id":"ri:202","n":"202","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["Projeto de lei é a proposição que tem por fim regular toda a matéria de competência da Câmara e sujeita à sanção do Prefeito.","Parágrafo único. A iniciativa dos projetos de lei será:","I – do Vereador;","II – da Mesa da Câmara;","III – do Prefeito;","IV – de, no mínimo, 5% (cinco por cento) do eleitorado."],"nt":[]},{"id":"ri:203","n":"203","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["É da competência privativa do Prefeito a iniciativa das leis que disponham sobre:","I – a criação, estruturação e atribuições dos órgãos e entidades da administração pública municipal;","II – a criação de cargos, empregos e funções na administração pública direta e autárquica, bem como a fixação e aumento de sua remuneração;","III – regime jurídico dos servidores municipais;","IV – o plano plurianual, as diretrizes orçamentárias e o orçamento anual, bem como a abertura de créditos suplementares e especiais (art. 165 e 67, V, CF).","§ 1º Nos projetos de iniciativa privativa do Prefeito, não serão admitidas emendas que aumentem a despesa prevista, ressalvadas as leis orçamentárias.","§ 2º As emendas ao projeto de lei de diretrizes orçamentárias não serão aprovadas quando incompatíveis com o plano plurianual (art. 166, §40, CF)."],"nt":["STF, Tema 917: criar despesa não basta para configurar vício de iniciativa."]},{"id":"ri:204","n":"204","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["Independentemente de sua origem, os projetos de lei que dispuserem sobre denominações de logradouros públicos deverão estar acompanhados de documentação que comprove a ausência da denominação, além de demais exigências previstas em lei."],"nt":[]},{"id":"ri:205","n":"205","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["Mediante solicitação expressa do Prefeito, a Câmara deverá apreciar o projeto de lei respectivo dentro do prazo de 90 (noventa) dias, contados de seu recebimento na Diretoria Legislativa.","§ 1º Se o Prefeito julgar urgente a medida, poderá solicitar que a apreciação do projeto se faça em Regime de Urgência, de até 30 (trinta) dias, contados de seu recebimento pela Diretoria Legislativa.","§ 2º A fixação de prazo deverá ser sempre expressa e poderá ser feita após a remessa do projeto, em qualquer fase de seu andamento, considerando-se a data do recebimento desse pedido como seu termo inicial.","§ 3º Esgotado sem alteração o prazo previsto no §1º, o projeto será incluído na Ordem do Dia, sobrestando-se a deliberação, quanto aos demais assuntos, até que se ultime a votação, nos termos do Regimento Interno.","§ 4º Os prazos previstos neste artigo aplicam-se também aos projetos de lei para os quais se exija aprovação por quórum qualificado.","§ 5º Os prazos previstos neste artigo não correm no período de recesso e nem se aplicam aos projetos de códigos.","§ 6º Observadas as disposições regimentais, a Câmara poderá apreciar, em qualquer tempo, os projetos para os quais o Prefeito não tenha solicitado prazo de apreciação."],"nt":[]},{"id":"ri:206","n":"206","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["A matéria constante de projeto de lei rejeitado somente poderá constituir objeto de novo projeto na mesma sessão legislativa mediante proposta da maioria absoluta dos membros da Câmara."],"nt":[]},{"id":"ri:207","n":"207","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["Os projetos de lei submetidos a prazo de apreciação deverão constar, obrigatoriamente, da Ordem do Dia, independentemente de parecer escrito das Comissões, antes do término do prazo.","Parágrafo único. Os projetos que constarem para votação na Ordem do Dia sem parecer escrito das Comissões os receberão de forma oral em Plenário."],"nt":[]},{"id":"ri:208","n":"208","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["São de iniciativa popular os projetos de lei de interesse específico do Município, da cidade ou de bairros, a partir da manifestação de no mínimo 5% (cinco por cento) do eleitorado, atendidas as disposições do Capítulo 1, do Título VIII, deste Regimento."],"nt":[]},{"id":"ri:209","n":"209","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção III — Dos Projetos de Lei"],"t":["À Comissão de Constituição, Justiça e Redação, em razão da matéria de sua competência, cabe discutir e votar, em caráter terminativo, projeto de lei que propõe o reconhecimento de instituição como de utilidade pública."],"nt":[]},{"id":"ri:210","n":"210","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção IV — Dos Projetos de Decreto Legislativo"],"t":["Projeto de Decreto Legislativo é a proposição de competência privativa da Câmara, que excede os limites de sua economia interna, não sujeita à sanção do Prefeito e cuja promulgação compete ao Presidente da Câmara.","§ 1º Constitui matéria de decreto legislativo:","a) a concessão de licença ao Prefeito;","b) a cassação do mandato do Prefeito e do Vice-Prefeito;","c) a concessão de título de cidadão honorário ou qualquer outra honraria ou homenagem a pessoas que, reconhecidamente, tenham prestado serviços ao Município.","§ 2º Será de exclusiva competência da Mesa Diretora a apresentação dos projetos de decreto legislativo a que se referem às alíneas \"a\" e \"h\" do parágrafo anterior, competindo, nos demais casos, à Mesa ou aos Vereadores e Vereadoras."],"nt":[]},{"id":"ri:211","n":"211","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção V — Dos Projetos de Resolução"],"t":["Projeto de Resolução é a proposição destinada a regular assuntos de economia interna da Câmara, de natureza político-administrativa e que versará sobre sua Secretaria Administrativa, a Mesa e os Vereadores.","§ 1º Constitui matéria de projeto de Resolução:","a) destituição da Mesa ou de qualquer de seus membros;","b) elaboração e reforma do Regimento Interno;","c) julgamento de recursos;","d) constituição das Comissões de Assuntos Relevantes, de Representação ou Frentes Parlamentares;","e) organização, funcionamento, polícia, criação, transformação ou extinção dos cargos, empregos ou funções de seus serviços, observados os parâmetros estabelecidos na lei de diretrizes orçamentárias e os limites constitucionais (art. 48 cc. art. 51, IV, CF);","f) a cassação de mandato de Vereador;","g) demais atos de economia interna da Câmara.","§ 2º A iniciativa dos projetos de Resolução poderá ser da Mesa ou dos Vereadores, sendo exclusiva da Mesa a iniciativa do projeto previsto nas alíneas \"c\" e \"e\" do parágrafo anterior.","§ 3º Os projetos de Resolução serão apreciados na sessão subsequente à sua apresentação.","§ 4º Os Projetos de Resolução que dispuserem sobre a constituição de frentes parlamentares deverão prever a participação da sociedade civil, além de indicarem, em termos claros, qual o objetivo da frente parlamentar, sua forma de constituição, o quantitativo de membros que a comporão, bem como descrever como serão desenvolvidas suas atividades, ficando a condução dos trabalhos sob a responsabilidade do parlamentar proponente, não podendo a frente parlamentar dispor sobre temática de competência específica de Comissão Permanente."],"nt":[]},{"id":"ri:212","n":"212","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO II — Dos Projetos","Seção V — Dos Projetos de Resolução","Subseção Única — Dos Recursos"],"t":["Os recursos contra atos do Presidente da Mesa da Câmara ou de Presidente de qualquer Comissão serão interpostos dentro do prazo de dez (10) dias, contados da data da ocorrência, por simples petição dirigida à Presidência.","§ 1º O recurso será encaminhado à Comissão de Constituição, Justiça e Redação para opinar e elaborar projeto de Resolução.","§ 2º Apresentado o parecer em forma de projeto de Resolução, acolhendo ou denegando o recurso, será tal parecer submetido a uma única discussão e votação na Ordem do Dia da primeira sessão ordinária subsequente à sua leitura.","§ 3º Aprovado o recurso, o recorrido deverá observar a decisão soberana do Plenário e cumpri-la fielmente, sob pena de se sujeitar a processo de destituição.","§ 4º Rejeitado o recurso, a decisão recorrida será integralmente mantida."],"nt":[]},{"id":"ri:213","n":"213","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Substitutivo é o Projeto de Lei, de Decreto Legislativo ou de Resolução, apresentado por um Vereador ou membro de Comissão para substituir outro já em tramitação sobre o mesmo assunto.","§ 1º Não é permitido ao Vereador apresentar mais de um substitutivo ao mesmo projeto.","§ 2º Apresentado o substitutivo, será enviado às Comissões competentes e será discutido e votado, preferencialmente, antes do projeto original.","§ 3º Sendo aprovado o substitutivo, o projeto original ficará prejudicado, e no caso de rejeição tramitará normalmente."],"nt":[]},{"id":"ri:214","n":"214","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Emenda é a proposição apresentada como acessória de outra.","§ 1º As emendas podem ser supressivas, substitutivas, aditivas e modificativas:","I – Emenda supressiva é a que visa a suprimir, em parte ou no todo, o artigo, parágrafo, inciso, alínea ou item do projeto;","II – Emenda substitutiva é a que deve ser colocada em lugar do artigo, parágrafo, inciso, alínea ou item do projeto;","III – Emenda aditiva é a que deve ser acrescentada ao corpo ou aos termos do artigo, parágrafo, inciso, alínea ou item do projeto;","IV – Emenda modificativa é a que se refere apenas à redação do artigo, parágrafo, inciso, alínea ou item sem alterar a sua substância.","§ 2º A emenda apresentada a outra emenda denomina-se subemenda.","§ 3º As emendas e subemendas recebidas serão discutidas e, se aprovadas, o projeto original será encaminhado à Comissão de Constituição, Justiça e Redação, que lhe dará nova redação, na forma do aprovado."],"nt":[]},{"id":"ri:215","n":"215","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Os substitutivos, emendas e subemendas serão recebidos até a primeira ou única discussão do projeto original."],"nt":[]},{"id":"ri:216","n":"216","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Não serão aceitos substitutivos, emendas ou subemendas que não tenham relação direta ou imediata com a matéria da proposição principal.","§ 1º O autor do projeto para o qual o Presidente tiver recebido substitutivo, emenda ou subemenda alheios ao seu objeto terá o direito de recorrer ao Plenário da decisão do Presidente.","§ 2º Idêntico direito de recurso contra ato do Presidente que não receber o substitutivo, emenda ou subemenda caberá ao seu autor.","§ 3º As emendas que não se referirem diretamente à matéria do projeto serão destacadas para constituírem projetos em separado, sujeitos à tramitação regimental.","§ 4º O substitutivo estranho à matéria do projeto tramitará como projeto novo."],"nt":[]},{"id":"ri:217","n":"217","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Constitui projeto novo, mas equiparado à emenda para fins de tramitação regimental, a mensagem do Chefe do Executivo, que pode acrescentar algo ao projeto original, modificar a sua redação, suprimir ou substituir, no todo ou em parte, algum dispositivo.","Parágrafo único. A mensagem somente será recebida até a primeira ou única discussão do projeto original."],"nt":[]},{"id":"ri:218","n":"218","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO III — Dos Substitutivos, Emendas e Subemendas"],"t":["Não serão admitidas emendas que impliquem aumento de despesa prevista:","I – Nos projetos de iniciativa privativa do Prefeito, ressalvado o disposto no art. 165, §§2º e 4º, da Constituição Federal;","II – nos projetos sobre organização dos serviços administrativos da Câmara Municipal."],"nt":[]},{"id":"ri:219","n":"219","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO IV — Dos Pareceres a serem Deliberados"],"t":["Serão discutidos e votados os pareceres das Comissões Processantes, da Comissão de Constituição, Justiça e Redação e do Tribunal de Contas, nos seguintes casos:","I – das Comissões Processantes:","a) no processo de destituição de Membros da Mesa;","b) no processo de cassação de Prefeito, Vice-Prefeito e Vereadores;","II – da Comissão de Constituição, Justiça e Redação:","a) que concluírem pela ilegalidade ou inconstitucionalidade de algum projeto;","III – do Tribunal de Contas:","a) sobre as contas do Prefeito;","b) sobre as contas da Mesa.","§ 1º Os pareceres das Comissões serão discutidos e votados na Ordem do Dia da sessão de sua apresentação.","§ 2º Os pareceres do Tribunal de Contas serão discutidos e votados segundo o previsto no título pertinente deste Regimento."],"nt":[]},{"id":"ri:220","n":"220","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Requerimento é todo pedido verbal ou escrito formulado sobre qualquer assunto, que implique decisão ou resposta."],"nt":[]},{"id":"ri:221","n":"221","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Tomam a forma de requerimento escrito, mas independem de decisão, os seguintes atos:","a) retirada de proposição ainda não incluída na Ordem do Dia;","b) constituição de Comissão Especial de Inquérito, desde que formulada por 1/3 (um terço) dos Vereadores da Câmara;","c) votação, em Plenário, de emenda ao Projeto de Orçamento aprovada ou rejeitada na Comissão de Finanças, Orçamento e Contabilidade, desde que formulado por 1/3 (um terço) dos Vereadores."],"nt":[]},{"id":"ri:222","n":"222","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Serão decididos pelo Presidente da Câmara e formulados verbalmente os requerimentos que solicitem:","I – a palavra ou a desistência dela;","II – permissão para falar sentado;","III – leitura de qualquer matéria para conhecimento do Plenário;","IV – interrupção do discurso do orador nos casos previstos no Art. 244 deste Regimento;","V – informações sobre trabalhos ou a pauta da Ordem do Dia;","VI – declaração de manifestação nominal dos votos para as matérias para as quais este Regimento prevê o processo de votação simbólico;","VII – a palavra, para declaração do voto."],"nt":[]},{"id":"ri:223","n":"223","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Serão decididos pelo Presidente da Câmara, e escritos, os requerimentos que solicitem:","I – transcrição em ata de declaração de voto formulada por escrito;","II – inserção de documento em ata;","III – desarquivamento de projetos nos termos do Art. 190 deste Regimento;","IV – requisição de documentos ou processos relacionados com alguma proposição;","V – audiência de Comissão, quando o pedido for apresentado por outra;","VI -juntada ou desentranhamento de documentos;","VII – informações em caráter oficial sobre atos da Mesa, da Presidência ou da Câmara;","VIII – requerimento de reconstituição de processos."],"nt":[]},{"id":"ri:224","n":"224","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Serão decididos pelo Plenário e formulados verbalmente os requerimentos que solicitem:","I – retificação da ata;","I – invalidação da ata, quando impugnada;","III – dispensa da leitura de determinada matéria, de todas as constantes da Ordem do Dia ou da Redação Final;","IV – preferência na discussão ou da votação de uma proposição sobre outra;","V – encerramento da discussão nos termos do Art. 248 deste Regimento;","VI – reabertura de discussão;","VII – destaque de matéria para votação;","Parágrafo único. Os requerimentos de retificação e de invalidação da ata serão discutidos e votados na fase da Ordem do Dia da sessão ordinária, ou na Ordem do Dia da sessão extraordinária em que for deliberada a ata, juntamente com as demais matérias em pauta."],"nt":[]},{"id":"ri:225","n":"225","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Serão discutidos pelo Plenário, e escritos, os requerimentos que solicitem:","I – vista de projetos, observado o previsto no Art. 240 deste Regimento;","II – prorrogação de prazo para a Comissão Especial de Inquérito concluir seus trabalhos, nos termos do Art. 131 deste Regimento;","III – retirada de proposição já incluída na Ordem do Dia, formulada pelo seu autor;","IV – pedido de agendamento de sessão solene ou audiência pública;","V – constituição de precedentes;","VI – informações ao Prefeito sobre assunto determinado, relativo à Administração Municipal;","VII – convocação de Secretário Municipal ou equivalente;","VIII – licença de Vereador;","IX – a iniciativa da Câmara, para a abertura de inquérito policial ou de instauração de ação penal contra o Prefeito e intervenção no processo-crime respectivo;","X – adiamento da discussão ou da votação de qualquer proposição;","XI – manifestação de pesar, regozijo, congratulações, apoio ou repúdio a acontecimento de relevante importância para o País, o Estado ou Município;","XII – Requerimento de Urgência Especial, quando este receber manifestação contrária da Comissão de Constituição, Justiça e Redação.","§ 1º O requerimento de urgência especial será apresentado, discutido e deliberado no início ou no transcorrer da Ordem do Dia da mesma sessão de sua apresentação.","§ 2º Os requerimentos previstos nos incisos VI (informações do Prefeito) e VII (convocação de Secretário municipal), ao receberem pedido de discussão, serão automaticamente enviados para deliberação na Ordem do Dia da sessão ordinária subsequente."],"nt":[]},{"id":"ri:226","n":"226","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Os requerimentos de adiamento da discussão ou votação e o de vista de processos devem ser formulados por prazo determinado, devendo coincidir o seu término com a data da sessão ordinária subsequente."],"nt":[]},{"id":"ri:227","n":"227","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["As representações de outras edilidades solicitando a manifestação da Câmara sobre qualquer assunto serão lidas na fase do Expediente para conhecimento do Plenário."],"nt":[]},{"id":"ri:228","n":"228","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO V — Dos Requerimentos"],"t":["Não é permitido dar forma de requerimento a assuntos que constituem objetos de indicação, sob pena de não recebimento."],"nt":[]},{"id":"ri:229","n":"229","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO VI — Das Indicações"],"t":["Indicação é o ato escrito em que o Vereador sugere medida de interesse público às autoridades competentes."],"nt":[]},{"id":"ri:230","n":"230","tag":"","b":"F","h":["TÍTULO VI — DAS PROPOSIÇÕES","CAPÍTULO VI — Das Indicações"],"t":["As indicações serão lidas e encaminhadas a quem de direito, independentemente de deliberação do Plenário."],"nt":[]},{"id":"ri:231","n":"231","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["Toda proposição recebida pela Mesa Diretora, após ter sido numerada e datada, será lida pelo 1º Secretário, no Expediente, ressalvados os casos expressos neste Regimento.","Parágrafo único. A leitura da proposição, nos termos deste artigo, poderá ser dispensada, nos termos deste regimento, a pedido de qualquer Vereador e desde que aprovada pelo Plenário."],"nt":[]},{"id":"ri:232","n":"232","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["Além do que estabelece o Art. 187, a Presidência, no ato do protocolo legislativo, devolverá ao autor qualquer proposição que:","I – não esteja devidamente formalizada em termos;","II – versar sobre matéria:","a) alheia à competência da Câmara;","b) evidentemente inconstitucional;","c) antirregimental;","d) semelhante a proposição já existente."],"nt":[]},{"id":"ri:233","n":"233","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["Compete ao Presidente da Câmara, por meio de despacho, dentro do prazo improrrogável de 3 (três) dias a contar da data do recebimento das proposições, encaminhá-las às Comissões Permanentes, que, por sua natureza, devam opinar sobre o assunto.","Parágrafo único. Antes da distribuição, o Presidente mandará verificar se existe proposição em trâmite que trate de matéria análoga ou conexa, caso em que fará a distribuição por dependência, determinando sua apensação."],"nt":[]},{"id":"ri:234","n":"234","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["Quando qualquer proposição for atribuída a mais de uma Comissão, cada qual dará seu parecer separadamente, sendo a Comissão de Constituição, Justiça e Redação ouvida sempre em primeiro lugar."],"nt":[]},{"id":"ri:235","n":"235","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["Respeitado o disposto no artigo anterior, o projeto sobre o qual deva pronunciar-se mais de uma Comissão será encaminhado diretamente de uma para outra, feitos os registros nos respectivos protocolos."],"nt":[]},{"id":"ri:236","n":"236","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO I — Do Recebimento e Distribuição das Proposições"],"t":["O procedimento descrito nos artigos anteriores aplica-se somente às matérias em regime de tramitação ordinária."],"nt":[]},{"id":"ri:237","n":"237","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção I — Disposições Preliminares","Subseção I — Da Prejudicialidade"],"t":["Na apreciação pelo Plenário, consideram-se prejudicadas e assim serão declaradas pelo Presidente, que determinará seu arquivamento:","I – a discussão ou votação de qualquer projeto idêntico a outro que já tenha sido aprovado; CÂMARA MUNICIPAL DE mossoinS/RN II - a proposição original, com as respectivas emendas ou subemendas, quando tiver substitutivo aprovado;","III – a emenda ou subemenda de matéria idêntica à de outra já aprovada ou rejeitada;","IV – o requerimento com a mesma finalidade já aprovado ou rejeitado, salvo se consubstanciar reiteração de pedido não atendido ou resultante de modificação da situação anterior."],"nt":[]},{"id":"ri:238","n":"238","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção I — Disposições Preliminares","Subseção II — Do Destaque"],"t":["Destaque é o ato de separar do texto um dispositivo ou uma emenda a ele apresentada, para possibilitar a sua apreciação isolada pelo Plenário.","Parágrafo único. O destaque deve ser requerido por Vereador e aprovado pelo Plenário, implicando preferência na discussão e na votação da emenda ou do dispositivo destacado sobre os demais do texto original."],"nt":[]},{"id":"ri:239","n":"239","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção I — Disposições Preliminares","Subseção III — Da Preferência"],"t":["Preferência é a primazia na discussão ou na votação de uma proposição sobre outra, mediante requerimento aprovado pelo Plenário.","Parágrafo único. Terão preferência para discussão e votação, independentemente de requerimento, as emendas supressivas, os substitutivos, o requerimento de licença de Vereador, o decreto legislativo concessivo de licença ao Prefeito e o requerimento de adiamento que marque prazo menor."],"nt":[]},{"id":"ri:240","n":"240","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção I — Disposições Preliminares","Subseção IV — Do Pedido de Vista"],"t":["O Vereador poderá requerer vista de processo relativo a qualquer proposição, desde que essa esteja sujeita ao regime de tramitação ordinária.","Parágrafo único. O requerimento de vista deve ser escrito e deliberado pelo Plenário, não podendo o seu prazo exceder o período de tempo correspondente ao intervalo entre uma sessão ordinária e outra."],"nt":[]},{"id":"ri:241","n":"241","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção I — Disposições Preliminares","Subseção V — Do Adiamento"],"t":["O requerimento de adiamento de discussão ou de votação de qualquer proposição estará sujeito à deliberação do Plenário e somente poderá ser proposto no início da Ordem do Dia ou durante a discussão da proposição a que se refere.","§ 1º A apresentação do requerimento não pode interromper o orador que estiver com a palavra, e o adiamento deve ser proposto por tempo determinado, contado em sessões.","§ 2º Apresentados 2 (dois) ou mais requerimentos de adiamento, será votado primeiramente o que marcar menor prazo.","§ 30 Somente será admissivel o requerimento de adiamento da discussão ou da votação de projetos quando estes estiverem sujeitos ao regime de tramitação ordinária."],"nt":[]},{"id":"ri:242","n":"242","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões"],"t":["Discussão é a fase dos trabalhos destinada aos debates em Plenário.","§ 1º Serão votados em dois turnos de discussão e votação:","a) com intervalo mínimo de 10 (dez) dias entre eles, as propostas de emenda à Lei Orgânica;","b) os projetos de lei do plano plurianual, de diretrizes orçamentárias e do orçamento anual;","c) os projetos de codificação.","§ 2º Excetuada a matéria em regime de urgência, é de 2 (duas) sessões o interstício mínimo entre os turnos de votação das matérias a que se referem as alíneas \"b\" e \"c\" do parágrafo anterior.","§ 3º Terão discussão e votação únicas todas as demais proposições."],"nt":[]},{"id":"ri:243","n":"243","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões"],"t":["Os debates deverão realizar-se com dignidade e ordem, cumprindo aos Vereadores e Vereadoras atender às determinações sobre o uso da palavra, nos termos do Art. 247 deste Regimento."],"nt":[]},{"id":"ri:244","n":"244","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões"],"t":["O Presidente solicitará ao orador, por iniciativa própria ou a requerimento de qualquer Vereador, que interrompa o seu discurso, nos seguintes casos:","I – para leitura de requerimento de urgência especial;","II – para comunicação importante à Câmara;","III – para recepção de visitantes;","IV – para atender a pedido de palavra pela ordem, para propor questão de ordem regimental."],"nt":[]},{"id":"ri:245","n":"245","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões"],"t":["Quando mais de um Vereador solicitar a palavra simultaneamente, o Presidente a concederá obedecendo à seguinte ordem de preferência:","I – ao autor do substitutivo ou do projeto;","II – ao relator de qualquer Comissão;","III – ao autor de emenda ou subemenda.","§ 1º Cumpre ao Presidente dar a palavra, alternadamente, a quem seja favorável ou contrário a matéria em debate, quando não prevalecer a ordem determinada neste artigo.","§ 2º Não será permitido o uso da palavra sucessivamente e alternadamente ao Vereador que já tenha feito seu pronunciamento, exceto quando citado nominalmente por outro orador, e mesmo assim, exclusivamente para a defesa de seu ponto de vista."],"nt":[]},{"id":"ri:246","n":"246","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões","Subseção I — Dos Apartes"],"t":["Aparte é a interrupção do orador para indagação ou esclarecimento relativo à matéria em debate.","§ 1º O aparte deve ser expresso em termos corteses e não poderá exceder a 1 (um) minuto.","§ 2º Não serão permitidos apartes paralelos, sucessivos ou sem licença do orador.","§ 3º Não é permitido apartear o Presidente nem o orador que fala pela ordem, em Explicação Pessoal ou declaração de voto.","§ 4º Quando o orador negar o direito de apartear, não lhe será permitido dirigir-se diretamente ao Vereador que solicitou o aparte."],"nt":[]},{"id":"ri:247","n":"247","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões","Subseção II — Dos Prazos das Discussões"],"t":["O Vereador terá os seguintes prazos para discussão:","I – cinco minutos com apartes:","a) vetos;","b) projetos e suas proposições acessórias;","II – três minutos com apartes:","a) pareceres;","b) redação final;","c) requerimentos;","d) acusação ou defesa no processo de cassação de mandato de Prefeito, Vice-Prefeito e Vereadores.","§ 1º Nos pareceres das Comissões Processantes exarados nos processos de destituição, o relator e o membro da Mesa denunciado terão o prazo de 30 (trinta) minutos cada um; nos processos de cassação de mandato, o denunciado terá o prazo de 1 (uma) hora para defesa.","§ 2º Na discussão de matérias constantes da Ordem do Dia, não será permitida a cessão de tempo."],"nt":[]},{"id":"ri:248","n":"248","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões","Subseção III — Do Encerramento e da Reabertura da Discussão"],"t":["O encerramento da discussão dar-se-á:","I – por inexistência de solicitação da palavra;","II – pelo decurso dos prazos regimentais;","III – a requerimento de qualquer Vereador, mediante deliberação do Plenário.","§ 1º Só poderá ser requerido o encerramento da discussão quando no mínimo dois vereadores houverem falado sobre a matéria.","§ 2º Se o requerimento de encerramento de discussão for rejeitado, só poderá ser reformulado depois de terem falado, no mínimo, mais 3 (três)Vereadores."],"nt":[]},{"id":"ri:249","n":"249","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção II — Das Discussões","Subseção III — Do Encerramento e da Reabertura da Discussão"],"t":["O requerimento de reabertura da discussão somente será admitido se apresentado por 2/3 (dois terços) dos Vereadores."],"nt":[]},{"id":"ri:250","n":"250","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção I — Disposições Preliminares"],"t":["Votação é o ato complementar da discussão por meio do qual o Plenário manifesta sua vontade a respeito da rejeição ou da aprovação da matéria.","§ 1º Considera-se qualquer matéria em fase de votação a partir do momento em que o Presidente declara encerrada a discussão.","§ 2º A discussão e a votação pelo Plenário de matéria constante da Ordem do Dia só poderão ser efetuadas com a presença de maioria absoluta dos membros da Câmara."],"nt":[]},{"id":"ri:251","n":"251","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção I — Disposições Preliminares"],"t":["O Vereador presente à sessão não poderá escusar-se de votar, devendo, porém, abster-se quando tiver interesse pessoal na deliberação, sob pena de nulidade de votação, quando seu voto for decisivo.","§ 1º O Vereador que se considerar impedido de votar, nos termos deste artigo, fará a devida comunicação ao Presidente, computando-se, todavia, sua presença para efeito de quórum.","§ 2º O impedimento poderá ser arguido por qualquer Vereador, cabendo a decisão ao Presidente."],"nt":[]},{"id":"ri:252","n":"252","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção I — Disposições Preliminares"],"t":["Quando a matéria for submetida a 2 (dois) turnos de discussão e votação, ainda que rejeitada no primeiro, deverá passar obrigatoriamente pelo segundo turno, prevalecendo o resultado deste último."],"nt":[]},{"id":"ri:253","n":"253","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção II — Do Encaminhamento da Votação"],"t":["A partir do instante em que o Presidente da Câmara declarar a matéria já debatida e com discussão encerrada, poderá ser solicitada a palavra para encaminhamento da votação.","§ 1º No encaminhamento da votação, será assegurado aos líderes das bancadas falar apenas uma vez, por três minutos, para propor ao Plenário a rejeição ou a aprovação da matéria a ser votada, sendo vedados os apartes.","§ 2º Ainda que tenham sido apresentados substitutivos, emendas e subemendas ao projeto, haverá apenas um encaminhamento de votação que versará sobre todas as peças."],"nt":[]},{"id":"ri:254","n":"254","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção III — Dos Processos de Votação"],"t":["São 02 (dois) os processos de votação:","I – simbólico;","II – nominal por chamada ou por processo eletrônico;","§ 1º No processo simbólico de votação, o Presidente convidará os Vereadores que estiverem de acordo a permanecerem sentados e os que forem contrários a se manifestarem de pé, procedendo, em seguida, à necessária contagem dos votos e à proclamação do resultado.","§ 2º O processo nominal de votação consiste na apuração dos votos favoráveis e contrários, com consignação expressa do nome e do voto de cada Vereador, ocorrendo nos casos em que seja exigido quórum especial de votação ou quando solicitada verificação nominal de matérias de maioria simples.","§ 3º Proceder-se-á, obrigatoriamente, à votação nominal para matéria que exigir:","I – O voto favorável de dois terços ou da maioria absoluta dos membros da Câmara Municipal para sua aprovação;","II – Quórum mínimo de votação de dois terços dos membros da Câmara Municipal;","III – Votação dos pareceres do Tribunal de Contas sobre as Contas do Prefeito e as da Mesa da Câmara;","IV – Composição das Comissões Permanentes;","V – Eleição da Mesa;","VI – Processo de cassação de Prefeito e Vereador;","VII – Concessão de título de cidadania honorária ou qualquer outra honraria ou homenagem;","VIII – Apreciação do Veto;","IX – Cassação do mandato do Prefeito e dos Vereadores.","§ 4º No processo nominal, utilizar-se-á o sistema de apuração eletrônica dos votos, por meio de postos de votação instalados nas bancadas e na Mesa Diretora, nos quais os Vereadores acionarão os respectivos dispositivos, por meio de senha individual e secreta, para a identificação dos votos.","§ 5º Para iniciar o processo de votação nominal pelo sistema eletrônico, o Presidente declarará abertos os postos de votação e solicitará aos Vereadores e Vereadoras que registrem o voto \"sim\", \"não\" ou \"abstenção\", conforme sejam favoráveis ou contrários à matéria em votação.","§ 6º O processo de votação por meio eletrônico será acionado em dois tempos contínuos: o primeiro destinar-se-á aos líderes e, logo após, aos demais Vereadores.","§ 7º No caso de líder que não tenha votado no primeiro momento, o sistema admitirá o voto no tempo seguinte, registrando-o junto aos demais Vereadores.","§ 8º O painel eletrônico instalado no Plenário identificará o nome e o voto de cada Vereador e, imediatamente ao processamento dos votos, emitirá em formulário os dados concernentes à votação, contendo:","I – data e hora em que se processou a votação;","II – a matéria objeto da votação;","III – o nome de quem presidiu a sessão no momento da votação;","IV – o resultado da votação;","V – os nomes dos vereadores votantes, discriminando os que votaram a favor, os que votaram contra e os que se abstiveram;","VI – os nomes dos Vereadores ausentes à votação; e VII - o impedimento regimental de quem presidiu a sessão no momento da votação, quando for o caso.","§ 9º Concluída a votação, após tempo suficiente para que todos os presentes votem, o Presidente encerrará a votação e proclamará o resultado, desligando a seguir o sistema de processamento eletrônico.","§ 10 Quando o sistema de votação eletrônica não estiver em condições de funcionamento, a votação nominal será feita pela chamada dos Vereadores e o presidente solicitará que respondam \"sim\", \"não\" ou \"abstenção\", conforme sejam favoráveis ou contrários, à medida que forem sendo chamados."],"nt":[]},{"id":"ri:255","n":"255","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção IV — Do Adiamento da Votação"],"t":["O adiamento da votação de qualquer proposição só pode ser solicitado antes de seu início, mediante requerimento assinado por Líder, pelo Autor ou Relator da matéria.","§ 1º O adiamento da votação só poderá ser concedido uma vez e por prazo previamente fixado, não superior a 2 (duas) sessões.","§ 2º Solicitado simultaneamente mais de um adiamento, a adoção de um requerimento prejudicará os demais.","§ 3º Não admite adiamento de votação a proposição em regime de urgência ou em regime de urgência especial, salvo se requerido por 2/3 (dois terços) dos membros da Câmara ou por Líderes que representem este número, por prazo não excedente a uma sessão."],"nt":[]},{"id":"ri:256","n":"256","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção V — Da Verificação da Votação"],"t":["Se algum Vereador tiver dúvida sobre resultado de votação simbólica proclamado pelo Presidente, poderá requerer o registro de como cada parlamentar votou, bem como o resultado de quantos votaram contra ou a favor, sendo o requerimento analisado de imediato e necessariamente decidido pelo Presidente.","§ 1º O requerimento de divulgação nominal só poderá ser suscitado antes de anunciada a discussão de nova matéria ou, se for o caso, antes de se passar à nova fase da sessão.","§ 2º Nenhuma votação admitirá mais de uma verificação.","§ 3º Ficará prejudicado o requerimento de divulgação nominal de votação, caso o requerente não se encontre presente no momento em que for chamado pela primeira vez.","§ 4º Prejudicado o requerimento de divulgação nominal de votação, pela ausência de seu autor, ou por pedido de retirada, faculta-se a qualquer outro Vereador reformulá-lo."],"nt":[]},{"id":"ri:257","n":"257","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção VI — Da Declaração de Voto"],"t":["Declaração de voto é o pronunciamento do Vereador sobre os motivos que o levaram a manifestar-se contra ou favoravelmente à matéria votada."],"nt":[]},{"id":"ri:258","n":"258","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO II — Dos Debates e das Deliberações","Seção III — Das Votações","Subseção VI — Da Declaração de Voto"],"t":["A declaração de voto far-se-á depois de concluída a votação da matéria, se aprovado o requerimento respectivo pelo Presidente.","§ 1º Em declaração de voto, cada Vereador dispõe de três minutos, sendo vedados os apartes.","§ 2º Quando a declaração do voto estiver formulada por escrito, poderá o Vereador requerer sua inclusão ou transcrição na ata da sessão, em inteiro teor."],"nt":[]},{"id":"ri:259","n":"259","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO III — Da Redação Final"],"t":["Ultimada a fase da votação, será a proposição, se houver substitutivo, emenda ou subemenda aprovados, enviada à Comissão de Constituição, Justiça e Redação para elaboração da Redação Final."],"nt":[]},{"id":"ri:260","n":"260","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO III — Da Redação Final"],"t":["A Redação Final será discutida e votada depois de lida em Plenário, podendo ser dispensada a leitura por requerimento de qualquer Vereador.","§ 1º Somente serão admitidas emendas à Redação Final para evitar incorreção de linguagem ou contradição evidente.","§ 2º Aprovada qualquer emenda ou rejeitada a Redação Final, a proposição voltará à Comissão de Constituição, Justiça e Redação para a elaboração de nova Redação Final.","§ 3º A nova Redação Final considerar-se-á aprovada se contra ela não votarem 2/3 (dois terços) dos Vereadores."],"nt":[]},{"id":"ri:261","n":"261","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO III — Da Redação Final"],"t":["Quando, após a aprovação da Redação Final e até a expedição do autógrafo, verificar-se inexatidão gramatical do texto, a Mesa procederá à respectiva correção, da qual dará conhecimento ao Plenário.","§ 1º Não havendo impugnação, considerar-se-á aceita a correção, e, em caso contrário, será reaberta a discussão para a decisão final do Plenário.","§ 2º Aplicar-se-á o mesmo critério deste artigo aos projetos aprovados sem emendas, nos quais, até a elaboração do autógrafo, verificar-se inexatidão do texto."],"nt":[]},{"id":"ri:262","n":"262","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO IV — Da Sanção"],"t":["Aprovado um projeto de lei na forma regimental e transformado em autógrafo, ele será enviado ao Prefeito no prazo de 10 (dez) dias úteis, para fins de sanção e promulgação.","§ 1º Os autógrafos de projetos de lei, antes de serem remetidos ao Prefeito, serão registrados e documentados na Diretoria Legislativa.","§ 2º O membro da Mesa não poderá recusar-se a assinar o despacho do autógrafo, sob pena de sujeição a processo de destituição.","§ 3º Decorrido o prazo de 15 (quinze) dias úteis, contados da data do recebimento do respectivo autógrafo, sem a sanção do Prefeito, considerar-se-á sancionado o projeto, sendo obrigatória sua promulgação pelo Presidente da Câmara, dentro de 48 (quarenta e oito) horas e, se este não o fizer, caberá ao Vice-presidente fazê-lo em igual prazo (art. 66, §7º, CF)."],"nt":[]},{"id":"ri:263","n":"263","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO V — Do Veto"],"t":["O Prefeito poderá exercer o direito de veto, parcial ou total, dentro do prazo de 15 (quinze) dias úteis, contados da data do recebimento do respectivo autógrafo, por julgar o projeto inconstitucional, ilegal ou contrário ao interesse público.","§ 1º O veto parcial somente abrangerá texto integral de artigo, de parágrafo, de inciso ou de alínea.","§ 2º Recebido o veto pelo Presidente da Câmara, será encaminhado à Comissão de Constituição, Justiça e Redação, que poderá solicitar audiência de outras comissões.","§ 3º As Comissões têm o prazo conjunto e improrrogável de 15 (quinze) dias para manifestarem-se sobre o veto.","§ 4º Se a Comissão de Constituição, Justiça e Redação não se pronunciar no prazo indicado, a Presidência da Câmara incluirá a proposição na Ordem do Dia da sessão imediata, independentemente de parecer.","§ 5º O Presidente convocará sessões extraordinárias para a discussão do veto, se necessário.","§ 6º O veto será apreciado dentro de 30 (trinta) dias a contar de seu recebimento e só poderá ser rejeitado pelo voto da maioria absoluta dos membros da Câmara (art. 66, §4º da CF).","§ 7º Esgotado sem deliberação o prazo estabelecido no §6º, o veto será colocado na Ordem do Dia da sessão imediata, sobrestadas as demais proposições, até sua votação final (art. 66, §6º CF).","§ 8º Rejeitado o veto, as disposições aprovadas serão enviadas ao Prefeito em até 48 (quarenta e oito) horas para promulgação.","§ 9º A não promulgação das disposições aprovadas no prazo previsto no parágrafo anterior autoriza o Presidente da Câmara a promulgá-las em igual prazo e, se este não o fizer, caberá ao Vice-presidente fazê-lo, obrigatoriamente.","§ 10 O prazo previsto no §6º não corre nos períodos de recesso da Câmara."],"nt":["Simetria com o art. 66 da CF."]},{"id":"ri:264","n":"264","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VI — Da Promulgação e da Publicação"],"t":["Os Decretos Legislativos e as Resoluções, desde que aprovados os respectivos projetos, serão promulgados e publicados pelo Presidente da Câmara."],"nt":[]},{"id":"ri:265","n":"265","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VI — Da Promulgação e da Publicação"],"t":["Serão também promulgadas e publicadas pelo Presidente da Câmara:","I – as leis que tenham sido sancionadas tacitamente;","II – as leis cujo veto, total ou parcial, tenha sido rejeitado pela Câmara e não promulgadas pelo Prefeito."],"nt":[]},{"id":"ri:266","n":"266","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VI — Da Promulgação e da Publicação"],"t":["Na promulgação de Leis, Resoluções e Decretos Legislativos pelo Presidente da Câmara serão utilizadas as seguintes cláusulas promulgatórias:","I – Leis:","a) com sanção tácita: O Presidente da Câmara Municipal de Mossoró: \"Faço saber que a Câmara aprovou e eu, nos termos do artigo..., §..., da Lei Orgânica do Município, promulgo a seguinte lei:\"","b) cujo veto total foi rejeitado: \"Faço saber que a Câmara Municipal manteve e eu promulgo, nos termos do artigo..., §..., da Lei Orgânica do Município, a seguinte lei:","c) cujo veto parcial foi rejeitado: \"Faço saber que a Câmara Municipal manteve e eu promulgo, nos termos da Lei Orgânica do Município, os seguintes dispositivos da Lei nº,.... De..., de...\".","II – Decretos legislativos: \"Faço saber que a Câmara Municipal aprovou e eu promulgo o seguinte Decreto Legislativo:\" III - Resoluções: \"Faço saber que a Câmara Municipal aprovou e eu promulgo a seguinte Resolução:\""],"nt":[]},{"id":"ri:267","n":"267","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VI — Da Promulgação e da Publicação"],"t":["Para a promulgação e a publicação de lei com sanção tácita ou por rejeição de veto total, utilizar-se-á a numeração subsequente àquela existente na Prefeitura Municipal.","Parágrafo único. Quando se tratar de veto parcial, a lei terá o mesmo número do texto anterior a que pertencer."],"nt":[]},{"id":"ri:268","n":"268","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VI — Da Promulgação e da Publicação"],"t":["A publicação das Leis, Decretos Legislativos e Resoluções obedecerá ao disposto na Lei Orgânica Municipal."],"nt":[]},{"id":"ri:269","n":"269","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção I — Dos Códigos"],"t":["Código é a reunião de disposições legais sobre a mesma matéria, de modo orgânico e sistemático, visando a estabelecer os princípios gerais do sistema adotado e a prover completamente a matéria tratada."],"nt":[]},{"id":"ri:270","n":"270","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção I — Dos Códigos"],"t":["Os projetos de códigos, depois de apresentados ao Plenário, serão publicados, permanecendo à disposição dos Vereadores, sendo após encaminhados à Comissão de Constituição, Justiça e Redação.","§ 1º Durante o prazo de 30 (trinta) dias, poderão os Vereadores encaminhar à Comissão emendas a respeito.","§ 2º A Comissão terá mais 30 (trinta) dias para apresentar parecer ao projeto e às emendas apresentadas.","§ 30 Decorrido o prazo ou antes desse decurso, se a Comissão antecipar o seu parecer, entrará o processo para a pauta da Ordem do Dia."],"nt":[]},{"id":"ri:271","n":"271","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção I — Dos Códigos"],"t":["Na primeira discussão, o projeto será discutido e votado por capítulo, salvo requerimento de destaque, aprovado pelo Plenário.","§ 1º Aprovado em primeiro turno de discussão e votação com emendas, voltará à Comissão de Constituição, Justiça e Redação por mais 15 (quinze) dias, para sua incorporação ao texto do projeto original.","§ 2º Encerrado o primeiro turno de discussão e votação, seguir-se-á a tramitação normal dos demais projetos, sendo encaminhado às comissões de mérito."],"nt":[]},{"id":"ri:272","n":"272","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção I — Dos Códigos"],"t":["Não se fará a tramitação simultânea de mais de 2 (dois) projetos de Código.","Parágrafo único. O disposto nesta seção se aplicará exclusivamente à matéria que, por sua complexidade e abrangência, deva ser promulgada como Código."],"nt":[]},{"id":"ri:273","n":"273","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção I — Dos Códigos"],"t":["Não se aplicará o regime deste capítulo aos projetos que cuidem de alterações parciais de códigos."],"nt":[]},{"id":"ri:274","n":"274","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["Leis de iniciativa privativa do Poder Executivo estabelecerão:","I – o plano plurianual;","II – as diretrizes orçamentárias;","III – os orçamentos anuais.","§ 1º A lei que instituir o plano plurianual estabelecerá as diretrizes, objetivos e metas da administração pública municipal para as despesas de capital e outras delas decorrentes e para as relativas aos programas de duração continuada.","§ 2º A lei de diretrizes orçamentárias compreenderá as metas e prioridades da administração municipal, incluindo as despesas de capital para o exercício subsequente, orientará a elaboração da lei orçamentária anual, dispondo sobre as alterações na legislação tributária, além de outros assuntos previstos na legislação acerca do tema.","§ 3º A lei orçamentária anual compreenderá:","I – o orçamento fiscal do Município, seus fundos, órgãos e entidades da administração direta e indireta, inclusive Fundações instituídas e mantidas pelo Poder Público;","II – o orçamento de investimento das empresas em que o Município, direta ou indiretamente, detenha a maioria do capital social com direito a voto;","III – o orçamento da seguridade social.","§ 4º O projeto de lei de diretrizes orçamentárias será encaminhado à Câmara até 15 de abril e devolvido para sanção do Executivo até o encerramento do primeiro período da sessão legislativa.","§ 5º Os projetos de lei orçamentária anual e do plano plurianual do Município serão encaminhados à Câmara até o dia 30 (trinta) de agosto e devolvidos para sanção até o encerramento da sessão legislativa."],"nt":[]},{"id":"ri:275","n":"275","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["Recebidos os projetos, o Presidente da Câmara, depois de comunicar o fato ao Plenário e determinar sua publicação imediata, manterá os projetos à disposição dos Vereadores.","§ 1º Em seguida à publicação, os projetos irão à Comissão de Orçamento, Finanças e Contabilidade, que receberá as emendas apresentadas pelos Vereadores e pela comunidade, no prazo de 10 (dez) dias.","§ 2º A Comissão de Orçamento, Finanças e Contabilidade terá mais 15 (quinze) dias de prazo para emitir os pareceres sobre os projetos a que se refere o artigo anterior e a sua decisão sobre as emendas, contados a partir do seu recebimento pela Comissão, logo após leitura em Plenário dos acessórios apresentados.","§ 3º Deverão ser realizadas audiências públicas, com ampla divulgação e participação popular, durante o processo de tramitação dos planos, lei de diretrizes orçamentárias e orçamentos.","§ 4º Será elaborado Calendário de Tramitação das Leis Orçamentárias, após o envio dos projetos previstos no Art. 274 à Câmara Municipal, a ser apresentado em Plenário conforme os prazos e datas previstos no Regimento Interno."],"nt":[]},{"id":"ri:276","n":"276","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["As emendas ao projeto de lei do orçamento anual ou aos projetos que o modifiquem somente poderão ser aprovadas se:","I – compatíveis com o plano plurianual e com a lei de diretrizes orçamentárias;","II – indicarem os recursos necessários, admitidos apenas os provenientes de anulação das despesas, excluídas as que incidam sobre:","a) dotação para pessoal e seus encargos;","b) serviços da dívida;","c) compromissos com convênios;","III – sejam relacionadas com:","a) correção de erros ou omissões;","b) os dispositivos do texto do projeto de lei.","§ 1º As emendas ao projeto de lei de diretrizes orçamentárias não poderão ser aprovadas quando incompatíveis com o plano plurianual.","§ 2º As emendas populares aos projetos de lei a que se refere esta seção atenderão ao disposto no art. 282 deste Regimento."],"nt":[]},{"id":"ri:277","n":"277","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["As Emendas Parlamentares Impositivas ao Orçamento Anual, dispostas no artigo 148-A da Lei Orgânica Municipal, serão apresentadas no prazo constante no Art. 275, §1º, deste Regimento Interno, no limite de até 10 (dez) emendas impositivas por parlamentar.","§ 1º Em casos de incompatibilidade nas codificações entre as Emendas Parlamentares Impositivas apresentadas e os anexos presentes no Projeto de Lei Orçamentária Anual, ou em demais erros materiais simples, a Comissão de Orçamento, Finanças e Contabilidade, dentro do prazo estabelecido no §2º do Art. 275, elaborará nota técnica, no prazo de 5 (cinco) dias, sugerindo aos vereadores as readequações técnicas necessárias para a devida inclusão das emendas parlamentares impositivas ao Projeto do Orçamento.","§ 2º Após o recebimento do documento previsto no parágrafo anterior, os vereadores terão o prazo de 2 (dois) dias para reapresentar à Comissão de Orçamento, Finanças e Contabilidade as correções à emenda parlamentar impositiva, acolhendo ou não as sugestões apresentadas pelo Órgão.","§ 3º As correções às Emendas Parlamentares Impositivas deverão ser assinadas pelo vereador.","§ 4º As emendas parlamentares impositivas, incluindo suas correções, serão encaminhadas ao Poder Executivo após as deliberações em Plenário do Projeto de Lei Orçamentária Anual, cabendo a análise preliminar sobre a aptidão e execução da Emenda Impositiva aos órgãos e secretarias do Poder Executivo responsáveis, conforme o disposto na Lei Complementar nº 192, de 12 de junho de 2023 ou outro normativo legal que venha a tratar do tema.","§ 5º As Emendas Parlamentares Impositivas deverão conter as seguintes informações:","I – Número da emenda, a ser atribuído pelo protocolo legislativo;","II – Unidade gestora e Unidade Orçamentária;","III – Função e Subfunção;","IV – Programa e Ação;","V – Código de Despesa;","VI – Valor destinado;","VII – Objeto (finalidade).","§ 6º A Comissão de Orçamento, Finanças e Contabilidade disponibilizará, findo o prazo de apresentação para correção das Emendas Parlamentares Impositivas, informações referentes ao número de emendas impositivas por vereador, o total de valores utilizados por parlamentar e a distribuição dos valores por área temática.","§ 7º A Comissão de Orçamento, Finanças e Contabilidade realizará a fiscalização e monitoramento da execução das emendas parlamentares impositivas aprovadas, dentro de suas prerrogativas legais e regimentais."],"nt":[]},{"id":"ri:278","n":"278","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["A mensagem do Chefe do Executivo enviada à Câmara objetivando propor alterações aos projetos a que se refere o Art. 274 somente será recebida enquanto não iniciada pela Comissão de Orçamento, Finanças e Contabilidade a votação da parte cuja alteração é proposta."],"nt":[]},{"id":"ri:279","n":"279","tag":"","b":"G","h":["TÍTULO VII — DO PROCESSO LEGISLATIVO","CAPÍTULO VII — Da Elaboração Legislativa Especial","Seção II — Do Processo Legislativo Orçamentário"],"t":["A decisão da Comissão de Orçamento, Finanças e Contabilidade sobre as emendas será definitiva, salvo se 1/3 (um terço) dos membros da Câmara requerer ao Presidente a votação em Plenário, sem discussão de emenda aprovada ou rejeitada pela própria Comissão.","§ 1º Se não houver emendas, o projeto
