<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Câmara de Mossoró · Kit de Estudos · Prof. Pietro Medeiros</title>
<style>
:root{
  --paper:#F4F7FB; --sheet:#FFFFFF; --sheet2:#F9FBFE; --ink:#13203A; --ink2:#4B5A76; --ink3:#7C89A3;
  --line:#DCE3EE; --line2:#C9D3E3;
  --blue:#2348C9; --blue2:#1A39A6; --blue-soft:#E7EDFD; --on-blue:#FFFFFF;
  --ri:#1D2B4F; --ri-soft:#E6E9F2; --on-ri:#FFFFFF;
  --cmp:#6A4BC4; --cmp-soft:#EEE9FB;
  --mark:rgba(255,222,64,.62); --mark-strong:#FFE14A; --hl:rgba(35,72,201,.18);
  --red:#C62828; --red-soft:#FDECEC; --green:#17804F; --green-soft:#E5F5EC;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 18px rgba(19,32,58,.06);
  --wm:rgba(19,32,58,.045);
  --f: ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fs:17px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0E1524; --sheet:#151F33; --sheet2:#19243B; --ink:#E6EBF5; --ink2:#A4B0C8; --ink3:#7A87A1;
  --line:#25324B; --line2:#31405E;
  --blue:#7E9CFF; --blue2:#A3B8FF; --blue-soft:#1C2848; --on-blue:#0E1524;
  --ri:#C9D3EA; --ri-soft:#222D45; --on-ri:#0E1524;
  --cmp:#B49CFF; --cmp-soft:#2A2448;
  --mark:rgba(255,214,64,.30); --mark-strong:#FFD640; --hl:rgba(126,156,255,.28);
  --red:#FF7A7A; --red-soft:#3A1D24; --green:#52CC8E; --green-soft:#16302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --wm:rgba(230,235,245,.035);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Gate (ativação) ---------- */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-card{width:100%;max-width:440px;background:var(--sheet);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.gate-top{padding:26px 26px 18px;background:linear-gradient(180deg,var(--blue-soft),transparent)}
.gate-top .seal{width:52px;height:52px;border-radius:16px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:900;font-size:1.25rem;margin-bottom:14px}
.gate-top h1{font-size:1.55rem;font-weight:900;letter-spacing:-.01em}
.gate-top p{margin:.5rem 0 0;color:var(--ink2)}
.gate-body{padding:6px 26px 26px}
.fld{display:block;margin:14px 0 0}
.fld span{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--sheet2);outline:none}
.inp:focus{border-color:var(--blue)}
.inp.key{letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:700;font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--blue);color:var(--on-blue);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%;margin-top:18px;padding:14px}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line2)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px}
.gate-foot{margin-top:16px;font-size:.85rem;color:var(--ink3);text-align:center}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100%}
.rail{position:sticky;top:0;height:100vh;width:250px;flex:none;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .seal{width:42px;height:42px;border-radius:13px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:900;flex:none}
.brand b{display:block;font-size:1.02rem;line-height:1.15;font-weight:900}
.brand small{color:var(--ink3);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--ink2);text-align:left}
.nav button .ic{width:22px;text-align:center;font-size:1.1rem}
.nav button:hover{background:var(--sheet2);color:var(--ink)}
.nav button.on{background:var(--blue-soft);color:var(--blue)}
.rail .lic{margin-top:auto;font-size:.78rem;color:var(--ink3);padding:12px 8px 0;border-top:1px solid var(--line);word-break:break-word}
.rail .lic b{color:var(--ink2)}
main{flex:1;min-width:0;padding:26px 28px 90px;max-width:1040px;margin:0 auto}
.bottom{display:none}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.view-h h2{font-size:1.65rem;font-weight:900;letter-spacing:-.015em}
.view-h p{margin:.3rem 0 0;color:var(--ink2)}

/* watermark */
#wm{position:fixed;inset:0;pointer-events:none;z-index:5;background-repeat:repeat}

/* ---------- Cards genéricos ---------- */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--sheet2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.lom{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.ri{background:var(--ri-soft);color:var(--ri);border-color:transparent}
.chip.cmp{background:var(--cmp-soft);color:var(--cmp);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}

/* início */
.hello{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.hello .panel h3{font-size:1.15rem;font-weight:900;margin-bottom:6px}
.count{display:flex;align-items:baseline;gap:10px}
.count .big{font-size:3.2rem;font-weight:900;line-height:1;color:var(--blue);letter-spacing:-.03em}
.ring-row{display:flex;gap:18px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:12px}
.ring svg{flex:none}
.ring b{display:block;font-size:1.05rem}
.ring small{color:var(--ink3)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.qa{border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow)}
.qa:hover{border-color:var(--blue)}
.qa .ic{font-size:1.4rem}
.qa b{display:block;margin-top:8px;font-size:1rem}
.qa span{display:block;color:var(--ink2);font-size:.88rem;margin-top:3px}
.tip{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--sheet2);border:1px dashed var(--line2);color:var(--ink2)}

/* ---------- Lei seca ---------- */
.tabs{display:flex;gap:6px;align-items:flex-end;padding-left:10px;position:relative;z-index:2}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--sheet2);color:var(--ink2);padding:10px 18px 12px;border-radius:14px 14px 0 0;font-weight:800;position:relative;top:1px}
.tab small{display:block;font-weight:600;font-size:.74rem;color:var(--ink3)}
.tab.on.lom{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tab.on.ri{background:var(--ri);color:var(--on-ri);border-color:var(--ri)}
.tab.on small{color:inherit;opacity:.8}
.binder{background:var(--sheet);border:1px solid var(--line);border-radius:0 18px 18px 18px;box-shadow:var(--shadow);position:relative}
.binder.lom{border-top:4px solid var(--blue)} .binder.ri{border-top:4px solid var(--ri)}
.ls-tools{position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:1px solid var(--line);padding:14px 16px;border-radius:0 18px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1.5px solid var(--line2);background:var(--sheet2);outline:none}
.search input:focus{border-color:var(--blue)}
.search .mg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--sheet);padding:7px 11px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ls-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 18px;font-size:.85rem;color:var(--ink3);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;flex:1;min-width:120px;max-width:260px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.ls-list{padding:6px 0 30px}
.hd{padding:22px 22px 6px}
.hd .t{font-size:.8rem;font-weight:800;color:var(--ink3);letter-spacing:.02em}
.hd .c{font-size:1.06rem;font-weight:900;margin-top:2px}
.hd .s{font-size:.95rem;font-weight:700;color:var(--ink2);margin-top:2px}
.art{margin:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);position:relative;overflow:hidden}
.art::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:1.5px;background:var(--blue-soft)}
.art.ri::before{background:var(--ri-soft)}
.art.read{background:var(--sheet2)}
.art-h{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 74px;flex-wrap:wrap;min-height:44px}
.art-n{position:absolute;left:0;top:12px;width:58px;text-align:center;font-weight:900;font-size:.95rem;color:var(--blue);line-height:1.1}
.art.ri .art-n{color:var(--ri)}
.art-n small{display:block;font-size:.66rem;color:var(--ink3);font-weight:800}
.art-h .sp{flex:1}
.ib{border:0;background:transparent;width:36px;height:36px;border-radius:10px;color:var(--ink3);font-size:1.05rem;display:inline-grid;place-items:center}
.ib:hover{background:var(--sheet2);color:var(--ink)}
.ib.on{color:var(--blue)}
.ib.fav.on{color:#E0A100}
.art-b{padding:2px 20px 14px 74px;font-size:1.02rem;line-height:1.72}
.art-b p{margin:0 0 .5em}
.art-b .par{margin-left:0;font-weight:500}
.art-b .inc{margin-left:1.1em}
.art-b .ali{margin-left:2.2em}
.art-b .ite{margin-left:3.2em}
.art-b .rev{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.art-b .red{font-size:.84em;color:var(--ink3)}
mark.mt{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .08em;border-radius:2px}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 .1em;box-shadow:0 0 0 1px var(--blue) inset}
.pnote{margin:4px 20px 14px 74px;padding:10px 12px;border-radius:10px;background:var(--blue-soft);font-size:.9rem;color:var(--ink)}
.pnote b{color:var(--blue)}
.unote{margin:4px 20px 14px 74px;padding:10px 12px;border-radius:10px;background:var(--mark);font-size:.92rem;white-space:pre-wrap}
.art-f{display:flex;gap:8px;padding:0 20px 14px 74px;flex-wrap:wrap}
.lnk{border:0;background:transparent;color:var(--blue);font-weight:800;font-size:.85rem;padding:4px 0}
.empty{padding:40px 24px;text-align:center;color:var(--ink2)}
.more{display:block;margin:12px auto 0}

/* drawer sumário */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(10,16,30,.45)}
.drawer .dpan{width:min(420px,92vw);height:100%;background:var(--sheet);overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.toc button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--ink)}
.toc button:hover{background:var(--sheet2)}
.toc .lv0{font-weight:900;margin-top:10px}
.toc .lv1{padding-left:18px;font-weight:700;color:var(--ink2)}
.toc .lv2{padding-left:30px;font-size:.92rem;color:var(--ink2)}
.toc .lv3{padding-left:42px;font-size:.88rem;color:var(--ink3)}

/* ---------- Questões ---------- */
.cfg{display:grid;gap:16px}
.cfg h4{margin:0 0 8px;font-size:.92rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line2);background:var(--sheet);border-radius:12px;padding:9px 14px;font-weight:700;color:var(--ink2)}
.opt.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.sel{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--sheet2);max-width:100%}
.avail{font-weight:800;color:var(--blue)}
.qwrap{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qtop .sp{flex:1}
.qprog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--blue)}
.timer{font-weight:900;font-variant-numeric:tabular-nums;padding:5px 12px;border-radius:10px;background:var(--sheet);border:1px solid var(--line)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.qnum{font-size:.82rem;font-weight:800;color:var(--ink3)}
.qe{font-size:1.1rem;font-weight:600;line-height:1.6;margin:8px 0 16px}
.alts{display:grid;gap:9px}
.alt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:14px;padding:12px 12px 12px 12px;background:var(--sheet);text-align:left;width:100%;position:relative}
.alt .l{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;background:var(--sheet2);border:1px solid var(--line)}
.alt .x{flex:1;padding-top:3px}
.alt .cut{flex:none;border:0;background:transparent;color:var(--ink3);width:30px;height:30px;border-radius:8px;font-size:.95rem}
.alt .cut:hover{background:var(--sheet2)}
.alt.cutd .x{text-decoration:line-through;color:var(--ink3)}
.alt.sel{border-color:var(--blue);background:var(--blue-soft)}
.alt.sel .l{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.alt.ok{border-color:var(--green);background:var(--green-soft)}
.alt.ok .l{background:var(--green);color:#fff;border-color:var(--green)}
.alt.bad{border-color:var(--red);background:var(--red-soft)}
.alt.bad .l{background:var(--red);color:#fff;border-color:var(--red)}
.ce{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ce .alt{justify-content:center;font-weight:900;font-size:1.05rem;padding:16px}
.qact{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.verdict{font-weight:900;font-size:1.05rem}
.verdict.ok{color:var(--green)} .verdict.bad{color:var(--red)}
.comm{margin-top:16px;border-radius:14px;background:var(--sheet2);border:1px solid var(--line);padding:14px 16px}
.comm p{margin:0 0 .45em}
.comm .warn{color:var(--red);font-weight:700}
.comm .key{font-weight:800;color:var(--blue)}
.res-big{font-size:3rem;font-weight:900;color:var(--blue);line-height:1}
.rv{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv .d{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff}
.rv .d.ok{background:var(--green)} .rv .d.bad{background:var(--red)} .rv .d.nr{background:var(--ink3)}

/* ---------- Revisão ---------- */
.flash{perspective:1200px;max-width:620px;margin:0 auto}
.fcard{min-height:250px;border-radius:20px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;position:relative;background-image:repeating-linear-gradient(transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 56px}
.fcard .fq{font-size:1.25rem;font-weight:800}
.fcard .fa{font-size:1.2rem;font-weight:800;color:var(--blue);margin-top:14px}
.fcard .fa mark{background:var(--mark);color:inherit;padding:0 .2em;border-radius:3px}
.fcard .ft{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.boxes{display:flex;gap:8px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
table.qd{width:100%;border-collapse:collapse;font-size:.94rem}
table.qd th,table.qd td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.qd th{font-size:.8rem;color:var(--ink3)}
table.qd td.v{font-weight:800}
.tscroll{overflow-x:auto}

/* ---------- Desempenho ---------- */
.kpi b{display:block;font-size:2rem;font-weight:900;line-height:1.1}
.kpi span{color:var(--ink2);font-size:.88rem}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 52px;gap:10px;align-items:center;font-size:.9rem}
.bar .tr{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.bar .tr i.low{background:var(--red)}
.bar .pc{text-align:right;font-weight:800}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,30,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--sheet);border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:1}
.mh h3{flex:1;font-size:1.08rem;font-weight:900}
.mb{padding:16px 18px}
.mb .art{margin:0}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:12px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
textarea.note{width:100%;min-height:130px;border-radius:12px;border:1.5px solid var(--line2);background:var(--sheet2);padding:12px;outline:none;resize:vertical}

/* ---------- Ajustes ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row b{display:block}
.row small{color:var(--ink3)}
.pdf{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sheet2)}
.pdf .pi{width:44px;height:54px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}

@media (max-width:900px){
  .rail{display:none}

<script>window.__DATA__={"laws":{"lom":[{"id":"lom:1º","n":"1º","tag":"","b":"A","h":["TÍTULO I — Dos Fundamentos da Organização Municipal"],"t":["O Município de Mossoró integra a união indissolúvel da República Federativa do Brasil e tem como fundamentos:","I – A autonomia;","II – A cidadania;","III – A dignidade da pessoa humana;","IV – Os valores sociais do trabalho e da livre iniciativa;","V – O pluralismo político;","VI – Transparência e participação social. (Redação dada pela Emenda 04/2016)"],"nt":[]},{"id":"lom:2º","n":"2º","tag":"","b":"A","h":["TÍTULO I — Dos Fundamentos da Organização Municipal"],"t":["Todo o poder emana do povo, que o exerce por meio de representantes eleitos diretamente nos termos da Constituição Federal, da Constituição Estadual e desta Lei Orgânica."],"nt":[]},{"id":"lom:3º","n":"3º","tag":"","b":"A","h":["TÍTULO I — Dos Fundamentos da Organização Municipal"],"t":["São objetivos fundamentais deste Município e de seus cidadãos por meio de seus representantes: (Redação dada pela Emenda 04/2016)","I – Assegurar a construção de uma sociedade livre, justa e solidária:","II – Garantir o desenvolvimento local e regional;","III – Contribuir para o desenvolvimento estadual e nacional;","IV – Erradicar a pobreza, a marginalização e reduzir as desigualdades sociais nas áreas urbana e rural;","V – Promover o bem de todos, sem preconceitos de origem, raça, sexo, cor, idade ou quaisquer outras formas de discriminação; (Redação dada pela Emenda 04/2016)"],"nt":[]},{"id":"lom:4º","n":"4º","tag":"","b":"A","h":["TÍTULO I — Dos Fundamentos da Organização Municipal"],"t":["Os direitos e deveres individuais e coletivos, na forma prevista na Constituição Federal, integram esta Lei Orgânica e devem ser afixadas em todas as repartições públicas municipais, nas escolas, nos hospitais ou qualquer local de acesso público, para que todos possam, permanentemente, tomar ciência, exigir o seu cumprimento por parte das autoridades e cumprir, por sua parte, o que cabe a cada cidadão habitante deste Município ou que em seu território transite."],"nt":[]},{"id":"lom:5º","n":"5º","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO I — Da Organização Político administrativa"],"t":["O Município de Mossoró com sede na cidade que lhe dá o nome, dotado de autonomia política, administrativa e financeira, reger-se-á pela Constituição Federal, Constituição Estadual e por esta Lei Orgânica. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:6º","n":"6º","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO I — Da Organização Político administrativa"],"t":["São poderes do Município independentes e harmônicos entre si, o Legislativo e o Executivo."],"nt":[]},{"id":"lom:7º","n":"7º","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO I — Da Organização Político administrativa"],"t":["São símbolos do Município sua Bandeira, seu Hino e seu Brasão.","§ 1º Outros símbolos poderão ser estabelecidos em Lei, que disporá, também, sobre o seu uso no território do Município.","§ 2º O Poder Executivo Municipal somente poderá utilizar em peças publicitárias como marca de Gestão o brasão e, como slogan, a frase: Prefeitura Municipal de Mossoró. (Redação dada pela Emenda à Lei Orgânica 01/2013)","§ 3º Fica vedada a fixação de imagem do Chefe de Poder, seja executivo ou legislativo nas repartições públicas municipais. (Redação dada pela Emenda à Lei Orgânica 01/2013)"],"nt":[]},{"id":"lom:8º","n":"8º","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO I — Da Organização Político administrativa"],"t":["Incluem-se entre os bens do Município de Mossoró os imóveis, por natureza ou acessão física, e os móveis que atualmente sejam do seu domínio ou a ele pertençam, bem assim os que lhe vierem ser atribuídos por lei e os que se incorporarem ao seu patrimônio por ato jurídico perfeito."],"nt":[]},{"id":"lom:9º","n":"9º","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO II — Da Divisão Administrativa do Município"],"t":["O Município de Mossoró poderá dividir-se, para fins exclusivamente administrativos, em bairros, distritos e vilas.","§ 1 Constituem bairros as porções contíguas e contíguas do território da sede, com denominação própria, representando meras divisões geográficas desta.","§ 2º É facultada a descentralização administrativa com a criação, nos bairros, ou conjuntos de bairros, de subsedes da Prefeitura, na forma de lei de iniciativa do Poder Executivo."],"nt":[]},{"id":"lom:10","n":"10","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO II — Da Divisão Administrativa do Município"],"t":["Distrito é a parte do território do Município, dividido para fins administrativos de circunscrição territorial e de jurisdição municipal, com denominação própria.","§ 1º Aplica-se ao distrito o disposto no § 2º do artigo anterior.","§ 2º O distrito poderá subdividir-se em vilas, de acordo com lei."],"nt":[]},{"id":"lom:11","n":"11","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO II — Da Divisão Administrativa do Município"],"t":["A criação, organização, supressão ou fusão de distritos, depende de lei, após a consulta plebiscitária às populações diretamente interessadas, observada a legislação estadual específica e o atendimento aos requisitos estabelecidos no art. 12 desta Lei Orgânica."],"nt":[]},{"id":"lom:12","n":"12","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO II — Da Divisão Administrativa do Município"],"t":["São requisitos para criação de distrito:","I – População, eleitorado e arrecadação não inferior à sexta parte exigida para a criação do município;","II – Existência, no povoado-sede de, pelo menos, cinquenta moradias, escola pública e unidade de saúde. (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único Comprova-se o atendimento às exigências mencionadas neste artigo através de:","I – Declaração, emitida pela Fundação Instituto Brasileiro de Geografia e Estatística - IBGE, de estimativa de população; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Certidão, emitida pelo Tribunal Regional Eleitoral, do número de eleitores; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Certidão, emitida pelo agente municipal de estatística ou pela repartição competente do Município, atestando o número de moradias; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – Certidão do órgão fazendário estadual e de Mossoró, informando a arrecadação na respectiva área territorial; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Certidão emitida pela Prefeitura de Mossoró ou pela Secretaria Municipal de Educação, pelo Órgão Municipal de Saúde e pela Secretaria de Segurança do Estado do Rio Grande do Norte, informando a existência de escola pública, posto de saúde e posto policial, respectivamente, no povoado sede. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:13","n":"13","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO II — Da Divisão Administrativa do Município"],"t":["Na fixação das divisas distritais serão observados:","I – Sempre que possível, serão evitadas formas assimétricas, estrangulamentos e alongamentos exagerados;","II – Preferência, para a delimitação, as linhas naturais, facilmente identificáveis;","III – Na inexistência de linhas naturais, utilizar linhas retas, cujos extremos, pontos naturais ou não, sejam facilmente identificáveis;","IV – É vedada a interrupção de continuidade territorial do Município ou do distrito de origem.","Parágrafo único As divisas distritais devem ser descritas trecho a trecho, salvo, para evitar duplicidade, nos trechos que coincidem com os limites municipais."],"nt":[]},{"id":"lom:14","n":"14","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO III — Da Competência do Município De Mossoró","SEÇÃO I — Da Competência Privativa"],"t":["Compete ao Município de Mossoró:","I – Legislar sobre assuntos de interesse local;","II – Suplementar à legislação federal e a estadual, no que couber;","III – Elaborar o Plano Plurianual, a Lei de Diretrizes Orçamentárias e a Lei Orçamentária Anual;","IV – Instituir e arrecadar os tributos municipais, bem como aplicar suas rendas, sem prejuízo da obrigatoriedade de prestar contas e publicar balancetes nos prazos fixados em lei;","V – Fixar, fiscalizar e cobrar tarifas ou preços públicos;","VI – Criar, Organizar e suprimir distritos, observada a legislação estadual;","VII – Dispor sobre administração, utilização e alienação dos bens públicos, atendendo no que couber o art. 108 desta Lei Orgânica e observando-se: (Redação dada pela Emenda à Lei Orgânica 04/2016)","a) Adquirir bens, inclusive através de desapropriação por necessidade de utilidade pública no interesse social;","b) Aceitar legados e doações;","c) Dispor sobre concessão, permissão, cessão e autorização de uso de seus bens.","VIII – Dispor sobre organização, administração e execução dos serviços municipais;","IX – Instituir o quadro, os planos de carreira e o regime jurídico dos servidores públicos municipais;","X – Organizar e prestar, direta ou sob o regime de concessão ou permissão, os serviços públicos locais, inclusive o de transporte coletivo, que tem caráter essencial;","XI – (Revogado pela Emenda à Lei Orgânica 04/2016)","XII – Manter, com a cooperação técnica e financeira da União e do Estado do Rio Grande do Norte, a educação básica e, em caráter complementar e facultativo, o ensino médio e superior; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIII – Instituir, executar e apoiar programas educacionais e culturais que propiciem o pleno desenvolvimento da criança e do adolescente; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIV – Amparar, de modo especial, às crianças e adolescentes, os idosos e as pessoas com deficiências físicas e mentais; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XV – Estimular a participação popular na formulação de políticas públicas e sua ação governamental, estabelecendo programas de incentivo a projetos de organização comunitária nos campos social e econômico, cooperativas de produção e mutirões;","XVI – Prestar, com a cooperação técnica e financeira da União e do Estado, serviços de atendimento à saúde da população, inclusive assistência no nível básico, médio e de alta complexidade, com recursos próprios ou mediante convênio com entidade especializada; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVII – Planejar e controlar o uso, o parcelamento e a ocupação do solo em seu território, especialmente o de sua zona urbana;","XVIII – Estabelecer normas de edificação, de loteamento, de arruamento e de zoneamento urbano e rural, bem como as limitações urbanísticas convenientes à ordenação do seu território observadas as diretrizes da lei federal;","XIX – Instituir, planejar e fiscalizar programas de desenvolvimento urbano nas áreas de habitação e saneamento básico, de acordo com as diretrizes estabelecidas na legislação federal, sem prejuízo do exercício da competência comum correspondente;","XX – Dispor, mediante plebiscito popular, sobre qualquer alteração territorial, na forma da Lei Estadual, preservando a continuidade e unidade histórico/cultural do ambiente urbano;","XXI – Combater a poluição urbana em todas as suas formas;","XXII – Prover sobre a limpeza das vias e logradouros públicos, remoção e destino do lixo domiciliar ou não, bem como de outros detritos e resíduos de qualquer natureza;","XXIII – Conceder e renovar licença para localização e funcionamento de estabelecimentos industriais, comerciais, prestadores de serviços e quaisquer outros;","XXIV – Cassar a licença que houver concedido ao estabelecimento cuja atividade venha a se tornar prejudicial saúde, à higiene, à segurança, ao sossego e aos bons costumes da sociedade;","XXV – Ordenar as atividades urbanas, fixando condições e horários para funcionamento de estabelecimentos industriais comerciais, de serviços e outros, atendidas as normas da legislação federal aplicável;","XXVI – Organizar e manter os serviços de fiscalização necessários ao exercício do seu poder de polícia administrativa;","XXVII – Fiscalizar nos locais de venda, peso, medidas e condições sanitárias dos gêneros alimentícios observada à legislação federal pertinente;","XXVIII – Dispor sobre o depósito e venda de animais e mercadorias apreendidos em decorrência de transgressão da legislação municipal;","XXIX – Dispor sobre registro, guarda, vacinação e captura de animais, com a finalidade precípua de controlar e erradicar moléstias que possam ser portadores e transmissores;","XXX – Disciplinar os serviços de carga e descarga, bem como fixar a tonelagem máxima permitida a veículos que circulem em vias públicas municipais, inclusive nas vicinais, cuja conservação seja de sua competência;","XXXI – Sinalizar as vias urbanas e as estradas municipais, bem, como regulamentar e fiscalizar sua utilização;","XXXII – Regulamentar a utilização dos logradouros públicos e, especialmente no perímetro urbano, determinar o itinerário e os pontos de parada obrigatória de veículos de transporte coletivo;","XXXIII – Fixar e sinalizar as zonas de silêncio e de trânsito e tráfego em condições especiais;","XXXIV – Regular as condições de utilização dos bens públicos de uso comum;","XXXV – Regular, executar, licenciar, fiscalizar, conceder, persistir ou autorizar, conforme o caso:","a) O serviço de veículos automotores de aluguel, inclusive o uso de taxímetro; (Redação dada pela Emenda à Lei Orgânica 04/2016) a) Os serviços funerários e os cemitérios;","b) Os serviços de mercados, feiras e abatedouros;","c) Os serviços de construção e conservação de estradas, ruas, vias ou caminhos municipais;","d) Os serviços de iluminação pública;","e) A afixação de cartazes e anúncios, bem como a utilização de quaisquer outros meios de publicidade e propaganda, nos locais sujeitos ao poder de polícia municipal.","XXXVI – Fiscalizar os quintais e terrenos baldios, notificando os proprietários e mantê-los asseados, murados e com as calçadas correspondentes as suas testadas devidamente construídas, sob pena de execução direta pela Administração e, sem prejuízo de sanções, cobrança do custo respectivo ao proprietário;","XXXVII – Tombar e proteger bens, documentos, obras e locais de valor histórico ou artístico e as paisagens naturais, bem como cultivar a tradição de festas populares;","XXXVIII – Dispor sobre áreas verdes e reservas ecológicas do Município;","XXXIX – criar e manter estabelecimentos de ensino, nos limites de sua competência; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XL – Amparar a maternidade, a infância, os idosos, os deficientes e os adultos, coordenando e orientando os serviços sociais do âmbito do Município;","XLI – Proteger a juventude contra a exploração e fatores que possam conduzi-la ao abandono físico, moral e intelectual, promovendo os meios de assistência em todos os níveis, aos menores abandonados;","XLII – Promover medidas necessárias para restringir a mortalidade infantil e para higiene social que impeçam a propagação de doenças transmissíveis;","XLIII – Fixar os locais de estacionamento público de táxis e demais veículos;","XLIV – Estabelecer servidões administrativas necessárias à realização de seus serviços, inclusive a dos seus concessionários;","XLV – Adquirir bens, inclusive por meio de desapropriação;","XLVI – Assegurar a expedição de certidões, quando requeridas às repartições municipais, para defesa de direitos e esclarecimentos de situações;","§ 1º As competências previstas neste artigo não esgotam o exercício privativo de outras, na forma da lei, desde que atendam ao peculiar interesse do Município de Mossoró e ao bem - estar da sua população e não conflitem, com a competência federal estadual.","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 3º A lei que dispuser sobre a guarda municipal, estabelecerá sua organização e competência.","§ 4º A política de desenvolvimento urbano, com o objetivo de ordenar as funções sociais da cidade e garantir o bem estar de seus habitantes, deve ser consubstanciada em Plano Diretor de Desenvolvimento Integrado, nos termos do art. 182, §1º, da Constituição Federal."],"nt":[]},{"id":"lom:15","n":"15","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO III — Da Competência do Município De Mossoró","SEÇÃO II — Da Competência Comum"],"t":["É de competência comum do Município de Mossoró, da União e do Estado do Rio Grande do Norte, na forma prevista em lei complementar federal:","I – Zelar pela guarda da Constituição, das leis e das instituições democráticas e conservar o patrimônio público;","II – Cuidar da saúde e assistência pública, da proteção e garantia das pessoas com deficiência;","III – Proteger os documentos, as obras e outros bens de valor histórico e cultural, os monumentos, as paisagens naturais notáveis e os sítios arqueológicos;","IV – Impedir a evasão, a destruição e a descaracterização de obras de arte e de outros bens de valor histórico, artístico ou cultural;","V – Proporcionar os meios de acesso à cultura, à educação e à ciência;","VI – Proteger o meio ambiente e combater a poluição em qualquer de suas formas;","VII – Preservar as florestas, a fauna e a flora;","VIII – Fomentar a produção agropecuária e organizar o abastecimento alimentar;","IX – Promover programas de construção de moradias e a melhoria das condições habitacionais e de saneamento básico;","X – Combater as causas da pobreza e os fatores de marginalização, promovendo a integração social dos setores desfavoráveis;","XI – Registrar, acompanhar e fiscalizar as concessões de direitos de pesquisa e exploração de recursos hídricos e minerais no território do Município de Mossoró;","XII – Estabelecer e implantar política de educação para a segurança do trânsito;","XIII – Estabelecer política de educação para controle e combate à obesidade; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIV – Criar e manter serviço de proteção ao incêndio. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:16","n":"16","tag":"","b":"A","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO IV — Das Vedações"],"t":["Além de outros casos previstos nesta Lei Orgânica, ao Município de Mossoró é vedado:","I – Estabelecer cultos religiosos ou igrejas, subvencioná-los, embaraçar-lhe o funcionamento ou manter com eles ou seus representantes relações de dependência ou aliança, ressalvada, na forma da lei, a colaboração de interesse público;","II – Recusar fé aos documentos públicos;","III – Criar distinções arbitrárias entre brasileiros ou preferências entre si; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – Subvencionar ou auxiliar de qualquer forma, com recursos públicos, quer pela imprensa, rádio, televisão, internet, serviço de alto-falante, cartazes, anúncios ou outro meio de comunicação, propaganda político-partidária ou a que se destinar às campanhas ou objetivos estranhos à administração e ao interesse público; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Denominar nomes de pessoas vivas a vias e logradouros ou bens públicos. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:17","n":"17","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO I — Disposições Gerais"],"t":["A administração pública direta, indireta ou fundacional, de qualquer dos poderes do Município de Mossoró, obedece aos princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência e também ao seguinte:","I – Os cargos, empregos e funções públicas são acessíveis aos brasileiros, assim como aos estrangeiros, que preencham os requisitos estabelecidos em lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – A investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão declarada em lei de livre nomeação exoneração;","III – O prazo de validade de concurso público é de até dois anos, prorrogável uma vez, por igual período;","IV – Durante o prazo improrrogável previsto no edital de convocação, aquele aprovado em concurso público de provas ou de provas e títulos deve ser convocado, com prioridade sobre novos concursados, para assumir o cargo ou emprego, na carreira;","V – Os cargos em comissão e as funções de confiança devem ser exercidos, preferencialmente, por servidores ocupantes de cargo de carreira técnica ou profissional, nos casos e condições previstas em lei;","VI – É garantido ao servidor público o direito a livre associação sindical;","VII – O direito de greve será exercido, nos termos e nos limites definidos em Lei Complementar Federal;","VIII – A lei reservará percentual dos cargos e empregos públicos para as pessoas com deficiência e definirá os critérios de sua admissão;","IX – A lei estabelecerá os casos de contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público;","X – A revisão geral da remuneração dos servidores públicos far-se-á sempre na mesma data;","XI – A lei fixará o limite máximo entre a maior e a menor remuneração dos servidores públicos, observados, como limite máximo, os valores percebidos como subsídio, em espécie, pelo Prefeito; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XII – Os vencimentos dos cargos do Poder Legislativo não poderão ser superiores aos pagos pelo Poder Executivo;","XIII – É vedada a vinculação ou equiparação de vencimentos, para efeito de remuneração de pessoal do serviço público, ressalvado o disposto no inciso anterior e no §1º, do art. 19 desta Lei Orgânica;","XIV – Os acréscimos pecuniários percebidos por servidor público não serão computados nem acumulados para fins de concessão de acréscimos ulteriores, sob o mesmo título ou idêntico fundamento;","XV – Os vencimentos dos servidores públicos são irredutíveis e a remuneração observará o que dispõem os incisos XI e XII deste artigo, bem como os arts. 150, II, 153, III, §2º, I, da Constituição Federal;","XVI – É vedada a acumulação remunerada de cargos públicos, exceto quando houver compatibilidade de horários:","a) A de dois cargos de professor;","b) A de um cargo de professor e outro de técnico ou científico;","c) De dois privativos de profissionais da saúde, com profissões regulamentadas. (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVII – A proibição de acumular estende-se a empregos e funções e abrange autarquias, empresas públicas, sociedade de economia mista e fundações mantidas pelo Poder Público;","XVIII – A administração fazendária e seus servidores fiscais terão, dentro de suas áreas de competência e jurisdição, precedência sobre os demais setores administrativos, na forma da lei;","XIX – Somente por lei específica poderão ser criadas as autarquias e autorizadas à instituição de empresa pública, sociedade de economia mista, ou fundação pública, cabendo Lei Complementar neste último caso definir suas áreas de atuação; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XX – Depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer desta em empresas privadas;","XXI – Ressalvados os casos específicos na legislação, as obras, os serviços, compras e alienações serão contratadas mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, com cláusula que estabeleça obrigações e pagamento, mantidas as condições efetivas da proposta, nos termos da lei, exigindo-se a qualificação técnica e econômica indispensável à garantia do cumprimento das obrigações;","XXII – A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou de servidores públicos;","XXIII – A não observância do disposto nos incisos II e III desse artigo implicará a nulidade do ato e punição da autoridade responsável, nos termos da lei.","§ 1º As reclamações relativas à prestação de serviços públicos serão disciplinadas em lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Os atos de improbidade administrativa importarão em suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e graduação prevista em lei, sem prejuízo da ação penal cabível. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º A lei federal estabelecerá os prazos de prescrição para ilícitos praticados por qualquer agente, servidor ou não, que causem prejuízo ao erário, ressalvadas as respectivas ações de ressarcimento; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":["Inciso XVI, b: O texto municipal reproduz a antiga hipótese: professor com cargo técnico ou científico. Desde 22/12/2025, a EC nº 138/2025 permite, na Constituição Federal, professor com outro cargo de qualquer natureza. Esta nota não é emenda da Lei Orgânica; sinaliza prevalência da Constituição Federal."]},{"id":"lom:18","n":"18","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["O Município instituirá regime jurídico único e planos de cargos, carreira e remuneração para os servidores da administração pública direta, das autarquias e das fundações públicas. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A lei assegurará, aos servidores da administração direta, autárquica e fundacional, isonomia de vencimentos para cargos de atribuições iguais ou assemelhadas do mesmo Poder ou entre servidores dos Poderes Executivo e Legislativo, ressalvadas as vantagens de caráter individual e as relativas à natureza ou ao local de trabalho. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Aplica-se a esses servidores o disposto no art. 7º, IV, VI, VII, VIII, IX, XII, XIII. XV, XVI, XVII. XVIII. XIX, XX, XXII, XXIII e XXX da Constituição Federal."],"nt":[]},{"id":"lom:19","n":"19","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["O Regime Próprio de Previdência Social - RPPS dos servidores titulares de cargos efetivos terá caráter contributivo e solidário, mediante contribuição dos órgãos integrantes dos poderes Legislativo e Executivo do Município e dos servidores ativos, de aposentados e de pensionistas, observados critérios que preservem o equilíbrio financeiro e atuarial. (Redação dada pela Emenda à Lei Orgânica Nº 11/2022).","§ 1º Os benefícios previdenciários a cargo do Regime Próprio de Previdência Social - RPPS municipal se restringem a aposentadorias e pensão por morte.","§ 2º O servidor público abrangido pelo Regime Próprio de Previdência Social - RPPS municipal será aposentado:","I – por incapacidade permanente para o trabalho, no cargo em que estiver investido, quando insuscetível de readaptação, hipótese em que será obrigatória a realização de avaliações periódicas para verificação da continuidade das condições que ensejaram a concessão da aposentadoria, na forma de Lei Complementar Municipal;","II – compulsoriamente, com proventos proporcionais ao tempo de contribuição, aos 75 (setenta e cinco) anos de idade, na forma da Lei Complementar Federal nº 152, de dezembro de 2015;","III – aos 60 (sessenta) anos de idade, se mulher, e aos 65 (sessenta e cinco) anos de idade, se homem, observados o tempo de contribuição e os demais requisitos estabelecidos em lei complementar municipal.","§ 3º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o § 2º do art. 201 ou superiores ao limite máximo estabelecido para o Regime Geral de Previdência Social, observado o disposto nos §§ 14 a 16, do artigo 40 da Constituição Federal.","§ 4º As modalidades de aposentadorias, os requisitos e critérios de concessão, as regras para cálculo de proventos de aposentadoria e pensão por morte e demais disciplinas que se fizerem necessárias serão carreadas em lei complementar municipal.","§ 5º As rubricas remuneratórias denominadas como salário-família, salário-maternidade, auxíliodoença, benefício por incapacidade temporária e auxílio-reclusão ficam excluídos do rol de benefícios previdenciários do RPPS de Mossoró e serão pagas, quando devidas, nos termos desta Lei Orgânica e dos demais dispositivos da legislação aplicável, diretamente pelo Ente Federativo e não correrão à conta do Regime Próprio de Previdência Social - RPPS, sendo de inteira e exclusiva responsabilidade, tanto financeira, quanto orçamentária, do Município de Mossoró.","§ 6º O servidor titular de cargo efetivo que tenha completado as exigências para a aposentadoria voluntária estabelecidas neste artigo e que opte, mediante efetiva verificação da implementação dos requisitos para aposentação espontânea, por permanecer em atividade fará jus a um abono de permanência equivalente ao valor da sua contribuição previdenciária, até completar a idade para aposentadoria compulsória.","§ 7º As idades mínimas do servidor exercente do cargo de magistério serão de 58 (cinquenta e oito) anos, se mulher, 63 (sessenta e três) anos de idade, se homem, devendo ser observada a aplicação do redutor constitucional de 5 (cinco) anos, para aqueles que comprovem 25 (vinte e cinco) anos de exclusivo e efetivo exercício das funções de magistério na educação infantil e no ensino fundamental e médio."],"nt":["A redação atual do art. 19 e o art. 19-A vêm da Emenda à Lei Orgânica nº 11/2022, reproduzida na íntegra ao fim do fichário."]},{"id":"lom:19-A","n":"19-A","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["O Regime Próprio de Previdência Social - RPPS do Município de Mossoró fica alterado, e nos termos do inciso II, do art. 36, da Emenda Constitucional nº 103, de 2019, ficando referendadas: (Redação dada pela Emenda à Lei Orgânica nº 11/2022)","I – pelas alterações promovidas pelo art. 1º da Emenda Constitucional nº 103, de 2019, e art. 149 da Constituição Federal; e","II – pelas revogações previstas na alínea “a”, do inciso I, e nos incisos III e IV, do art. 35 da Emenda Constitucional nº 103, de 2019."],"nt":[]},{"id":"lom:20","n":"20","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["A estabilidade do servidor público municipal, nomeado em virtude de concurso público, dar-se-á nos termos do que determina a Constituição Federal.","Parágrafo único O servidor público estável só perderá o cargo em virtude de sentença judicial transitada em julgado, mediante processo administrativo em que lhe seja assegurada ampla defesa ou procedimento de avaliação periódica de desempenho. (Redação dada pela à Lei Orgânica Emenda 04/2016)"],"nt":[]},{"id":"lom:21","n":"21","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["O plano de cargos e carreiras do servidor público municipal será elaborado de forma assegurar aos servidores municipais remuneração compatível com o mercado de trabalho para a função respectiva, oportunidade de progressão e ascensão funcional de acordo com a respectiva carreira. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O Município proporcionará aos servidores oportunidade de crescimento profissional através de programas de formação de mão de obra, aperfeiçoamento e reciclagem, em caráter permanente. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:22","n":"22","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["Ao servidor público municipal em exercício do mandato eletivo, aplicam-se as disposições do art. 38 da Constituição Federal."],"nt":[]},{"id":"lom:23","n":"23","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["São direitos do servidor público, entre outros:","I – Décimo terceiro salário com base na remuneração integral; (Redação dada pela Emenda à Lei Orgânica 04/2016)","II – Remuneração do trabalho noturno superior ao diurno; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – Remuneração-família para os seus dependentes; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IV – Duração do trabalho normal não superior a oito horas diárias e quarenta e quatro semanais, facultado a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – Jornada de seis horas para o trabalho realizado em turnos ininterruptos de revezamento, salvo negociação coletiva; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – Repouso semanal remunerado; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VII – Remuneração de serviços extraordinários superior, no mínimo, em cinquenta por cento a do normal; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VIII – Gozo de férias anuais remuneradas com, pelo menos, um terço a mais, da remuneração normal; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IX – Licença à gestante sem prejuízo do emprego e da remuneração, com duração de cento e oitenta dias; (Redação dada pela Emenda à Lei Orgânica 04/2016)","X – Participação do servidor público na gerência de fundos e entidades para os quais contribuem, a ser regulamentada por lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XI – Direito a reunião em locais de trabalho, desde que não exista comprometimento de atividades funcionais regulares; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XII – Liberdade de filiação político-partidária; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIII – Licença especial de três meses, após a implementação de cada cinco anos de efetivo exercício; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XIV – Proteção de remuneração na forma da lei, constituindo crime sua retenção dolosa; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XV – Licença-paternidade, nos termos fixados em lei; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVI – Adicional de remuneração para as atividades penosas, insalubres ou perigosas, na forma da lei. (Redação dada pela Emenda 04/2016)","Parágrafo único Lei específica disporá sobre jornadas diferenciadas por categoria, observando o estabelecido na Constituição Federal. (Redação dada pela Emenda 04/2016)"],"nt":[]},{"id":"lom:24","n":"24","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["O servidor público do Município, quando investido na função de direção máxima de entidade representativa de classe ou conselheiro de entidade de fiscalização do exercício das profissões liberais, não poderá ser impedido de exercer suas funções nessa entidade, nem sofrerá prejuízos em suas remunerações e demais vantagens na sua instituição de origem."],"nt":[]},{"id":"lom:25","n":"25","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["As empresas, fundações, autarquias e sociedade de economia mista, que integram a organização municipal, terão conselho representativo constituído por servidores das respectivas entidades e por esses escolhidos em votação direta e aberta/secreta."],"nt":[]},{"id":"lom:26","n":"26","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["Será assegurada a participação dos servidores na elaboração e instituição do seu regime jurídico, plano de cargos e remuneração e no Estatuto do Magistério Municipal."],"nt":[]},{"id":"lom:27","n":"27","tag":"","b":"B","h":["TÍTULO II — Da Organização Municipal","CAPÍTULO V — Da Administração Pública","SEÇÃO II — Dos Servidores Públicos"],"t":["A lei assegurará aos servidores da administração pública direta, das autarquias fundações e empresas de economia mistas, controlada acionariamente pelo Município, o vale transporte obedecendo ao disposto na legislação federal."],"nt":[]},{"id":"lom:28","n":"28","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["O Poder Legislativo de Mossoró é exercido pela Câmara Municipal, composta por 23 vereadores (Redação dada pela Emenda à Lei Orgânica 10/2020).","Parágrafo único Cada legislatura tem a duração de quatro anos, correspondendo cada ano a uma sessão legislativa."],"nt":[]},{"id":"lom:29","n":"29","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["A Câmara Municipal de Mossoró compõe-se de vereadores eleitos pelo sistema proporcional, como representantes do povo, com mandato de quatro anos.","§ 1º São condições de elegibilidade para o exercício do mandato de vereador, na forma da lei federal:","I – A nacionalidade brasileira;","II – O pleno exercício dos direitos políticos,","III – O alistamento eleitoral","IV – O domicílio eleitoral na circunscrição.","V – A filiação partidária;","VI – A idade mínima de dezoito anos;","VII – Ser alfabetizado.","§ 2º Devem ser observados como critérios de elegibilidade os constantes na Lei Complementar Federal. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º O número de vereadores será fixado por esta Lei Orgânica, observado o disposto no art. 29, IV da Constituição Federal (Redação dada pela Emenda à Lei Orgânica 10/2020)"],"nt":[]},{"id":"lom:30","n":"30","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["A Câmara Municipal de Mossoró reunir-se-á anual e ordinariamente na sede do Município de 01 de fevereiro a 18 de julho e 01 de agosto a 23 de dezembro. (Redação dada pela Emenda à Lei Orgânica 09/2019)","§ 1º As reuniões inaugurais de cada sessão legislativa, marcadas para as datas que lhes correspondem, previstas no parágrafo anterior, serão transferidas para o primeiro dia útil subsequente quando coincidirem com sábados, domingos e feriados.","§ 2º A convocação da Câmara é feita no período e nos termos estabelecidos no “caput” deste artigo correspondente à sessão legislativa ordinária.","§ 3º A convocação extraordinária da Câmara far-se-á:","I – pelo Prefeito, quando este a entender necessária;","II – pelo Presidente da Câmara para o compromisso e a posse do Prefeito e do Vice-Prefeito;","III – pelo Presidente da Câmara ou a requerimento da maioria dos membros desta, em casos de urgência ou interesse público relevante;","IV – pela Comissão Representativa da Câmara, conforme previsto no art. 38, V desta Lei Orgânica;","§ 4º Na sessão legislativa extraordinária, a Câmara Municipal de Mossoró somente deliberará sobre a matéria para a qual for convocada."],"nt":[]},{"id":"lom:31","n":"31","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["As deliberações da Câmara serão tomadas por maioria de votos, presente a maioria de seus membros, salvo disposição em contrário prevista na Constituição Federal, nesta Lei Orgânica e no Regimento Interno."],"nt":[]},{"id":"lom:32","n":"32","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["A sessão legislativa ordinária não será interrompida sem a deliberação sobre o projeto de lei orçamentária."],"nt":[]},{"id":"lom:33","n":"33","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["As sessões da Câmara realizar-se-ão em recinto destinado ao seu funcionamento, observado o disposto no art. 38, XII, desta Lei Orgânica. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º O horário das sessões ordinárias e extraordinárias da Câmara Municipal é o estabelecido em seu Regimento Interno.","§ 2º Poderão ser realizadas sessões fora do recinto da Câmara, previstas no seu Regimento Interno. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:34","n":"34","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["As sessões serão públicas salvo deliberação em contrário, de dois terços (2/3) dos vereadores, adotada em razão de motivo relevante."],"nt":[]},{"id":"lom:35","n":"35","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO I — Da Câmara Municipal"],"t":["Na Câmara Municipal de Mossoró são 2 (dois) os processos de votação: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – simbólico;","II – nominal por chamada ou por processo eletrônico;","Parágrafo único O Regimento Interno da Câmara Municipal determinará o procedimento a ser utilizado nos processos de votação previstos nos incisos acima, bem como as matérias atinentes aos mesmos."],"nt":[]},{"id":"lom:36","n":"36","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO II — Das Atribuições da Câmara Municipal"],"t":["Cabe a Câmara Municipal, com a sanção do Prefeito, dispor sobre todas as matérias de competência do Município de Mossoró, observando as disposições contidas nos artigos 57 e 58 desta Lei, especialmente sobre: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – tributos municipais, arrecadação e dispêndio de suas rendas;","II – isenção e anistia em matéria tributária bem como remissão de dívidas;","III – plano plurianual, lei de diretrizes orçamentárias, orçamento anual e autorização para abertura de créditos suplementares e especiais;","IV – operações de créditos, auxílios e subvenções;","V – concessão, permissão e autorização de serviços públicos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","VI – concessão administrativa do uso dos bens municipais;","VII – alienação de bens públicos;","VIII – aquisição de bens imóveis, salvo quando se tratar de doação sem encargo;","IX – organização administrativa municipal, criação, transformação e extinção de cargos, empregos e funções públicas, bem como a fixação dos respectivos vencimentos;","X – criação e estruturação de secretarias municipais e demais órgãos da administração pública, bem assim a definição das respectivas atribuições;","XI – aprovação do Plano Diretor e demais Planos e Programas de Governo Municipal;","XII – (Revogado pela Emenda à Lei Orgânica 04/2016)","XIII – delimitação do perímetro urbano;","XIV – transferência temporária da sede do governo municipal;","XV – autorização para mudança de denominação de nomes próprios de vias e logradouros públicos; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XVI – normas urbanísticas, particularmente as relativas a zoneamento e loteamento."],"nt":[]},{"id":"lom:37","n":"37","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO II — Das Atribuições da Câmara Municipal"],"t":["É da competência exclusiva da Câmara Municipal:","I – eleger os membros de sua Mesa Diretora;","II – elaborar o Regimento Interno; (Redação dada pela Emenda à Lei Orgânica 04/2016)","III – organizar os serviços administrativos internos e prover os cargos respectivos;","IV – propor a criação ou a extinção dos cargos dos serviços administrativos internos e a fixação dos respectivos vencimentos;","V – Conceder licença ao Prefeito, ao Vice-Prefeito e aos Vereadores;","VI – autorizar o Prefeito a ausentar-se do Município, quando a ausência exceda a quinze dias;","VII – exercer a fiscalização contábil, financeira e orçamentária do Município, mediante controle externo e pelos sistemas de controle interno do Poder Executivo;","VIII – tomar e julgar as contas do Prefeito, deliberando sobre o parecer do Tribunal de Contas do Estado, no prazo máximo de sessenta dias do seu recebimento observados os seguintes preceitos:","a) o parecer do tribunal somente deixará de prevalecer por decisão de dois terços (2/3) dos membros da Câmara;","b) é vedado o julgamento ficto;","c) no decurso do prazo previsto neste inciso as contas do Prefeito ficarão à disposição de qualquer contribuinte do Município de Mossoró para exame e apreciação, o qual poderá questionar-lhe a legitimidade, nos termos da lei;","d) rejeitadas as contas e publicado o resultado do julgamento através de Decreto Legislativo no Diário Oficial do Município ou veículo de publicidade equivalente, serão elas imediatamente remetidas ao Tribunal de Contas do Estado, Ministério Público e Procuradoria Regional Eleitoral para os fins de direito.","IX – decretar a perda do mandato do Prefeito, de Vice-Prefeito e dos Vereadores, nos casos indicados na Constituição Federal, nesta Lei Orgânica, na legislação municipal, estadual e federal, aplicável;","X – autorizar a realização de empréstimo ou de crédito interno ou externo de qualquer natureza, de interesse do Município de Mossoró;","XI – proceder à tomada de contas do Prefeito através de Comissão especial, quando não apresentadas à Câmara, dentro de sessenta dias após a abertura da sessão legislativa;","XII – (Revogado pela Emenda à Lei Orgânica 04/2016)","XIII – estabelecer e mudar temporariamente o local de suas reuniões;","XIV – convocar o Prefeito, secretários do Município ou autoridade equivalente para prestar esclarecimentos aprazando dia e hora para o comparecimento, importando a ausência sem justificação adequada em crime de responsabilidade, punível na forma da legislação federal;","XV – encaminhar pedidos escritos de informação a secretário do Município ou autoridade equivalente, para atendimento no prazo de trinta dias, podendo representar os interessados por desvios e prestação de informações falsas;","XVI – ouvir secretários do Município ou autoridades equivalentes, quando, por sua iniciativa e mediante entendimentos prévios como a Mesa, comparecerem à Câmara Municipal para expor assunto de relevância da Secretaria ou do órgão da administração de que forem titulares;","XVII – deliberar sobre o atendimento e a suspensão de suas reuniões","XVIII – criar comissão parlamentar de inquérito para apurar fato determinado e por prazo certo, mediante requerimento de um terço de seus membros;","XIX – conceder título de cidadão honorário ou conferir homenagem a pessoas que, reconhecidamente, tenham prestado relevantes serviços ao Município ou neles tenham se destacado pela atuação exemplar na vida pública e particular, mediante aprovação da maioria dos membros da Câmara; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XX – solicitar a intervenção do Estado no Município; observado o disposto no art. 35 da Constituição Federal, por decisão de dois terços (2/3) dos membros da Câmara;","XXI – julgar o Prefeito, o Vice-Prefeito e os Vereadores, nos casos previstos em lei;","XXII – fiscalizar e controlar os atos do Poder Executivo, incluídos os da Administração Indireta;","XXIII – Fixar o subsídio dos Vereadores mediante projeto de lei de iniciativa privativa até 60 (sessenta) dias antes da data das eleições para a nova legislatura, obedecendo ao respectivo regime jurídico; (Redação dada pela Emenda à Lei Orgânica 04/2016)","XXXIV – Fixar, observado o que dispõe o art. 17, XI desta Lei Orgânica, e os arts. 150, II, 153, III e 153, § 2º, I, da Constituição Federal, em cada legislatura para a subsequente, a remuneração do Prefeito, do Vice- Prefeito e secretários municipais ou autoridades equivalentes; (Redação dada pela Emenda à Lei Orgânica 04/2016)","Parágrafo único A apreciação e votação do parecer do Tribunal e Contas pela Câmara Municipal serão precedidas da devida notificação do responsável pelas contas, para a apresentação de manifestação escrita na forma e prazo estabelecidos pelo Regimento Interno. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:38","n":"38","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO II — Das Atribuições da Câmara Municipal"],"t":["Ao término de cada sessão legislativa a Câmara elegerá, dentre os seus membros, uma Comissão Representativa, cuja composição reproduzirá, a proporcionalidade da representação partidária ou dos blocos parlamentares na Casa, que funcionará nos interregnos das sessões legislativas ordinárias, com as seguintes atribuições: (Redação dada pela Emenda à Lei Orgânica 04/2016)","I – reunir-se ordinariamente uma Vez por semana e, extraordinariamente, sempre que convocada pelo presidente;","II – zelar pelas prerrogativas do Poder Legislativo;","III -zelar pela observância da Lei Orgânica e dos direitos e garantias individuais;","IV – autorizar o Prefeito a se ausentar do Município por mais de quinze dias observado o disposto no inciso VI do art. 37;","V – convocar extraordinariamente a Câmara em caso de urgência ou interesse público relevante.","§ 1º A Comissão Representativa é constituída por número ímpar de Vereadores","§ 2º A comissão Representativa deve apresentar relatório dos trabalhos por ela realizados quando do reinicio do período de funcionamento ordinário da Câmara."],"nt":[]},{"id":"lom:39","n":"39","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO III — Dos Vereadores"],"t":["Os Vereadores são invioláveis, no exercício do mandato e na circunscrição do Município, por suas opiniões, palavras e votos.","§ 1º (Revogado pela Emenda à Lei Orgânica 01/2012)","§ 2º (Revogado pela Emenda à Lei Orgânica 01/2012)","§ 3º (Revogado pela Emenda à Lei Orgânica 01/2012)","§ 4º Os Vereadores não serão obrigados a testemunhar sobre informações recebidas ou prestadas em razão do exercício do mandato nem sobre as pessoas que lhes confiaram ou deles receberam informações.","§ 5º Os vereadores farão jus ao décimo terceiro salário e ao terço constitucional de férias. (Redação dada pela Emenda à Lei Orgânica 08/2019)."],"nt":[]},{"id":"lom:40","n":"40","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO III — Dos Vereadores"],"t":["É vedado ao Vereador:","I – desde a expedição do diploma:","a) firmar ou manter contrato com o Município, com suas autarquias, fundações, empresas públicas, sociedades de economia mista ou com suas empresas concessionárias de serviço público, salvo quando o contrato obedecer a cláusulas uniformes;","b) aceitar cargo, emprego ou função, no âmbito da Administração Pública Direta ou Indireta municipal, salvo mediante aprovação em concurso público e observado o disposto no art. 22 desta Lei Orgânica.","II – desde a posse:","a) ocupar cargo, função ou emprego, na Administração Pública Direta ou Indireta do Município, de que seja exonerável ad-nutun, salvo o cargo de secretário do Município ou equivalente;","b) exercer outro cargo eletivo federal, estadual ou municipal;","c) ser proprietário, controlador ou diretor de empresa que goze de favor decorrente de contrato com pessoa jurídica de direito público do Município de Mossoró, ou nele exercer função remunerada;","d) patrocinar causa junto ao Município de Mossoró em que seja interessada qualquer das entidades a que se refere alínea 'a' do inciso I deste artigo."],"nt":[]},{"id":"lom:41","n":"41","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO III — Dos Vereadores"],"t":["Perderá o mandato o Vereador:","I – que infringir qualquer das proibições estabelecidas no artigo anterior;","II – cujo procedimento for declarado incompatível com o decoro parlamentar ou atentatório às instituições vigentes;","III – (Revogado pela Emenda à Lei Orgânica 04/2016)","IV – que deixar de comparecer, em cada sessão legislativa, à terça parte das sessões ordinárias da Câmara Municipal, salvo doença comprovada, licença ou missão autorizada pela edilidade; (Redação dada pela Emenda à Lei Orgânica 04/2016)","V – que fixar domicílio eleitoral em outro Município;","VI – que perder ou tiver suspensos os direitos políticos;","VII – quando o decretar a Justiça Eleitoral nos casos previstos na Constituição Federal;","VIII – que sofrer condenação criminal em sentença transitada em julgado; (Redação dada pela Emenda à Lei Orgânica 04/2016)","IX – (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 1º Além de outros casos definidos no Regimento Interno da Câmara Municipal de Mossoró, considerar-se- á incompatível com o decoro parlamentar o abuso das prerrogativas asseguradas ao Vereador ou a percepção de vantagens ilícitas ou imorais. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 2º Nos casos dos incisos I, II e VIII, a perda do mandato será declarada pela maioria absoluta, mediante convocação da Mesa ou de qualquer Partido Político, com representação na Câmara Municipal da Mossoró, assegurado o amplo direito de defesa. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º Nos casos previstos nos incisos IV, V e VII, a perda será declarada pela Mesa da Casa, de ofício ou mediante provocação de qualquer de seus membros, ou de partido político representado na Câmara Municipal, assegurada ampla defesa; (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 4º A renúncia de vereador submetido a processo que vise ou possa levar à perda do mandato, nos termos deste artigo, terá seus efeitos suspensos até as deliberações finais de que tratam os § 2º e § 3º. (Redação dada pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:42","n":"42","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO III — Dos Vereadores"],"t":["O Vereador poderá licenciar-se:","I – por motivo de doença;","II – (Revogado pela Emenda à Lei Orgânica 04/2016)","III – (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 1º Não perderá o mandato, considerando-se automaticamente licenciado, o Vereador investido no cargo de secretário do Município ou em cargo equivalente ou assemelhado da Administração Pública Direta ou Indireta do Município, conforme previsto no art. 40, inciso II, alínea “a”, desta Lei Orgânica;","§ 2º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 3º (Revogado pela Emenda à Lei Orgânica 04/2016)","§ 4º A licença para tratar de interesse particular não será inferior a 30 (trinta) dias e o Vereador não poderá reassumir o exercício do mandato antes do término da licença.","§ 5º Independentemente de requerimento, considerar-se-á como licença o não comparecimento às reuniões da Câmara, o Vereador privado, temporariamente, de sua liberdade, em virtude de processo criminal em curso.","§ 6º Na hipótese do §1º o Vereador poderá optar pela remuneração do mandato."],"nt":[]},{"id":"lom:43","n":"43","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO III — Dos Vereadores"],"t":["Dar-se-á a convocação do Suplente de Vereador nos casos de vaga ou de licença.","§ 1º O suplente convocado deverá tomar posse no prazo de 15 (quinze) dias, contados da data da convocação, salvo justo motivo aceito pela Câmara, quando o prazo será prorrogado por igual período.","§ 2º Ocorrendo vaga e não havendo suplente, o Presidente da Câmara comunicará o fato, dentro de 48 horas, à Justiça Eleitoral. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º Enquanto a vaga a que se refere o parágrafo anterior não for preenchida, calcular-se-á o quórum em função dos Vereadores remanescentes."],"nt":[]},{"id":"lom:44","n":"44","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["A Câmara reunir-se-á em sessão solene, no dia 1º de Janeiro, no primeiro ano da legislatura, para a posse de seus membros. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º A posse ocorrerá em sessão solene, sob a Presidência do Vereador mais idoso dentre os presentes, caso esta condição seja comum a mais de um Vereador, presidirá o mais votado dentre eles.","§ 2º O Vereador que não tomar posse na sessão prevista no parágrafo anterior deverá fazê-lo dentro do prazo de quinze dias do início do funcionamento ordinário da Câmara, sob pena de impossibilitar a sua posse cassação, salvo motivo justo, aceito pela maioria absoluta dos membros da Câmara. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 3º Imediatamente após a posse, os Vereadores reunir-se-ão sob a Presidência do escolhido com base no §1º deste artigo, e havendo maioria absoluta dos membros da Câmara, elegerão os componentes da Mesa, que serão automaticamente empossados.","§ 4º Inexistindo número legal, o Vereador indicado para Presidente, com base no §1º deste artigo, permanecerá na presidência e convocará sessões diárias, até que seja eleita a Mesa.","§ 5º A eleição da Mesa Diretora da Câmara Municipal de Mossoró, para o segundo biênio, far-se-á a qualquer tempo, desde que convocada pela Mesa Diretora ou por 2/3 (dois terços) dos Vereadores (Redação dada pela Emenda à Lei Orgânica 06/2017).","§ 6º A reunião marcada para a data estabelecida no parágrafo anterior será transferida para o 1º dia útil subsequente quando recair em sábado, ou domingo.","§ 7º (Revogado pela Emenda à Lei Orgânica 04/2016)"],"nt":[]},{"id":"lom:45","n":"45","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["O mandato da Mesa Diretora da Câmara será de 2 (dois) anos, permitida a reeleição (Redação dada pela Emenda à Lei Orgânica 06/2017)."],"nt":[]},{"id":"lom:46","n":"46","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["A Mesa da Câmara se compõe do Presidente, do Primeiro Vice-Presidente, do Segundo Vice- Presidente, do Primeiro Secretário, do Segundo Secretário, do Terceiro Secretário e do Quarto Secretário, os quais se substituirão nessa ordem.","§ 1º Na constituição da Mesa é assegurada, tanto quanto possível, representação proporcional dos partidos ou dos blocos parlamentares que participam da Casa.","§ 2º Na ausência dos membros da Mesa, o Vereador mais idoso, e em caso de empate, o mais votado dentre eles, assumirá a Presidência.","§ 3º Qualquer componente da Mesa poderá ser destituído da mesma, pelo voto de dois terços (2/3) dos membros da Câmara, quando faltoso, omisso ou ineficiente no desempenho de suas atribuições regimentais, elegendo-se outro Vereador para a complementação do mandato."],"nt":[]},{"id":"lom:47","n":"47","tag":"","b":"C","h":["TÍTULO III — Da Organização Dos Poderes","CAPÍTULO I — Do Poder Legislativo","SEÇÃO IV — Da Instalação e Funcionamento da Câmara"],"t":["A Câmara terá comissões permanentes e especiais, constituídas e com atribuições previstas nesta Lei e no respectivo regimento ou no ato de que resultar sua criação. (Redação dada pela Emenda à Lei Orgânica 04/2016)","§ 1º Às comissões permanentes em razão da matéria de sua competência, cabem:","I – discutir e votar projeto de l
